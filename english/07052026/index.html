<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情绪探险家：需求 vs 要求</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', sans-serif;
            background-color: #e0f7fa;
            background-image: radial-gradient(#b2ebf2 20%, transparent 20%), radial-gradient(#b2ebf2 20%, transparent 20%);
            background-position: 0 0, 25px 25px;
            background-size: 50px 50px;
        }
        .bounce { animation: bounce 2s infinite; }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-20px); }
            60% { transform: translateY(-10px); }
        }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .card-hover:hover { transform: scale(1.05); transition: transform 0.2s; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1); }
    </style>
</head>
<body class="h-screen w-full flex items-center justify-center p-4">

    <!-- 游戏主容器 -->
    <div id="app" class="bg-white/90 backdrop-blur-sm rounded-3xl shadow-2xl w-full max-w-2xl overflow-hidden border-4 border-cyan-300 relative">
        
        <!-- 进度条 -->
        <div class="h-4 bg-gray-200 w-full">
            <div id="progress-bar" class="h-full bg-yellow-400 transition-all duration-500 w-0"></div>
        </div>

        <div class="p-8 text-center min-h-[450px] flex flex-col justify-center">
            
            <!-- 屏幕 0: 登录 -->
            <div id="screen-start" class="fade-in block">
                <div class="text-6xl mb-4 bounce">🌟</div>
                <h1 class="text-4xl font-bold text-cyan-600 mb-2">情绪探险家</h1>
                <p class="text-gray-500 mb-8 text-lg">一年级体育与健康：需求 vs 要求</p>
                
                <div class="max-w-xs mx-auto">
                    <input type="text" id="playerName" placeholder="输入你的名字..." 
                           class="w-full px-6 py-4 rounded-full border-2 border-cyan-200 focus:outline-none focus:border-cyan-500 text-center text-xl mb-6 shadow-inner">
                    <button onclick="startGame()" 
                            class="w-full bg-gradient-to-r from-cyan-400 to-blue-500 text-white font-bold py-4 px-8 rounded-full text-2xl shadow-lg hover:shadow-xl hover:scale-105 transition-all active:scale-95">
                        开始冒险 🚀
                    </button>
                </div>
            </div>

            <!-- 屏幕 1: 情绪歌 -->
            <div id="screen-emotion" class="fade-in hidden">
                <span class="bg-pink-100 text-pink-600 px-4 py-1 rounded-full text-sm font-bold mb-4 inline-block">第一关：情绪动作对对碰</span>
                <h2 class="text-3xl font-bold text-gray-800 mb-6">如果你很 <span class="text-blue-500">伤心 😭</span>，你会怎么做？</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-8">
                    <button onclick="checkEmotion(false)" class="card-hover bg-yellow-100 border-2 border-yellow-300 p-6 rounded-2xl text-xl font-bold text-yellow-700">
                        👏 拍拍手
                    </button>
                    <button onclick="checkEmotion(true)" class="card-hover bg-blue-100 border-2 border-blue-300 p-6 rounded-2xl text-xl font-bold text-blue-700">
                        🥺 揉揉眼
                    </button>
                    <button onclick="checkEmotion(false)" class="card-hover bg-red-100 border-2 border-red-300 p-6 rounded-2xl text-xl font-bold text-red-700">
                        🦶 跺跺脚
                    </button>
                </div>
            </div>

            <!-- 屏幕 2: 分类游戏 (展示物品) -->
            <div id="screen-classify" class="fade-in hidden">
                <span class="bg-green-100 text-green-600 px-4 py-1 rounded-full text-sm font-bold mb-4 inline-block">第二关：小管家分类</span>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">这是 <span class="text-purple-600">需求</span> 还是 <span class="text-orange-500">要求</span>？</h2>
                <p class="text-sm text-gray-500 mb-6">需求：生活必须品 | 要求：想要但不是必须的</p>
                
                <div class="bg-gray-50 rounded-3xl p-8 mb-8 border-2 border-dashed border-gray-300 inline-block">
                    <div id="item-emoji" class="text-8xl mb-4">🍞</div>
                    <div id="item-name" class="text-3xl font-bold text-gray-700">面包 (食物)</div>
                </div>

                <div class="flex justify-center gap-6">
                    <button onclick="checkItem('need')" class="flex-1 max-w-[200px] bg-purple-100 border-4 border-purple-400 text-purple-700 font-bold py-4 px-6 rounded-2xl text-2xl hover:bg-purple-200 transition-colors active:scale-95 shadow-md">
                        ✅ 需求
                    </button>
                    <button onclick="checkItem('want')" class="flex-1 max-w-[200px] bg-orange-100 border-4 border-orange-400 text-orange-700 font-bold py-4 px-6 rounded-2xl text-2xl hover:bg-orange-200 transition-colors active:scale-95 shadow-md">
                        🎁 要求
                    </button>
                </div>
            </div>

            <!-- 屏幕 3: 情境题 -->
            <div id="screen-scenario" class="fade-in hidden">
                <span class="bg-indigo-100 text-indigo-600 px-4 py-1 rounded-full text-sm font-bold mb-4 inline-block">第三关：情境大考验</span>
                <div class="bg-blue-50 p-6 rounded-2xl mb-6">
                    <h2 class="text-2xl font-bold text-gray-800 mb-4">🤖 约翰的玩具机器人跌坏了...</h2>
                    <p class="text-xl text-gray-700">如果你是约翰，你会怎么表达你的情绪？</p>
                </div>
                
                <div class="flex flex-col gap-4 max-w-md mx-auto">
                    <button onclick="checkScenario(false)" class="bg-white border-2 border-red-200 p-4 rounded-xl text-lg font-bold text-red-600 hover:bg-red-50 text-left flex items-center gap-4 transition-colors">
                        <span class="text-3xl">😡</span> 大哭大闹，乱丢东西
                    </button>
                    <button onclick="checkScenario(true)" class="bg-white border-2 border-green-200 p-4 rounded-xl text-lg font-bold text-green-600 hover:bg-green-50 text-left flex items-center gap-4 transition-colors">
                        <span class="text-3xl">🗣️</span> 好好跟爸爸妈妈说我很伤心
                    </button>
                </div>
            </div>

            <!-- 屏幕 4: 结束 -->
            <div id="screen-end" class="fade-in hidden">
                <div class="text-8xl mb-4">🏆</div>
                <h2 class="text-4xl font-bold text-yellow-500 mb-2">太棒了！</h2>
                <p class="text-2xl text-gray-700 mb-6"><span id="final-name" class="font-bold text-cyan-600"></span>，你完成了探险！</p>
                
                <div class="bg-yellow-50 border-4 border-yellow-300 rounded-3xl p-6 inline-block mb-8">
                    <p class="text-lg text-gray-600">你的总分</p>
                    <p class="text-6xl font-black text-yellow-600" id="final-score">100</p>
                </div>
                
                <div id="sync-status" class="text-gray-500 mb-4">
                    <span class="animate-pulse">🔄 正在将分数发送给老师...</span>
                </div>

                <button onclick="location.reload()" class="bg-gray-200 text-gray-700 font-bold py-3 px-8 rounded-full hover:bg-gray-300 transition-colors">
                    再玩一次
                </button>
            </div>

        </div>
    </div>

    <!-- 自定义消息弹窗 -->
    <div id="msg-box" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full mx-4 text-center transform scale-95 transition-transform" id="msg-content">
            <div id="msg-icon" class="text-6xl mb-4">🌟</div>
            <h3 id="msg-title" class="text-2xl font-bold mb-2">提示</h3>
            <p id="msg-text" class="text-gray-600 mb-6 text-lg">内容</p>
            <button onclick="closeMsg()" id="msg-btn" class="bg-cyan-500 text-white font-bold py-3 px-8 rounded-full w-full hover:bg-cyan-600">
                继续
            </button>
        </div>
    </div>

    <script>
        // --- 音效引擎 (Web Audio API) ---
        let audioCtx;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playTone(freq, wave, duration, vol, delay) {
            initAudio();
            const t = audioCtx.currentTime + delay;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = wave;
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(vol, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + duration);
        }

        function playSound(type) {
            initAudio();
            if (type === 'click') {
                playTone(600, 'sine', 0.1, 0.1, 0);
            } else if (type === 'success') {
                // 答对音效：欢快的上升音阶
                playTone(523.25, 'sine', 0.1, 0.1, 0);     // Do
                playTone(659.25, 'sine', 0.1, 0.1, 0.1);   // Mi
                playTone(783.99, 'sine', 0.3, 0.1, 0.2);   // Sol
            } else if (type === 'error') {
                // 答错音效：低沉的错误提示
                playTone(300, 'square', 0.2, 0.05, 0);
                playTone(200, 'square', 0.3, 0.05, 0.2);
            } else if (type === 'win') {
                // 胜利音效：华丽的通关旋律
                playTone(523.25, 'sine', 0.1, 0.1, 0);
                playTone(659.25, 'sine', 0.1, 0.1, 0.15);
                playTone(783.99, 'sine', 0.1, 0.1, 0.3);
                playTone(1046.50, 'sine', 0.4, 0.1, 0.45); // 高音 Do
            }
        }
        // ------------------------------

        // 游戏状态
        let state = {
            name: "",
            score: 0,
            itemIndex: 0,
            progress: 0
        };

        // 物品数据 (需求与要求)
        const items = [
            { name: "校服", emoji: "👕", type: "need", reason: "每天上学必须穿的。" },
            { name: "新手机", emoji: "📱", type: "want", reason: "想要用来玩游戏，但不是必须的。" },
            { name: "文具盒", emoji: "✏️", type: "need", reason: "写字和做功课必须用的。" },
            { name: "巧克力", emoji: "🍫", type: "want", reason: "好吃，但不吃也不会影响健康。" }
        ];

        // 页面控制函数
        function showScreen(screenId) {
            ['screen-start', 'screen-emotion', 'screen-classify', 'screen-scenario', 'screen-end'].forEach(id => {
                document.getElementById(id).classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
            document.getElementById(screenId).classList.add('fade-in');
        }

        function updateProgress(percent) {
            document.getElementById('progress-bar').style.width = percent + '%';
        }

        function showMessage(icon, title, text, type = 'normal', callback = null) {
            const msgBox = document.getElementById('msg-box');
            document.getElementById('msg-icon').innerText = icon;
            document.getElementById('msg-title').innerText = title;
            document.getElementById('msg-title').className = `text-2xl font-bold mb-2 ${type === 'error' ? 'text-red-500' : 'text-green-500'}`;
            document.getElementById('msg-text').innerText = text;
            
            const btn = document.getElementById('msg-btn');
            btn.className = `font-bold py-3 px-8 rounded-full w-full text-white ${type === 'error' ? 'bg-red-500 hover:bg-red-600' : 'bg-green-500 hover:bg-green-600'}`;
            
            msgBox.classList.remove('hidden');

            // 播放对应音效
            if (type === 'success') playSound('success');
            else if (type === 'error') playSound('error');
            else playSound('click');
            
            // 绑定关闭事件
            btn.onclick = () => {
                playSound('click'); // 弹窗点击音效
                msgBox.classList.add('hidden');
                if (callback) callback();
            };
        }

        // 游戏流程函数
        function startGame() {
            playSound('click'); // 按钮点击音效
            const nameInput = document.getElementById('playerName').value.trim();
            if (!nameInput) {
                showMessage("🤔", "等等！", "请先输入你的名字哦！", "error");
                return;
            }
            state.name = nameInput;
            updateProgress(20);
            showScreen('screen-emotion');
        }

        // 第一关：情绪
        function checkEmotion(isCorrect) {
            if (isCorrect) {
                state.score += 20;
                showMessage("🎉", "答对啦！", "伤心的时候，我们会揉揉眼。参考课本第71页！", "success", () => {
                    updateProgress(40);
                    loadNextItem();
                    showScreen('screen-classify');
                });
            } else {
                showMessage("💡", "不对哦~", "伤心的时候，我们通常会揉揉眼。拍手是开心，跺脚是生气哦。", "error", () => {
                    // 答错也直接进入下一关，不给重选
                    updateProgress(40);
                    loadNextItem();
                    showScreen('screen-classify');
                });
            }
        }

        // 第二关：分类
        function loadNextItem() {
            if (state.itemIndex < items.length) {
                const item = items[state.itemIndex];
                document.getElementById('item-emoji').innerText = item.emoji;
                document.getElementById('item-name').innerText = item.name;
            } else {
                // 分类关卡完成，进入情境题
                updateProgress(80);
                showScreen('screen-scenario');
            }
        }

        function checkItem(selectedType) {
            const item = items[state.itemIndex];
            if (selectedType === item.type) {
                state.score += 10; // 每个10分，共40分
                showMessage("⭐", "答对啦！", item.reason, "success", () => {
                    state.itemIndex++;
                    updateProgress(40 + (state.itemIndex * 10));
                    loadNextItem();
                });
            } else {
                // 答错显示正确答案并直接进入下一题
                let correctAnswerText = item.type === 'need' ? "需求" : "要求";
                showMessage("👀", "哎呀，选错啦", `这个是【${correctAnswerText}】哦。${item.reason}`, "error", () => {
                    state.itemIndex++;
                    updateProgress(40 + (state.itemIndex * 10));
                    loadNextItem();
                });
            }
        }

        // 第三关：情境
        function checkScenario(isCorrect) {
            if (isCorrect) {
                state.score += 40;
                updateProgress(100);
                showMessage("🌟", "非常棒！", "适当地表达情绪是正常的，但不能伤害自己或别人哦！", "success", () => {
                    endGame();
                });
            } else {
                // 答错也结束游戏并结算
                updateProgress(100);
                showMessage("💔", "这样不太好哦", "大哭大闹会伤害自己和物品，试着用嘴巴说出你的感受吧！", "error", () => {
                    endGame();
                });
            }
        }

        // 结束与数据同步
        function endGame() {
            playSound('win'); // 播放通关胜利音效
            showScreen('screen-end');
            document.getElementById('final-name').innerText = state.name;
            document.getElementById('final-score').innerText = state.score;
            
            // 模拟发送数据到 Google Sheets
            // 实际使用时，请将下方 URL 替换为你在 Google Apps Script 获取的 Web URL
            const scriptUrl = "https://script.google.com/macros/s/AKfycbwceSzEbVw_JFieIbolmwJtwFM9GUxy3uGsFfkyNhLmT-M4MM9PLVjEU9QablHy_ljKZQ/exec"; 
            
            setTimeout(() => {
                const statusEl = document.getElementById('sync-status');
                statusEl.innerHTML = `<span class="text-green-500 font-bold">✅ 成功！老师已经收到你的分数啦！</span>`;
                
                // 真实环境下的提交代码 (这里被注释掉了，以防在预览环境中报错)
                /*
                fetch(`${scriptUrl}?name=${encodeURIComponent(state.name)}&score=${state.score}&emotion=Completed`)
                    .then(response => {
                        statusEl.innerHTML = `<span class="text-green-500 font-bold">✅ 成功！老师已经收到你的分数啦！</span>`;
                    })
                    .catch(err => {
                        statusEl.innerHTML = `<span class="text-red-500">⚠️ 网络错误，但你的分数是：${state.score}</span>`;
                    });
                */
            }, 2000);
        }
    </script>
</body>
</html>
