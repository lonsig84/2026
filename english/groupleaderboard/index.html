<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 English Class 2.0 - Cloud Management System</title>
  
  <!-- Core Dependencies -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(at 10% 10%, rgba(254, 226, 226, 0.9) 0px, transparent 50%),
        radial-gradient(at 90% 10%, rgba(224, 242, 254, 0.9) 0px, transparent 50%),
        radial-gradient(at 50% 50%, rgba(243, 232, 255, 0.9) 0px, transparent 50%),
        radial-gradient(at 80% 90%, rgba(209, 250, 229, 0.9) 0px, transparent 50%),
        radial-gradient(at 20% 90%, rgba(254, 240, 138, 0.6) 0px, transparent 50%);
      background-attachment: fixed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #334155;
    }
    
    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.04), 0 0 20px rgba(255, 255, 255, 0.5) inset;
    }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.3); border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }
    
    @keyframes slideIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-slide-in { animation: slideIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

    @keyframes pulse-soft { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(0.95); } }
    .animate-syncing { animation: pulse-soft 1s infinite ease-in-out; }

    .theme-pink { --c-main: #f43f5e; --c-light: #fff1f2; --c-grad: linear-gradient(135deg, #ff758f, #e63946); }
    .theme-blue { --c-main: #0ea5e9; --c-light: #f0f9ff; --c-grad: linear-gradient(135deg, #48cae4, #0077b6); }
    .theme-green { --c-main: #10b981; --c-light: #ecfdf5; --c-grad: linear-gradient(135deg, #52b788, #2d6a4f); }
    .theme-orange { --c-main: #f97316; --c-light: #fff7ed; --c-grad: linear-gradient(135deg, #fb923c, #ea580c); }
    .theme-purple { --c-main: #a855f7; --c-light: #faf5ff; --c-grad: linear-gradient(135deg, #c084fc, #9333ea); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ==========================================
    // ⚠️ CRITICAL: Replace with a NEW Google Apps Script URL for the English Class.
    // If you use the same URL as the Chinese class, the data will overwrite each other!
    // ==========================================
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw31sTWVqpaLqwuE3bEsGUaTNoalaGCdLbzutDH6wrt9yDXFkv6BTcu8SuR00yE_-Nxbg/exec"; 

    // Default English Data Structure
    const INITIAL_DATA = [
      { id: 'A', name: 'Group A', theme: 'theme-pink', score: 0, students: [{id: 'A1', name: 'Alice', score: 0}, {id: 'A2', name: 'Bob', score: 0}, {id: 'A3', name: 'Charlie', score: 0}] },
      { id: 'B', name: 'Group B', theme: 'theme-blue', score: 0, students: [{id: 'B1', name: 'David', score: 0}, {id: 'B2', name: 'Emma', score: 0}, {id: 'B3', name: 'Frank', score: 0}] },
      { id: 'C', name: 'Group C', theme: 'theme-green', score: 0, students: [{id: 'C1', name: 'Grace', score: 0}, {id: 'C2', name: 'Henry', score: 0}, {id: 'C3', name: 'Ivy', score: 0}] }
    ];

    // Sound Effects
    const playSound = (type) => {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);
      if (type === 'add') {
        osc.type = 'sine'; osc.frequency.setValueAtTime(987.77, ctx.currentTime);
        gain.gain.setValueAtTime(0, ctx.currentTime); gain.gain.linearRampToValueAtTime(0.5, ctx.currentTime + 0.05);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.5);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
      } else if (type === 'minus') {
        osc.type = 'triangle'; osc.frequency.setValueAtTime(300, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.3);
        gain.gain.setValueAtTime(0.5, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.3);
      }
    };

    function App() {
      // State Management
      const [groups, setGroups] = useState([]);
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);
      const [syncStatus, setSyncStatus] = useState('synced'); // 'synced' | 'syncing' | 'error'
      const [selectedStudent, setSelectedStudent] = useState(null);
      const [groupInputs, setGroupInputs] = useState({});
      
      const isFirstLoad = useRef(true);

      // --- 1. Initial Load from Cloud ---
      useEffect(() => {
        const fetchInitialData = async () => {
          try {
            const response = await fetch(`${GAS_API_URL}?action=getData`);
            const resData = await response.json();
            
            if (resData.status === 'success' && resData.data.groups) {
              setGroups(resData.data.groups);
              setHistory(resData.data.history || []);
            } else {
              setGroups(INITIAL_DATA);
            }
          } catch (error) {
            console.error("Cloud connection failed, using local defaults.", error);
            alert("Failed to connect to the cloud. Using offline mode.");
            setGroups(INITIAL_DATA);
          } finally {
            setLoading(false);
          }
        };
        fetchInitialData();
      }, []);

      // --- 2. Auto Save to Cloud (Debounced) ---
      useEffect(() => {
        if (isFirstLoad.current || loading) {
          isFirstLoad.current = false;
          return;
        }

        setSyncStatus('syncing');
        const timeoutId = setTimeout(async () => {
          try {
            const response = await fetch(GAS_API_URL, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify({ action: 'saveData', groups, history })
            });
            const data = await response.json();
            if(data.status === 'success') {
              setSyncStatus('synced');
            } else throw new Error(data.message);
          } catch (err) {
            console.error("Save failed", err);
            setSyncStatus('error');
          }
        }, 1500);

        return () => clearTimeout(timeoutId);
      }, [groups, history]);

      // --- Core Business Logic ---
      const logHistory = (action, points, targetName, payload = null) => {
        const newLog = {
          id: Date.now(),
          time: new Date().toLocaleTimeString('en-US', {hour: '2-digit', minute:'2-digit', second:'2-digit'}),
          action, points, targetName, payload
        };
        setHistory(prev => [newLog, ...prev].slice(0, 80));
      };

      const addGroupScore = (groupId, points, event) => {
        if(!points || isNaN(points)) return;
        setGroups(prev => prev.map(g => g.id === groupId ? { ...g, score: g.score + points } : g));
        logHistory(points > 0 ? 'Awarded' : 'Deducted', points, groups.find(g => g.id === groupId).name);
        triggerEffects(points, event.target);
      };

      const addStudentScore = (groupId, studentId, points, event) => {
        if(!points || isNaN(points)) return;
        setGroups(prev => prev.map(g => {
          if (g.id !== groupId) return g;
          return {
            ...g,
            score: g.score + points,
            students: g.students.map(s => s.id === studentId ? { ...s, score: s.score + points } : s)
          };
        }));
        const sName = groups.find(g=>g.id===groupId).students.find(s=>s.id===studentId).name;
        logHistory(points > 0 ? 'Great job' : 'Penalty', points, sName);
        triggerEffects(points, event?.target);
      };

      const addStudent = (groupId) => {
        const name = prompt("Enter new student's name:");
        if (!name) return;
        setGroups(prev => prev.map(g => {
          if (g.id !== groupId) return g;
          return { ...g, students: [...g.students, { id: Date.now().toString(), name, score: 0 }] };
        }));
        logHistory('Joined group', 0, name);
      };

      const updateStudentName = (groupId, studentId, newName) => {
        if (!newName) return;
        setGroups(prev => prev.map(g => g.id === groupId ? {
          ...g, students: g.students.map(s => s.id === studentId ? { ...s, name: newName } : s)
        } : g));
        setSelectedStudent(null);
      };

      const deleteStudent = (groupId, studentId, name) => {
        if(!window.confirm(`Are you sure you want to remove ${name} from the group?`)) return;
        
        const targetGroup = groups.find(g => g.id === groupId);
        const studentToRestore = targetGroup.students.find(s => s.id === studentId);

        setGroups(prev => prev.map(g => g.id === groupId ? {
          ...g, students: g.students.filter(s => s.id !== studentId)
        } : g));
        
        logHistory('Removed from group', 0, name, { type: 'restore_student', groupId, data: studentToRestore });
        setSelectedStudent(null);
      };

      const addNewGroup = () => {
        const groupName = prompt("Enter new group name (e.g., Group D):");
        if (!groupName) return;
        
        const themes = ['theme-pink', 'theme-blue', 'theme-green', 'theme-orange', 'theme-purple'];
        const themeToUse = themes[groups.length % themes.length];
        
        const newGroup = {
          id: 'G' + Date.now().toString(),
          name: groupName,
          theme: themeToUse,
          score: 0,
          students: []
        };

        setGroups(prev => [...prev, newGroup]);
        logHistory('Created group', 0, groupName);
      };

      const deleteGroup = (groupId, groupName) => {
        if(!window.confirm(`⚠️ WARNING: Are you sure you want to delete [${groupName}]?\n\nAll scores and members in this group will be permanently lost!`)) return;
        
        const groupToRestore = groups.find(g => g.id === groupId);
        
        setGroups(prev => prev.filter(g => g.id !== groupId));
        logHistory('Deleted group', 0, groupName, { type: 'restore_group', data: groupToRestore });
      };

      // --- Undo Logics ---
      const restoreGroup = (logId, groupData) => {
        if(groups.some(g => g.id === groupData.id)) return alert("This group already exists!");
        setGroups(prev => [...prev, groupData]);
        logHistory('Restored group', 0, groupData.name);
        setHistory(prev => prev.map(log => log.id === logId ? { ...log, payload: null } : log));
      };

      const restoreStudent = (logId, groupId, studentData) => {
        setGroups(prev => prev.map(g => {
          if (g.id === groupId) {
            if (g.students.some(s => s.id === studentData.id)) return g;
            return { ...g, students: [...g.students, studentData] };
          }
          return g;
        }));
        logHistory('Restored member', 0, studentData.name);
        setHistory(prev => prev.map(log => log.id === logId ? { ...log, payload: null } : log));
      };

      const triggerEffects = (points, element) => {
        points > 0 ? playSound('add') : playSound('minus');
        if (points > 0 && element) {
          const rect = element.getBoundingClientRect();
          confetti({ particleCount: 40, spread: 60, origin: { x: (rect.left+rect.width/2)/window.innerWidth, y: (rect.top+rect.height/2)/window.innerHeight } });
        }
      };

      const leaderboard = useMemo(() => {
        let allStudents = [];
        groups.forEach(g => { g.students.forEach(s => allStudents.push({ ...s, groupName: g.name, theme: g.theme })); });
        return allStudents.sort((a, b) => b.score - a.score).slice(0, 10);
      }, [groups]);

      // --- UI Rendering ---
      if (loading) {
        return (
          <div className="h-screen flex flex-col items-center justify-center space-y-4">
            <div className="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500"></div>
            <p className="text-slate-500 font-bold tracking-widest animate-pulse">Connecting to Cloud System...</p>
          </div>
        );
      }

      return (
        <div className="min-h-screen p-6 md:p-10 max-w-7xl mx-auto flex flex-col gap-8">
          
          {/* Header */}
          <header className="glass-panel rounded-3xl p-8 text-center relative overflow-hidden flex flex-col md:flex-row justify-between items-center gap-4">
            <div className="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-pink-500 via-blue-500 to-green-500"></div>
            <div className="text-left">
              <h1 className="text-4xl md:text-5xl font-black text-slate-800 tracking-tight mb-2">🏆 English Class Scoreboard <span className="text-xl text-blue-500 bg-blue-100 px-3 py-1 rounded-full align-middle">v2.0 ☁️</span></h1>
              <p className="text-slate-500 font-medium text-lg flex items-center gap-2">
                Status: 
                {syncStatus === 'syncing' && <span className="text-amber-500 animate-syncing flex items-center gap-1"><svg className="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> Syncing...</span>}
                {syncStatus === 'synced' && <span className="text-green-500 flex items-center gap-1">✅ Saved to Cloud</span>}
                {syncStatus === 'error' && <span className="text-red-500 flex items-center gap-1">❌ Sync failed, check network</span>}
              </p>
            </div>
            <button 
              onClick={() => { if(confirm('Reset all scores to zero? Member lists will be kept.')) { 
                setGroups(groups.map(g => ({...g, score:0, students: g.students.map(s => ({...s, score:0}))})));
                setHistory([{id: Date.now(), time: new Date().toLocaleTimeString(), action: 'Reset all data', points: 0, targetName: 'Teacher'}]);
              } }}
              className="text-red-400 hover:text-red-600 font-bold bg-white/50 px-4 py-2 rounded-xl border border-red-100 transition whitespace-nowrap">
              Reset All
            </button>
          </header>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
            {/* Left: Groups */}
            <div className="lg:col-span-2 space-y-8">
              {groups.map((group, idx) => (
                <div key={group.id} className={`glass-panel rounded-3xl p-6 relative ${group.theme} animate-slide-in`} style={{animationDelay: `${idx*0.1}s`}}>
                  <div className="absolute top-0 right-0 w-32 h-32 rounded-full opacity-20 filter blur-2xl" style={{background: 'var(--c-main)'}}></div>
                  
                  <div className="flex justify-between items-end mb-6 relative z-10">
                    <div>
                      <h2 className="text-3xl font-black text-slate-800 drop-shadow-sm flex items-center gap-3">
                        <span className="w-10 h-10 rounded-xl text-white flex items-center justify-center text-xl shadow-lg" style={{background: 'var(--c-grad)'}}>{group.name.charAt(0)}</span>
                        {group.name}
                        <button onClick={() => deleteGroup(group.id, group.name)} className="ml-1 w-7 h-7 flex items-center justify-center rounded-full bg-white/50 text-red-400 hover:bg-red-500 hover:text-white transition-all opacity-40 hover:opacity-100 shadow-sm" title="Delete Group">
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                        </button>
                      </h2>
                    </div>
                    <div className="text-right flex items-center gap-4">
                      <div className="text-6xl font-black text-slate-800 drop-shadow-md">{group.score}</div>
                      <div className="flex flex-col gap-2">
                        <div className="flex gap-1 justify-end">
                          <button onClick={(e) => addGroupScore(group.id, 5, e)} className="bg-white/80 hover:bg-white text-slate-800 font-bold w-10 h-8 rounded-lg shadow-sm hover:scale-105 transition text-sm">+5</button>
                          <button onClick={(e) => addGroupScore(group.id, -2, e)} className="bg-white/50 hover:bg-white/80 text-red-500 font-bold w-10 h-8 rounded-lg shadow-sm hover:scale-105 transition text-sm">-2</button>
                        </div>
                        <div className="flex items-center bg-white/60 p-1 rounded-lg shadow-inner border border-white/60">
                          <input type="number" placeholder="± Score" value={groupInputs[group.id] || ''}
                            onChange={(e) => setGroupInputs({...groupInputs, [group.id]: e.target.value})}
                            onKeyDown={(e) => { if(e.key === 'Enter') { addGroupScore(group.id, parseInt(groupInputs[group.id]), e); setGroupInputs({...groupInputs, [group.id]: ''}); } }}
                            className="w-16 bg-transparent text-center font-bold text-slate-700 outline-none text-sm placeholder-gray-400" />
                          <button onClick={(e) => { addGroupScore(group.id, parseInt(groupInputs[group.id]), e); setGroupInputs({...groupInputs, [group.id]: ''}); }}
                            className="w-7 h-7 bg-white text-blue-500 rounded font-bold text-xs shadow-sm hover:bg-blue-50">✓</button>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white/40 p-4 rounded-2xl shadow-inner border border-white/50">
                    <p className="text-xs font-bold text-slate-500 mb-3">Team Members (Click to edit)</p>
                    <div className="flex flex-wrap gap-3">
                      {group.students.map(student => (
                        <button key={student.id} onClick={() => setSelectedStudent({ group, student })}
                          className="group relative flex items-center bg-white hover:bg-slate-50 px-3 py-1.5 rounded-full shadow-sm border border-slate-200 transition hover:-translate-y-1">
                          <span className="font-bold text-slate-700 mr-2">{student.name}</span>
                          <span className="bg-slate-100 text-slate-600 text-xs font-black px-2 py-0.5 rounded-full">{student.score}</span>
                        </button>
                      ))}
                      <button onClick={() => addStudent(group.id)} className="w-8 h-8 rounded-full bg-white/50 border border-dashed border-slate-400 text-slate-500 hover:bg-white hover:text-blue-500">+</button>
                    </div>
                  </div>
                </div>
              ))}
              
              <button 
                onClick={addNewGroup}
                className="w-full glass-panel rounded-3xl p-6 border-2 border-dashed border-slate-300 text-slate-400 hover:border-blue-400 hover:text-blue-500 font-bold text-lg flex items-center justify-center gap-2 transition-all hover:bg-white/50"
              >
                <span className="text-2xl">+</span> Add New Group
              </button>
            </div>

            {/* Right Sidebar */}
            <div className="flex flex-col gap-8 h-[calc(100vh-10rem)] sticky top-6">
              
              <div className="glass-panel rounded-3xl p-6 flex-1 flex flex-col min-h-[300px]">
                <h3 className="text-xl font-black text-slate-800 mb-4">🎖️ Leaderboard</h3>
                <div className="flex-1 overflow-y-auto pr-2 space-y-3">
                  {leaderboard.length === 0 ? <p className="text-center text-slate-400 text-sm mt-4">No data</p> : null}
                  {leaderboard.map((student, i) => (
                    <div key={student.id} className="flex justify-between items-center bg-white/60 p-3 rounded-xl shadow-sm border border-white/50">
                      <div className="flex items-center gap-3">
                        <span className={`w-6 h-6 flex items-center justify-center rounded-full text-xs font-black text-white ${i===0?'bg-yellow-400':i===1?'bg-gray-400':i===2?'bg-amber-600':'bg-slate-300'}`}>{i+1}</span>
                        <div>
                          <p className="font-bold text-slate-700 text-sm">{student.name}</p>
                          <p className="text-[10px] font-bold text-slate-400 uppercase">{student.groupName}</p>
                        </div>
                      </div>
                      <div className="text-lg font-black" style={{color: 'var(--c-main)'}}>{student.score}</div>
                    </div>
                  ))}
                </div>
              </div>

              <div className="glass-panel rounded-3xl p-6 flex-1 flex flex-col min-h-[300px]">
                <h3 className="text-xl font-black text-slate-800 mb-4">📜 Activity Log</h3>
                <div className="flex-1 overflow-y-auto pr-2 space-y-3">
                  {history.length === 0 ? <p className="text-center text-slate-400 text-sm mt-4">No activity yet</p> : null}
                  {history.map(log => (
                    <div key={log.id} className="flex items-start gap-3 border-b border-slate-200/50 pb-2 last:border-0">
                      <div className={`mt-1 w-2 h-2 rounded-full ${log.points > 0 ? 'bg-green-400' : log.points < 0 ? 'bg-red-400' : 'bg-blue-400'}`}></div>
                      <div className="flex-1">
                        <p className="text-sm text-slate-700">
                          <span className="font-bold">{log.targetName}</span> {log.action} 
                          {log.points !== 0 && <span className={`ml-1 font-black ${log.points > 0 ? 'text-green-500' : 'text-red-500'}`}>{log.points > 0 ? `+${log.points}` : log.points}</span>}
                        </p>
                        
                        <div className="flex justify-between items-center mt-1">
                          <p className="text-[10px] text-slate-400">{log.time}</p>
                          
                          {/* Undo Buttons */}
                          {log.payload?.type === 'restore_group' && (
                            <button onClick={() => restoreGroup(log.id, log.payload.data)} className="text-[10px] bg-blue-50 text-blue-500 px-2 py-0.5 rounded shadow-sm border border-blue-100 hover:bg-blue-500 hover:text-white transition-all font-bold">Undo</button>
                          )}
                          {log.payload?.type === 'restore_student' && (
                            <button onClick={() => restoreStudent(log.id, log.payload.groupId, log.payload.data)} className="text-[10px] bg-blue-50 text-blue-500 px-2 py-0.5 rounded shadow-sm border border-blue-100 hover:bg-blue-500 hover:text-white transition-all font-bold">Undo</button>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* Modal */}
          {selectedStudent && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/40 backdrop-blur-sm animate-slide-in">
              <div className="bg-white rounded-3xl p-8 w-full max-w-sm shadow-2xl relative">
                <button onClick={() => setSelectedStudent(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-800">✖</button>
                
                <div className="text-center mb-6">
                  <div className="w-16 h-16 mx-auto bg-blue-100 text-blue-500 rounded-full flex items-center justify-center text-3xl font-black mb-3">{selectedStudent.student.name.charAt(0)}</div>
                  <h3 className="text-2xl font-black text-slate-800">{selectedStudent.student.name}</h3>
                  <p className="text-sm font-bold text-slate-400 mt-1">{selectedStudent.group.name} · Current Score: {selectedStudent.student.score}</p>
                </div>

                <div className="grid grid-cols-2 gap-3 mb-6">
                  <button onClick={(e) => addStudentScore(selectedStudent.group.id, selectedStudent.student.id, 2, e)} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-600 border border-emerald-200 py-3 rounded-xl font-bold flex flex-col items-center"><span className="text-2xl">+2</span><span className="text-xs">Excellent</span></button>
                  <button onClick={(e) => addStudentScore(selectedStudent.group.id, selectedStudent.student.id, 1, e)} className="bg-blue-50 hover:bg-blue-100 text-blue-600 border border-blue-200 py-3 rounded-xl font-bold flex flex-col items-center"><span className="text-2xl">+1</span><span className="text-xs">Good Answer</span></button>
                  <button onClick={(e) => addStudentScore(selectedStudent.group.id, selectedStudent.student.id, -1, e)} className="col-span-2 bg-red-50 hover:bg-red-100 text-red-500 border border-red-200 py-2 rounded-xl font-bold">-1 (Rule Break)</button>
                  
                  <div className="col-span-2 flex items-center gap-2 mt-1 bg-slate-50 p-2 rounded-xl border border-slate-100">
                    <input type="number" placeholder="Custom score (e.g., 5 or -3)" id="customScore" className="flex-1 border px-3 py-2 rounded-lg text-sm font-bold focus:outline-none focus:border-blue-400"
                      onKeyDown={(e) => { if(e.key === 'Enter') { addStudentScore(selectedStudent.group.id, selectedStudent.student.id, parseInt(e.target.value), e); e.target.value=''; } }} />
                    <button onClick={(e) => { const v = document.getElementById('customScore'); addStudentScore(selectedStudent.group.id, selectedStudent.student.id, parseInt(v.value), e); v.value=''; }} className="bg-blue-500 text-white px-4 py-2 rounded-lg font-bold text-sm">Confirm</button>
                  </div>
                </div>

                <div className="flex justify-between border-t border-slate-100 pt-4">
                  <button onClick={() => updateStudentName(selectedStudent.group.id, selectedStudent.student.id, prompt("Edit Name to:", selectedStudent.student.name))} className="text-sm font-bold text-blue-500">Edit Name</button>
                  <button onClick={() => deleteStudent(selectedStudent.group.id, selectedStudent.student.id, selectedStudent.student.name)} className="text-sm font-bold text-red-400">Remove</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
