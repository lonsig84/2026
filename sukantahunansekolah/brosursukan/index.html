<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta
    name="description"
    content="2026年学校运动会电子小册子"
  >

  <title>2026年学校运动会电子小册子</title>

  <script
    src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --header-height: 88px;
      --toolbar-height: 74px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        "Noto Sans SC",
        Arial,
        sans-serif;

      color: #174e78;

      background:
        radial-gradient(
          circle at 12% 12%,
          rgba(255, 255, 255, 0.96),
          transparent 34%
        ),
        linear-gradient(
          135deg,
          #eef8ff 0%,
          #dceffd 55%,
          #f8fcff 100%
        );
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      height: 100%;

      display: grid;

      grid-template-rows:
        var(--header-height)
        minmax(0, 1fr)
        var(--toolbar-height);
    }

    /* =========================
       顶部标题
    ========================= */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 10px 20px;

      position: relative;
      z-index: 30;

      background: rgba(255, 255, 255, 0.9);

      border-bottom:
        1px solid rgba(34, 103, 151, 0.12);

      box-shadow:
        0 4px 18px rgba(33, 88, 126, 0.08);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .title-wrap {
      text-align: center;
    }

    .title-wrap h1 {
      margin: 0;

      color: #174f77;

      font-size: clamp(20px, 2.1vw, 34px);
      line-height: 1.2;
      letter-spacing: 0.04em;
    }

    .title-wrap p {
      margin: 6px 0 0;

      color: #5c7b91;

      font-size: clamp(11px, 1.1vw, 15px);
    }

    /* =========================
       小册子显示区
    ========================= */

    .stage {
      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      padding: 10px 16px;

      overflow: hidden;
    }

    .book-viewport {
      width: 100%;
      height: 100%;

      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      overflow: hidden;

      padding: 8px;

      touch-action: none;
    }

    /*
     * 缩放及移动会应用在这一层。
     */
    #bookTransform {
      display: flex;
      align-items: center;
      justify-content: center;

      flex: 0 0 auto;

      position: relative;

      transform-origin: center center;

      will-change: transform;

      transition: transform 0.2s ease;
    }

    #bookTransform.dragging {
      transition: none;
      cursor: grabbing;
    }

    #bookTransform.zoomed {
      cursor: grab;
    }

    #book {
      visibility: hidden;

      flex: 0 0 auto;

      position: relative;

      margin: auto;
    }

    #book.ready {
      visibility: visible;
    }

    .page {
      overflow: hidden;
      background: #ffffff;
    }

    .page-content {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      background: #ffffff;
    }

    .page-content img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;
      object-position: center;

      background: #ffffff;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;

      pointer-events: none;
    }

    /* =========================
       载入状态
    ========================= */

    .loading {
      position: absolute;
      inset: 0;
      z-index: 50;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 14px;

      color: #286488;
    }

    .loading.hidden {
      display: none;
    }

    .spinner {
      width: 46px;
      height: 46px;

      border:
        5px solid rgba(33, 104, 154, 0.18);

      border-top-color: #216b9d;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      display: none;

      width: min(560px, 90%);

      padding: 22px;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.97);

      box-shadow:
        0 12px 35px rgba(20, 53, 78, 0.18);

      text-align: center;
      color: #902c37;
    }

    .error-box.show {
      display: block;
    }

    .hint {
      position: absolute;

      left: 50%;
      bottom: 10px;
      z-index: 35;

      transform: translateX(-50%);

      padding: 9px 15px;

      border-radius: 999px;

      background: rgba(16, 54, 80, 0.86);
      color: #ffffff;

      font-size: 12px;

      white-space: nowrap;

      pointer-events: none;

      opacity: 1;

      transition: opacity 0.4s ease;
    }

    .hint.hide {
      opacity: 0;
    }

    /* =========================
       控制栏
    ========================= */

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 6px 10px 12px;

      position: relative;
      z-index: 60;
    }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      padding: 7px;

      border:
        1px solid rgba(36, 104, 151, 0.14);

      border-radius: 20px;

      background: rgba(255, 255, 255, 0.93);

      box-shadow:
        0 8px 25px rgba(21, 72, 108, 0.16);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .control-btn {
      height: 46px;
      min-width: 48px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      padding: 0 14px;

      border: 0;
      border-radius: 13px;

      color: #174f77;
      background: #e8f3fa;

      cursor: pointer;

      transition:
        background 0.16s ease,
        transform 0.16s ease,
        opacity 0.16s ease;
    }

    .control-btn:hover:not(:disabled) {
      background: #d4eaf7;
      transform: translateY(-1px);
    }

    .control-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .control-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .control-btn .icon {
      font-size: 22px;
      line-height: 1;
    }

    .page-status,
    .zoom-status {
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 13px;

      border-radius: 13px;

      background: #ffffff;
      color: #315e7c;

      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;
    }

    .page-status {
      min-width: 86px;
    }

    .zoom-status {
      min-width: 70px;
    }

    .icon-only {
      width: 48px;
      padding: 0;
    }

    /*
     * 普通模式不显示缩放控制。
     */
    .zoom-control {
      display: none;
    }

    .divider {
      display: none;

      width: 1px;
      height: 30px;

      margin: 0 2px;

      background:
        rgba(44, 94, 128, 0.16);
    }

    /* =========================
       全屏模式
    ========================= */

    body.fullscreen-mode {
      background: #102438;
    }

    body.fullscreen-mode .app {
      grid-template-rows:
        minmax(0, 1fr)
        var(--toolbar-height);
    }

    body.fullscreen-mode .topbar {
      display: none;
    }

    body.fullscreen-mode .stage {
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        3px
        max(8px, env(safe-area-inset-left));
    }

    body.fullscreen-mode .toolbar {
      padding-bottom:
        max(9px, env(safe-area-inset-bottom));
    }

    body.fullscreen-mode .control-group {
      background: rgba(255, 255, 255, 0.95);
    }

    body.fullscreen-mode .zoom-control {
      display: inline-flex;
    }

    body.fullscreen-mode .divider {
      display: block;
    }

    /*
     * 网页模拟全屏。
     * 用于不支持 Fullscreen API 的手机浏览器。
     */
    body.pseudo-fullscreen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;
    }

    /* =========================
       手机
    ========================= */

    @media (max-width: 700px) {
      :root {
        --header-height: 70px;
        --toolbar-height: 64px;
      }

      .title-wrap h1 {
        font-size: 18px;
      }

      .title-wrap p {
        margin-top: 3px;
        font-size: 10px;
      }

      .stage {
        padding: 6px 3px;
      }

      .book-viewport {
        padding: 4px;
      }

      .toolbar {
        padding: 4px 4px 7px;
      }

      .control-group {
        gap: 3px;

        max-width: calc(100vw - 8px);

        padding: 5px;

        border-radius: 16px;
      }

      .control-btn {
        height: 42px;
        min-width: 40px;

        padding: 0 8px;
      }

      .control-btn .label {
        display: none;
      }

      .control-btn .icon {
        font-size: 20px;
      }

      .page-status {
        height: 42px;
        min-width: 64px;

        padding: 0 8px;

        font-size: 13px;
      }

      .zoom-status {
        height: 42px;
        min-width: 56px;

        padding: 0 6px;

        font-size: 12px;
      }

      .icon-only {
        width: 40px;
      }

      .hint {
        bottom: 6px;

        padding: 7px 11px;

        font-size: 10px;
      }

      /*
       * 手机全屏控制按钮较多，
       * 控制栏允许左右滚动。
       */
      body.fullscreen-mode .toolbar {
        justify-content: flex-start;

        overflow-x: auto;
        overflow-y: hidden;

        scrollbar-width: none;
      }

      body.fullscreen-mode .toolbar::-webkit-scrollbar {
        display: none;
      }

      body.fullscreen-mode .control-group {
        flex: 0 0 auto;

        margin: 0 auto;
      }

      .divider {
        height: 26px;
      }
    }

    @media (
      max-height: 560px
    ) and (
      orientation: landscape
    ) {
      :root {
        --header-height: 0px;
        --toolbar-height: 58px;
      }

      .topbar {
        display: none;
      }

      .stage {
        padding: 3px 7px 1px;
      }

      .toolbar {
        padding: 3px 5px 5px;
      }

      .control-btn,
      .page-status,
      .zoom-status {
        height: 39px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="title-wrap">
        <h1>2026年学校运动会电子小册子</h1>

        <p>
          左右滑动、拖动页角或使用下方按钮翻页
        </p>
      </div>
    </header>

    <main class="stage">
      <section
        id="bookViewport"
        class="book-viewport"
        aria-label="学校运动会电子小册子"
      >
        <div
          id="loading"
          class="loading"
          aria-live="polite"
        >
          <div class="spinner"></div>

          <div id="loadingText">
            正在载入小册子……
          </div>
        </div>

        <div
          id="errorBox"
          class="error-box"
          role="alert"
        >
          <strong>
            图片或翻页组件无法载入
          </strong>

          <p>
            请检查网络连接，并确认图片名称为：
          </p>

          <p>
            page-1.webp、page-2.webp、<br>
            page-3.webp、page-4.webp
          </p>
        </div>

        <div id="bookTransform">
          <div
            id="book"
            title="双击进入全屏"
          >
            <div
              class="page"
              data-density="hard"
            >
              <div class="page-content">
                <img
                  src="page-1.webp"
                  alt="学校运动会小册子封面"
                  draggable="false"
                >
              </div>
            </div>

            <div class="page">
              <div class="page-content">
                <img
                  src="page-2.webp"
                  alt="学校运动会工委表"
                  draggable="false"
                >
              </div>
            </div>

            <div class="page">
              <div class="page-content">
                <img
                  src="page-3.webp"
                  alt="学校运动会赛程"
                  draggable="false"
                >
              </div>
            </div>

            <div
              class="page"
              data-density="hard"
            >
              <div class="page-content">
                <img
                  src="page-4.webp"
                  alt="学校运动会鸣谢页"
                  draggable="false"
                >
              </div>
            </div>
          </div>
        </div>

        <div id="hint" class="hint">
          滑动翻页 · 双击进入全屏
        </div>
      </section>
    </main>

    <footer class="toolbar">
      <div class="control-group">

        <button
          id="prevBtn"
          class="control-btn"
          type="button"
          aria-label="上一页"
          disabled
        >
          <span class="icon">‹</span>
          <span class="label">上一页</span>
        </button>

        <div
          id="pageStatus"
          class="page-status"
          aria-live="polite"
        >
          1 / 4
        </div>

        <button
          id="nextBtn"
          class="control-btn"
          type="button"
          aria-label="下一页"
          disabled
        >
          <span class="label">下一页</span>
          <span class="icon">›</span>
        </button>

        <div class="divider"></div>

        <button
          id="zoomOutBtn"
          class="control-btn icon-only zoom-control"
          type="button"
          aria-label="缩小"
          title="缩小"
        >
          <span class="icon">−</span>
        </button>

        <div
          id="zoomStatus"
          class="zoom-status zoom-control"
          aria-live="polite"
        >
          100%
        </div>

        <button
          id="zoomInBtn"
          class="control-btn icon-only zoom-control"
          type="button"
          aria-label="放大"
          title="放大"
        >
          <span class="icon">＋</span>
        </button>

        <button
          id="zoomResetBtn"
          class="control-btn zoom-control"
          type="button"
          aria-label="重置缩放"
          title="恢复适合屏幕"
        >
          <span class="icon">↺</span>
          <span class="label">重置</span>
        </button>

        <div class="divider"></div>

        <button
          id="soundBtn"
          class="control-btn icon-only"
          type="button"
          aria-label="关闭翻页声音"
          title="翻页声音"
        >
          <span
            id="soundIcon"
            class="icon"
          >
            🔊
          </span>
        </button>

        <button
          id="fullscreenBtn"
          class="control-btn icon-only"
          type="button"
          aria-label="进入全屏"
          title="进入全屏"
        >
          <span
            id="fullscreenIcon"
            class="icon"
          >
            ⛶
          </span>
        </button>

      </div>
    </footer>

  </div>

  <script>
    "use strict";

    const IMAGE_FILES = [
      "page-1.webp",
      "page-2.webp",
      "page-3.webp",
      "page-4.webp"
    ];

    /*
     * 图片宽度 ÷ 高度。
     */
    const PAGE_RATIO = 0.707;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 2.2;
    const ZOOM_STEP = 0.2;
    const DOUBLE_CLICK_ZOOM = 1.6;

    const bookElement =
      document.getElementById("book");

    const bookTransform =
      document.getElementById("bookTransform");

    const bookViewport =
      document.getElementById("bookViewport");

    const loadingElement =
      document.getElementById("loading");

    const loadingText =
      document.getElementById("loadingText");

    const errorBox =
      document.getElementById("errorBox");

    const hint =
      document.getElementById("hint");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const pageStatus =
      document.getElementById("pageStatus");

    const zoomOutBtn =
      document.getElementById("zoomOutBtn");

    const zoomInBtn =
      document.getElementById("zoomInBtn");

    const zoomResetBtn =
      document.getElementById("zoomResetBtn");

    const zoomStatus =
      document.getElementById("zoomStatus");

    const soundBtn =
      document.getElementById("soundBtn");

    const soundIcon =
      document.getElementById("soundIcon");

    const fullscreenBtn =
      document.getElementById("fullscreenBtn");

    const fullscreenIcon =
      document.getElementById("fullscreenIcon");

    /*
     * 保存翻页组件运行前的四页 HTML。
     * 重建翻页组件时使用。
     */
    const ORIGINAL_PAGE_HTML =
      bookElement.innerHTML;

    let pageFlip = null;
    let resizeTimer = null;

    let currentPageIndex = 0;

    let soundEnabled = true;
    let audioContext = null;

    let pseudoFullscreen = false;

    let lastViewportWidth = 0;
    let lastViewportHeight = 0;

    /*
     * 缩放及移动状态。
     */
    let zoomScale = 1;
    let panX = 0;
    let panY = 0;

    let isPanning = false;
    let panStartX = 0;
    let panStartY = 0;
    let panStartOffsetX = 0;
    let panStartOffsetY = 0;
    let activePointerId = null;

    function nativeFullscreenActive() {
      return Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement
      );
    }

    function fullscreenActive() {
      return (
        nativeFullscreenActive() ||
        pseudoFullscreen
      );
    }

    function usePortraitLayout() {
      const width =
        bookViewport.clientWidth;

      const height =
        bookViewport.clientHeight;

      /*
       * 手机使用单页。
       */
      if (window.innerWidth <= 700) {
        return true;
      }

      /*
       * 双页若无法完整放进可用宽度，
       * 改为单页。
       */
      const requiredDoubleWidth =
        height * PAGE_RATIO * 2;

      return (
        width < 720 ||
        requiredDoubleWidth > width
      );
    }

    /*
     * 计算保证不会超出可见区域的尺寸。
     */
    function calculateBookSize() {
      const viewportWidth =
        Math.max(
          bookViewport.clientWidth,
          240
        );

      const viewportHeight =
        Math.max(
          bookViewport.clientHeight,
          280
        );

      const portraitMode =
        usePortraitLayout();

      const safeHorizontalSpace =
        portraitMode ? 30 : 54;

      const safeVerticalSpace =
        fullscreenActive() ? 28 : 38;

      const usableWidth =
        Math.max(
          viewportWidth -
            safeHorizontalSpace,
          200
        );

      const usableHeight =
        Math.max(
          viewportHeight -
            safeVerticalSpace,
          250
        );

      const pagesAcross =
        portraitMode ? 1 : 2;

      let pageWidth =
        Math.floor(
          usableWidth / pagesAcross
        );

      let pageHeight =
        Math.floor(
          pageWidth / PAGE_RATIO
        );

      if (pageHeight > usableHeight) {
        pageHeight =
          Math.floor(usableHeight);

        pageWidth =
          Math.floor(
            pageHeight * PAGE_RATIO
          );
      }

      /*
       * 为翻页阴影保留一点空间。
       */
      pageWidth =
        Math.max(
          170,
          pageWidth - 7
        );

      pageHeight =
        Math.max(
          240,
          pageHeight - 7
        );

      return {
        pageWidth,
        pageHeight,
        portraitMode
      };
    }

    function preloadImage(src) {
      return new Promise(
        (resolve, reject) => {
          const image = new Image();

          image.onload = () =>
            resolve(src);

          image.onerror = () => {
            reject(
              new Error(
                `无法载入图片：${src}`
              )
            );
          };

          /*
           * 更换版本号码可减少旧缓存问题。
           */
          image.src =
            `${src}?v=20260806-zoom1`;
        }
      );
    }

    async function preloadAllImages() {
      let loaded = 0;

      for (const src of IMAGE_FILES) {
        await preloadImage(src);

        loaded += 1;

        loadingText.textContent =
          `正在载入小册子…… ${loaded} / ${IMAGE_FILES.length}`;
      }
    }

    /*
     * 用 Web Audio 即时产生纸张翻动声。
     */
    function playPageTurnSound() {
      if (!soundEnabled) {
        return;
      }

      try {
        if (!audioContext) {
          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();
        }

        if (
          audioContext.state ===
          "suspended"
        ) {
          audioContext.resume();
        }

        const duration = 0.25;

        const sampleCount =
          Math.floor(
            audioContext.sampleRate *
              duration
          );

        const buffer =
          audioContext.createBuffer(
            1,
            sampleCount,
            audioContext.sampleRate
          );

        const data =
          buffer.getChannelData(0);

        for (
          let index = 0;
          index < sampleCount;
          index += 1
        ) {
          const progress =
            index / sampleCount;

          const envelope =
            Math.pow(
              1 - progress,
              2.4
            );

          const noise =
            Math.random() * 2 - 1;

          const movement =
            0.76 +
            Math.sin(
              progress *
                Math.PI *
                11
            ) *
              0.15;

          data[index] =
            noise *
            envelope *
            movement;
        }

        const source =
          audioContext.createBufferSource();

        const filter =
          audioContext.createBiquadFilter();

        const gain =
          audioContext.createGain();

        source.buffer = buffer;

        filter.type = "bandpass";
        filter.frequency.value = 1180;
        filter.Q.value = 0.72;

        gain.gain.setValueAtTime(
          0.0001,
          audioContext.currentTime
        );

        gain.gain
          .exponentialRampToValueAtTime(
            0.17,
            audioContext.currentTime +
              0.018
          );

        gain.gain
          .exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime +
              duration
          );

        source.connect(filter);
        filter.connect(gain);
        gain.connect(
          audioContext.destination
        );

        source.start();
      } catch (error) {
        console.warn(
          "翻页声音无法播放：",
          error
        );
      }
    }

    function updatePageControls() {
      if (!pageFlip) {
        return;
      }

      const totalPages =
        pageFlip.getPageCount();

      currentPageIndex =
        pageFlip.getCurrentPageIndex();

      pageStatus.textContent =
        `${currentPageIndex + 1} / ${totalPages}`;

      prevBtn.disabled =
        currentPageIndex <= 0;

      nextBtn.disabled =
        currentPageIndex >=
        totalPages - 1;
    }

    /*
     * 缩放后可移动的最大范围。
     */
    function getPanLimits() {
      if (zoomScale <= 1) {
        return {
          maxX: 0,
          maxY: 0
        };
      }

      const viewportWidth =
        bookViewport.clientWidth;

      const viewportHeight =
        bookViewport.clientHeight;

      const baseWidth =
        bookTransform.offsetWidth;

      const baseHeight =
        bookTransform.offsetHeight;

      const scaledWidth =
        baseWidth * zoomScale;

      const scaledHeight =
        baseHeight * zoomScale;

      /*
       * 允许内容在边缘保留少许空间。
       */
      const extraPadding = 24;

      const maxX =
        Math.max(
          0,
          (
            scaledWidth -
            viewportWidth
          ) /
            2 +
            extraPadding
        );

      const maxY =
        Math.max(
          0,
          (
            scaledHeight -
            viewportHeight
          ) /
            2 +
            extraPadding
        );

      return {
        maxX,
        maxY
      };
    }

    function clampPan() {
      const {
        maxX,
        maxY
      } = getPanLimits();

      panX =
        Math.min(
          maxX,
          Math.max(-maxX, panX)
        );

      panY =
        Math.min(
          maxY,
          Math.max(-maxY, panY)
        );
    }

    function applyZoomTransform(
      animate = true
    ) {
      clampPan();

      bookTransform.classList.toggle(
        "zoomed",
        zoomScale > 1
      );

      bookTransform.style.transition =
        animate
          ? "transform 0.2s ease"
          : "none";

      bookTransform.style.transform =
        `translate(${panX}px, ${panY}px) scale(${zoomScale})`;

      zoomStatus.textContent =
        `${Math.round(
          zoomScale * 100
        )}%`;

      zoomOutBtn.disabled =
        zoomScale <= MIN_ZOOM;

      zoomInBtn.disabled =
        zoomScale >= MAX_ZOOM;

      /*
       * 放大后关闭 PageFlip 的鼠标及触控操作，
       * 让拖动手势专门用于移动画面。
       */
      bookElement.style.pointerEvents =
        zoomScale > 1
          ? "none"
          : "auto";

      if (zoomScale > 1) {
        hint.textContent =
          "拖动画面查看 · 使用按钮翻页";

        hint.classList.remove("hide");

        window.clearTimeout(
          hint.hideTimer
        );

        hint.hideTimer =
          window.setTimeout(() => {
            hint.classList.add("hide");
          }, 2200);
      }
    }

    function setZoom(
      newZoom,
      animate = true
    ) {
      if (!fullscreenActive()) {
        return;
      }

      const roundedZoom =
        Math.round(newZoom * 10) / 10;

      zoomScale =
        Math.min(
          MAX_ZOOM,
          Math.max(
            MIN_ZOOM,
            roundedZoom
          )
        );

      /*
       * 回到100%时自动回到中央。
       */
      if (zoomScale <= 1) {
        zoomScale = 1;
        panX = 0;
        panY = 0;
      }

      applyZoomTransform(animate);
    }

    function resetZoom(
      animate = true
    ) {
      zoomScale = 1;
      panX = 0;
      panY = 0;

      applyZoomTransform(animate);
    }

    function restoreOriginalPages() {
      bookElement.innerHTML =
        ORIGINAL_PAGE_HTML;
    }

    function destroyBook() {
      if (pageFlip) {
        try {
          currentPageIndex =
            pageFlip.getCurrentPageIndex();

          pageFlip.destroy();
        } catch (error) {
          console.warn(
            "移除旧翻页组件时出现提示：",
            error
          );
        }
      }

      pageFlip = null;

      bookElement.classList.remove(
        "ready"
      );

      restoreOriginalPages();
    }

    function initialiseBook(
      requestedPageIndex = 0
    ) {
      if (
        !window.St ||
        typeof window.St.PageFlip !==
          "function"
      ) {
        throw new Error(
          "翻页组件没有成功载入。"
        );
      }

      if (
        bookElement.querySelectorAll(
          ".page"
        ).length !==
        IMAGE_FILES.length
      ) {
        restoreOriginalPages();
      }

      const {
        pageWidth,
        pageHeight
      } = calculateBookSize();

      lastViewportWidth =
        bookViewport.clientWidth;

      lastViewportHeight =
        bookViewport.clientHeight;

      pageFlip =
        new St.PageFlip(
          bookElement,
          {
            width: pageWidth,
            height: pageHeight,

            size: "fixed",

            minWidth: pageWidth,
            maxWidth: pageWidth,

            minHeight: pageHeight,
            maxHeight: pageHeight,

            autoSize: false,

            showCover: true,

            /*
             * 组件会根据可用空间自动使用单页或双页。
             */
            usePortrait: true,

            drawShadow: true,
            maxShadowOpacity: 0.4,

            flippingTime: 720,

            mobileScrollSupport: false,
            useMouseEvents: true,

            swipeDistance: 18,

            showPageCorners: true,

            disableFlipByClick: false
          }
        );

      const pages =
        bookElement.querySelectorAll(
          ".page"
        );

      pageFlip.loadFromHTML(pages);

      pageFlip.on("flip", () => {
        updatePageControls();
        playPageTurnSound();

        /*
         * 换页后把放大的页面移回中央，
         * 但保留当前缩放比例。
         */
        if (zoomScale > 1) {
          panX = 0;
          panY = 0;
          applyZoomTransform();
        }

        hint.classList.add("hide");
      });

      pageFlip.on(
        "changeOrientation",
        () => {
          window.setTimeout(
            updatePageControls,
            60
          );
        }
      );

      bookElement.classList.add(
        "ready"
      );

      loadingElement.classList.add(
        "hidden"
      );

      const maximumIndex =
        pageFlip.getPageCount() - 1;

      const safePageIndex =
        Math.min(
          Math.max(
            requestedPageIndex,
            0
          ),
          maximumIndex
        );

      window.setTimeout(() => {
        if (
          pageFlip &&
          safePageIndex > 0
        ) {
          pageFlip.turnToPage(
            safePageIndex
          );
        }

        updatePageControls();
        applyZoomTransform(false);
      }, 130);
    }

    function rebuildBook() {
      const savedPageIndex =
        pageFlip
          ? pageFlip.getCurrentPageIndex()
          : currentPageIndex;

      /*
       * 重建版面时回到100%，
       * 避免旧的移动位置超出新屏幕。
       */
      zoomScale = 1;
      panX = 0;
      panY = 0;

      bookTransform.style.transform =
        "translate(0px, 0px) scale(1)";

      destroyBook();

      window.requestAnimationFrame(
        () => {
          window.requestAnimationFrame(
            () => {
              initialiseBook(
                savedPageIndex
              );
            }
          );
        }
      );
    }

    function scheduleRebuild(
      delay = 350
    ) {
      window.clearTimeout(
        resizeTimer
      );

      resizeTimer =
        window.setTimeout(
          rebuildBook,
          delay
        );
    }

    function shouldRebuildForResize() {
      const newWidth =
        bookViewport.clientWidth;

      const newHeight =
        bookViewport.clientHeight;

      const widthDifference =
        Math.abs(
          newWidth -
          lastViewportWidth
        );

      const heightDifference =
        Math.abs(
          newHeight -
          lastViewportHeight
        );

      return (
        widthDifference > 40 ||
        heightDifference > 70
      );
    }

    /* =========================
       翻页按钮
    ========================= */

    prevBtn.addEventListener(
      "click",
      () => {
        if (pageFlip) {
          pageFlip.flipPrev();
        }
      }
    );

    nextBtn.addEventListener(
      "click",
      () => {
        if (pageFlip) {
          pageFlip.flipNext();
        }
      }
    );

    /* =========================
       缩放按钮
    ========================= */

    zoomInBtn.addEventListener(
      "click",
      () => {
        setZoom(
          zoomScale + ZOOM_STEP
        );
      }
    );

    zoomOutBtn.addEventListener(
      "click",
      () => {
        setZoom(
          zoomScale - ZOOM_STEP
        );
      }
    );

    zoomResetBtn.addEventListener(
      "click",
      () => {
        resetZoom();
      }
    );

    /*
     * 电脑全屏时：
     * Ctrl + 滚轮缩放。
     */
    bookViewport.addEventListener(
      "wheel",
      event => {
        if (
          !fullscreenActive() ||
          !event.ctrlKey
        ) {
          return;
        }

        event.preventDefault();

        if (event.deltaY < 0) {
          setZoom(
            zoomScale + ZOOM_STEP
          );
        } else {
          setZoom(
            zoomScale - ZOOM_STEP
          );
        }
      },
      {
        passive: false
      }
    );

    /* =========================
       放大后拖动画面
    ========================= */

    bookViewport.addEventListener(
      "pointerdown",
      event => {
        if (
          !fullscreenActive() ||
          zoomScale <= 1
        ) {
          return;
        }

        if (
          event.pointerType === "mouse" &&
          event.button !== 0
        ) {
          return;
        }

        event.preventDefault();

        isPanning = true;

        activePointerId =
          event.pointerId;

        panStartX =
          event.clientX;

        panStartY =
          event.clientY;

        panStartOffsetX =
          panX;

        panStartOffsetY =
          panY;

        bookTransform.classList.add(
          "dragging"
        );

        bookViewport.setPointerCapture(
          event.pointerId
        );
      }
    );

    bookViewport.addEventListener(
      "pointermove",
      event => {
        if (
          !isPanning ||
          event.pointerId !==
            activePointerId
        ) {
          return;
        }

        event.preventDefault();

        panX =
          panStartOffsetX +
          (
            event.clientX -
            panStartX
          );

        panY =
          panStartOffsetY +
          (
            event.clientY -
            panStartY
          );

        applyZoomTransform(false);
      }
    );

    function stopPanning(event) {
      if (
        !isPanning ||
        (
          event &&
          event.pointerId !==
            activePointerId
        )
      ) {
        return;
      }

      isPanning = false;
      activePointerId = null;

      bookTransform.classList.remove(
        "dragging"
      );

      applyZoomTransform(true);
    }

    bookViewport.addEventListener(
      "pointerup",
      stopPanning
    );

    bookViewport.addEventListener(
      "pointercancel",
      stopPanning
    );

    bookViewport.addEventListener(
      "lostpointercapture",
      stopPanning
    );

    /* =========================
       声音按钮
    ========================= */

    soundBtn.addEventListener(
      "click",
      () => {
        soundEnabled =
          !soundEnabled;

        soundIcon.textContent =
          soundEnabled
            ? "🔊"
            : "🔇";

        soundBtn.setAttribute(
          "aria-label",
          soundEnabled
            ? "关闭翻页声音"
            : "开启翻页声音"
        );

        soundBtn.title =
          soundEnabled
            ? "关闭翻页声音"
            : "开启翻页声音";

        if (soundEnabled) {
          playPageTurnSound();
        }
      }
    );

    /* =========================
       全屏
    ========================= */

    async function enterFullscreen() {
      const target =
        document.documentElement;

      try {
        if (
          target.requestFullscreen
        ) {
          await target.requestFullscreen();
          return;
        }

        if (
          target.webkitRequestFullscreen
        ) {
          target.webkitRequestFullscreen();
          return;
        }
      } catch (error) {
        console.warn(
          "浏览器原生全屏不可用，改用网页全屏。",
          error
        );
      }

      /*
       * iPhone等不支持普通网页全屏的浏览器，
       * 改用网页模拟全屏。
       */
      pseudoFullscreen = true;

      document.body.classList.add(
        "pseudo-fullscreen"
      );

      updateFullscreenUI();
    }

    async function exitFullscreen() {
      try {
        if (
          document.exitFullscreen &&
          document.fullscreenElement
        ) {
          await document.exitFullscreen();
          return;
        }

        if (
          document.webkitExitFullscreen &&
          document.webkitFullscreenElement
        ) {
          document.webkitExitFullscreen();
          return;
        }
      } catch (error) {
        console.warn(
          "退出原生全屏失败：",
          error
        );
      }

      pseudoFullscreen = false;

      document.body.classList.remove(
        "pseudo-fullscreen"
      );

      updateFullscreenUI();
    }

    async function toggleFullscreen() {
      if (fullscreenActive()) {
        await exitFullscreen();
      } else {
        await enterFullscreen();
      }
    }

    function updateFullscreenUI() {
      const active =
        fullscreenActive();

      document.body.classList.toggle(
        "fullscreen-mode",
        active
      );

      fullscreenIcon.textContent =
        active ? "×" : "⛶";

      fullscreenBtn.setAttribute(
        "aria-label",
        active
          ? "退出全屏"
          : "进入全屏"
      );

      fullscreenBtn.title =
        active
          ? "退出全屏"
          : "进入全屏";

      resetZoom(false);

      /*
       * 等浏览器完成全屏版面变化后，
       * 才重建小册子。
       */
      scheduleRebuild(550);
    }

    fullscreenBtn.addEventListener(
      "click",
      toggleFullscreen
    );

    document.addEventListener(
      "fullscreenchange",
      () => {
        /*
         * 用户按 Esc 退出原生全屏时，
         * 同步状态。
         */
        if (
          !nativeFullscreenActive()
        ) {
          pseudoFullscreen = false;

          document.body.classList.remove(
            "pseudo-fullscreen"
          );
        }

        updateFullscreenUI();
      }
    );

    document.addEventListener(
      "webkitfullscreenchange",
      () => {
        if (
          !nativeFullscreenActive()
        ) {
          pseudoFullscreen = false;

          document.body.classList.remove(
            "pseudo-fullscreen"
          );
        }

        updateFullscreenUI();
      }
    );

    /*
     * 双击：
     * 普通模式进入全屏；
     * 全屏模式切换100%与160%。
     */
    bookViewport.addEventListener(
      "dblclick",
      event => {
        event.preventDefault();

        if (!fullscreenActive()) {
          enterFullscreen();
          return;
        }

        if (zoomScale > 1) {
          resetZoom();
        } else {
          setZoom(
            DOUBLE_CLICK_ZOOM
          );
        }
      }
    );

    /* =========================
       键盘控制
    ========================= */

    document.addEventListener(
      "keydown",
      event => {
        if (!pageFlip) {
          return;
        }

        if (
          event.key ===
            "ArrowLeft" ||
          event.key === "PageUp"
        ) {
          event.preventDefault();
          pageFlip.flipPrev();
        }

        if (
          event.key ===
            "ArrowRight" ||
          event.key === "PageDown" ||
          event.key === " "
        ) {
          event.preventDefault();
          pageFlip.flipNext();
        }

        if (
          event.key === "+" ||
          event.key === "="
        ) {
          if (fullscreenActive()) {
            event.preventDefault();

            setZoom(
              zoomScale +
                ZOOM_STEP
            );
          }
        }

        if (event.key === "-") {
          if (fullscreenActive()) {
            event.preventDefault();

            setZoom(
              zoomScale -
                ZOOM_STEP
            );
          }
        }

        if (event.key === "0") {
          if (fullscreenActive()) {
            event.preventDefault();
            resetZoom();
          }
        }

        if (event.key === "Home") {
          event.preventDefault();
          pageFlip.turnToPage(0);
        }

        if (event.key === "End") {
          event.preventDefault();

          pageFlip.turnToPage(
            pageFlip.getPageCount() -
              1
          );
        }
      }
    );

    /* =========================
       视窗变化
    ========================= */

    window.addEventListener(
      "resize",
      () => {
        if (
          pageFlip &&
          shouldRebuildForResize()
        ) {
          scheduleRebuild(380);
        }
      }
    );

    window.addEventListener(
      "orientationchange",
      () => {
        scheduleRebuild(750);
      }
    );

    /* =========================
       启动
    ========================= */

    async function start() {
      try {
        await preloadAllImages();

        window.requestAnimationFrame(
          () => {
            window.requestAnimationFrame(
              () => {
                initialiseBook(0);
              }
            );
          }
        );

        hint.hideTimer =
          window.setTimeout(() => {
            hint.classList.add(
              "hide"
            );
          }, 4200);
      } catch (error) {
        console.error(error);

        loadingElement.classList.add(
          "hidden"
        );

        errorBox.classList.add(
          "show"
        );

        hint.classList.add(
          "hide"
        );
      }
    }

    start();
  </script>
</body>
</html>
