<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="description"
    content="2026年学校运动会电子小册子"
  >

  <title>2026年学校运动会电子小册子</title>

  <script
    src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --header-height: 88px;
      --toolbar-height: 72px;
      --safe-gap: 24px;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        "Noto Sans SC",
        Arial,
        sans-serif;

      color: #194e75;

      background:
        radial-gradient(
          circle at 12% 14%,
          rgba(255, 255, 255, 0.96),
          transparent 34%
        ),
        linear-gradient(
          135deg,
          #eef8ff 0%,
          #dceffd 55%,
          #f8fcff 100%
        );
    }

    button {
      font: inherit;
    }

    .app {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-rows:
        var(--header-height)
        minmax(0, 1fr)
        var(--toolbar-height);
    }

    /* =========================
       顶部标题
    ========================= */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 10px 20px;

      background: rgba(255, 255, 255, 0.88);
      border-bottom: 1px solid rgba(34, 103, 151, 0.12);

      box-shadow:
        0 4px 18px rgba(33, 88, 126, 0.08);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      position: relative;
      z-index: 20;
    }

    .title-wrap {
      text-align: center;
    }

    .title-wrap h1 {
      margin: 0;

      color: #174f77;

      font-size: clamp(20px, 2.1vw, 34px);
      line-height: 1.2;
      letter-spacing: 0.04em;
    }

    .title-wrap p {
      margin: 6px 0 0;

      color: #5c7b91;
      font-size: clamp(11px, 1.1vw, 15px);
    }

    /* =========================
       小册子区域
    ========================= */

    .stage {
      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 12px 18px;

      position: relative;
      overflow: hidden;
    }

    .book-viewport {
      width: 100%;
      height: 100%;

      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;
      overflow: hidden;
    }

    #book {
      visibility: hidden;
      flex: 0 0 auto;
    }

    #book.ready {
      visibility: visible;
    }

    .page {
      overflow: hidden;
      background: #ffffff;
    }

    .page-content {
      width: 100%;
      height: 100%;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      background: #ffffff;
    }

    .page-content img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;
      object-position: center;

      background: #ffffff;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;

      pointer-events: none;
    }

    /* =========================
       载入与错误提示
    ========================= */

    .loading {
      position: absolute;
      inset: 0;
      z-index: 30;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 14px;

      color: #286488;
    }

    .loading.hidden {
      display: none;
    }

    .spinner {
      width: 46px;
      height: 46px;

      border: 5px solid rgba(33, 104, 154, 0.18);
      border-top-color: #216b9d;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      display: none;

      width: min(560px, 90%);
      padding: 22px;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.96);
      box-shadow:
        0 12px 35px rgba(20, 53, 78, 0.18);

      text-align: center;
      color: #902c37;
    }

    .error-box.show {
      display: block;
    }

    .hint {
      position: absolute;
      left: 50%;
      bottom: 12px;
      z-index: 22;

      transform: translateX(-50%);

      padding: 9px 15px;

      border-radius: 999px;

      background: rgba(16, 54, 80, 0.84);
      color: #ffffff;

      font-size: 12px;
      white-space: nowrap;

      pointer-events: none;

      opacity: 1;
      transition: opacity 0.4s ease;
    }

    .hint.hide {
      opacity: 0;
    }

    /* =========================
       控制栏
    ========================= */

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 6px 12px 12px;

      position: relative;
      z-index: 40;
    }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;
      padding: 7px;

      border: 1px solid rgba(36, 104, 151, 0.14);
      border-radius: 20px;

      background: rgba(255, 255, 255, 0.92);

      box-shadow:
        0 8px 25px rgba(21, 72, 108, 0.16);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .control-btn {
      height: 46px;
      min-width: 48px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      padding: 0 14px;

      border: 0;
      border-radius: 13px;

      color: #174f77;
      background: #e8f3fa;

      cursor: pointer;

      transition:
        background 0.16s ease,
        transform 0.16s ease,
        opacity 0.16s ease;
    }

    .control-btn:hover:not(:disabled) {
      background: #d4eaf7;
      transform: translateY(-1px);
    }

    .control-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .control-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .control-btn .icon {
      font-size: 22px;
      line-height: 1;
    }

    .page-status {
      height: 46px;
      min-width: 88px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 14px;

      border-radius: 13px;

      background: #ffffff;
      color: #315e7c;

      font-size: 15px;
      font-weight: 700;

      white-space: nowrap;
    }

    .icon-only {
      width: 48px;
      padding: 0;
    }

    /* =========================
       全屏模式
    ========================= */

    body.fullscreen-mode {
      background: #102438;
    }

    body.fullscreen-mode .app {
      grid-template-rows:
        minmax(0, 1fr)
        var(--toolbar-height);
    }

    body.fullscreen-mode .topbar {
      display: none;
    }

    body.fullscreen-mode .stage {
      padding:
        max(10px, env(safe-area-inset-top))
        max(10px, env(safe-area-inset-right))
        6px
        max(10px, env(safe-area-inset-left));
    }

    body.fullscreen-mode .toolbar {
      padding-bottom:
        max(9px, env(safe-area-inset-bottom));
    }

    body.fullscreen-mode .control-group {
      background: rgba(255, 255, 255, 0.94);
    }

    /* =========================
       手机
    ========================= */

    @media (max-width: 700px) {
      :root {
        --header-height: 70px;
        --toolbar-height: 64px;
      }

      .title-wrap h1 {
        font-size: 18px;
      }

      .title-wrap p {
        margin-top: 3px;
        font-size: 10px;
      }

      .stage {
        padding: 7px 5px;
      }

      .toolbar {
        padding: 4px 5px 7px;
      }

      .control-group {
        gap: 4px;
        padding: 5px;
        border-radius: 16px;
      }

      .control-btn {
        height: 42px;
        min-width: 42px;
        padding: 0 9px;
      }

      .control-btn .label {
        display: none;
      }

      .control-btn .icon {
        font-size: 20px;
      }

      .page-status {
        height: 42px;
        min-width: 68px;

        padding: 0 9px;
        font-size: 13px;
      }

      .icon-only {
        width: 42px;
      }

      .hint {
        bottom: 7px;
        padding: 7px 11px;
        font-size: 11px;
      }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      :root {
        --header-height: 0px;
        --toolbar-height: 58px;
      }

      .topbar {
        display: none;
      }

      .stage {
        padding: 5px 8px 2px;
      }

      .toolbar {
        padding: 3px 6px 6px;
      }

      .control-btn,
      .page-status {
        height: 39px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="title-wrap">
        <h1>2026年学校运动会电子小册子</h1>
        <p>左右滑动、拖动页角或使用下方按钮翻页</p>
      </div>
    </header>

    <main class="stage">
      <section
        id="bookViewport"
        class="book-viewport"
        aria-label="学校运动会电子小册子"
      >
        <div
          id="loading"
          class="loading"
          aria-live="polite"
        >
          <div class="spinner"></div>
          <div id="loadingText">正在载入小册子……</div>
        </div>

        <div
          id="errorBox"
          class="error-box"
          role="alert"
        >
          <strong>图片或翻页组件无法载入</strong>

          <p>
            请检查网络连接，并确认图片名称为：
          </p>

          <p>
            page-1.webp、page-2.webp、<br>
            page-3.webp、page-4.webp
          </p>
        </div>

        <div
          id="book"
          title="双击进入或退出全屏"
        >
          <div
            class="page"
            data-density="hard"
          >
            <div class="page-content">
              <img
                src="page-1.webp"
                alt="学校运动会小册子封面"
                draggable="false"
              >
            </div>
          </div>

          <div class="page">
            <div class="page-content">
              <img
                src="page-2.webp"
                alt="学校运动会工委表"
                draggable="false"
              >
            </div>
          </div>

          <div class="page">
            <div class="page-content">
              <img
                src="page-3.webp"
                alt="学校运动会赛程"
                draggable="false"
              >
            </div>
          </div>

          <div
            class="page"
            data-density="hard"
          >
            <div class="page-content">
              <img
                src="page-4.webp"
                alt="学校运动会鸣谢页"
                draggable="false"
              >
            </div>
          </div>
        </div>

        <div id="hint" class="hint">
          点击页角或左右滑动翻页 · 双击进入全屏
        </div>
      </section>
    </main>

    <footer class="toolbar">
      <div class="control-group">

        <button
          id="prevBtn"
          class="control-btn"
          type="button"
          aria-label="上一页"
          disabled
        >
          <span class="icon">‹</span>
          <span class="label">上一页</span>
        </button>

        <div
          id="pageStatus"
          class="page-status"
          aria-live="polite"
        >
          1 / 4
        </div>

        <button
          id="nextBtn"
          class="control-btn"
          type="button"
          aria-label="下一页"
          disabled
        >
          <span class="label">下一页</span>
          <span class="icon">›</span>
        </button>

        <button
          id="soundBtn"
          class="control-btn icon-only"
          type="button"
          aria-label="关闭翻页声音"
          title="翻页声音"
        >
          <span id="soundIcon" class="icon">🔊</span>
        </button>

        <button
          id="fullscreenBtn"
          class="control-btn icon-only"
          type="button"
          aria-label="进入全屏"
          title="进入全屏"
        >
          <span id="fullscreenIcon" class="icon">⛶</span>
        </button>

      </div>
    </footer>

  </div>

  <script>
    "use strict";

    const IMAGE_FILES = [
      "page-1.webp",
      "page-2.webp",
      "page-3.webp",
      "page-4.webp"
    ];

    /*
     * 图片原始比例约为：
     * 宽度 ÷ 高度 = 0.707
     */
    const PAGE_RATIO = 0.707;

    const bookElement =
      document.getElementById("book");

    const bookViewport =
      document.getElementById("bookViewport");

    const loadingElement =
      document.getElementById("loading");

    const loadingText =
      document.getElementById("loadingText");

    const errorBox =
      document.getElementById("errorBox");

    const hint =
      document.getElementById("hint");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const pageStatus =
      document.getElementById("pageStatus");

    const soundBtn =
      document.getElementById("soundBtn");

    const soundIcon =
      document.getElementById("soundIcon");

    const fullscreenBtn =
      document.getElementById("fullscreenBtn");

    const fullscreenIcon =
      document.getElementById("fullscreenIcon");

    let pageFlip = null;
    let resizeTimer = null;
    let currentPageIndex = 0;
    let soundEnabled = true;
    let audioContext = null;

    /*
     * 判断是否采用单页模式。
     * 手机、窄窗口或空间不足时使用单页。
     */
    function shouldUsePortraitMode() {
      const width = bookViewport.clientWidth;
      const height = bookViewport.clientHeight;

      const estimatedTwoPageWidth =
        height * PAGE_RATIO * 2;

      return (
        window.innerWidth <= 700 ||
        width < 760 ||
        estimatedTwoPageWidth > width
      );
    }

    /*
     * 根据可用空间计算页面尺寸。
     * 页面一定小于容器，保留安全距离。
     */
    function calculateBookSize() {
      const viewportWidth =
        Math.max(bookViewport.clientWidth, 240);

      const viewportHeight =
        Math.max(bookViewport.clientHeight, 280);

      const portraitMode =
        shouldUsePortraitMode();

      const horizontalPadding =
        portraitMode ? 18 : 32;

      const verticalPadding = 18;

      const usableWidth =
        Math.max(
          viewportWidth - horizontalPadding,
          220
        );

      const usableHeight =
        Math.max(
          viewportHeight - verticalPadding,
          280
        );

      const pageCountAcross =
        portraitMode ? 1 : 2;

      /*
       * 先按照高度计算，再检查总宽度。
       */
      let pageHeight =
        Math.floor(usableHeight);

      let pageWidth =
        Math.floor(pageHeight * PAGE_RATIO);

      const maximumPageWidth =
        Math.floor(
          usableWidth / pageCountAcross
        );

      if (pageWidth > maximumPageWidth) {
        pageWidth = maximumPageWidth;
        pageHeight =
          Math.floor(pageWidth / PAGE_RATIO);
      }

      /*
       * 防止小数与阴影造成边缘裁切。
       */
      pageWidth =
        Math.max(180, pageWidth - 4);

      pageHeight =
        Math.max(255, pageHeight - 4);

      return {
        pageWidth,
        pageHeight,
        portraitMode
      };
    }

    function preloadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();

        image.onload = () => resolve(src);

        image.onerror = () => {
          reject(
            new Error(`无法载入图片：${src}`)
          );
        };

        image.src = `${src}?v=20260806`;
      });
    }

    async function preloadAllImages() {
      let loaded = 0;

      for (const src of IMAGE_FILES) {
        await preloadImage(src);

        loaded += 1;

        loadingText.textContent =
          `正在载入小册子…… ${loaded} / ${IMAGE_FILES.length}`;
      }
    }

    /*
     * 使用 Web Audio 生成轻微的纸张翻动声。
     * 不需要额外上传 mp3 文件。
     */
    function playPageTurnSound() {
      if (!soundEnabled) {
        return;
      }

      try {
        if (!audioContext) {
          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();
        }

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        const duration = 0.28;

        const bufferLength =
          Math.floor(
            audioContext.sampleRate * duration
          );

        const buffer =
          audioContext.createBuffer(
            1,
            bufferLength,
            audioContext.sampleRate
          );

        const data =
          buffer.getChannelData(0);

        for (
          let index = 0;
          index < bufferLength;
          index += 1
        ) {
          const progress =
            index / bufferLength;

          const envelope =
            Math.pow(1 - progress, 2.2);

          const wave =
            Math.sin(progress * Math.PI * 13);

          const noise =
            Math.random() * 2 - 1;

          data[index] =
            noise *
            envelope *
            (0.35 + 0.15 * wave);
        }

        const source =
          audioContext.createBufferSource();

        const filter =
          audioContext.createBiquadFilter();

        const gain =
          audioContext.createGain();

        source.buffer = buffer;

        filter.type = "bandpass";
        filter.frequency.value = 1250;
        filter.Q.value = 0.65;

        gain.gain.setValueAtTime(
          0.0001,
          audioContext.currentTime
        );

        gain.gain.exponentialRampToValueAtTime(
          0.22,
          audioContext.currentTime + 0.025
        );

        gain.gain.exponentialRampToValueAtTime(
          0.0001,
          audioContext.currentTime + duration
        );

        source.connect(filter);
        filter.connect(gain);
        gain.connect(audioContext.destination);

        source.start();
      } catch (error) {
        console.warn(
          "无法播放翻页声音：",
          error
        );
      }
    }

    function updateControls() {
      if (!pageFlip) {
        return;
      }

      currentPageIndex =
        pageFlip.getCurrentPageIndex();

      const total =
        pageFlip.getPageCount();

      pageStatus.textContent =
        `${currentPageIndex + 1} / ${total}`;

      prevBtn.disabled =
        currentPageIndex <= 0;

      nextBtn.disabled =
        currentPageIndex >= total - 1;
    }

    function destroyBook() {
      if (!pageFlip) {
        return;
      }

      try {
        pageFlip.destroy();
      } catch (error) {
        console.warn(
          "重新建立小册子时出现提示：",
          error
        );
      }

      pageFlip = null;
      bookElement.classList.remove("ready");
    }

    function initialiseBook(
      requestedPageIndex = 0
    ) {
      if (
        !window.St ||
        typeof window.St.PageFlip !== "function"
      ) {
        throw new Error(
          "翻页组件没有成功载入。"
        );
      }

      const {
        pageWidth,
        pageHeight,
        portraitMode
      } = calculateBookSize();

      pageFlip = new St.PageFlip(
        bookElement,
        {
          width: pageWidth,
          height: pageHeight,

          /*
           * fixed 是关键：
           * 不再让组件自行拉大超出容器。
           */
          size: "fixed",

          minWidth: pageWidth,
          maxWidth: pageWidth,

          minHeight: pageHeight,
          maxHeight: pageHeight,

          autoSize: false,

          showCover: true,
          usePortrait: portraitMode,

          drawShadow: true,
          maxShadowOpacity: 0.42,

          flippingTime: 760,

          mobileScrollSupport: false,
          useMouseEvents: true,

          swipeDistance: 18,
          showPageCorners: true,

          disableFlipByClick: false
        }
      );

      pageFlip.loadFromHTML(
        document.querySelectorAll(".page")
      );

      pageFlip.on("flip", () => {
        updateControls();
        playPageTurnSound();
        hint.classList.add("hide");
      });

      pageFlip.on("changeState", event => {
        if (event.data === "flipping") {
          hint.classList.add("hide");
        }
      });

      const maximumIndex =
        pageFlip.getPageCount() - 1;

      const safeIndex =
        Math.min(
          Math.max(requestedPageIndex, 0),
          maximumIndex
        );

      if (safeIndex > 0) {
        window.setTimeout(() => {
          pageFlip.turnToPage(safeIndex);
          updateControls();
        }, 60);
      }

      bookElement.classList.add("ready");

      loadingElement.classList.add("hidden");

      updateControls();
    }

    /*
     * 窗口大小或全屏状态改变时，
     * 重新建立翻页组件。
     */
    function rebuildBook() {
      const savedPage =
        pageFlip
          ? pageFlip.getCurrentPageIndex()
          : currentPageIndex;

      destroyBook();

      window.requestAnimationFrame(() => {
        window.requestAnimationFrame(() => {
          initialiseBook(savedPage);
        });
      });
    }

    function scheduleRebuild(delay = 180) {
      window.clearTimeout(resizeTimer);

      resizeTimer =
        window.setTimeout(
          rebuildBook,
          delay
        );
    }

    prevBtn.addEventListener("click", () => {
      if (pageFlip) {
        pageFlip.flipPrev();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (pageFlip) {
        pageFlip.flipNext();
      }
    });

    soundBtn.addEventListener("click", () => {
      soundEnabled = !soundEnabled;

      soundIcon.textContent =
        soundEnabled ? "🔊" : "🔇";

      soundBtn.setAttribute(
        "aria-label",
        soundEnabled
          ? "关闭翻页声音"
          : "开启翻页声音"
      );

      soundBtn.title =
        soundEnabled
          ? "关闭翻页声音"
          : "开启翻页声音";

      if (soundEnabled) {
        playPageTurnSound();
      }
    });

    function isFullscreen() {
      return Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement
      );
    }

    async function toggleFullscreen() {
      try {
        if (!isFullscreen()) {
          const target =
            document.documentElement;

          if (target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (
            target.webkitRequestFullscreen
          ) {
            target.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (
            document.webkitExitFullscreen
          ) {
            document.webkitExitFullscreen();
          }
        }
      } catch (error) {
        console.warn(
          "无法切换全屏：",
          error
        );
      }
    }

    function updateFullscreenUI() {
      const active = isFullscreen();

      document.body.classList.toggle(
        "fullscreen-mode",
        active
      );

      fullscreenIcon.textContent =
        active ? "×" : "⛶";

      fullscreenBtn.setAttribute(
        "aria-label",
        active ? "退出全屏" : "进入全屏"
      );

      fullscreenBtn.title =
        active ? "退出全屏" : "进入全屏";

      /*
       * 等浏览器完成全屏版面调整后再计算。
       */
      scheduleRebuild(320);
    }

    fullscreenBtn.addEventListener(
      "click",
      toggleFullscreen
    );

    /*
     * 双击小册子进入或退出全屏。
     */
    bookElement.addEventListener(
      "dblclick",
      event => {
        event.preventDefault();
        toggleFullscreen();
      }
    );

    document.addEventListener(
      "fullscreenchange",
      updateFullscreenUI
    );

    document.addEventListener(
      "webkitfullscreenchange",
      updateFullscreenUI
    );

    document.addEventListener(
      "keydown",
      event => {
        if (!pageFlip) {
          return;
        }

        if (
          event.key === "ArrowLeft" ||
          event.key === "PageUp"
        ) {
          event.preventDefault();
          pageFlip.flipPrev();
        }

        if (
          event.key === "ArrowRight" ||
          event.key === "PageDown" ||
          event.key === " "
        ) {
          event.preventDefault();
          pageFlip.flipNext();
        }

        if (event.key === "Home") {
          event.preventDefault();
          pageFlip.turnToPage(0);
        }

        if (event.key === "End") {
          event.preventDefault();

          pageFlip.turnToPage(
            pageFlip.getPageCount() - 1
          );
        }
      }
    );

    window.addEventListener(
      "resize",
      () => scheduleRebuild(220)
    );

    window.addEventListener(
      "orientationchange",
      () => scheduleRebuild(420)
    );

    async function start() {
      try {
        await preloadAllImages();

        initialiseBook(0);

        window.setTimeout(() => {
          hint.classList.add("hide");
        }, 4200);
      } catch (error) {
        console.error(error);

        loadingElement.classList.add("hidden");
        errorBox.classList.add("show");
        hint.classList.add("hide");
      }
    }

    start();
  </script>
</body>
</html>
