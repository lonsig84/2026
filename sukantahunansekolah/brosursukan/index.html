<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="description"
    content="2026年学校运动会电子小册子"
  >

  <title>2026年学校运动会电子小册子</title>

  <script
    src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js"
  ></script>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --header-height: 76px;
      --toolbar-height: 74px;
      --page-ratio: 0.707;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow-x: hidden;

      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        "Noto Sans SC",
        Arial,
        sans-serif;

      color: #16324f;

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(255, 255, 255, 0.95),
          transparent 34%
        ),
        radial-gradient(
          circle at 85% 80%,
          rgba(183, 221, 246, 0.45),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #eaf6ff 0%,
          #d8eefc 45%,
          #f7fbff 100%
        );
    }

    body.fullscreen-mode {
      background: #102132;
    }

    button {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .topbar {
      min-height: var(--header-height);

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 12px 72px;

      position: relative;
      z-index: 10;

      background: rgba(255, 255, 255, 0.82);
      border-bottom: 1px solid rgba(37, 105, 154, 0.16);
      box-shadow: 0 5px 22px rgba(21, 76, 116, 0.08);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .title-wrap {
      text-align: center;
    }

    .title-wrap h1 {
      margin: 0;
      font-size: clamp(18px, 2.1vw, 30px);
      line-height: 1.2;
      letter-spacing: 0.06em;
      color: #174e78;
    }

    .title-wrap p {
      margin: 5px 0 0;
      font-size: clamp(11px, 1.1vw, 14px);
      color: #52748e;
    }

    .main {
  flex: 1;
  min-height: 0;

  display: flex;
  align-items: flex-start;
  justify-content: center;

  padding: 8px 16px 0;
  }

    .book-area {
  width: 100%;
  height: calc(
    100dvh
    - var(--header-height)
    - var(--toolbar-height)
    - 8px
  );

  min-height: 420px;

  display: flex;
  align-items: flex-start;
  justify-content: center;

  position: relative;
  overflow: hidden;
  padding-top: 6px;
}

    .book-shell {
  width: 100%;
  height: 100%;

  display: flex;
  align-items: flex-start;
  justify-content: center;

  position: relative;
}

    #book {
      visibility: hidden;
    }

    #book.ready {
      visibility: visible;
    }

    .page {
      background: #ffffff;
      overflow: hidden;
    }

    .page-content {
      width: 100%;
      height: 100%;
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;
    }

    .page-content img {
      width: 100%;
      height: 100%;
      display: block;

      object-fit: contain;
      object-position: center;

      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;

      background: #ffffff;
    }

    .page-cover {
      background: #ffffff;
    }

    .page-cover .page-content {
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.07);
    }

    .loading {
      position: absolute;
      z-index: 20;

      inset: 0;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 14px;

      color: #265f87;
    }

    .loading.hidden {
      display: none;
    }

    .spinner {
      width: 46px;
      height: 46px;

      border: 5px solid rgba(31, 105, 157, 0.18);
      border-top-color: #236d9e;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      display: none;

      width: min(560px, 90%);
      padding: 22px;

      border-radius: 16px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 12px 35px rgba(20, 53, 78, 0.18);

      text-align: center;
      color: #8a2733;
    }

    .error-box.show {
      display: block;
    }

    .error-box code {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 8px;

      border-radius: 6px;
      background: #f3f5f7;

      color: #283747;
    }

    .hint {
      position: absolute;
      z-index: 15;

      left: 50%;
      bottom: 20px;

      transform: translateX(-50%);

      padding: 10px 16px;

      border-radius: 999px;
      background: rgba(13, 44, 67, 0.84);
      color: #ffffff;

      font-size: 13px;
      white-space: nowrap;

      pointer-events: none;

      opacity: 1;
      transition: opacity 0.45s ease;
    }

    .hint.hide {
      opacity: 0;
    }

    .toolbar {
      min-height: var(--toolbar-height);

      display: flex;
      align-items: center;
      justify-content: center;

      gap: 10px;

      padding: 10px 18px 16px;

      position: relative;
      z-index: 20;
    }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 8px;

      padding: 8px;

      border: 1px solid rgba(37, 105, 154, 0.16);
      border-radius: 18px;

      background: rgba(255, 255, 255, 0.88);
      box-shadow: 0 8px 24px rgba(22, 75, 113, 0.13);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .control-btn {
      min-width: 48px;
      height: 44px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      padding: 0 14px;

      border: 0;
      border-radius: 12px;

      background: #e8f3fa;
      color: #174e78;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        background 0.15s ease,
        opacity 0.15s ease;
    }

    .control-btn:hover:not(:disabled) {
      background: #d5eaf7;
      transform: translateY(-1px);
    }

    .control-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .control-btn:disabled {
      cursor: not-allowed;
      opacity: 0.38;
    }

    .control-btn .icon {
      font-size: 22px;
      line-height: 1;
    }

    .page-status {
      min-width: 86px;
      height: 44px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 12px;

      border-radius: 12px;
      background: #ffffff;

      color: #315e7c;
      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;
    }

    .fullscreen-btn {
      width: 48px;
      padding: 0;
    }

    body.fullscreen-mode .topbar {
      display: none;
    }

    body.fullscreen-mode .main {
      padding-top: 12px;
    }

    body.fullscreen-mode .book-area {
      height: calc(100vh - var(--toolbar-height) - 22px);
    }

    body.fullscreen-mode .control-group {
      background: rgba(255, 255, 255, 0.92);
    }

    @media (max-width: 700px) {
      :root {
        --header-height: 66px;
        --toolbar-height: 68px;
      }

      .topbar {
        padding: 10px 48px;
      }

      .title-wrap h1 {
        font-size: 18px;
      }

      .title-wrap p {
        font-size: 11px;
      }

      .main {
        padding: 10px 6px 4px;
      }

      .book-area {
        min-height: 350px;

        height: calc(
          100dvh
          - var(--header-height)
          - var(--toolbar-height)
          - 14px
        );
      }

      .toolbar {
        padding: 6px 8px 10px;
      }

      .control-group {
        gap: 5px;
        padding: 6px;
        border-radius: 15px;
      }

      .control-btn {
        min-width: 44px;
        height: 42px;
        padding: 0 10px;
      }

      .control-btn .label {
        display: none;
      }

      .page-status {
        min-width: 72px;
        height: 42px;
        font-size: 13px;
      }

      .fullscreen-btn {
        width: 44px;
      }

      .hint {
        bottom: 12px;
        font-size: 12px;
        padding: 8px 13px;
      }

      body.fullscreen-mode .book-area {
        height: calc(100dvh - var(--toolbar-height) - 10px);
      }
    }

    @media (max-height: 560px) and (orientation: landscape) {
      .topbar {
        display: none;
      }

      .main {
        padding: 5px;
      }

      .book-area {
        height: calc(100dvh - 65px);
        min-height: 250px;
      }

      .toolbar {
        min-height: 60px;
        padding: 4px 8px 8px;
      }

      .control-btn,
      .page-status {
        height: 38px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="title-wrap">
        <h1>2026年学校运动会电子小册子</h1>
        <p>左右滑动、拖动页角或使用下方按钮翻页</p>
      </div>
    </header>

    <main class="main">
      <section
        class="book-area"
        aria-label="电子小册子"
      >
        <div class="book-shell">

          <div
            id="loading"
            class="loading"
            aria-live="polite"
          >
            <div class="spinner"></div>
            <div id="loadingText">正在载入小册子……</div>
          </div>

          <div
            id="errorBox"
            class="error-box"
            role="alert"
          >
            <strong>图片无法载入</strong>
            <p>
              请确认四张图片与
              <code>index.html</code>
              放在同一个文件夹，并检查文件名大小写。
            </p>
          </div>

          <div id="book">

            <div
              class="page page-cover"
              data-density="hard"
            >
              <div class="page-content">
                <img
                  src="page-1.webp"
                  alt="2026年学校运动会小册子封面"
                  draggable="false"
                >
              </div>
            </div>

            <div class="page">
              <div class="page-content">
                <img
                  src="page-2.webp"
                  alt="学校运动会工委表"
                  draggable="false"
                >
              </div>
            </div>

            <div class="page">
              <div class="page-content">
                <img
                  src="page-3.webp"
                  alt="学校运动会赛程"
                  draggable="false"
                >
              </div>
            </div>

            <div
              class="page page-cover"
              data-density="hard"
            >
              <div class="page-content">
                <img
                  src="page-4.webp"
                  alt="学校运动会鸣谢页"
                  draggable="false"
                >
              </div>
            </div>

          </div>

          <div id="hint" class="hint">
            点击页面边缘或左右滑动翻页
          </div>

        </div>
      </section>
    </main>

    <footer class="toolbar">
      <div class="control-group">

        <button
          id="prevBtn"
          class="control-btn"
          type="button"
          aria-label="上一页"
          disabled
        >
          <span class="icon">‹</span>
          <span class="label">上一页</span>
        </button>

        <div
          id="pageStatus"
          class="page-status"
          aria-live="polite"
        >
          1 / 4
        </div>

        <button
          id="nextBtn"
          class="control-btn"
          type="button"
          aria-label="下一页"
          disabled
        >
          <span class="label">下一页</span>
          <span class="icon">›</span>
        </button>

        <button
          id="fullscreenBtn"
          class="control-btn fullscreen-btn"
          type="button"
          aria-label="进入全屏"
          title="全屏"
        >
          <span id="fullscreenIcon" class="icon">⛶</span>
        </button>

      </div>
    </footer>

  </div>

  <script>
    "use strict";

    const IMAGE_FILES = [
      "page-1.webp",
      "page-2.webp",
      "page-3.webp",
      "page-4.webp"
    ];

    const bookElement = document.getElementById("book");
    const loadingElement = document.getElementById("loading");
    const loadingText = document.getElementById("loadingText");
    const errorBox = document.getElementById("errorBox");
    const hint = document.getElementById("hint");

    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const pageStatus = document.getElementById("pageStatus");

    const fullscreenBtn =
      document.getElementById("fullscreenBtn");

    const fullscreenIcon =
      document.getElementById("fullscreenIcon");

    let pageFlip = null;
    let resizeTimer = null;

    function preloadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();

        image.onload = () => resolve(src);
        image.onerror = () => reject(
          new Error(`无法载入图片：${src}`)
        );

        image.src = src;
      });
    }

    async function preloadAllImages() {
      let loaded = 0;

      const jobs = IMAGE_FILES.map(async (src) => {
        await preloadImage(src);

        loaded += 1;

        loadingText.textContent =
          `正在载入小册子…… ${loaded} / ${IMAGE_FILES.length}`;
      });

      await Promise.all(jobs);
    }

    function getBookDimensions() {
      const area =
        document.querySelector(".book-area");

      const availableWidth =
      Math.max(area.clientWidth - 24, 280);

      const availableHeight =
      Math.max(area.clientHeight - 32, 300);

      const isMobile =
        window.matchMedia("(max-width: 700px)").matches;

      /*
       * 原图看起来接近 A4 竖版比例：
       * 宽度约为高度的 0.707。
       */
      const ratio = 0.707;

      let pageHeight;
      let pageWidth;

      if (isMobile) {
        pageHeight = Math.min(
          availableHeight,
          availableWidth / ratio
        );

        pageWidth = pageHeight * ratio;

        if (pageWidth > availableWidth) {
          pageWidth = availableWidth;
          pageHeight = pageWidth / ratio;
        }
      } else {
        pageHeight = Math.min(
          availableHeight,
          availableWidth / (ratio * 2)
        );

        pageWidth = pageHeight * ratio;

        if (pageWidth * 2 > availableWidth) {
          pageWidth = availableWidth / 2;
          pageHeight = pageWidth / ratio;
        }
      }

      return {
        width: Math.max(Math.floor(pageWidth), 260),
        height: Math.max(Math.floor(pageHeight), 368)
      };
    }

    function updateControls() {
      if (!pageFlip) {
        return;
      }

      const currentIndex =
        pageFlip.getCurrentPageIndex();

      const totalPages =
        pageFlip.getPageCount();

      pageStatus.textContent =
        `${currentIndex + 1} / ${totalPages}`;

      prevBtn.disabled = currentIndex <= 0;

      nextBtn.disabled =
        currentIndex >= totalPages - 1;
    }

    function hideHintLater() {
      window.setTimeout(() => {
        hint.classList.add("hide");
      }, 3200);
    }

    function hideHintImmediately() {
      hint.classList.add("hide");
    }

    function initialiseBook() {
      if (
        !window.St ||
        typeof window.St.PageFlip !== "function"
      ) {
        throw new Error(
          "翻页组件未能载入，请检查网络连接。"
        );
      }

      const dimensions = getBookDimensions();

      pageFlip = new St.PageFlip(
        bookElement,
        {
          width: dimensions.width,
          height: dimensions.height,

          size: "stretch",

          minWidth: 260,
          maxWidth: 1000,

          minHeight: 368,
          maxHeight: 1415,

          maxShadowOpacity: 0.45,

          showCover: true,

          mobileScrollSupport: false,

          usePortrait: true,

          autoSize: true,

          drawShadow: true,

          flippingTime: 850,

          clickEventForward: true,

          useMouseEvents: true,

          swipeDistance: 20,

          showPageCorners: true,

          disableFlipByClick: false
        }
      );

      pageFlip.loadFromHTML(
        document.querySelectorAll(".page")
      );

      pageFlip.on("flip", () => {
        updateControls();
        hideHintImmediately();
      });

      pageFlip.on("changeOrientation", () => {
        updateControls();
      });

      pageFlip.on("changeState", (event) => {
        if (event.data === "flipping") {
          hideHintImmediately();
        }
      });

      bookElement.classList.add("ready");
      loadingElement.classList.add("hidden");

      prevBtn.disabled = false;
      nextBtn.disabled = false;

      updateControls();
      hideHintLater();
    }

    function resizeBook() {
      if (!pageFlip) {
        return;
      }

      const dimensions = getBookDimensions();

      pageFlip.update({
        width: dimensions.width,
        height: dimensions.height
      });
    }

    prevBtn.addEventListener("click", () => {
      if (pageFlip) {
        pageFlip.flipPrev();
      }
    });

    nextBtn.addEventListener("click", () => {
      if (pageFlip) {
        pageFlip.flipNext();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (!pageFlip) {
        return;
      }

      if (
        event.key === "ArrowLeft" ||
        event.key === "PageUp"
      ) {
        event.preventDefault();
        pageFlip.flipPrev();
      }

      if (
        event.key === "ArrowRight" ||
        event.key === "PageDown" ||
        event.key === " "
      ) {
        event.preventDefault();
        pageFlip.flipNext();
      }

      if (event.key === "Home") {
        event.preventDefault();
        pageFlip.flip(0);
      }

      if (event.key === "End") {
        event.preventDefault();
        pageFlip.flip(
          pageFlip.getPageCount() - 1
        );
      }
    });

    function isFullscreen() {
      return Boolean(
        document.fullscreenElement ||
        document.webkitFullscreenElement
      );
    }

    async function toggleFullscreen() {
      try {
        if (!isFullscreen()) {
          const target =
            document.documentElement;

          if (target.requestFullscreen) {
            await target.requestFullscreen();
          } else if (target.webkitRequestFullscreen) {
            target.webkitRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            await document.exitFullscreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          }
        }
      } catch (error) {
        console.warn("无法切换全屏：", error);
      }
    }

    function updateFullscreenUI() {
      const active = isFullscreen();

      document.body.classList.toggle(
        "fullscreen-mode",
        active
      );

      fullscreenIcon.textContent =
        active ? "×" : "⛶";

      fullscreenBtn.setAttribute(
        "aria-label",
        active ? "退出全屏" : "进入全屏"
      );

      fullscreenBtn.title =
        active ? "退出全屏" : "全屏";

      window.setTimeout(resizeBook, 160);
    }

    fullscreenBtn.addEventListener(
      "click",
      toggleFullscreen
    );

    document.addEventListener(
      "fullscreenchange",
      updateFullscreenUI
    );

    document.addEventListener(
      "webkitfullscreenchange",
      updateFullscreenUI
    );

    window.addEventListener("resize", () => {
      window.clearTimeout(resizeTimer);

      resizeTimer = window.setTimeout(
        resizeBook,
        180
      );
    });

    window.addEventListener(
      "orientationchange",
      () => {
        window.setTimeout(resizeBook, 300);
      }
    );

    async function start() {
      try {
        await preloadAllImages();
        initialiseBook();
      } catch (error) {
        console.error(error);

        loadingElement.classList.add("hidden");
        errorBox.classList.add("show");
        hint.classList.add("hide");
      }
    }

    start();
  </script>
</body>
</html>
