<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  >

  <meta
    name="description"
    content="2026年学校运动会电子小册子"
  >

  <title>2026年学校运动会电子小册子</title>

  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --header-height: 82px;
      --toolbar-height: 72px;

      --blue-dark: #123d61;
      --blue: #176391;
      --blue-light: #e5f3fc;

      --page-ratio: 0.707;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        "Noto Sans SC",
        Arial,
        sans-serif;

      color: var(--blue-dark);

      background:
        radial-gradient(
          circle at 15% 12%,
          rgba(255, 255, 255, 0.96),
          transparent 36%
        ),
        linear-gradient(
          135deg,
          #eff9ff 0%,
          #d9eefc 55%,
          #f8fcff 100%
        );
    }

    button {
      font: inherit;
      touch-action: manipulation;
    }

    .app {
      width: 100%;
      height: 100%;

      display: grid;

      grid-template-rows:
        var(--header-height)
        minmax(0, 1fr)
        var(--toolbar-height);
    }

    /* =========================
       标题栏
    ========================= */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 10px 18px;

      background: rgba(255, 255, 255, 0.9);

      border-bottom:
        1px solid rgba(27, 91, 134, 0.12);

      box-shadow:
        0 4px 20px rgba(25, 76, 111, 0.08);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      position: relative;
      z-index: 50;
    }

    .title-wrap {
      text-align: center;
    }

    .title-wrap h1 {
      margin: 0;

      font-size: clamp(20px, 2.2vw, 34px);
      line-height: 1.2;
      letter-spacing: 0.04em;

      color: #154f78;
    }

    .title-wrap p {
      margin: 5px 0 0;

      font-size: clamp(11px, 1vw, 14px);

      color: #5c7d94;
    }

    /* =========================
       阅读区
    ========================= */

    .reader-stage {
      min-width: 0;
      min-height: 0;

      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      padding: 12px 18px;
    }

    .viewport {
      width: 100%;
      height: 100%;

      min-width: 0;
      min-height: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      position: relative;

      overflow: hidden;

      touch-action: none;
    }

    /*
     * 只有这一层会缩放及移动。
     */
    .zoom-layer {
      position: relative;

      display: flex;
      align-items: center;
      justify-content: center;

      transform-origin: center center;

      will-change: transform;

      transition: transform 0.2s ease;
    }

    .zoom-layer.dragging {
      transition: none;
      cursor: grabbing;
    }

    .zoom-layer.zoomed {
      cursor: grab;
    }

    /* =========================
       书本
    ========================= */

    .book {
      position: relative;

      display: flex;
      align-items: stretch;
      justify-content: center;

      perspective: 2400px;
      transform-style: preserve-3d;

      filter:
        drop-shadow(
          0 18px 24px
          rgba(9, 37, 58, 0.2)
        );
    }

    .page-slot {
      position: relative;

      overflow: hidden;

      background: #ffffff;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .page-slot img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;
      object-position: center;

      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;

      pointer-events: none;

      background: #ffffff;
    }

    .single-page {
      border-radius: 3px;

      box-shadow:
        0 0 0 1px rgba(20, 59, 86, 0.12),
        0 12px 26px rgba(11, 45, 69, 0.16);
    }

    .spread {
      display: flex;

      position: relative;

      overflow: visible;
    }

    .spread .left-page {
      border-radius: 3px 0 0 3px;

      box-shadow:
        inset -15px 0 20px -18px
        rgba(0, 0, 0, 0.48);
    }

    .spread .right-page {
      border-radius: 0 3px 3px 0;

      box-shadow:
        inset 15px 0 20px -18px
        rgba(0, 0, 0, 0.48);
    }

    .book-spine {
      position: absolute;

      top: 0;
      bottom: 0;
      left: 50%;

      width: 2px;

      transform: translateX(-50%);

      z-index: 8;

      background:
        linear-gradient(
          to right,
          rgba(0, 0, 0, 0.14),
          rgba(255, 255, 255, 0.8),
          rgba(0, 0, 0, 0.14)
        );

      box-shadow:
        0 0 12px rgba(0, 0, 0, 0.24);

      pointer-events: none;
    }

    /*
     * 动画纸张覆盖层。
     */
    .turn-sheet {
      display: none;

      position: absolute;

      top: 0;

      z-index: 30;

      transform-style: preserve-3d;

      pointer-events: none;
    }

    .turn-sheet.active {
      display: block;
    }

    .turn-face {
      position: absolute;

      inset: 0;

      overflow: hidden;

      background: #ffffff;

      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;

      box-shadow:
        0 8px 28px rgba(0, 0, 0, 0.24);
    }

    .turn-face img {
      width: 100%;
      height: 100%;

      display: block;

      object-fit: contain;

      background: #ffffff;
    }

    .turn-face.back {
      transform: rotateY(180deg);
    }

    .sheet-shadow {
      position: absolute;

      inset: 0;

      z-index: 5;

      background:
        linear-gradient(
          90deg,
          transparent 20%,
          rgba(0, 0, 0, 0.28) 100%
        );

      opacity: 0;

      pointer-events: none;
    }

    .turn-forward {
      transform-origin: left center;

      animation:
        pageTurnForward
        820ms
        cubic-bezier(0.62, 0.02, 0.28, 1)
        forwards;
    }

    .turn-backward {
      transform-origin: right center;

      animation:
        pageTurnBackward
        820ms
        cubic-bezier(0.62, 0.02, 0.28, 1)
        forwards;
    }

    .turn-forward .sheet-shadow,
    .turn-backward .sheet-shadow {
      animation:
        paperShadow
        820ms
        ease-in-out
        forwards;
    }

    @keyframes pageTurnForward {
      0% {
        transform: rotateY(0deg);
      }

      45% {
        transform:
          rotateY(-82deg)
          translateZ(8px);
      }

      100% {
        transform: rotateY(-180deg);
      }
    }

    @keyframes pageTurnBackward {
      0% {
        transform: rotateY(0deg);
      }

      45% {
        transform:
          rotateY(82deg)
          translateZ(8px);
      }

      100% {
        transform: rotateY(180deg);
      }
    }

    @keyframes paperShadow {
      0% {
        opacity: 0;
      }

      42% {
        opacity: 0.9;
      }

      100% {
        opacity: 0.05;
      }
    }

    /* =========================
       载入与提示
    ========================= */

    .loading {
      position: absolute;
      inset: 0;
      z-index: 80;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      gap: 13px;

      color: #27668e;
    }

    .loading.hidden {
      display: none;
    }

    .spinner {
      width: 44px;
      height: 44px;

      border:
        5px solid rgba(32, 105, 153, 0.18);

      border-top-color: #236f9e;
      border-radius: 50%;

      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .error-box {
      display: none;

      width: min(560px, 92%);

      padding: 22px;

      border-radius: 16px;

      background: rgba(255, 255, 255, 0.97);

      box-shadow:
        0 12px 32px rgba(16, 48, 72, 0.18);

      color: #902f3a;
      text-align: center;
    }

    .error-box.show {
      display: block;
    }

    .hint {
      position: absolute;

      left: 50%;
      bottom: 10px;

      transform: translateX(-50%);

      z-index: 70;

      padding: 8px 14px;

      border-radius: 999px;

      background: rgba(12, 46, 70, 0.84);
      color: #ffffff;

      font-size: 12px;
      white-space: nowrap;

      pointer-events: none;

      opacity: 1;

      transition: opacity 0.4s ease;
    }

    .hint.hide {
      opacity: 0;
    }

    /* =========================
       控制栏
    ========================= */

    .toolbar {
      position: relative;
      z-index: 90;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 6px 10px 12px;
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;

      gap: 7px;

      padding: 7px;

      border:
        1px solid rgba(34, 99, 143, 0.14);

      border-radius: 20px;

      background: rgba(255, 255, 255, 0.94);

      box-shadow:
        0 8px 24px rgba(16, 58, 88, 0.16);

      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .control-btn {
      height: 46px;
      min-width: 48px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      padding: 0 14px;

      border: 0;
      border-radius: 13px;

      background: #e8f4fb;
      color: #164f78;

      cursor: pointer;

      transition:
        background 0.15s ease,
        transform 0.15s ease,
        opacity 0.15s ease;
    }

    .control-btn:hover:not(:disabled) {
      background: #d4eaf7;

      transform: translateY(-1px);
    }

    .control-btn:active:not(:disabled) {
      transform: translateY(1px);
    }

    .control-btn:disabled {
      opacity: 0.34;
      cursor: not-allowed;
    }

    .control-btn .icon {
      font-size: 21px;
      line-height: 1;
    }

    .status-box {
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 0 13px;

      border-radius: 13px;

      background: #ffffff;
      color: #315f7d;

      font-size: 14px;
      font-weight: 700;

      white-space: nowrap;
    }

    .page-status {
      min-width: 88px;
    }

    .zoom-status {
      min-width: 68px;
    }

    .icon-only {
      width: 48px;
      padding: 0;
    }

    .divider {
      display: none;

      width: 1px;
      height: 28px;

      margin: 0 2px;

      background:
        rgba(42, 91, 126, 0.16);
    }

    .zoom-control {
      display: none;
    }

    /* =========================
       沉浸式全屏
    ========================= */

    body.reader-fullscreen {
      background: #0e263a;
    }

    body.reader-fullscreen .app {
      position: fixed;
      inset: 0;

      z-index: 9999;

      grid-template-rows:
        minmax(0, 1fr)
        var(--toolbar-height);

      background: #0e263a;
    }

    body.reader-fullscreen .topbar {
      display: none;
    }

    body.reader-fullscreen .reader-stage {
      padding:
        max(8px, env(safe-area-inset-top))
        max(8px, env(safe-area-inset-right))
        4px
        max(8px, env(safe-area-inset-left));
    }

    body.reader-fullscreen .toolbar {
      padding-bottom:
        max(9px, env(safe-area-inset-bottom));
    }

    body.reader-fullscreen .zoom-control {
      display: inline-flex;
    }

    body.reader-fullscreen .divider {
      display: block;
    }

    /* =========================
       手机
    ========================= */

    @media (max-width: 700px) {
      :root {
        --header-height: 68px;
        --toolbar-height: 62px;
      }

      .title-wrap h1 {
        font-size: 18px;
      }

      .title-wrap p {
        margin-top: 3px;
        font-size: 10px;
      }

      .reader-stage {
        padding: 6px 4px;
      }

      .toolbar {
        padding: 4px 4px 7px;
      }

      .controls {
        max-width: calc(100vw - 8px);

        gap: 3px;
        padding: 5px;

        border-radius: 16px;
      }

      .control-btn {
        height: 41px;
        min-width: 39px;

        padding: 0 8px;
      }

      .control-btn .label {
        display: none;
      }

      .control-btn .icon {
        font-size: 19px;
      }

      .status-box {
        height: 41px;

        padding: 0 7px;

        font-size: 12px;
      }

      .page-status {
        min-width: 61px;
      }

      .zoom-status {
        min-width: 53px;
      }

      .icon-only {
        width: 39px;
      }

      .hint {
        bottom: 6px;

        padding: 7px 10px;

        font-size: 10px;
      }

      body.reader-fullscreen .toolbar {
        justify-content: flex-start;

        overflow-x: auto;
        overflow-y: hidden;

        scrollbar-width: none;
      }

      body.reader-fullscreen .toolbar::-webkit-scrollbar {
        display: none;
      }

      body.reader-fullscreen .controls {
        flex: 0 0 auto;
        margin: 0 auto;
      }
    }

    @media (
      max-height: 560px
    ) and (
      orientation: landscape
    ) {
      :root {
        --header-height: 0px;
        --toolbar-height: 56px;
      }

      .topbar {
        display: none;
      }

      .reader-stage {
        padding: 3px 6px 1px;
      }

      .toolbar {
        padding: 3px 5px 5px;
      }

      .control-btn,
      .status-box {
        height: 38px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <header class="topbar">
      <div class="title-wrap">
        <h1>
          2026年学校运动会电子小册子
        </h1>

        <p>
          点击按钮、页面边缘或左右滑动翻页
        </p>
      </div>
    </header>

    <main class="reader-stage">

      <section
        id="viewport"
        class="viewport"
        aria-label="2026年学校运动会电子小册子"
      >

        <div
          id="loading"
          class="loading"
          aria-live="polite"
        >
          <div class="spinner"></div>

          <div id="loadingText">
            正在载入小册子……
          </div>
        </div>

        <div
          id="errorBox"
          class="error-box"
          role="alert"
        >
          <strong>
            图片无法载入
          </strong>

          <p>
            请确认 index.html 与以下四张图片位于同一个文件夹：
          </p>

          <p>
            page-1.webp、page-2.webp、<br>
            page-3.webp、page-4.webp
          </p>
        </div>

        <div
          id="zoomLayer"
          class="zoom-layer"
        >
          <div
            id="book"
            class="book"
          >
            <div
              id="singleView"
              class="page-slot single-page"
            >
              <img
                id="singleImage"
                src="page-1.webp"
                alt="小册子页面"
                draggable="false"
              >
            </div>

            <div
              id="spreadView"
              class="spread"
              hidden
            >
              <div
                class="page-slot left-page"
              >
                <img
                  src="page-2.webp"
                  alt="工委表"
                  draggable="false"
                >
              </div>

              <div
                class="page-slot right-page"
              >
                <img
                  src="page-3.webp"
                  alt="运动会赛程"
                  draggable="false"
                >
              </div>

              <div class="book-spine"></div>
            </div>

            <div
              id="turnSheet"
              class="turn-sheet"
              aria-hidden="true"
            >
              <div class="turn-face front">
                <img
                  id="turnFront"
                  src="page-1.webp"
                  alt=""
                  draggable="false"
                >
              </div>

              <div class="turn-face back">
                <img
                  id="turnBack"
                  src="page-2.webp"
                  alt=""
                  draggable="false"
                >
              </div>

              <div class="sheet-shadow"></div>
            </div>
          </div>
        </div>

        <div
          id="hint"
          class="hint"
        >
          左右滑动或点击页面边缘翻页
        </div>

      </section>

    </main>

    <footer class="toolbar">

      <div class="controls">

        <button
          id="prevBtn"
          class="control-btn"
          type="button"
          aria-label="上一页"
          disabled
        >
          <span class="icon">‹</span>
          <span class="label">上一页</span>
        </button>

        <div
          id="pageStatus"
          class="status-box page-status"
          aria-live="polite"
        >
          1 / 4
        </div>

        <button
          id="nextBtn"
          class="control-btn"
          type="button"
          aria-label="下一页"
        >
          <span class="label">下一页</span>
          <span class="icon">›</span>
        </button>

        <div class="divider"></div>

        <button
          id="zoomOutBtn"
          class="control-btn icon-only zoom-control"
          type="button"
          aria-label="缩小"
          title="缩小"
          disabled
        >
          <span class="icon">−</span>
        </button>

        <div
          id="zoomStatus"
          class="status-box zoom-status zoom-control"
          aria-live="polite"
        >
          100%
        </div>

        <button
          id="zoomInBtn"
          class="control-btn icon-only zoom-control"
          type="button"
          aria-label="放大"
          title="放大"
        >
          <span class="icon">＋</span>
        </button>

        <button
          id="zoomResetBtn"
          class="control-btn zoom-control"
          type="button"
          aria-label="重置缩放"
          title="恢复完整显示"
        >
          <span class="icon">↺</span>
          <span class="label">重置</span>
        </button>

        <div class="divider"></div>

        <button
          id="soundBtn"
          class="control-btn icon-only"
          type="button"
          aria-label="关闭翻页声音"
          title="翻页声音"
        >
          <span
            id="soundIcon"
            class="icon"
          >
            🔊
          </span>
        </button>

        <button
          id="fullscreenBtn"
          class="control-btn icon-only"
          type="button"
          aria-label="进入全屏"
          title="进入全屏"
        >
          <span
            id="fullscreenIcon"
            class="icon"
          >
            ⛶
          </span>
        </button>

      </div>

    </footer>

  </div>

  <script>
    "use strict";

    const IMAGES = [
      "page-1.webp",
      "page-2.webp",
      "page-3.webp",
      "page-4.webp"
    ];

    /*
     * 三种阅读状态：
     *
     * 0 = 封面
     * 1 = 工委表 + 赛程双页
     * 2 = 鸣谢
     */
    const VIEW_COUNT = 3;

    const PAGE_RATIO = 0.707;

    const MIN_ZOOM = 1;
    const MAX_ZOOM = 2;
    const ZOOM_STEP = 0.25;

    const viewport =
      document.getElementById("viewport");

    const zoomLayer =
      document.getElementById("zoomLayer");

    const book =
      document.getElementById("book");

    const singleView =
      document.getElementById("singleView");

    const singleImage =
      document.getElementById("singleImage");

    const spreadView =
      document.getElementById("spreadView");

    const turnSheet =
      document.getElementById("turnSheet");

    const turnFront =
      document.getElementById("turnFront");

    const turnBack =
      document.getElementById("turnBack");

    const loading =
      document.getElementById("loading");

    const loadingText =
      document.getElementById("loadingText");

    const errorBox =
      document.getElementById("errorBox");

    const hint =
      document.getElementById("hint");

    const prevBtn =
      document.getElementById("prevBtn");

    const nextBtn =
      document.getElementById("nextBtn");

    const pageStatus =
      document.getElementById("pageStatus");

    const zoomOutBtn =
      document.getElementById("zoomOutBtn");

    const zoomInBtn =
      document.getElementById("zoomInBtn");

    const zoomResetBtn =
      document.getElementById("zoomResetBtn");

    const zoomStatus =
      document.getElementById("zoomStatus");

    const soundBtn =
      document.getElementById("soundBtn");

    const soundIcon =
      document.getElementById("soundIcon");

    const fullscreenBtn =
      document.getElementById("fullscreenBtn");

    const fullscreenIcon =
      document.getElementById("fullscreenIcon");

    let currentView = 0;
    let isAnimating = false;

    let soundEnabled = true;
    let audioContext = null;

    let zoomScale = 1;
    let panX = 0;
    let panY = 0;

    let isPanning = false;
    let activePointerId = null;

    let pointerStartX = 0;
    let pointerStartY = 0;

    let startPanX = 0;
    let startPanY = 0;

    let swipeStartX = 0;
    let swipeStartY = 0;
    let swipePointerId = null;

    let resizeTimer = null;

    /*
     * 实际页面编号。
     */
    function getDisplayPage() {
      if (currentView === 0) {
        return "1 / 4";
      }

      if (currentView === 1) {
        return "2–3 / 4";
      }

      return "4 / 4";
    }

    function preloadImage(src) {
      return new Promise(
        (resolve, reject) => {
          const image = new Image();

          image.onload = () =>
            resolve(src);

          image.onerror = () =>
            reject(
              new Error(
                `无法载入：${src}`
              )
            );

          image.src =
            `${src}?v=20260806-cssbook1`;
        }
      );
    }

    async function preloadImages() {
      let loadedCount = 0;

      for (const src of IMAGES) {
        await preloadImage(src);

        loadedCount += 1;

        loadingText.textContent =
          `正在载入小册子…… ${loadedCount} / ${IMAGES.length}`;
      }
    }

    function calculateBookSize() {
      const availableWidth =
        Math.max(
          viewport.clientWidth - 30,
          240
        );

      const availableHeight =
        Math.max(
          viewport.clientHeight - 28,
          260
        );

      /*
       * 手机中间页也采用双页，但会自动缩小。
       * 若想手机中间页改成单页，可再进一步调整。
       */
      const pagesAcross =
        currentView === 1 ? 2 : 1;

      let pageHeight =
        availableHeight;

      let pageWidth =
        pageHeight * PAGE_RATIO;

      const totalWidth =
        pageWidth * pagesAcross;

      if (totalWidth > availableWidth) {
        pageWidth =
          availableWidth / pagesAcross;

        pageHeight =
          pageWidth / PAGE_RATIO;
      }

      /*
       * 额外预留阴影空间。
       */
      pageWidth =
        Math.max(
          145,
          Math.floor(pageWidth - 8)
        );

      pageHeight =
        Math.max(
          205,
          Math.floor(pageHeight - 8)
        );

      return {
        pageWidth,
        pageHeight
      };
    }

    function applyBookSize() {
      const {
        pageWidth,
        pageHeight
      } = calculateBookSize();

      const pageSlots =
        book.querySelectorAll(
          ".page-slot"
        );

      pageSlots.forEach(page => {
        page.style.width =
          `${pageWidth}px`;

        page.style.height =
          `${pageHeight}px`;
      });

      turnSheet.style.width =
        `${pageWidth}px`;

      turnSheet.style.height =
        `${pageHeight}px`;

      if (currentView === 1) {
        book.style.width =
          `${pageWidth * 2}px`;

        book.style.height =
          `${pageHeight}px`;
      } else {
        book.style.width =
          `${pageWidth}px`;

        book.style.height =
          `${pageHeight}px`;
      }

      clampPan();
      applyTransform(false);
    }

    function updateViewContent() {
      if (currentView === 0) {
        singleImage.src =
          "page-1.webp";

        singleImage.alt =
          "学校运动会小册子封面";

        singleView.hidden = false;
        spreadView.hidden = true;
      }

      if (currentView === 1) {
        singleView.hidden = true;
        spreadView.hidden = false;
      }

      if (currentView === 2) {
        singleImage.src =
          "page-4.webp";

        singleImage.alt =
          "学校运动会鸣谢页";

        singleView.hidden = false;
        spreadView.hidden = true;
      }

      pageStatus.textContent =
        getDisplayPage();

      prevBtn.disabled =
        currentView <= 0 ||
        isAnimating;

      nextBtn.disabled =
        currentView >=
          VIEW_COUNT - 1 ||
        isAnimating;

      applyBookSize();
    }

    /*
     * 纸张翻动声音。
     */
    function playPageSound() {
      if (!soundEnabled) {
        return;
      }

      try {
        if (!audioContext) {
          audioContext =
            new (
              window.AudioContext ||
              window.webkitAudioContext
            )();
        }

        if (
          audioContext.state ===
          "suspended"
        ) {
          audioContext.resume();
        }

        const duration = 0.28;

        const sampleCount =
          Math.floor(
            audioContext.sampleRate *
            duration
          );

        const buffer =
          audioContext.createBuffer(
            1,
            sampleCount,
            audioContext.sampleRate
          );

        const data =
          buffer.getChannelData(0);

        for (
          let index = 0;
          index < sampleCount;
          index += 1
        ) {
          const progress =
            index / sampleCount;

          const envelope =
            Math.pow(
              1 - progress,
              2.1
            );

          const noise =
            Math.random() * 2 - 1;

          const wave =
            0.7 +
            Math.sin(
              progress *
              Math.PI *
              13
            ) *
            0.17;

          data[index] =
            noise *
            envelope *
            wave;
        }

        const source =
          audioContext.createBufferSource();

        const filter =
          audioContext.createBiquadFilter();

        const gain =
          audioContext.createGain();

        source.buffer = buffer;

        filter.type = "bandpass";
        filter.frequency.value = 1250;
        filter.Q.value = 0.72;

        gain.gain.setValueAtTime(
          0.0001,
          audioContext.currentTime
        );

        gain.gain
          .exponentialRampToValueAtTime(
            0.18,
            audioContext.currentTime +
              0.02
          );

        gain.gain
          .exponentialRampToValueAtTime(
            0.0001,
            audioContext.currentTime +
              duration
          );

        source.connect(filter);
        filter.connect(gain);
        gain.connect(
          audioContext.destination
        );

        source.start();
      } catch (error) {
        console.warn(
          "无法播放翻页声音：",
          error
        );
      }
    }

    /*
     * 配置翻页覆盖层。
     */
    function prepareTurnSheet(direction) {
      const pageWidth =
        singleView.offsetWidth ||
        spreadView
          .querySelector(".left-page")
          .offsetWidth;

      turnSheet.style.width =
        `${pageWidth}px`;

      if (direction === "forward") {
        if (currentView === 0) {
          turnFront.src =
            "page-1.webp";

          turnBack.src =
            "page-2.webp";

          turnSheet.style.left = "0";
        } else {
          turnFront.src =
            "page-3.webp";

          turnBack.src =
            "page-4.webp";

          turnSheet.style.left =
            `${pageWidth}px`;
        }

        turnSheet.className =
          "turn-sheet active turn-forward";
      } else {
        if (currentView === 2) {
          turnFront.src =
            "page-4.webp";

          turnBack.src =
            "page-3.webp";

          turnSheet.style.left = "0";
        } else {
          turnFront.src =
            "page-2.webp";

          turnBack.src =
            "page-1.webp";

          turnSheet.style.left = "0";
        }

        turnSheet.className =
          "turn-sheet active turn-backward";
      }
    }

    function finishTurn(targetView) {
      currentView = targetView;

      turnSheet.className =
        "turn-sheet";

      isAnimating = false;

      resetZoom(false);
      updateViewContent();

      hint.classList.add("hide");
    }

    function turnForward() {
      if (
        isAnimating ||
        currentView >= VIEW_COUNT - 1
      ) {
        return;
      }

      isAnimating = true;

      prevBtn.disabled = true;
      nextBtn.disabled = true;

      prepareTurnSheet("forward");
      playPageSound();

      const targetView =
        currentView + 1;

      /*
       * 翻页中段先切换底层内容，
       * 让动画结束时显示正确页面。
       */
      window.setTimeout(() => {
        const previousView =
          currentView;

        currentView =
          targetView;

        updateViewContent();

        currentView =
          previousView;
      }, 390);

      window.setTimeout(() => {
        finishTurn(targetView);
      }, 830);
    }

    function turnBackward() {
      if (
        isAnimating ||
        currentView <= 0
      ) {
        return;
      }

      isAnimating = true;

      prevBtn.disabled = true;
      nextBtn.disabled = true;

      prepareTurnSheet("backward");
      playPageSound();

      const targetView =
        currentView - 1;

      window.setTimeout(() => {
        const previousView =
          currentView;

        currentView =
          targetView;

        updateViewContent();

        currentView =
          previousView;
      }, 390);

      window.setTimeout(() => {
        finishTurn(targetView);
      }, 830);
    }

    /* =========================
       缩放
    ========================= */

    function fullscreenActive() {
      return document.body.classList
        .contains("reader-fullscreen");
    }

    function getPanLimits() {
      if (zoomScale <= 1) {
        return {
          maxX: 0,
          maxY: 0
        };
      }

      const viewportWidth =
        viewport.clientWidth;

      const viewportHeight =
        viewport.clientHeight;

      const baseWidth =
        book.offsetWidth;

      const baseHeight =
        book.offsetHeight;

      const scaledWidth =
        baseWidth * zoomScale;

      const scaledHeight =
        baseHeight * zoomScale;

      return {
        maxX:
          Math.max(
            0,
            (
              scaledWidth -
              viewportWidth
            ) /
              2 +
              20
          ),

        maxY:
          Math.max(
            0,
            (
              scaledHeight -
              viewportHeight
            ) /
              2 +
              20
          )
      };
    }

    function clampPan() {
      const {
        maxX,
        maxY
      } = getPanLimits();

      panX =
        Math.min(
          maxX,
          Math.max(-maxX, panX)
        );

      panY =
        Math.min(
          maxY,
          Math.max(-maxY, panY)
        );
    }

    function applyTransform(
      animate = true
    ) {
      clampPan();

      zoomLayer.style.transition =
        animate
          ? "transform 0.2s ease"
          : "none";

      zoomLayer.style.transform =
        `translate(${panX}px, ${panY}px) scale(${zoomScale})`;

      zoomLayer.classList.toggle(
        "zoomed",
        zoomScale > 1
      );

      zoomStatus.textContent =
        `${Math.round(
          zoomScale * 100
        )}%`;

      zoomOutBtn.disabled =
        zoomScale <= MIN_ZOOM;

      zoomInBtn.disabled =
        zoomScale >= MAX_ZOOM;
    }

    function setZoom(value) {
      if (!fullscreenActive()) {
        return;
      }

      zoomScale =
        Math.min(
          MAX_ZOOM,
          Math.max(
            MIN_ZOOM,
            Math.round(
              value * 100
            ) / 100
          )
        );

      if (zoomScale <= 1) {
        zoomScale = 1;
        panX = 0;
        panY = 0;
      }

      applyTransform(true);
    }

    function resetZoom(
      animate = true
    ) {
      zoomScale = 1;
      panX = 0;
      panY = 0;

      applyTransform(animate);
    }

    /* =========================
       按钮
    ========================= */

    prevBtn.addEventListener(
      "click",
      turnBackward
    );

    nextBtn.addEventListener(
      "click",
      turnForward
    );

    zoomInBtn.addEventListener(
      "click",
      () => {
        setZoom(
          zoomScale +
            ZOOM_STEP
        );
      }
    );

    zoomOutBtn.addEventListener(
      "click",
      () => {
        setZoom(
          zoomScale -
            ZOOM_STEP
        );
      }
    );

    zoomResetBtn.addEventListener(
      "click",
      () => {
        resetZoom();
      }
    );

    soundBtn.addEventListener(
      "click",
      () => {
        soundEnabled =
          !soundEnabled;

        soundIcon.textContent =
          soundEnabled
            ? "🔊"
            : "🔇";

        soundBtn.setAttribute(
          "aria-label",
          soundEnabled
            ? "关闭翻页声音"
            : "开启翻页声音"
        );

        if (soundEnabled) {
          playPageSound();
        }
      }
    );

    /*
     * 这里不使用浏览器 Fullscreen API。
     * 只进入网页沉浸模式，手机和电脑表现一致。
     */
    function toggleReaderFullscreen() {
      const active =
        fullscreenActive();

      document.body.classList.toggle(
        "reader-fullscreen",
        !active
      );

      fullscreenIcon.textContent =
        active ? "⛶" : "×";

      fullscreenBtn.setAttribute(
        "aria-label",
        active
          ? "进入全屏"
          : "退出全屏"
      );

      fullscreenBtn.title =
        active
          ? "进入全屏"
          : "退出全屏";

      resetZoom(false);

      window.setTimeout(() => {
        applyBookSize();
      }, 120);
    }

    fullscreenBtn.addEventListener(
      "click",
      toggleReaderFullscreen
    );

    /* =========================
       滑动与拖动
    ========================= */

    viewport.addEventListener(
      "pointerdown",
      event => {
        if (
          event.pointerType ===
            "mouse" &&
          event.button !== 0
        ) {
          return;
        }

        if (
          fullscreenActive() &&
          zoomScale > 1
        ) {
          isPanning = true;

          activePointerId =
            event.pointerId;

          pointerStartX =
            event.clientX;

          pointerStartY =
            event.clientY;

          startPanX = panX;
          startPanY = panY;

          zoomLayer.classList.add(
            "dragging"
          );

          viewport.setPointerCapture(
            event.pointerId
          );

          return;
        }

        swipePointerId =
          event.pointerId;

        swipeStartX =
          event.clientX;

        swipeStartY =
          event.clientY;
      }
    );

    viewport.addEventListener(
      "pointermove",
      event => {
        if (
          isPanning &&
          event.pointerId ===
            activePointerId
        ) {
          event.preventDefault();

          panX =
            startPanX +
            (
              event.clientX -
              pointerStartX
            );

          panY =
            startPanY +
            (
              event.clientY -
              pointerStartY
            );

          applyTransform(false);
        }
      }
    );

    function finishPointer(event) {
      if (
        isPanning &&
        event.pointerId ===
          activePointerId
      ) {
        isPanning = false;
        activePointerId = null;

        zoomLayer.classList.remove(
          "dragging"
        );

        applyTransform(true);

        return;
      }

      if (
        event.pointerId !==
          swipePointerId ||
        zoomScale > 1
      ) {
        return;
      }

      const differenceX =
        event.clientX -
        swipeStartX;

      const differenceY =
        event.clientY -
        swipeStartY;

      swipePointerId = null;

      if (
        Math.abs(differenceX) < 55 ||
        Math.abs(differenceX) <=
          Math.abs(differenceY)
      ) {
        return;
      }

      if (differenceX < 0) {
        turnForward();
      } else {
        turnBackward();
      }
    }

    viewport.addEventListener(
      "pointerup",
      finishPointer
    );

    viewport.addEventListener(
      "pointercancel",
      finishPointer
    );

    /*
     * 100%时点击页面左右区域翻页。
     */
    viewport.addEventListener(
      "click",
      event => {
        if (
          isAnimating ||
          zoomScale > 1
        ) {
          return;
        }

        const target =
          event.target;

        if (
          target.closest(
            "button"
          )
        ) {
          return;
        }

        const rect =
          viewport.getBoundingClientRect();

        const relativeX =
          event.clientX -
          rect.left;

        if (
          relativeX <
          rect.width * 0.27
        ) {
          turnBackward();
        }

        if (
          relativeX >
          rect.width * 0.73
        ) {
          turnForward();
        }
      }
    );

    /*
     * 全屏时双击：
     * 100%与150%快速切换。
     */
    viewport.addEventListener(
      "dblclick",
      event => {
        event.preventDefault();

        if (!fullscreenActive()) {
          toggleReaderFullscreen();
          return;
        }

        if (zoomScale > 1) {
          resetZoom();
        } else {
          setZoom(1.5);
        }
      }
    );

    /* =========================
       键盘
    ========================= */

    document.addEventListener(
      "keydown",
      event => {
        if (
          event.key ===
          "ArrowLeft"
        ) {
          event.preventDefault();
          turnBackward();
        }

        if (
          event.key ===
          "ArrowRight"
        ) {
          event.preventDefault();
          turnForward();
        }

        if (
          fullscreenActive() &&
          (
            event.key === "+" ||
            event.key === "="
          )
        ) {
          event.preventDefault();

          setZoom(
            zoomScale +
              ZOOM_STEP
          );
        }

        if (
          fullscreenActive() &&
          event.key === "-"
        ) {
          event.preventDefault();

          setZoom(
            zoomScale -
              ZOOM_STEP
          );
        }

        if (
          fullscreenActive() &&
          event.key === "0"
        ) {
          event.preventDefault();
          resetZoom();
        }

        if (
          fullscreenActive() &&
          event.key === "Escape"
        ) {
          toggleReaderFullscreen();
        }
      }
    );

    /* =========================
       视窗变化
    ========================= */

    window.addEventListener(
      "resize",
      () => {
        window.clearTimeout(
          resizeTimer
        );

        resizeTimer =
          window.setTimeout(() => {
            resetZoom(false);
            applyBookSize();
          }, 160);
      }
    );

    window.addEventListener(
      "orientationchange",
      () => {
        window.setTimeout(() => {
          resetZoom(false);
          applyBookSize();
        }, 350);
      }
    );

    /* =========================
       启动
    ========================= */

    async function start() {
      try {
        await preloadImages();

        updateViewContent();

        loading.classList.add(
          "hidden"
        );

        window.setTimeout(() => {
          hint.classList.add(
            "hide"
          );
        }, 4200);
      } catch (error) {
        console.error(error);

        loading.classList.add(
          "hidden"
        );

        errorBox.classList.add(
          "show"
        );

        hint.classList.add(
          "hide"
        );
      }
    }

    start();
  </script>
</body>
</html>
