<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>一年级道德教育：分工合作真欢喜</title>
  <style>
    :root {
      --primary: #4CAF50;
      --primary-light: #E8F5E9;
      --accent: #FF9800;
      --text: #2C3E50;
      --border-color: #81C784;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      margin: 0; padding: 0;
    }

    body {
      font-family: "Comic Sans MS", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #A8E6CF 0%, #DCEDC1 50%, #FFD3B6 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      color: var(--text);
    }

    #game-container {
      width: 100%;
      max-width: 650px;
      max-height: 94vh;
      background: #FFFFFF;
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(46, 125, 50, 0.2);
      border: 4px solid var(--border-color);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-y: auto;
      overflow-x: hidden;
    }

    .top-bar {
      background: #F1F8E9;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px dashed #C8E6C9;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .badge {
      background: #4CAF50;
      color: white;
      padding: 4px 12px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: bold;
    }
    .score-txt {
      font-size: 14px;
      font-weight: bold;
      color: #2E7D32;
    }
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #E0E0E0;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #81C784, #FFB74D);
      transition: width 0.3s ease;
    }

    .panel {
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      flex-grow: 1;
      width: 100%;
    }

    .btn-main {
      background: linear-gradient(180deg, #66BB6A, #43A047);
      color: white;
      border: none;
      padding: 12px 32px;
      font-size: 17px;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(67, 160, 71, 0.35);
      touch-action: manipulation;
      transition: transform 0.1s ease, background 0.2s;
      z-index: 20;
      margin: 10px 0;
      display: inline-block;
    }
    .btn-main:active { transform: scale(0.96); }
    .btn-main:disabled { background: #B0BEC5; box-shadow: none; cursor: not-allowed; }

    .q-box {
      background: #F9FBE7;
      border: 2px solid #DCEDC8;
      border-radius: 16px;
      padding: 12px 16px;
      width: 100%;
      text-align: left;
      margin-bottom: 12px;
    }
    .q-text {
      font-size: 16px;
      font-weight: bold;
      color: #2E7D32;
      line-height: 1.4;
    }
    .q-sub {
      font-size: 13px;
      color: #689F38;
      margin-top: 4px;
    }

    .feedback-hint {
      min-height: 36px;
      margin: 8px 0;
      font-size: 14px;
      font-weight: bold;
      color: #2E7D32;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      opacity: 0;
      transition: opacity 0.2s;
      width: 100%;
    }
    .feedback-hint.show { opacity: 1; }

    /* 关卡1：绿植浇灌 */
    .tree-stage {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: #FFFDE7;
      border: 3px solid #FFF59D;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 6px auto 14px auto;
      box-shadow: inset 0 0 15px rgba(255, 238, 88, 0.4);
      transition: transform 0.3s;
    }
    .tree-emoji { font-size: 52px; line-height: 1; }
    .tree-label {
      font-size: 12px;
      font-weight: bold;
      color: #558B2F;
      margin-top: 4px;
      background: #E8F5E9;
      padding: 2px 8px;
      border-radius: 10px;
    }
    .tool-options {
      display: flex;
      gap: 10px;
      justify-content: center;
      width: 100%;
    }
    .tool-card {
      background: #FFFFFF;
      border: 3px solid #81C784;
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: bold;
      font-size: 15px;
      color: #333;
      flex: 1;
      max-width: 260px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.06);
      transition: transform 0.15s, border-color 0.15s;
      z-index: 10;
    }
    .tool-card:active { transform: scale(0.96); }
    .tool-card.selected { border-color: #2E7D32; background: #E8F5E9; }

    /* 关卡2：磁吸拼图 */
    .puzzle-target-slot {
      width: 100%;
      min-height: 60px;
      border: 3px dashed #81C784;
      border-radius: 16px;
      background: #F1F8E9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px 12px;
      font-weight: bold;
      color: #689F38;
      margin: 10px 0;
      font-size: 15px;
    }
    .puzzle-target-slot.snapped {
      border-style: solid;
      background: #DCEDC8;
      color: #1B5E20;
    }
    .puzzle-pieces-pool {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .puzzle-piece {
      background: #FFFFFF;
      border: 3px solid #A5D6A7;
      border-radius: 14px;
      padding: 12px 14px;
      font-size: 14px;
      font-weight: bold;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
      z-index: 10;
    }
    .puzzle-piece:active { transform: scale(0.98); }

    /* 关卡3：萌宠投喂 */
    .feeding-monsters-wrap {
      display: flex;
      justify-content: space-around;
      width: 100%;
      margin: 10px 0;
      gap: 12px;
    }
    .monster-bin {
      background: #E8F5E9;
      border: 3px solid #81C784;
      border-radius: 18px;
      padding: 10px;
      flex: 1;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.2s, background 0.2s;
      z-index: 10;
    }
    .monster-bin:active { transform: scale(0.95); }
    .monster-bin.mouth-open { transform: scale(1.06); background: #C8E6C9; }
    .feeding-food-card {
      background: #FFF9C4;
      border: 2px solid #FBC02D;
      border-radius: 14px;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      color: #E65100;
      width: 100%;
      margin: 6px 0;
    }

    /* 关卡4：戳泡泡 */
    .bubbles-area {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      width: 100%;
      margin: 10px 0;
    }
    .bubble-item {
      background: radial-gradient(circle at 30% 30%, #E1F5FE, #81D4FA);
      border: 3px solid #29B6F6;
      border-radius: 50%;
      width: 95px;
      height: 95px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      font-size: 13px;
      font-weight: bold;
      color: #01579B;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(41, 182, 246, 0.3);
      animation: floatBubble 2.5s ease-in-out infinite alternate;
      z-index: 10;
    }
    .bubble-item.popped {
      animation: popEffect 0.2s forwards;
      pointer-events: none;
    }
    @keyframes floatBubble {
      0% { transform: translateY(0); }
      100% { transform: translateY(-8px); }
    }
    @keyframes popEffect {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.4); opacity: 0; }
    }

    /* 关卡5：积木搭建 */
    .castle-building-zone {
      width: 100%;
      min-height: 140px;
      background: #ECEFF1;
      border: 2px dashed #90A4AE;
      border-radius: 14px;
      display: flex;
      flex-direction: column-reverse;
      align-items: center;
      padding: 8px;
      gap: 5px;
      margin-bottom: 8px;
    }
    .castle-brick {
      width: 90%;
      background: linear-gradient(90deg, #FFB74D, #FFA726);
      border: 2px solid #F57C00;
      color: white;
      font-weight: bold;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 13px;
      animation: dropBrick 0.3s ease-out;
    }
    @keyframes dropBrick {
      0% { transform: translateY(-20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    #confetti-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="confetti-canvas"></canvas>

  <div class="top-bar" id="topBar" style="display:none;">
    <div class="badge" id="levelNameBadge">关卡 1</div>
    <div class="score-txt" id="subStepInfo">第 1 / 5 步</div>
    <div class="score-txt" id="scoreBadge">⭐ 分数: 0</div>
  </div>
  <div class="progress-bar" id="progressBar" style="display:none;">
    <div class="progress-fill" id="progressFill"></div>
  </div>

  <!-- 登录页面 -->
  <div class="panel" id="viewLogin">
    <div style="font-size: 54px; margin-top: 10px;">🤝🌱🏰</div>
    <h1 style="color: #2E7D32; font-size: 24px; margin: 8px 0;">分工合作真欢喜</h1>
    <p style="color: #666; font-size: 14px; margin-bottom: 20px;">
      一年级道德教育 • 价值 12 合作<br>5 大互动游戏：浇水、磁吸拼图、投喂、戳泡泡、叠积木！
    </p>

    <div style="width: 100%; max-width: 300px; text-align: left;">
      <label style="font-weight: bold; color: #2E7D32; font-size: 13px;">学生姓名 (Nama):</label>
      <input type="text" id="stuName" placeholder="请输入你的姓名" style="width: 100%; padding: 10px 14px; border-radius: 12px; border: 2px solid #81C784; margin: 4px 0 14px; font-size: 15px; outline: none;">

      <label style="font-weight: bold; color: #2E7D32; font-size: 13px;">班级 (Kelas):</label>
      <input type="text" id="stuClass" value="一年级" style="width: 100%; padding: 10px 14px; border-radius: 12px; border: 2px solid #81C784; margin-top: 4px; font-size: 15px; outline: none;">
    </div>

    <button class="btn-main" onclick="onStartGame()" style="margin-top: 20px;">🚀 进入游戏乐园</button>
  </div>

  <!-- 游戏主舞台 -->
  <div class="panel" id="viewGame" style="display:none;">
    <div class="q-box">
      <div class="q-text" id="qTitle">加载中...</div>
      <div class="q-sub" id="qSub"></div>
    </div>

    <div id="interactiveArea" style="width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;"></div>

    <div class="feedback-hint" id="feedbackHint">
      <span id="hintEmoji">💡</span>
      <span id="hintText">一起动手，合作力量大！</span>
    </div>

    <button class="btn-main" id="btnNext" style="display:none;" onclick="nextStep()">下一题 ➔</button>
  </div>

  <!-- 结算页面 -->
  <div class="panel" id="viewResult" style="display:none;">
    <div style="font-size: 54px; margin-top: 10px;">🏆🎉🎈</div>
    <h2 style="color: #2E7D32; font-size: 24px;">闯关大成功！</h2>
    <div style="font-size: 36px; margin: 8px 0;" id="resultStars">⭐⭐⭐</div>
    <div style="font-size: 30px; font-weight: bold; color: #2E7D32;" id="resultScore">25 / 25</div>
    <p style="color: #558B2F; font-size: 14px; margin-top: 4px;" id="resultTitle">最佳班级合作小先锋！</p>
    <p style="color: #888; font-size: 12px; margin-top: 2px;" id="resultTime">用时：01分30秒</p>

    <div id="mistakeBox" style="width: 100%; background: #FFFDE7; border: 1px solid #FFF59D; border-radius: 12px; padding: 10px; max-height: 120px; overflow-y: auto; text-align: left; font-size: 13px; color: #795548; margin: 10px 0; display: none;">
      <strong>📝 温馨提示：</strong>
      <div id="mistakeItems"></div>
    </div>

    <button class="btn-main" id="btnSubmitScore" onclick="submitScoreData()">📤 提交成绩至试算表</button>
    <p id="submitTip" style="font-size: 13px; color: #2E7D32; margin-top: 6px;"></p>
  </div>
</div>

<script>
  /* ==========================================================================
     📍 这里就是填 GAS URL 的地方！
     - 如果部署在 GitHub Pages，把引号里的链接换成你的 GAS Web App 部署链接
     - 如果直接在 GAS 内部作为 Web App 运行，留空也会自动通过 google.script.run 上传
     ========================================================================== */
  const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbxG2N9YeOsNj6OGq3lJENWpci4qkdx_I99_lzt72RFS0S_2eXvpbPf4lTjjZEfKLVTQ/exec"; 

  /* 音效合成 */
  let actx = null;
  function getActx() {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    return actx;
  }
  function playPop() {
    const c = getActx(), o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.setValueAtTime(800, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(1200, c.currentTime + 0.08);
    g.gain.setValueAtTime(0.2, c.currentTime); g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 0.08);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.08);
  }
  function playSnap() {
    const c = getActx(), o = c.createOscillator(), g = c.createGain();
    o.type = "triangle"; o.frequency.setValueAtTime(1400, c.currentTime);
    o.frequency.exponentialRampToValueAtTime(1800, c.currentTime + 0.12);
    g.gain.setValueAtTime(0.25, c.currentTime); g.gain.exponentialRampToValueAtTime(0.01, c.currentTime + 0.12);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + 0.12);
  }
  function playFanfare() {
    const c = getActx(), notes = [523.25, 659.25, 783.99, 1046.5];
    notes.forEach((f, i) => {
      const o = c.createOscillator(), g = c.createGain();
      o.type = "sine"; o.frequency.setValueAtTime(f, c.currentTime + i * 0.12);
      g.gain.setValueAtTime(0.25, c.currentTime + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + i * 0.12 + 0.35);
      o.connect(g); g.connect(c.destination); o.start(c.currentTime + i * 0.12); o.stop(c.currentTime + i * 0.12 + 0.35);
    });
  }

  /* 25题题库 */
  const GAME_LEVELS = [
    {
      levelId: 1,
      title: "第一关：🌱 梦幻绿植浇灌养成 (课本P.59)",
      mechanic: "bloom",

        { q: "我们要绿化居住环境，伙伴拿铁锹松土，我该拿什么分工配合？", sub: "儿歌：“大家一起来种树，我松土来你……”", choices: [{txt:"拿水壶负责浇水 🚿", cor:true}, {txt:"空手在旁边笑 😆", cor:false}], tip: "我松土来你浇水，小树喝水长得快！" },
        { q: "小树苗歪了，一个小朋友扶正树苗，另一个小朋友应该：", sub: "分工合作栽种小树", choices: [{txt:"培土压实泥土 🪴", cor:true}, {txt:"拉着树枝乱摇 🙅", cor:false}], tip: "一人扶树一人培土，小树站得直！" },
        { q: "地上有拔出来的杂草，两个同学怎样清理最快？", sub: "整理树下的杂草碎石", choices: [{txt:"一人装袋一人搬运 🗑️", cor:true}, {txt:"把杂草踢到邻居家 ❌", cor:false}], tip: "配合清理，环境马上变得好干净！" },
        { q: "天气炎热小树口渴，我们要帮花园浇水，怎样分工最棒？", sub: "花园大面积植物浇水", choices: [{txt:"一人提水一人均匀洒水 💦", cor:true}, {txt:"把水桶抢过来泼水 🌊", cor:false}], tip: "互相配合提水浇水，花草都笑了！" },
        { q: "大家分工把小树栽好了，看到绿意盎然的社区，你的心情是？", sub: "体会合作成功的道德情感", choices: [{txt:"心里特别踏实、开心自豪 🌟", cor:true}, {txt:"觉得很倒霉、很不满 😤", cor:false}], tip: "大家同心协力，收获满园芬芳与快乐！" }
      ]
    },
    {
      levelId: 2,
      title: "第二关：🧩 动物渡河磁吸拼图 (课本P.61)",

      questions: [
        { q: "河对岸有香甜果子，大象会游泳但摘不到，小猴会爬树但不会游泳，怎么做？", sub: "大象与猴子的寓言任务", choices: [{txt:"大象背小猴过河，小猴爬树摘果 🐘🐒", cor:true}, {txt:"大象和小猴互相嘲笑 🙅", cor:false}], tip: "互相借用长处，难题迎刃而解！" },

        { q: "制作模型时同伴遇到困难：", sub: "行为卡：主动把剪刀借给同伴，热心指导 🤝", isGood: true, tip: "互帮互助是团队最温暖的阳光！" },
        { q: "茶会结束后课室留下垃圾：", sub: "行为卡：全班齐心分工合作打扫课室 🧹", isGood: true, tip: "有始有终，合作让教室一尘不染！" }

    {
      levelId: 4,
      title: "第四关：🫧 大扫除好心情戳泡泡 (课本P.63)",
      mechanic: "bubble",
      questions: [
        { q: "戳破白板圆圈图上【合作带来的好心情】的泡泡：", sub: "白板圆圈图汇总情感", bubbles: [{txt:"快乐开心 😄", cor:true}, {txt:"自私愤怒 😡", cor:false}, {txt:"孤单害怕 🌧️", cor:false}], tip: "合作带来满满的快乐和喜悦！" },
        { q: "戳破有助于【班级大扫除高效分工】的做法泡泡：", sub: "课本第63页讨论站", bubbles: [{txt:"制定分工表 📋", cor:true}, {txt:"到处跑闹 🏃", cor:false}, {txt:"躲在桌下 🙈", cor:false}], tip: "有了分工表，人人有职责不慌乱！" },
        { q: "戳破体现【互相包容与礼貌商量】的正面泡泡：", sub: "化解合作中的小矛盾", bubbles: [{txt:"礼貌商量 💬", cor:true}, {txt:"大吵大闹 🗣️", cor:false}, {txt:"动手抢工具 💥", cor:false}], tip: "礼貌商量，退一步海阔天空！" },
        { q: "全班同心协力整理好图书角后，戳破你内心的真实感受：", sub: "教案目标1情感体验", bubbles: [{txt:"踏实与自豪 💖", cor:true}, {txt:"痛苦难受 😭", cor:false}, {txt:"厌烦后悔 🙅", cor:false}], tip: "看到整齐的图书角，心里暖洋洋很踏实！" },
        { q: "戳破让班级大家庭紧紧凝聚在一起的秘密武器泡泡：", sub: "学习标准 12.5 达致团结", bubbles: [{txt:"班级大团结 🌈", cor:true}, {txt:"分散各走 🚷", cor:false}, {txt:"互相冷漠 🧊", cor:false}], tip: "分工合作就是通往团结的彩虹桥！" }
      ]
    },
    {
      levelId: 5,
      title: "第五关：🧱 团结承诺积木塔 (教案目标与承诺)",
      mechanic: "stack",
      questions: [
        { q: "打好团结大厦的地基，选择第一句誓词积木：", sub: "宣读班级团结合作承诺卡", choices: [{txt:"手拉手，心连心 🤝", cor:true}, {txt:"你走你的，我走我的 🚶", cor:false}], tip: "第一层：手拉手，心连心！" },
        { q: "搭建第二层合作之墙，选择下一句誓词积木：", sub: "宣读班级团结合作承诺卡", choices: [{txt:"分工合作创奇迹 ✨", cor:true}, {txt:"偷懒耍赖不出力 💤", cor:false}], tip: "第二层：分工合作创奇迹！" },
        { q: "搭建第三层互助梁柱，选择互助誓词积木：", sub: "宣读班级团结合作承诺卡", choices: [{txt:"你帮我，我帮你 💖", cor:true}, {txt:"各人自扫门前雪 ❄️", cor:false}], tip: "第三层：你帮我，我帮你！" },
        { q: "搭建第四层友爱屋顶，选择班级美好誓词：", sub: "宣读班级团结合作承诺卡", choices: [{txt:"班级大家庭更美丽 🏫", cor:true}, {txt:"不管班级好与坏 🙈", cor:false}], tip: "第四层：班级大家庭更美丽！" },
        { q: "最后在金字塔顶端升起终极荣耀之星：", sub: "在日常生活中体现合作精神", choices: [{txt:"团结合作，人人践行！🌟", cor:true}, {txt:"只是口头说说不行动 🤐", cor:false}], tip: "顶峰闪耀：团结合作，人人践行！" }
      ]
    }
  ];

  let currLvlIdx = 0, currQIdx = 0, totalScore = 0;
  let mistakeLogs = [], startTime = null, studentName = "", studentClass = "";
  let hasAnsweredCurrent = false, castleBricksBuilt = [];

  function shuffle(arr) {
    return [...arr].sort(() => Math.random() - 0.5);
  }

  function onStartGame() {
    const n = document.getElementById("stuName").value.trim();
    if (!n) {
      alert("请小朋友输入名字哦！😊");
      return;
    }
    studentName = n;
    studentClass = document.getElementById("stuClass").value.trim() || "一年级";
    startTime = new Date();

    document.getElementById("viewLogin").style.display = "none";
    document.getElementById("topBar").style.display = "flex";
    document.getElementById("progressBar").style.display = "block";
    document.getElementById("viewGame").style.display = "flex";

    renderCurrentQuestion();
  }

  function renderCurrentQuestion() {
    hasAnsweredCurrent = false;
    const lvl = GAME_LEVELS[currLvlIdx];
    const qData = lvl.questions[currQIdx];
    const globalQNum = currLvlIdx * 5 + currQIdx + 1;

    document.getElementById("levelNameBadge").innerText = lvl.title;
    document.getElementById("subStepInfo").innerText = `第 ${currQIdx + 1} / 5 步 (共25题)`;
    document.getElementById("scoreBadge").innerText = `⭐ 分数: ${totalScore}`;
    document.getElementById("progressFill").style.width = `${((globalQNum - 1) / 25) * 100}%`;

    document.getElementById("qTitle").innerText = `${globalQNum}. ${qData.q}`;
    document.getElementById("qSub").innerText = qData.sub ? `💡 课堂线索：${qData.sub}` : "";

    const hint = document.getElementById("feedbackHint");
    hint.classList.remove("show");
    document.getElementById("btnNext").style.display = "none";

    const container = document.getElementById("interactiveArea");
    container.innerHTML = "";

    switch (lvl.mechanic) {
      case "bloom": renderBloomMechanic(container, qData); break;
      case "snap": renderSnapMechanic(container, qData); break;
      case "feed": renderFeedMechanic(container, qData); break;
      case "bubble": renderBubbleMechanic(container, qData); break;
      case "stack": renderStackMechanic(container, qData); break;
    }
  }

  function renderBloomMechanic(container, qData) {
    const treeStages = [
      { emoji: "🌱", label: "第1阶段：幼苗入土" },
      { emoji: "🌿", label: "第2阶段：抽叶萌芽" },
      { emoji: "🪴", label: "第3阶段：结出花苞" },
      { emoji: "🌸", label: "第4阶段：绽放鲜花" },
      { emoji: "🌳", label: "第5阶段：彩虹硕果" }
    ];
    const currentStage = treeStages[currQIdx] || treeStages[0];

    const stageDiv = document.createElement("div");
    stageDiv.className = "tree-stage";
    stageDiv.innerHTML = `
      <div class="tree-emoji">${currentStage.emoji}</div>
      <div class="tree-label">${currentStage.label}</div>
    `;
    container.appendChild(stageDiv);

    const toolBox = document.createElement("div");
    toolBox.className = "tool-options";
    const shuffled = shuffle(qData.choices);

    shuffled.forEach(c => {
      const card = document.createElement("div");
      card.className = "tool-card";
      card.innerHTML = `<span>🛠️</span> <span>${c.txt}</span>`;
      card.onclick = () => {
        if (hasAnsweredCurrent) return;
        hasAnsweredCurrent = true;
        card.classList.add("selected");
        playPop();
        if (c.cor) {
          playSnap();
          totalScore++;
          stageDiv.style.transform = "scale(1.12)";
          setTimeout(() => stageDiv.style.transform = "scale(1)", 200);
          showFeedback("🌟", qData.tip);
        } else {
          mistakeLogs.push(`【第1关】${qData.q}`);
          showFeedback("🌱", `真棒的探索！其实选择“${qData.choices.find(x=>x.cor).txt}”能让小树长得更好！`);
        }
        document.getElementById("btnNext").style.display = "inline-block";
      };
      toolBox.appendChild(card);
    });
    container.appendChild(toolBox);
  }

  function renderSnapMechanic(container, qData) {
    const slot = document.createElement("div");
    slot.className = "puzzle-target-slot";
    slot.innerHTML = "📥 点击下方最棒的合作拼图，吸附入卡槽";
    container.appendChild(slot);

    const pool = document.createElement("div");
    pool.className = "puzzle-pieces-pool";
    const shuffled = shuffle(qData.choices);

    shuffled.forEach(c => {
      const piece = document.createElement("div");
      piece.className = "puzzle-piece";
      piece.innerHTML = `🧩 <span>${c.txt}</span>`;
      piece.onclick = () => {
        if (hasAnsweredCurrent) return;
        hasAnsweredCurrent = true;
        playSnap();
        slot.classList.add("snapped");
        slot.innerHTML = `✅ 已吸附：<b>${c.txt}</b>`;
        if (c.cor) {
          totalScore++;
          showFeedback("🎉", qData.tip);
        } else {
          mistakeLogs.push(`【第2关】${qData.q}`);
          showFeedback("💡", `小提示：选择“${qData.choices.find(x=>x.cor).txt}”才是最默契的合作！`);
        }
        document.getElementById("btnNext").style.display = "inline-block";
      };
      pool.appendChild(piece);
    });
    container.appendChild(pool);
  }

  function renderFeedMechanic(container, qData) {
    const food = document.createElement("div");
    food.className = "feeding-food-card";
    food.innerText = qData.sub;
    container.appendChild(food);

    const bins = document.createElement("div");
    bins.className = "feeding-monsters-wrap";

    const binGood = document.createElement("div");
    binGood.className = "monster-bin";
    binGood.innerHTML = `<div style="font-size:38px;">🐱</div><b>分工合作小猫</b><small style="color:#2E7D32;">投喂我！</small>`;

    const binBad = document.createElement("div");
    binBad.className = "monster-bin";
    binBad.innerHTML = `<div style="font-size:38px;">🐶</div><b>独霸争吵小狗</b><small style="color:#C62828;">不要学！</small>`;

    binGood.onclick = () => handleFeedAction(true, qData, binGood, food);
    binBad.onclick = () => handleFeedAction(false, qData, binBad, food);

    bins.appendChild(binGood);
    bins.appendChild(binBad);
    container.appendChild(bins);
  }

  function handleFeedAction(userChoseGood, qData, targetBin, foodEl) {
    if (hasAnsweredCurrent) return;
    hasAnsweredCurrent = true;
    playPop();
    targetBin.classList.add("mouth-open");
    foodEl.style.transition = "all 0.3s";
    foodEl.style.transform = "scale(0.2)";
    foodEl.style.opacity = "0";

    setTimeout(() => {
      targetBin.classList.remove("mouth-open");
      if (userChoseGood === qData.isGood) {
        playSnap();
        totalScore++;
        showFeedback("😋", `投喂正确！${qData.tip}`);
      } else {
        mistakeLogs.push(`【第3关】${qData.q}`);
        showFeedback("💡", `没关系！${qData.tip}`);
      }
      document.getElementById("btnNext").style.display = "inline-block";
    }, 300);
  }

  function renderBubbleMechanic(container, qData) {
    const bubbleArea = document.createElement("div");
    bubbleArea.className = "bubbles-area";
    const shuffled = shuffle(qData.bubbles);

    shuffled.forEach(b => {
      const bubble = document.createElement("div");
      bubble.className = "bubble-item";
      bubble.innerText = b.txt;
      bubble.onclick = () => {
        if (hasAnsweredCurrent) return;
        hasAnsweredCurrent = true;
        playPop();
        bubble.classList.add("popped");
        if (b.cor) {
          playSnap();
          totalScore++;
          showFeedback("🫧", `啪！泡泡破裂：${qData.tip}`);
        } else {
          mistakeLogs.push(`【第4关】${qData.q}`);
          showFeedback("💡", `泡泡飞走啦！其实“${qData.bubbles.find(x=>x.cor).txt}”才是最好的选择！`);
        }
        document.getElementById("btnNext").style.display = "inline-block";
      };
      bubbleArea.appendChild(bubble);
    });
    container.appendChild(bubbleArea);
  }

  function renderStackMechanic(container, qData) {
    const castleZone = document.createElement("div");
    castleZone.className = "castle-building-zone";

    castleBricksBuilt.forEach(txt => {
      const b = document.createElement("div");
      b.className = "castle-brick";
      b.innerText = `🧱 ${txt}`;
      castleZone.appendChild(b);
    });
    container.appendChild(castleZone);

    const choicesWrap = document.createElement("div");
    choicesWrap.style.width = "100%";
    choicesWrap.style.display = "flex";
    choicesWrap.style.flexDirection = "column";
    choicesWrap.style.gap = "8px";
    choicesWrap.style.marginTop = "6px";

    const shuffled = shuffle(qData.choices);
    shuffled.forEach(c => {
      const btn = document.createElement("button");
      btn.className = "tool-card";
      btn.style.maxWidth = "100%";
      btn.style.width = "100%";
      btn.innerHTML = `🧱 <span>${c.txt}</span>`;
      btn.onclick = () => {
        if (hasAnsweredCurrent) return;
        hasAnsweredCurrent = true;
        btn.classList.add("selected");
        playPop();
        if (c.cor) {
          playSnap();
          totalScore++;
          castleBricksBuilt.push(c.txt);
          const newBrick = document.createElement("div");
          newBrick.className = "castle-brick";
          newBrick.innerText = `🧱 ${c.txt}`;
          castleZone.appendChild(newBrick);
          showFeedback("🏰", qData.tip);
        } else {
          mistakeLogs.push(`【第5关】${qData.q}`);
          showFeedback("💡", `加油！正确誓词积木是：“${qData.choices.find(x=>x.cor).txt}”！`);
        }
        document.getElementById("btnNext").style.display = "inline-block";
      };
      choicesWrap.appendChild(btn);
    });
    container.appendChild(choicesWrap);
  }

  function showFeedback(emoji, text) {
    const hint = document.getElementById("feedbackHint");
    document.getElementById("hintEmoji").innerText = emoji;
    document.getElementById("hintText").innerText = text;
    hint.classList.add("show");
    document.getElementById("scoreBadge").innerText = `⭐ 分数: ${totalScore}`;
  }

  function nextStep() {
    playPop();
    currQIdx++;
    if (currQIdx >= 5) {
      currLvlIdx++;
      currQIdx = 0;
    }

    if (currLvlIdx >= GAME_LEVELS.length) {
      finishAllLevels();
    } else {
      renderCurrentQuestion();
    }
  }

  function finishAllLevels() {
    playFanfare();
    launchConfetti();

    document.getElementById("progressFill").style.width = "100%";
    document.getElementById("viewGame").style.display = "none";
    document.getElementById("viewResult").style.display = "flex";

    const diffSec = Math.floor((new Date() - startTime) / 1000);
    const m = String(Math.floor(diffSec / 60)).padStart(2, '0');
    const s = String(diffSec % 60).padStart(2, '0');
    const timeSpent = `${m}分${s}秒`;

    document.getElementById("resultScore").innerText = `${totalScore} / 25`;
    document.getElementById("resultTime").innerText = `⏱️ 闯关总用时：${timeSpent}`;

    let stars = "⭐⭐⭐";
    let title = "卓越！你是最出色的班级团结合作小标兵！🎉";
    if (totalScore < 18) {
      stars = "⭐";
      title = "继续加油！多体会分工的快乐，你会更棒！🌱";
    } else if (totalScore < 23) {
      stars = "⭐⭐";
      title = "非常优秀！懂得互帮互助、团结友爱！🌸";
    }
    document.getElementById("resultStars").innerText = stars;
    document.getElementById("resultTitle").innerText = title;

    if (mistakeLogs.length > 0) {
      document.getElementById("mistakeBox").style.display = "block";
      document.getElementById("mistakeItems").innerHTML = mistakeLogs.map(m => `<div>• ${m}</div>`).join("");
    }

    window.gamePayload = {
      name: studentName,
      studentClass: studentClass,
      score: totalScore,
      total: 25,
      percentage: Math.round((totalScore / 25) * 100),
      timeSpent: timeSpent,
      mistakes: mistakeLogs.length > 0 ? mistakeLogs.join(" | ") : "全对！太棒了！"
    };
  }

  /* 兼容双模式自动上传：优先 google.script.run，其次使用 GAS_ENDPOINT_URL */
  function submitScoreData() {
    const btn = document.getElementById("btnSubmitScore");
    const tip = document.getElementById("submitTip");
    btn.disabled = true;
    btn.innerText = "⏳ 正在传输成绩...";

    // 模式 1：运行在 GAS 原生环境
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(res => {
          btn.innerText = "✔️ 成绩已成功提交";
          tip.innerText = "🎉 耶！成绩已经记录到老师的 Google Sheet 啦！";
        })
        .withFailureHandler(err => {
          btn.disabled = false;
          btn.innerText = "重新尝试提交";
          tip.innerText = "⚠️ 提交遇到问题，请检查网络。";
        })
        .recordScore(window.gamePayload);
      return;
    }

    // 模式 2：运行在 GitHub Pages 外部静态环境
    if (GAS_ENDPOINT_URL && !GAS_ENDPOINT_URL.includes("AKfycb...")) {
      fetch(GAS_ENDPOINT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(window.gamePayload)
      }).then(() => {
        btn.innerText = "✔️ 成绩已成功提交";
        tip.innerText = "🎉 耶！成绩已经通过 Web App 记录到 Google Sheet 啦！";
      }).catch(err => {
        btn.disabled = false;
        btn.innerText = "重新尝试提交";
        tip.innerText = "⚠️ 网络传输中断，请重试。";
      });
      return;
    }

    // 模式 3：本地未配置链接的测试模式
    setTimeout(() => {
      btn.innerText = "✔️ 本地测试完成";
      tip.innerText = "✅ 本地测试运行正常（部署到 GAS 或填写有效 URL 后将自动写入表格）。";
    }, 500);
  }

  function launchConfetti() {
    const canvas = document.getElementById("confetti-canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = canvas.parentElement.offsetWidth;
    canvas.height = canvas.parentElement.offsetHeight;
    const pieces = Array.from({length: 80}, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height,
      size: Math.random() * 8 + 4,
      color: ["#4CAF50", "#FFEB3B", "#FF9800", "#03A9F4", "#E91E63"][Math.floor(Math.random()*5)],
      speed: Math.random() * 3 + 2,
      tilt: Math.random() * 6 - 3
    }));

    let f = 0;
    function run() {
      ctx.clearRect(0,0,canvas.width,canvas.height);
      pieces.forEach(p => {
        p.y += p.speed;
        p.x += Math.sin(f/10 + p.tilt);
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
      f++;
      if (f < 180) requestAnimationFrame(run);
      else ctx.clearRect(0,0,canvas.width,canvas.height);
    }
    run();
  }
</script>
