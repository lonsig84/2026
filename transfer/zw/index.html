<!DOCTYPE html>
<html lang="zh-CN">
<head>q
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星空弹幕留言墙</title>
  
  <!-- 引入 Tailwind CSS (用于快速写样式) -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 引入 React 和 ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- 引入 Babel (用于在浏览器中解析 JSX 语法) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <!-- React 应用将渲染到这里 -->
  <div id="root"></div>

  <!-- 在 script 标签中编写 React 代码，设置 type="text/babel" -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==========================================
    // 🎈 配置区域 (你可以在这里修改你的本地资源)
    // ==========================================
    // 上传到 GitHub 后，你可以把这些链接换成你本地的相对路径，例如：'./images/photo1.jpg'
    const SAMPLE_PHOTOS = [
      "https://images.unsplash.com/photo-1529333166437-7750a6dd5a70?w=1000&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1511895426328-dc8714191300?w=1000&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1544928147-79a2dbc1f389?w=1000&auto=format&fit=crop",
      "https://images.unsplash.com/photo-1506869640319-fea1a2ab8e40?w=1000&auto=format&fit=crop"
    ];

    // 替换为你的背景音乐链接 (上传 GitHub 后换成 './music/bgm.mp3')
    const BGM_URL = "https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3"; 

    // 替换为你部署好的 GAS 接口 URL
    const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwQJ4vn80_2wFI3U9IBXofJD2NKNQp5jk30BlZOXDd_nnv9J7INMU0P6potDZq3wC3V/exec"; 

    // 弹幕颜色库
    const DANMAKU_COLORS = [
      '#FFFFFF', '#FFD1DC', '#E0BBE4', '#957DAD', '#D291BC', 
      '#FEC8D8', '#FFDFD3', '#F3EAC2', '#A8E6CF', '#DCEDC1'
    ];

    // SVG 图标组件 (替换了原有的外部图标库)
    const PlayIcon = () => (
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    );
    const HeartIcon = ({ className }) => (
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" className={className}><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
    );
    const SparklesIcon = ({ className }) => (
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M12 3v3m0 12v3m9-9h-3M6 12H3m14.485-6.364l-2.121 2.121M7.636 17.657l-2.121 2.121M16.485 17.657l-2.121-2.121M7.636 6.364l-2.121-2.121"/></svg>
    );

    function App() {
      const [isStarted, setIsStarted] = useState(false);
      const [nameInput, setNameInput] = useState('');
      const [messageInput, setMessageInput] = useState('');
      const [messages, setMessages] = useState([
        "同学，祝你前程似锦！🌟", 
        "常联系，友谊长存~", 
        "新的学校也要加油哦！", 
        "舍不得你，一切顺利！",
        "不要忘记我们哦！",
        "未来可期，顶峰相见！🎓"
      ]);
      const [photoIndex, setPhotoIndex] = useState(0);
      const audioRef = useRef(null);

      // 照片轮播逻辑
      useEffect(() => {
        if (!isStarted) return;
        const timer = setInterval(() => {
          setPhotoIndex(prev => {
            let next = Math.floor(Math.random() * SAMPLE_PHOTOS.length);
            while (next === prev && SAMPLE_PHOTOS.length > 1) {
              next = Math.floor(Math.random() * SAMPLE_PHOTOS.length);
            }
            return next;
          });
        }, 5000); 
        return () => clearInterval(timer);
      }, [isStarted]);

      // 从 Google Sheets 拉取留言
      useEffect(() => {
        if (!isStarted || !GAS_API_URL) return;
        
        const fetchMessages = async () => {
          try {
            const response = await fetch(GAS_API_URL);
            const data = await response.json();
            if (data && data.length > 0) {
              const formattedMessages = data.map(item => `${item.name}: ${item.message}`);
              setMessages(prev => [...prev, ...formattedMessages]);
            }
          } catch (error) {
            console.error("无法获取最新留言:", error);
          }
        };

        fetchMessages();
        const interval = setInterval(fetchMessages, 30000); 
        return () => clearInterval(interval);
      }, [isStarted]);

      const handleStart = () => {
        setIsStarted(true);
        if (audioRef.current) {
          audioRef.current.play().catch(e => console.log("Audio play failed:", e));
        }
      };

      const handleSubmit = (e) => {
        e.preventDefault();
        if (nameInput.trim() && messageInput.trim()) {
          const newMsg = `${nameInput}: ${messageInput}`;
          // 将刚提交的留言加入弹幕池，并多放几遍以确保马上能看到
          setMessages(prev => [newMsg, newMsg, ...prev]);
          
          // 【更新】：用表单(Form)的形式发送数据，避开跨域拦截
          if (GAS_API_URL) {
            const formData = new URLSearchParams();
            formData.append('name', nameInput.trim());
            formData.append('message', messageInput.trim());

            fetch(GAS_API_URL, {
              method: 'POST',
              body: formData,
              mode: 'no-cors' // 关键代码：告诉浏览器忽略 CORS 跨域报错
            }).then(() => {
              console.log('留言发送请求已发出');
            }).catch(err => {
              console.log('留言发送出错:', err);
            });
          }
          
          handleStart();
        }
      };

      const renderParticles = () => {
        // 生成静态闪烁的星星
        const stars = Array.from({ length: 120 }).map((_, i) => {
          const style = {
            left: `${Math.random() * 100}vw`,
            top: `${Math.random() * 100}vh`,
            width: `${Math.random() * 3 + 1}px`,
            height: `${Math.random() * 3 + 1}px`,
            animationDuration: `${Math.random() * 4 + 2}s`,
            animationDelay: `${Math.random() * 5}s`,
          };
          return <div key={`star-${i}`} className="star" style={style} />;
        });

        // 生成动态流星
        const meteors = Array.from({ length: 15 }).map((_, i) => {
          const style = {
            top: `${Math.random() * -50}vh`,
            left: `${Math.random() * 100 + 50}vw`, // 从偏右上方开始划过
            animationDuration: `${Math.random() * 3 + 2}s`,
            animationDelay: `${Math.random() * 15}s`,
          };
          return <div key={`meteor-${i}`} className="meteor" style={style} />;
        });

        return <>{stars}{meteors}</>;
      };

      const renderDanmaku = () => {
        const displayMessages = [...messages, ...messages, ...messages];
        
        return displayMessages.map((msg, index) => {
          const topPos = Math.random() * 85 + 5; 
          const duration = Math.random() * 15 + 10; 
          const delay = Math.random() * -20; 
          const fontSize = Math.random() * 10 + 18; 
          const color = DANMAKU_COLORS[Math.floor(Math.random() * DANMAKU_COLORS.length)];

          const style = {
            top: `${topPos}%`,
            animationDuration: `${duration}s`,
            animationDelay: `${delay}s`,
            fontSize: `${fontSize}px`,
            color: color,
            zIndex: 10
          };

          return (
            <div key={`danmaku-${index}`} className="danmaku-item" style={style}>
              {msg}
            </div>
          );
        });
      };

      return (
        <div className="relative w-full h-screen overflow-hidden bg-gradient-to-br from-[#0f172a] via-[#311042] to-[#0f172a] font-sans selection:bg-pink-500 selection:text-white">
          <style>{`
            @keyframes twinkle {
              0%, 100% { opacity: 0.1; transform: scale(0.5); }
              50% { opacity: 1; transform: scale(1.2); box-shadow: 0 0 10px #fff; }
            }
            .star {
              position: absolute;
              background: #fff;
              border-radius: 50%;
              animation: twinkle ease-in-out infinite;
              pointer-events: none;
              z-index: 1;
            }
            @keyframes meteor {
              0% { transform: translate(0, 0) rotate(-45deg); opacity: 1; }
              100% { transform: translate(-200vw, 200vh) rotate(-45deg); opacity: 0; }
            }
            .meteor {
              position: absolute;
              width: 150px;
              height: 2px;
              background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,1) 100%);
              animation: meteor linear infinite;
              pointer-events: none;
              z-index: 2;
            }
            .meteor::before {
              content: '';
              position: absolute;
              right: 0;
              width: 4px;
              height: 4px;
              border-radius: 50%;
              background: #fff;
              box-shadow: 0 0 10px 2px #fff;
              transform: translateY(-1px);
            }
            @keyframes slideLeft {
              from { left: 100%; transform: translateX(0); }
              to { left: -100%; transform: translateX(-100%); }
            }
            .danmaku-item {
              position: absolute;
              white-space: nowrap;
              font-weight: 500;
              text-shadow: 0px 0px 8px rgba(0,0,0,0.8), 2px 2px 4px rgba(0,0,0,0.5);
              animation: slideLeft linear infinite;
              will-change: transform, left;
              pointer-events: none;
            }
            .photo-frame {
              box-shadow: 0 0 40px rgba(236, 72, 153, 0.4), 0 0 80px rgba(139, 92, 246, 0.2);
            }
          `}</style>

          <audio ref={audioRef} src={BGM_URL} loop />

          {renderParticles()}

          {!isStarted && (
            <div className="absolute inset-0 z-50 flex flex-col items-center justify-center bg-black/40 backdrop-blur-sm transition-opacity duration-1000 p-4">
              {/* 玻璃拟态留言卡片 */}
              <div className="w-full max-w-xl bg-white/10 backdrop-blur-md rounded-3xl p-8 md:p-10 border border-white/20 shadow-2xl relative overflow-hidden">
                
                {/* 装饰发光背景 */}
                <div className="absolute -top-20 -left-20 w-40 h-40 bg-pink-500/30 rounded-full blur-3xl pointer-events-none"></div>
                <div className="absolute -bottom-20 -right-20 w-40 h-40 bg-blue-500/30 rounded-full blur-3xl pointer-events-none"></div>

                <div className="text-center space-y-4 mb-8 relative z-10">
                  <h1 className="text-3xl md:text-4xl text-white font-medium tracking-wider flex items-center justify-center gap-3">
                    <SparklesIcon className="text-pink-400 w-8 h-8" />
                    梓文同学转校了
                    <SparklesIcon className="text-blue-400 w-8 h-8" />
                  </h1>
                  <p className="text-pink-200 text-lg md:text-xl font-light">
                    大家有什么话对他说？
                  </p>
                  <p className="text-gray-300 text-sm font-light tracking-widest">
                    一样来制作这美好的回忆吧！
                  </p>
                </div>

                <form onSubmit={handleSubmit} className="space-y-5 relative z-10">
                  <div>
                    <input 
                      type="text" 
                      placeholder="你的姓名"
                      value={nameInput}
                      onChange={(e) => setNameInput(e.target.value)}
                      required
                      className="w-full px-5 py-4 bg-black/30 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-pink-400 focus:ring-1 focus:ring-pink-400 transition-all text-lg"
                    />
                  </div>
                  <div>
                    <textarea 
                      placeholder="写下你想对他说的话..."
                      value={messageInput}
                      onChange={(e) => setMessageInput(e.target.value)}
                      required
                      rows="3"
                      className="w-full px-5 py-4 bg-black/30 border border-white/20 rounded-xl text-white placeholder-gray-400 focus:outline-none focus:border-pink-400 focus:ring-1 focus:ring-pink-400 transition-all resize-none text-lg"
                    ></textarea>
                  </div>
                  
                  <button 
                    type="submit"
                    className="w-full group relative px-8 py-4 bg-gradient-to-r from-pink-500/80 to-purple-500/80 hover:from-pink-500 hover:to-purple-500 border border-white/30 rounded-xl text-white text-lg transition-all duration-300 overflow-hidden flex items-center justify-center gap-3 shadow-[0_0_20px_rgba(236,72,153,0.3)] mt-4"
                  >
                    <span className="relative z-10 flex items-center gap-2">
                      <PlayIcon />
                      <span className="tracking-wider">留言给他，开启回忆</span>
                    </span>
                  </button>
                </form>
              </div>
            </div>
          )}

          {isStarted && (
            <>
              <div className="absolute inset-0 z-20 overflow-hidden pointer-events-none">
                {renderDanmaku()}
              </div>

              <div className="absolute inset-0 z-10 flex items-center justify-center pointer-events-none">
                <div className="relative w-4/5 max-w-2xl aspect-[4/3] rounded-2xl overflow-hidden photo-frame transition-transform duration-1000 hover:scale-105">
                  {SAMPLE_PHOTOS.map((photo, index) => (
                    <img
                      key={index}
                      src={photo}
                      alt="Memories"
                      className={`absolute inset-0 w-full h-full object-cover transition-opacity duration-2000 ease-in-out ${
                        index === photoIndex ? 'opacity-100 scale-100' : 'opacity-0 scale-110'
                      }`}
                      style={{ transitionProperty: 'opacity, transform' }}
                    />
                  ))}
                  <div className="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>
                </div>
              </div>

              <div className="absolute bottom-6 right-6 z-30 flex items-center gap-2 text-white/50 bg-black/20 px-4 py-2 rounded-full backdrop-blur-md text-sm font-light">
                <HeartIcon className="text-pink-500 animate-bounce" />
                <span>Forever Memories</span>
              </div>
            </>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
