<!DOCTYPE html>
<html lang="zh-MY">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 一年级科学大挑战 🌟</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* 核心设定：动态渐变呼吸背景，锁死屏幕高度 */
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif; 
            margin: 0;
            padding: 0;
            height: 100vh; 
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; 
            
            /* 魔法变色背景设定 */
            background: linear-gradient(45deg, #FFE5F1, #E0F7FA, #FFF9C4, #E8F5E9);
            background-size: 400% 400%;
            animation: gradientBG 12s ease infinite; /* 12秒完成一次颜色循环 */
        }

        /* 控制背景变色的动画关键帧 */
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #quiz-container {
            background-color: rgba(255, 255, 255, 0.95); /* 稍微变半透明一点，透出后面的彩虹色 */
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 20px;
            width: 92%;
            max-width: 700px;
            height: 92vh; 
            box-sizing: border-box;
            text-align: center;
            border: 8px solid #FFD700; 
            display: flex;
            flex-direction: column;
        }

        #student-info-screen, #result-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #question-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
        }

        .question-text {
            font-size: 28px; 
            font-weight: bold;
            color: #2C3E50;
            margin: 10px 0;
            line-height: 1.3;
        }

        .question-image {
            max-width: 100%;
            max-height: 35vh; 
            object-fit: contain; 
            border-radius: 15px;
            margin: 0 auto 10px auto;
            border: 4px dashed #4ECDC4; 
        }

        #options-container {
            display: grid;
            grid-template-columns: 1fr 1fr; 
            gap: 15px; 
            margin-bottom: 10px;
        }

        /* 选项按钮基础形态 */
        .option-btn {
            width: 100%;
            padding: 15px 5px; 
            font-size: 26px; 
            font-weight: bold;
            font-family: inherit;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-btn:active {
            transform: translateY(6px); 
        }

        /* 🔥 分配四种不同的专属颜色 🔥 */
        
        /* 选项1: 西瓜红 */
        .option-btn:nth-child(1) { background-color: #FF6B6B; box-shadow: 0 6px 0 #C0392B; }
        .option-btn:nth-child(1):active { box-shadow: 0 0px 0 #C0392B; }

        /* 选项2: 晴空蓝 */
        .option-btn:nth-child(2) { background-color: #4DABF7; box-shadow: 0 6px 0 #228BE6; }
        .option-btn:nth-child(2):active { box-shadow: 0 0px 0 #228BE6; }
        
        /* 选项3: 草地绿 */
        .option-btn:nth-child(3) { background-color: #51CF66; box-shadow: 0 6px 0 #2B8A3E; }
        .option-btn:nth-child(3):active { box-shadow: 0 0px 0 #2B8A3E; }

        /* 选项4: 活力橙 */
        .option-btn:nth-child(4) { background-color: #FF922B; box-shadow: 0 6px 0 #D9480F; }
        .option-btn:nth-child(4):active { box-shadow: 0 0px 0 #D9480F; }


        input[type="text"] {
            width: 90%;
            padding: 15px;
            font-size: 24px;
            margin-bottom: 20px;
            border: 3px solid #4DABF7;
            border-radius: 15px;
            text-align: center;
            box-sizing: border-box;
        }

        #score-display {
            font-size: 50px;
            color: #FF1493;
            font-weight: bold;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <audio id="sound-correct" src="你的正确音效链接.mp3"></audio>
    <audio id="sound-wrong" src="你的错误音效链接.mp3"></audio>
    <audio id="sound-cheer" src="你的欢呼音效链接.mp3"></audio>

    <div id="quiz-container">
        <div id="student-info-screen">
            <h1 style="color: #FF6B6B; font-size: 36px;">欢迎来到科学大挑战！🚀</h1>
            <input type="text" id="student-name" placeholder="请输入你的名字 (英文/拼音)" required>
            <input type="text" id="student-class" placeholder="请输入你的班级 (例如: 1M)" required>
            <button class="option-btn" style="background-color: #FFD700; color: #D35400; box-shadow: 0 6px 0 #F39C12;" onclick="startQuiz()">开始挑战！</button>
        </div>

        <div id="question-screen" class="hidden">
            <div id="progress" style="font-size: 20px; color: #888; margin-bottom: 10px;"></div>
            <img id="q-image" class="question-image hidden" src="" alt="题目图片">
            <div id="q-text" class="question-text">题目加载中...</div>
            <div id="options-container"></div>
        </div>

        <div id="result-screen" class="hidden">
            <h2>挑战结束！🎉</h2>
            <p>你的得分是：</p>
            <div id="score-display">0 / 0</div>
            <p id="upload-status" style="font-size: 20px; color: #2B8A3E; margin-top: 20px;">正在把成绩变魔术飞给老师... 🕊️</p>
        </div>
    </div>

    <script>
        // ======= 1. 题库设置 =======
        const originalQuestions = [
            { question: "图中的孩子是应用哪项官能进行观察？", image_url: "./03.png", options: ["嗅觉", "听觉", "触觉", "味觉"], answer: "味觉" },
            { question: "图中物品的味道是什么？", image_url: "./04.png", options: ["甜", "酸", "咸", "苦"], answer: "咸" },
            { question: "利用味觉来观察图中的食物，它的味道是", image_url: "./05.png", options: ["甜", "酸", "咸", "苦"], answer: "酸" },
            { question: "舌头尝了这食物的味道是什么？", image_url: "./07.png", options: ["咸", "苦", "酸", "甜"], answer: "甜" },
            { question: "图中的人利用哪项沟通方法？", image_url: "./08.png", options: ["书写", "绘图", "口述", "信息与通讯技术"], answer: "信息与通讯技术" },
            { question: "图中说明了生物", image_url: "./14.png", options: ["会繁殖", "需要水", "会移动", "会成长"], answer: "会成长" },
            { question: "图中的动物名称是", image_url: "./15.png", options: ["水牛", "河马", "犀牛", "大象"], answer: "犀牛" },
            { question: "图中显示一种动物的某身体部位，它的名称是什么？", image_url: "./16.png", options: ["羽毛", "尾巴", "外壳", "毛发"], answer: "外壳" },
            { question: "北极熊的毛发的功能是什么？", image_url: "./17.png", options: ["保护自己", "保暖", "飞行", "对抗敌人"], answer: "保暖" },
            { question: "哪种动物有毛发？", image_url: "", options: ["鱼", "骆驼", "犀牛", "蛇"], answer: "骆驼" },
            { question: "图中显示某动物的身体部位，其功用是什么？", image_url: "./20.png", options: ["保暖", "保护自己", "嗅气味", "游泳"], answer: "游泳" },
            { question: "哪种植物不会开花？", image_url: "", options: ["羊角豆", "大红花", "仙人掌", "羊齿植物"], answer: "羊齿植物" },
            { question: "图中植物的部分有什么功能？", image_url: "./22.png", options: ["呼吸", "制造食物", "输送水、食物及养料", "吸收水分及养料"], answer: "吸收水分及养料" },
            { question: "图中植物的叶子是什么叶脉？", image_url: "./24.png", options: ["平行叶脉", "网状叶脉"], answer: "平行叶脉" },
            { question: "图中植物的名称是什么？", image_url: "./27.png", options: ["木槿", "苔藓", "木瓜", "玫瑰"], answer: "玫瑰" },
            { question: "图中的生物说明了什么？", image_url: "./28.png", options: ["生物会繁殖", "生物会呼吸", "生物会成长", "生物会移动"], answer: "生物会繁殖" },
            { question: "以下的植物都不会开花，除了", image_url: "", options: ["苔藓", "木槿", "鸟巢蕨", "羊齿植物"], answer: "木槿" },
            { question: "什么是生物？", image_url: "", options: ["有生命的东西", "会飞行的东西", "能发出声音的东西", "不会长大的东西"], answer: "有生命的东西" },
            { question: "如果长时间不浇水，植物会怎样？", image_url: "", options: ["植物会长高", "植物会枯死", "植物会变绿", "植物会开花"], answer: "植物会枯死" },
            { question: "哪两个感觉器官可以确认物体的形状？", image_url: "", options: ["舌头和鼻子", "耳朵和眼睛", "眼睛和皮肤", "鼻子和皮肤"], answer: "眼睛和皮肤" }
        ];

        // ======= 2. 核心逻辑 =======
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let studentData = {};

        // 这是你专属的 Google Apps Script 网址
        const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwpC4b8Ksp0jSOMQBH4gk0s_fB9UyNby_avoJZuuHhttUpcASacafdbrRpAg1ZUZCXy/exec";

        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startQuiz() {
            const name = document.getElementById('student-name').value.trim();
            const cls = document.getElementById('student-class').value.trim();
            
            if(!name || !cls) {
                alert("小朋友，要填好名字和班级才能开始哦！");
                return;
            }

            studentData = { name: name, class: cls };
            questions = shuffleArray(originalQuestions);
            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('student-info-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('progress').innerText = `第 ${currentQuestionIndex + 1} 题 / 共 ${questions.length} 题`;
            document.getElementById('q-text').innerText = q.question;
            
            const imgElement = document.getElementById('q-image');
            if(q.image_url) {
                imgElement.src = q.image_url;
                imgElement.classList.remove('hidden');
            } else {
                imgElement.classList.add('hidden');
            }

            const shuffledOptions = shuffleArray(q.options);
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.answer);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if(selected === correct) {
                score += 1;
                // document.getElementById('sound-correct').play(); 
                triggerMiniConfetti(); 
            } else {
                // document.getElementById('sound-wrong').play(); 
            }

            currentQuestionIndex++;
            if(currentQuestionIndex < questions.length) {
                setTimeout(showQuestion, 500); 
            } else {
                showResult();
            }
        }

        function triggerMiniConfetti() {
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
        }

        function showResult() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-display').innerText = `${score} / ${questions.length}`;
            
            // document.getElementById('sound-cheer').play(); 
            
            var duration = 3000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff0000', '#00ff00', '#0000ff'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff0000', '#00ff00', '#0000ff'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());

            sendDataToGoogleSheet();
        }

        function sendDataToGoogleSheet() {
            if(GAS_WEB_APP_URL === "你的_GOOGLE_APPS_SCRIPT_网址") {
                document.getElementById('upload-status').innerText = "提示：老师还没配置好 Google Sheet 链接哦。";
                return;
            }

            const payload = {
                name: studentData.name,
                class: studentData.class,
                score: score,
                total: questions.length,
                timestamp: new Date().toLocaleString('zh-MY')
            };

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', 
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById('upload-status').innerText = "✅ 成绩上传成功！你真棒！";
            })
            .catch((error) => {
                document.getElementById('upload-status').innerText = "❌ 哎呀，网络好像有点问题，成绩没传上去。";
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
