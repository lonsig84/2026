<!DOCTYPE html>
<html lang="zh-MY">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌟 一年级科学大挑战 🌟</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* 核心设定：大号印刷体，鲜艳背景 */
        body {
            /* 使用标准清晰的黑体/印刷体 */
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif; 
            background-color: #FFE5F1; /* 鲜艳的马卡龙粉红背景 */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #quiz-container {
            background-color: #FFFFFF;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            padding: 30px;
            width: 90%;
            max-width: 600px;
            text-align: center;
            border: 8px solid #FFD700; /* 明黄色的粗边框 */
        }

        /* 题目文字：超大号，深蓝色保护视力 */
        .question-text {
            font-size: 32px; 
            font-weight: bold;
            color: #2C3E50;
            margin-bottom: 25px;
            line-height: 1.4;
        }

        /* 图片样式 */
        .question-image {
            max-width: 100%;
            height: auto;
            border-radius: 15px;
            margin-bottom: 20px;
            border: 4px dashed #4ECDC4; /* 可爱的青色虚线边框 */
        }

        /* 选项按钮：极其鲜艳，大号文字 */
        .option-btn {
            display: block;
            width: 100%;
            padding: 20px;
            margin-bottom: 15px;
            font-size: 28px; /* 超大选项文字 */
            font-weight: bold;
            font-family: inherit;
            color: white;
            background-color: #FF6B6B; /* 鲜艳的西瓜红 */
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 #C0392B; /* 立体按钮效果 */
            transition: all 0.1s ease;
        }

        .option-btn:active {
            transform: translateY(6px); /* 按下时的 Q 弹效果 */
            box-shadow: 0 0px 0 #C0392B;
        }

        /* 选项颜色的交替，让视觉更丰富 */
        .option-btn:nth-child(even) { background-color: #4DABF7; box-shadow: 0 6px 0 #228BE6; }
        .option-btn:nth-child(even):active { box-shadow: 0 0 0 #228BE6; }
        
        .option-btn:nth-child(3n) { background-color: #51CF66; box-shadow: 0 6px 0 #2B8A3E; }
        .option-btn:nth-child(3n):active { box-shadow: 0 0 0 #2B8A3E; }

        /* 填资料区域的输入框 */
        input[type="text"] {
            width: 80%;
            padding: 15px;
            font-size: 24px;
            margin-bottom: 20px;
            border: 3px solid #4DABF7;
            border-radius: 15px;
            text-align: center;
        }

        #score-display {
            font-size: 40px;
            color: #FF1493;
            font-weight: bold;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <audio id="sound-correct" src="你的正确音效链接.mp3"></audio>
    <audio id="sound-wrong" src="你的错误音效链接.mp3"></audio>
    <audio id="sound-cheer" src="你的欢呼音效链接.mp3"></audio>

    <div id="quiz-container">
        <div id="student-info-screen">
            <h1 style="color: #FF6B6B; font-size: 36px;">欢迎来到科学大挑战！🚀</h1>
            <input type="text" id="student-name" placeholder="请输入你的名字 (英文/拼音)" required>
            <input type="text" id="student-class" placeholder="请输入你的班级 (例如: 1M)" required>
            <button class="option-btn" style="background-color: #FFD700; color: #D35400; box-shadow: 0 6px 0 #F39C12;" onclick="startQuiz()">开始挑战！</button>
        </div>

        <div id="question-screen" class="hidden">
            <div id="progress" style="font-size: 20px; color: #888; margin-bottom: 10px;"></div>
            <img id="q-image" class="question-image hidden" src="" alt="题目图片">
            <div id="q-text" class="question-text">题目加载中...</div>
            <div id="options-container"></div>
        </div>

        <div id="result-screen" class="hidden">
            <h2>挑战结束！🎉</h2>
            <p>你的得分是：</p>
            <div id="score-display">0 / 0</div>
            <p id="upload-status" style="font-size: 20px; color: #2B8A3E; margin-top: 20px;">正在把成绩变魔术飞给老师... 🕊️</p>
        </div>
    </div>

    <script>
        // ======= 1. 题库设置 (你可以在这里加题目) =======
        // 已经根据你提供的考卷截图提取了部分题目
        const originalQuestions = [
    {
        // Q3
        question: "图中的孩子是应用哪项官能进行观察？",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入吃辣椒男孩的图片链接
        options: ["嗅觉", "听觉", "触觉", "味觉"],
        answer: "味觉"
    },
    {
        // Q4
        question: "图中物品的味道是什么？",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入盐巴的图片链接
        options: ["甜", "酸", "咸", "苦"],
        answer: "咸"
    },
    {
        // Q5
        question: "利用味觉来观察图中的食物，它的味道是",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入酸橙(Lime)的图片链接
        options: ["甜", "酸", "咸", "苦"],
        answer: "酸"
    },
    {
        // Q7
        question: "舌头尝了这食物的味道是什么？",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入糖粉的图片链接
        options: ["咸", "苦", "酸", "甜"],
        answer: "甜"
    },
    {
        // Q8
        question: "图中的人利用哪项沟通方法？",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入用电脑的男孩图片链接
        options: ["书写", "绘图", "口述", "信息与通讯技术"],
        answer: "信息与通讯技术"
    },
    {
        // Q14
        question: "图中说明了生物",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入人类成长过程图片链接
        options: ["会繁殖", "需要水", "会移动", "会成长"],
        answer: "会成长"
    },
    {
        // Q15
        question: "图中的动物名称是",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入犀牛图片链接
        options: ["水牛", "河马", "犀牛", "大象"],
        answer: "犀牛"
    },
    {
        // Q16
        question: "图中显示一种动物的某身体部位，它的名称是什么？",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入蜗牛壳图片链接
        options: ["羽毛", "尾巴", "外壳", "毛发"],
        answer: "外壳"
    },
    {
        // Q17
        question: "北极熊的毛发的功能是什么？",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入北极熊图片链接
        options: ["保护自己", "保暖", "飞行", "对抗敌人"],
        answer: "保暖"
    },
    {
        // Q19 (原卷选项为图片，这里转为文字)
        question: "哪种动物有毛发？",
        image_url: "", // 这题不需要主图
        options: ["鱼", "骆驼", "犀牛", "蛇"],
        answer: "骆驼"
    },
    {
        // Q20
        question: "图中显示某动物的身体部位，其功用是什么？",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入鸭蹼图片链接
        options: ["保暖", "保护自己", "嗅气味", "游泳"],
        answer: "游泳"
    },
    {
        // Q21 (原卷选项为图片，这里转为文字)
        question: "哪种植物不会开花？",
        image_url: "", // 这题不需要主图
        options: ["羊角豆", "大红花", "仙人掌", "羊齿植物"],
        answer: "羊齿植物"
    },
    {
        // Q22
        question: "图中植物的部分有什么功能？",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入植物根部图片链接
        options: ["呼吸", "制造食物", "输送水、食物及养料", "吸收水分及养料"],
        answer: "吸收水分及养料"
    },
    {
        // Q24
        question: "图中植物的叶子是什么叶脉？",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入香蕉树叶图片链接
        options: ["平行叶脉", "网状叶脉"],
        answer: "平行叶脉"
    },
    {
        // Q27
        question: "图中植物的名称是什么？",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入玫瑰图片链接
        options: ["木槿", "苔藓", "木瓜", "玫瑰"],
        answer: "玫瑰"
    },
    {
        // Q28 (修复了原卷选项A和C重复的问题)
        question: "图中的生物说明了什么？",
        image_url: "YOUR_IMAGE_URL_HERE", // 请填入母鸡孵蛋图片链接
        options: ["生物会繁殖", "生物会呼吸", "生物会成长", "生物会移动"],
        answer: "生物会繁殖"
    },
    {
        // Q26
        question: "以下的植物都不会开花，除了",
        image_url: "", // 没有图片
        options: ["苔藓", "木槿", "鸟巢蕨", "羊齿植物"],
        answer: "木槿"
    },
    {
        // Q12
        question: "什么是生物？",
        image_url: "", // 没有图片
        options: ["有生命的东西", "会飞行的东西", "能发出声音的东西", "不会长大的东西"],
        answer: "有生命的东西"
    },
    {
        // Q11
        question: "如果长时间不浇水，植物会怎样？",
        image_url: "", // 没有图片
        options: ["植物会长高", "植物会枯死", "植物会变绿", "植物会开花"],
        answer: "植物会枯死"
    },
    {
        // Q9
        question: "哪两个感觉器官可以确认物体的形状？",
        image_url: "", // 没有图片
        options: ["舌头和鼻子", "耳朵和眼睛", "眼睛和皮肤", "鼻子和皮肤"],
        answer: "眼睛和皮肤"
    }
];

        // ======= 2. 核心逻辑 =======
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let studentData = {};

        // ！！！在这里填入你即将创建的 Google Apps Script Web App URL ！！！
        const GAS_WEB_APP_URL = "你的_GOOGLE_APPS_SCRIPT_网址";

        // 洗牌算法 (Fisher-Yates) - 用于打乱题目和选项
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function startQuiz() {
            const name = document.getElementById('student-name').value.trim();
            const cls = document.getElementById('student-class').value.trim();
            
            if(!name || !cls) {
                alert("小朋友，要填好名字和班级才能开始哦！");
                return;
            }

            studentData = { name: name, class: cls };
            
            // 打乱题目顺序
            questions = shuffleArray(originalQuestions);
            currentQuestionIndex = 0;
            score = 0;

            document.getElementById('student-info-screen').classList.add('hidden');
            document.getElementById('question-screen').classList.remove('hidden');
            
            showQuestion();
        }

        function showQuestion() {
            const q = questions[currentQuestionIndex];
            document.getElementById('progress').innerText = `第 ${currentQuestionIndex + 1} 题 / 共 ${questions.length} 题`;
            document.getElementById('q-text').innerText = q.question;
            
            // 处理图片
            const imgElement = document.getElementById('q-image');
            if(q.image_url) {
                imgElement.src = q.image_url;
                imgElement.classList.remove('hidden');
            } else {
                imgElement.classList.add('hidden');
            }

            // 打乱选项顺序
            const shuffledOptions = shuffleArray(q.options);
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            shuffledOptions.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt, q.answer);
                optionsContainer.appendChild(btn);
            });
        }

        function checkAnswer(selected, correct) {
            if(selected === correct) {
                score += 1;
                // document.getElementById('sound-correct').play(); // 取消注释启用音效
                triggerMiniConfetti(); 
            } else {
                // document.getElementById('sound-wrong').play(); // 取消注释启用音效
            }

            currentQuestionIndex++;
            if(currentQuestionIndex < questions.length) {
                setTimeout(showQuestion, 500); // 稍微延迟一下进入下一题
            } else {
                showResult();
            }
        }

        function triggerMiniConfetti() {
            confetti({ particleCount: 50, spread: 60, origin: { y: 0.8 } });
        }

        function showResult() {
            document.getElementById('question-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('score-display').innerText = `${score} / ${questions.length}`;
            
            // document.getElementById('sound-cheer').play(); // 取消注释启用音效
            
            // 华丽满屏撒花特效！
            var duration = 3000;
            var end = Date.now() + duration;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff0000', '#00ff00', '#0000ff'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#ff0000', '#00ff00', '#0000ff'] });
                if (Date.now() < end) { requestAnimationFrame(frame); }
            }());

            sendDataToGoogleSheet();
        }

        // 利用 Fetch API 自动把数据抛给 Google Sheet
        function sendDataToGoogleSheet() {
            if(GAS_WEB_APP_URL === "你的_GOOGLE_APPS_SCRIPT_网址") {
                document.getElementById('upload-status').innerText = "提示：老师还没配置好 Google Sheet 链接哦。";
                return;
            }

            const payload = {
                name: studentData.name,
                class: studentData.class,
                score: score,
                total: questions.length,
                timestamp: new Date().toLocaleString('zh-MY')
            };

            fetch(GAS_WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors', // 解决跨域问题，但无法读取 response
                cache: 'no-cache',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById('upload-status').innerText = "✅ 成绩上传成功！你真棒！";
            })
            .catch((error) => {
                document.getElementById('upload-status').innerText = "❌ 哎呀，网络好像有点问题，成绩没传上去。";
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
