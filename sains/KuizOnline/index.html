<!DOCTYPE html>
<html lang="zh-MY">
<head>
    <meta charset="UTF-8">

    <title>🌟 一年级科学大挑战 🌟</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* 核心设定：锁死屏幕高度，绝对禁止滚动 */
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif; 
            background-color: #FFE5F1; 
            margin: 0;
            padding: 0;
            height: 100vh; /* 锁死高度为视口(屏幕)的100% */
            overflow: hidden; /* 绝对禁止出现滚动条 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center; /* 让卡片永远在屏幕正中间 */
        }

        #quiz-container {
            background-color: #FFFFFF;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            padding: 20px;
            width: 92%;
            max-width: 700px;
            height: 92vh; /* 卡片高度占据屏幕的92%，留出一点鲜艳的背景边框 */
            box-sizing: border-box;
            text-align: center;
            border: 8px solid #FFD700; 
            display: flex;
            flex-direction: column;
        }

        /* 保证各个界面的内容能在卡片里居中 */
        #student-info-screen, #result-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        /* 答题卡片区域：利用 flex 自动均匀分配上下空间 */
        #question-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between; 
        }

        /* 题目文字：调整间距，紧凑显示 */
        .question-text {
            font-size: 28px; 
            font-weight: bold;
            color: #2C3E50;
            margin: 10px 0;
            line-height: 1.3;
        }

        /* 图片样式：超级关键！限制最大高度为屏幕35%，绝不把选项挤下去 */
        .question-image {
            max-width: 100%;
            max-height: 35vh; 
            object-fit: contain; /* 保证图片完整显示不被裁剪 */
            border-radius: 15px;
            margin: 0 auto 10px auto;
            border: 4px dashed #4ECDC4; 
        }

        /* 选项容器：改成 2x2 的田字格，极其节省空间且容易点击 */
        #options-container {
            display: grid;
            grid-template-columns: 1fr 1fr; /* 左右两列平分 */
            gap: 15px; /* 选项之间的缝隙 */
            margin-bottom: 10px;
        }

        /* 选项按钮：适应田字格，大号文字依然保留 */
        .option-btn {
            width: 100%;
            padding: 15px 5px; 
            font-size: 26px; 
            font-weight: bold;
            font-family: inherit;
            color: white;
            background-color: #FF6B6B; 
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 6px 0 #C0392B; 
            transition: all 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .option-btn:active {
            transform: translateY(6px); 
            box-shadow: 0 0px 0 #C0392B;
        }

        .option-btn:nth-child(even) { background-color: #4DABF7; box-shadow: 0 6px 0 #228BE6; }
        .option-btn:nth-child(even):active { box-shadow: 0 0 0 #228BE6; }
        
        .option-btn:nth-child(3n) { background-color: #51CF66; box-shadow: 0 6px 0 #2B8A3E; }
        .option-btn:nth-child(3n):active { box-shadow: 0 0 0 #2B8A3E; }

        input[type="text"] {
            width: 90%;
            padding: 15px;
            font-size: 24px;
            margin-bottom: 20px;
            border: 3px solid #4DABF7;
            border-radius: 15px;
            text-align: center;
            box-sizing: border-box;
        }

        #score-display {
            font-size: 50px;
            color: #FF1493;
            font-weight: bold;
        }

        .hidden { display: none !important; }
    </style>
</head>

        // 洗牌算法 (Fisher-Yates)
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }
