<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>健康特工队：身体保卫战</title>
  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --secondary: #0ea5e9;
      --accent: #f59e0b;
      --danger: #ef4444;
      --dark: #0f172a;
      --radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #38bdf8, #1e3a8a);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 容器主舞台 */
    .app-window {
      width: 100vw;
      max-width: 860px;
      height: 100vh;
      max-height: 900px;
      background: #f8fafc;
      border-radius: var(--radius);
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      border: 4px solid #ffffff;
    }

    /* 顶部仪表 HUD */
    .hud-bar {
      background: #0f172a;
      color: #f8fafc;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 30;
    }
    .hud-chip {
      background: rgba(255, 255, 255, 0.15);
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 0.88rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .hud-progress-wrap {
      flex: 1;
      height: 10px;
      background: #334155;
      border-radius: 999px;
      margin: 0 12px;
      overflow: hidden;
    }
    .hud-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10b981, #38bdf8);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    /* 按钮通用 */
    .btn-action {
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      color: white;
      border: none;
      padding: 14px 28px;
      font-size: 1.15rem;
      font-weight: 800;
      border-radius: 999px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
      transition: transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      text-decoration: none;
    }
    .btn-action:active { transform: scale(0.96); }

    /* ================= 阶段 1: PPT 研读视窗 ================= */
    #ppt-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding: 12px;
      background: #f1f5f9;
      position: relative;
      overflow: hidden;
    }
    .ppt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 4px 6px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .ppt-title {
      font-size: 1rem;
      font-weight: 800;
      color: #0f172a;
    }
    .ppt-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-fullscreen {
      background: #e0f2fe;
      color: #0369a1;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      border: 1px solid #7dd3fc;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn-fullscreen:hover { background: #bae6fd; }
    .timer-pill {
      background: #fee2e2;
      color: #991b1b;
      padding: 6px 12px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid #f87171;
    }

    /* 课件容器区 */
    .canva-frame-container {
      flex: 1;
      width: 100%;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
      border: 2px solid #cbd5e1;
      background: #ffffff;
      position: relative;
    }
    .canva-frame-container iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    .ppt-footer {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: 10px;
    }

    /* ================= 阶段 2: 20题游戏竞技场 ================= */
    #game-stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      touch-action: none;
    }
    .mission-subhead {
      background: #ffffff;
      padding: 8px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #e2e8f0;
      font-weight: 800;
      font-size: 0.95rem;
    }
    .arena-board {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }

    /* 模式 1: 喂食怪 */
    .monsters-wrap { display: flex; justify-content: space-around; width: 100%; margin-top: 8px; }
    .monster-cell {
      width: 135px; height: 145px; border-radius: 20px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.06); transition: transform 0.2s;
    }
    .m-green { background: #dcfce7; border: 3px solid #22c55e; }
    .m-red { background: #fee2e2; border: 3px solid #ef4444; }
    .m-open { transform: scale(1.12) rotate(-3deg); }

    .food-dock {
      width: 100%; min-height: 110px; border-radius: 18px; border: 3px dashed #cbd5e1;
      background: rgba(255,255,255,0.7); display: flex; justify-content: center; align-items: center;
    }
    .drag-token {
      background: white; border: 3px solid #0ea5e9; border-radius: 18px;
      padding: 12px 20px; font-size: 1.2rem; font-weight: 800; color: #0f172a;
      box-shadow: 0 10px 20px rgba(14,165,233,0.25); cursor: grab; touch-action: none;
    }

    /* 模式 2: 餐盘 */
    .plate-disc {
      width: 260px; height: 260px; background: white; border-radius: 50%;
      border: 8px solid #0ea5e9; box-shadow: 0 16px 36px rgba(0,0,0,0.12);
      display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr;
      overflow: hidden; margin: 8px 0;
    }
    .plate-vege { grid-column: 1/2; grid-row: 1/3; background: #dcfce7; border-right: 3px dashed #22c55e; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #166534; font-weight: 800; font-size: 0.88rem; text-align: center; }
    .plate-carb { grid-column: 2/3; grid-row: 1/2; background: #fef3c7; border-bottom: 3px dashed #f59e0b; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #b45309; font-weight: 800; font-size: 0.82rem; }
    .plate-protein { grid-column: 2/3; grid-row: 2/3; background: #fee2e2; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #991b1b; font-weight: 800; font-size: 0.82rem; }
    .plate-active { filter: brightness(1.2); transform: scale(1.03); }

    /* 模式 3: 血管 */
    .artery-box {
      width: 100%; height: 260px; background: radial-gradient(circle at center, #ffe4e6 0%, #f43f5e 120%);
      border-radius: 20px; border: 4px solid #be123c; display: flex; justify-content: center; align-items: center; position: relative;
    }
    .plaque-token {
      background: #fef08a; border: 3px solid #ca8a04; border-radius: 50%;
      padding: 16px 20px; cursor: pointer; text-align: center; animation: pulse 1.6s infinite ease-in-out;
      box-shadow: 0 10px 24px rgba(0,0,0,0.25);
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.08); } }

    /* 模式 4: 气泡 */
    .bubble-sea {
      width: 100%; height: 260px; background: linear-gradient(180deg, #bae6fd 0%, #e0f2fe 100%);
      border-radius: 20px; border: 4px solid #0284c7; display: flex; justify-content: center; align-items: center;
    }
    .bubble-token {
      background: white; border: 3px solid #0284c7; border-radius: 999px;
      padding: 14px 22px; font-weight: 900; font-size: 1.15rem; color: #0369a1;
      cursor: pointer; box-shadow: 0 10px 24px rgba(2,132,199,0.3);
    }

    /* 底部提示卡 */
    .dock-bar {
      width: 100%; background: white; border-radius: 16px; padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center; border: 2px solid #e2e8f0;
    }

    /* 弹窗遮罩 */
    .overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(6px);
      display: flex; justify-content: center; align-items: center; z-index: 100; padding: 16px;
    }
    .modal-card {
      background: white; border-radius: var(--radius); padding: 30px 24px;
      max-width: 440px; width: 100%; text-align: center; border: 4px solid #38bdf8;
      box-shadow: 0 20px 45px rgba(0,0,0,0.3);
    }
    .modal-card input {
      padding: 12px; font-size: 1.1rem; border: 2px solid #cbd5e1; border-radius: 14px;
      text-align: center; font-weight: 700; width: 100%; margin: 16px 0; outline: none;
    }
    #confetti-cvs { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 200; }
  </style>
</head>
<body>

  <canvas id="confetti-cvs"></canvas>

  <!-- 阶段 0: 登录弹窗 -->
  <div id="login-modal" class="overlay">
    <div class="modal-card">
      <div style="font-size: 4rem;">📖🥗🚀</div>
      <h2 style="font-size: 1.55rem; font-weight: 900; color: #0f172a; margin-top: 6px;">健康特工队：身体保卫战</h2>
      <p style="color: #64748b; font-size: 0.92rem; margin-top: 4px;">第一步：研读课本 PPT ➔ 第二步：解密闯关</p>
      <input type="text" id="ipt-name" placeholder="请输入你的姓名开始挑战" maxlength="20">
      <button class="btn-action" style="width: 100%;" onclick="startReadingPhase()">进入研读 PPT 📖</button>
    </div>
  </div>

  <!-- 主视窗 -->
  <div class="app-window" id="main-window">
    <div class="hud-bar">
      <div class="hud-chip" id="hud-name">👤 特工</div>
      <div class="hud-progress-wrap">
        <div class="hud-progress-fill" id="hud-bar"></div>
      </div>
      <div class="hud-chip" id="hud-score">⭐ 0 分</div>
      <div class="hud-chip" id="hud-stage-num">阶段：阅读课件</div>
    </div>

    <!-- ================= 阶段 1: PPT 视窗 ================= -->
    <div id="ppt-stage" style="display: none;">
      <div class="ppt-header">
        <span class="ppt-title">📑 核心知识研读：饮食多样化与外食风险</span>
        <div class="ppt-header-right">
          <a href="https://www.canva.com/design/DAHX8qgslTg/EsxzpWjWLRQkoidn6XaNUg/view?embed" 
             target="_blank" 
             class="btn-fullscreen">
            ↗️ 新窗口全屏
          </a>
          <div class="timer-pill">
            <span>⏱️ 阅读计时：</span>
            <span id="ppt-timer">00:00</span>
          </div>
        </div>
      </div>

      <div class="canva-frame-container">
        <iframe src="https://www.canva.com/design/DAHX8qgslTg/EsxzpWjWLRQkoidn6XaNUg/view?embed" 
                allowfullscreen="allowfullscreen" 
                allow="fullscreen">
        </iframe>
      </div>

      <div class="ppt-footer">
        <button class="btn-action" onclick="finishReadingAndPlay()">
          ✅ 我已认真阅读完毕，开始闯关！🚀
        </button>
      </div>
    </div>

    <!-- ================= 阶段 2: 20题游戏闯关视窗 ================= -->
    <div id="game-stage" style="display: none;">
      <div class="mission-subhead">
        <span id="mode-text">🍔 玩法加载中</span>
        <span id="game-timer" style="color: #0284c7;">闯关用时 00:00</span>
      </div>

      <div class="arena-board" id="arena-box"></div>

      <div class="dock-bar">
        <div style="font-size: 0.95rem; font-weight: 700; color: #1e293b;" id="tip-desc">观察食材属性，执行特工操作！</div>
        <div style="font-size: 1.15rem; font-weight: 900; color: #f59e0b;" id="combo-box">🔥 x0</div>
      </div>
    </div>
  </div>

  <!-- 阶段 3: 最终结算奖状 -->
  <div id="result-modal" class="overlay" style="display: none;">
    <div class="modal-card">
      <div style="font-size: 4.5rem;" id="res-emoji">🏆</div>
      <h2 style="font-size: 1.6rem; font-weight: 900; color: #0f172a;" id="res-title">特工挑战大获全胜！</h2>
      <div style="font-size: 2.5rem; margin: 6px 0;" id="res-stars">⭐⭐⭐</div>
      <p style="font-size: 1.25rem; font-weight: 800; color: #10b981;" id="res-score">最终战绩：100 分</p>
      
      <div style="margin: 12px 0; background: #f8fafc; padding: 12px; border-radius: 14px; text-align: left; font-size: 0.92rem; color: #334155; line-height: 1.6;">
        <div>📖 <strong>PPT 研读用时：</strong><span id="summary-read">00:00</span></div>
        <div>🎮 <strong>游戏闯关用时：</strong><span id="summary-game">00:00</span></div>
        <div>⏱️ <strong>总学习用时：</strong><span id="summary-total">00:00</span></div>
      </div>

      <p style="color: #0369a1; font-weight: 700; font-size: 0.88rem; margin-bottom: 12px;" id="cloud-status">
        📡 正在同步成绩与学时至 Google Sheet...
      </p>

      <button class="btn-action" style="width: 100%;" onclick="location.reload()">重新挑战 🔄</button>
    </div>
  </div>

  <script>
    // ==========================================
    // ⚙️ 1. Google Apps Script 端点配置
    // ==========================================
    const GAS_ENDPOINT_URL = "https://script.google.com/macros/s/AKfycbxG2N9YeOsNj6OGq3lJENWpci4qkdx_I99_lzt72RFS0S_2eXvpbPf4lTjjZEfKLVTQ/exec";

    // ==========================================
    // 🔊 2. Web Audio API 街机音效系统
    // ==========================================
    const SoundFx = {
      ctx: null,
      init() {
        if (!this.ctx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AC();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      },
      pop() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.frequency.setValueAtTime(420, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(840, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      },
      cheer() {
        this.init();
        const now = this.ctx.currentTime;
        [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = f;
          gain.gain.setValueAtTime(0, now + i * 0.08);
          gain.gain.linearRampToValueAtTime(0.25, now + i * 0.08 + 0.02);
          gain.gain.linearRampToValueAtTime(0, now + i * 0.08 + 0.28);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(now + i * 0.08);
          osc.stop(now + i * 0.08 + 0.28);
        });
      }
    };

    // ==========================================
    // 📚 3. 20 个核心关卡任务题库
    // ==========================================
    const MISSIONS = [
      // 玩法 1：萌怪大食堂 (辨析天然 vs 超加工)
      { mode: 'feed', target: 'green', item: '🍌 鲜采香蕉', desc: '新鲜原型水果，直接获取无化学添加！' },
      { mode: 'feed', target: 'red',   item: '🌭 罐头热狗肠', desc: '超加工肉类，含有大量防腐剂与人工增鲜剂！' },
      { mode: 'feed', target: 'green', item: '🥬 现摘有机包菜', desc: '新鲜绿叶蔬菜，富含抗氧化物与膳食纤维！' },
      { mode: 'feed', target: 'red',   item: '🍟 裹粉炸薯条', desc: '高温油炸食品，潜伏反式脂肪与高精制钠盐！' },
      { mode: 'feed', target: 'green', item: '🐟 生鲜鲑鱼肉', desc: '优质蛋白质，含丰富不饱和脂肪酸与脑健康DHA！' },

      // 玩法 2：黄金餐盘 (Suku-Suku Separuh 比例)
      { mode: 'plate', target: 'vege', item: '🥦 西兰花与彩椒', desc: '卫生部法则：1/2 (一半) 必须是蔬菜与水果！' },
      { mode: 'plate', target: 'carb', item: '🍚 天然糙米饭', desc: '卫生部法则：1/4 (Suku) 优质碳水提供平稳能量！' },
      { mode: 'plate', target: 'protein', item: '🥚 水煮蛋与豆腐', desc: '卫生部法则：1/4 (Suku) 优质蛋白修复机体组织！' },
      { mode: 'plate', target: 'vege', item: '🍎 脆甜红苹果', desc: '1/2 彩虹果蔬区域，富含果胶与多种微量元素！' },
      { mode: 'plate', target: 'carb', item: '🍞 全麦燕麦吐司', desc: '1/4 粗粮碳水，缓慢释放能量，防止餐后血糖剧增！' },

      // 玩法 3：血管透视镜激光排雷 (病理机制评估)
      { mode: 'laser', title: '反式脂肪酸', desc: '击碎！反式脂肪堆积血管，严重损害青少年记忆与认知！' },
      { mode: 'laser', title: '过量精制钠盐', desc: '击碎！高盐外食导致水钠潴留，加重血管硬化引发高血压！' },
      { mode: 'laser', title: '高果葡糖浆', desc: '击碎！高糖引发细胞胰岛素抵抗，诱发二型糖尿病与肥胖！' },
      { mode: 'laser', title: '黄色脂质斑块', desc: '击碎！脂代谢紊乱加速动脉粥样硬化，增加心脏病发作风险！' },
      { mode: 'laser', title: '超加工端粒损耗', desc: '击碎！长期摄入加工食品会加速染色体端粒缩短与细胞早衰！' },

      // 玩法 4：外食大变身消除置换 (餐单改良与饮水)
      { mode: 'bubble', bad: '🧋 全糖珍珠奶茶', swap: '💧 纯净白开水', desc: '置换成功！多喝纯白开水是维持健康代谢的黄金法则！' },
      { mode: 'bubble', bad: '🍔 油腻双层汉堡', swap: '🥪 全麦生菜三明治', desc: '置换成功！减少饱和脂肪，补充优质粗纤维碳水！' },
      { mode: 'bubble', bad: '🍟 大包高盐薯条', swap: '🥗 玉米鲜蔬沙拉', desc: '置换成功！换成果蔬，彻底远离劣质煎炸油！' },
      { mode: 'bubble', bad: '🧃 高糖风味饮料', swap: '🍊 现切鲜橙水果杯', desc: '置换成功！直接吃新鲜水果能吸收完整活性维生素！' },
      { mode: 'bubble', bad: '☕ 油条炼乳甜咖啡', swap: '🥛 水煮蛋与无糖纯豆浆', desc: '置换成功！高蛋白少糖低脂，开启活力满满的一天！' }
    ];

    // ==========================================
    // ⏱️ 4. 时间戳驱动的防休眠计时器
    // ==========================================
    let studentName = "";
    let stepIndex = 0;
    let score = 0;
    let combo = 0;

    let readStartTime = 0;
    let readFinalSeconds = 0;
    let readInterval = null;

    let gameStartTime = 0;
    let gameFinalSeconds = 0;
    let gameInterval = null;

    function formatTime(totalSec) {
      const s = Math.max(0, Math.floor(totalSec));
      const mins = String(Math.floor(s / 60)).padStart(2, '0');
      const secs = String(s % 60).padStart(2, '0');
      return `${mins}:${secs}`;
    }

    function startReadingPhase() {
      const nameIpt = document.getElementById('ipt-name');
      const val = nameIpt.value.trim();
      if (!val) {
        nameIpt.focus();
        nameIpt.style.borderColor = 'var(--danger)';
        return;
      }
      studentName = val;
      document.getElementById('hud-name').innerText = `👤 ${studentName}`;
      document.getElementById('login-modal').style.display = 'none';
      document.getElementById('ppt-stage').style.display = 'flex';

      // 记录真实系统毫秒，不怕切屏休眠
      readStartTime = Date.now();
      clearInterval(readInterval);
      readInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - readStartTime) / 1000);
        document.getElementById('ppt-timer').innerText = formatTime(sec);
      }, 500);
    }

    function finishReadingAndPlay() {
      clearInterval(readInterval);
      readFinalSeconds = Math.max(1, Math.floor((Date.now() - readStartTime) / 1000));

      document.getElementById('ppt-stage').style.display = 'none';
      document.getElementById('game-stage').style.display = 'flex';
      document.getElementById('hud-stage-num').innerText = '关卡 1/20';

      // 启动游戏闯关计时
      gameStartTime = Date.now();
      clearInterval(gameInterval);
      gameInterval = setInterval(() => {
        const sec = Math.floor((Date.now() - gameStartTime) / 1000);
        document.getElementById('game-timer').innerText = `闯关用时 ${formatTime(sec)}`;
      }, 500);

      loadStage();
    }

    function loadStage() {
      if (stepIndex >= MISSIONS.length) {
        handleGameOver();
        return;
      }

      const cur = MISSIONS[stepIndex];
      const arena = document.getElementById('arena-box');
      arena.innerHTML = '';

      document.getElementById('hud-score').innerText = `⭐ ${score} 分`;
      document.getElementById('hud-stage-num').innerText = `关卡 ${stepIndex + 1}/20`;
      document.getElementById('hud-bar').style.width = `${((stepIndex + 1) / 20) * 100}%`;

      if (cur.mode === 'feed') renderFeedMode(cur, arena);
      else if (cur.mode === 'plate') renderPlateMode(cur, arena);
      else if (cur.mode === 'laser') renderLaserMode(cur, arena);
      else if (cur.mode === 'bubble') renderBubbleMode(cur, arena);
    }

    function renderFeedMode(itemData, container) {
      document.getElementById('mode-text').innerText = '🍔 玩法 1：萌怪大食堂 (拖拽分类投喂)';
      document.getElementById('tip-desc').innerText = '按属性拖入【天然食材怪】或【超加工回收箱】！';

      container.innerHTML = `
        <div class="monsters-wrap">
          <div class="monster-cell m-green" id="box-green">
            <div style="font-size:3.5rem;">🥦😋</div>
            <div style="font-weight:900; color:#166534; font-size:0.95rem;">天然食材怪</div>
          </div>
          <div class="monster-cell m-red" id="box-red">
            <div style="font-size:3.5rem;">🗑️🤖</div>
            <div style="font-weight:900; color:#991b1b; font-size:0.95rem;">超加工回收箱</div>
          </div>
        </div>
        <div class="food-dock">
          <div class="drag-token" id="drag-food">${itemData.item}</div>
        </div>
      `;

      setupDrag(document.getElementById('drag-food'), [
        { el: document.getElementById('box-green'), id: 'green' },
        { el: document.getElementById('box-red'), id: 'red' }
      ], itemData);
    }

    function renderPlateMode(itemData, container) {
      document.getElementById('mode-text').innerText = '🍽️ 玩法 2：黄金餐盘 (Suku-Suku Separuh 拼盘)';
      document.getElementById('tip-desc').innerText = '把食物拖入餐盘中对应的区域 (1/2果蔬 / 1/4碳水 / 1/4蛋白)！';

      container.innerHTML = `
        <div class="plate-disc">
          <div class="plate-vege" id="z-vege">
            <span style="font-size:1.6rem;">🥗</span>
            1/2 彩虹果蔬
          </div>
          <div class="plate-carb" id="z-carb">
            <span style="font-size:1.3rem;">🍚</span>
            1/4 优质碳水
          </div>
          <div class="plate-protein" id="z-protein">
            <span style="font-size:1.3rem;">🍳</span>
            1/4 优质蛋白
          </div>
        </div>
        <div class="food-dock">
          <div class="drag-token" id="drag-plate">${itemData.item}</div>
        </div>
      `;

      setupDrag(document.getElementById('drag-plate'), [
        { el: document.getElementById('z-vege'), id: 'vege' },
        { el: document.getElementById('z-carb'), id: 'carb' },
        { el: document.getElementById('z-protein'), id: 'protein' }
      ], itemData);
    }

    function setupDrag(card, targets, itemData) {
      let startX, startY, isDragging = false;

      function onDown(e) {
        isDragging = true;
        startX = e.clientX || (e.touches && e.touches[0].clientX);
        startY = e.clientY || (e.touches && e.touches[0].clientY);
        card.setPointerCapture(e.pointerId);
      }

      function onMove(e) {
        if (!isDragging) return;
        const cx = e.clientX || (e.touches && e.touches[0].clientX);
        const cy = e.clientY || (e.touches && e.touches[0].clientY);
        const dx = cx - startX;
        const dy = cy - startY;
        card.style.transform = `translate(${dx}px, ${dy}px) scale(1.08)`;

        const cardR = card.getBoundingClientRect();
        targets.forEach(t => {
          const tR = t.el.getBoundingClientRect();
          if (hitTest(cardR, tR)) t.el.classList.add('m-open', 'plate-active');
          else t.el.classList.remove('m-open', 'plate-active');
        });
      }

      function onUp(e) {
        if (!isDragging) return;
        isDragging = false;
        const cardR = card.getBoundingClientRect();
        let matched = false;

        targets.forEach(t => {
          t.el.classList.remove('m-open', 'plate-active');
          if (hitTest(cardR, t.el.getBoundingClientRect()) && t.id === itemData.target) {
            matched = true;
          }
        });

        if (matched) {
          triggerSuccess(itemData.desc);
        } else {
          card.style.transform = 'translate(0px, 0px)';
          SoundFx.pop();
        }
      }

      card.onpointerdown = onDown;
      card.onpointermove = onMove;
      card.onpointerup = onUp;
    }

    function hitTest(r1, r2) {
      return !(r1.right < r2.left || r1.left > r2.right || r1.bottom < r2.top || r1.top > r2.bottom);
    }

    function renderLaserMode(itemData, container) {
      document.getElementById('mode-text').innerText = '🔬 玩法 3：血管透视镜 (激光排雷)';
      document.getElementById('tip-desc').innerText = '点击击碎潜伏在血管内壁的高危病理隐患！';

      container.innerHTML = `
        <div class="artery-box">
          <div style="position:absolute; top:12px; left:16px; font-weight:800; color:#ffffff;">
            🚨 血管内皮监测
          </div>
          <div class="plaque-token" id="plaque-btn">
            <div style="font-size:3rem;">⚠️</div>
            <div style="font-weight:900; color:#854d0e; font-size:1.15rem; margin-top:4px;">${itemData.title}</div>
          </div>
        </div>
      `;

      const p = document.getElementById('plaque-btn');
      p.onclick = () => {
        p.style.transform = 'scale(0) rotate(180deg)';
        setTimeout(() => triggerSuccess(itemData.desc), 250);
      };
    }

    function renderBubbleMode(itemData, container) {
      document.getElementById('mode-text').innerText = '🫧 玩法 4：外食大变身 (气泡消除置换)';
      document.getElementById('tip-desc').innerText = '戳破高脂高糖外食气泡，变身天然健康美食！';

      container.innerHTML = `
        <div class="bubble-sea">
          <div class="bubble-token" id="junk-btn">
            ${itemData.bad}
          </div>
        </div>
      `;

      const b = document.getElementById('junk-btn');
      b.onclick = () => {
        b.style.background = '#dcfce7';
        b.style.borderColor = '#22c55e';
        b.style.color = '#15803d';
        b.innerHTML = `✨ 成功置换：${itemData.swap}`;
        SoundFx.pop();
        setTimeout(() => triggerSuccess(itemData.desc), 350);
      };
    }

    function triggerSuccess(tipMsg) {
      SoundFx.cheer();
      score += 5;
      combo++;
      document.getElementById('combo-box').innerText = `🔥 x${combo}`;
      document.getElementById('tip-desc').innerText = `💡 ${tipMsg}`;
      stepIndex++;
      setTimeout(loadStage, 400);
    }

    // ==========================================
    // 🏆 5. 修复后的结果渲染与回传
    // ==========================================
    function handleGameOver() {
      clearInterval(gameInterval);
      gameFinalSeconds = Math.max(1, Math.floor((Date.now() - gameStartTime) / 1000));

      document.getElementById('game-stage').style.display = 'none';
      document.getElementById('result-modal').style.display = 'flex';

      const readTimeStr = formatTime(readFinalSeconds);
      const gameTimeStr = formatTime(gameFinalSeconds);
      const totalTimeStr = formatTime(readFinalSeconds + gameFinalSeconds);

      // 修正 ID：使用 res-score 确保不报错
      const resScoreEl = document.getElementById('res-score');
      if (resScoreEl) resScoreEl.innerText = `最终战绩：${score} 分`;

      document.getElementById('summary-read').innerText = readTimeStr;
      document.getElementById('summary-game').innerText = gameTimeStr;
      document.getElementById('summary-total').innerText = totalTimeStr;

      let ratingTitle = "五星特级营养师 🏆";
      if (score < 70) ratingTitle = "初级健康小卫士 🌱";
      else if (score < 90) ratingTitle = "优秀健康特工 🏅";

      document.getElementById('res-title').innerText = ratingTitle;
      fireConfetti();

      // 构建回传数据
      const payload = {
        name: studentName,
        studentClass: "六年级",
        score: score,
        total: 20,
        readTime: readTimeStr,
        gameTime: gameTimeStr,
        rating: ratingTitle,
        status: "完整通关"
      };

      const syncEl = document.getElementById('cloud-status');

      if (typeof google !== 'undefined' && google.script && google.script.run) {
        google.script.run
          .withSuccessHandler(() => {
            syncEl.innerText = "✅ 成绩与学时已成功存入 Google Sheet！";
            syncEl.style.color = "#15803d";
          })
          .withFailureHandler(() => {
            syncEl.innerText = "⚠️ 成绩已记录（云端写入遇到网络阻碍）";
          })
          .recordScore(payload);
      } else if (GAS_ENDPOINT_URL && GAS_ENDPOINT_URL.startsWith('http')) {
        fetch(GAS_ENDPOINT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        }).then(() => {
          syncEl.innerText = "✅ 成绩与学时已成功存入 Google Sheet！";
          syncEl.style.color = "#15803d";
        }).catch(() => {
          syncEl.innerText = "⚠️ 成绩已记录（网络波动）";
        });
      }
    }

    function fireConfetti() {
      const cvs = document.getElementById('confetti-cvs');
      const ctx = cvs.getContext('2d');
      cvs.width = window.innerWidth;
      cvs.height = window.innerHeight;
      const pieces = Array.from({length: 80}, () => ({
        x: Math.random() * cvs.width,
        y: -10,
        sz: Math.random() * 8 + 6,
        c: ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'][Math.floor(Math.random()*5)],
        vy: Math.random() * 5 + 3,
        vx: Math.random() * 4 - 2
      }));
      function draw() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        pieces.forEach(p => {
          p.y += p.vy;
          p.x += p.vx;
          ctx.fillStyle = p.c;
          ctx.fillRect(p.x, p.y, p.sz, p.sz);
        });
        if (pieces.some(p => p.y < cvs.height)) requestAnimationFrame(draw);
      }
      draw();
    }
  </script>
