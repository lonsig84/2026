<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>学生作业与事件管理系统</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" crossorigin="anonymous"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const SUPABASE_URL = "https://fmecxejzfagtdlxcxymk.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable__WW7bNpZdQUOXDFDEBDBYQ_-6bhu76T"; 
    const SYSTEM_PASSWORD = "8888"; 

    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
    const PAST_DAYS = Array.from({ length: 5 }, (_, i) => i);

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');

      const [subjectMap, setSubjectMap] = useState(null); 
      const [currentTab, setCurrentTab] = useState('');
      const [allStudents, setAllStudents] = useState([]);
      const [allRecords, setAllRecords] = useState([]);

      const todayYYYYMMDD = new Date().toLocaleDateString('en-CA'); 
      const [recordDate, setRecordDate] = useState(todayYYYYMMDD);
      const [homeworkName, setHomeworkName] = useState('');
      const [selectedStudents, setSelectedStudents] = useState({});
      const [activeStudentInput, setActiveStudentInput] = useState(null);

      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);
      const [recentFilter, setRecentFilter] = useState('all');

      // 弹窗状态
      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [tempSubjects, setTempSubjects] = useState([]);
      const [isStudentMgrOpen, setIsStudentMgrOpen] = useState(false);
      const [isHistoryOpen, setIsHistoryOpen] = useState(false);
      const [studentDetailModal, setStudentDetailModal] = useState(null);

      // 学生管理状态
      const [newStudentName, setNewStudentName] = useState('');
      const [batchStudentInput, setBatchStudentInput] = useState('');

      // 历史记录筛选状态
      const [histSubject, setHistSubject] = useState('all');
      const [histStatus, setHistStatus] = useState('all');
      const [histKeyword, setHistKeyword] = useState('');
      const [histStartDate, setHistStartDate] = useState('');
      const [histEndDate, setHistEndDate] = useState('');

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === SYSTEM_PASSWORD) {
          setIsAuthenticated(true);
          loadInitialData();
        } else {
          showToast('❌ 密码错误，请重试');
          setPasswordInput('');
        }
      };

      // 从 Supabase 载入数据（防崩溃弹性读取）
      const loadInitialData = async () => {
        if (!supabase) return showToast('❌ Supabase 客户端未就绪');
        setLoading(true);
        try {
          const [subRes, stuRes, recRes] = await Promise.all([
            supabase.from('subjects').select('*'),
            supabase.from('students').select('*'),
            supabase.from('homework_records').select('*')
          ]);

          if (subRes.error) console.error('Subjects error:', subRes.error);
          if (stuRes.error) console.error('Students error:', stuRes.error);
          if (recRes.error) console.error('Records error:', recRes.error);

          let map = {};
          const sortedSubs = (subRes.data || []).sort((a, b) => (a.sort_order || 0) - (b.sort_order || 0));
          sortedSubs.forEach(s => {
            map[s.code] = { 
              zh: s.name_zh || s.code, 
              ms: s.name_ms || s.code, 
              type: s.type || (s.code === 'Year1' || s.code === 'Y1' ? 'event' : 'homework')
            };
          });

          // 若数据库科目为空，自动兜底提供常用科目，保证界面绝不卡死
          if (Object.keys(map).length === 0) {
            map = {
              BC: { zh: '华文', ms: 'Bahasa Cina', type: 'homework' },
              BI: { zh: '英文', ms: 'Bahasa Inggeris', type: 'homework' },
              SN: { zh: '科学', ms: 'Sains', type: 'homework' },
              Year1: { zh: '一年级事件记录', ms: 'Tahun 1', type: 'event' }
            };
          }
          setSubjectMap(map);

          const sortedStudents = (stuRes.data || []).sort((a, b) => String(a.student_name || '').localeCompare(String(b.student_name || '')));
          setAllStudents(sortedStudents.map(s => ({ id: s.id, subject: s.subject, name: s.student_name })));

          const sortedRecords = (recRes.data || []).sort((a, b) => String(b.record_date || b.date || '').localeCompare(String(a.record_date || a.date || '')));
          setAllRecords(sortedRecords);

          const subjects = Object.keys(map);
          if (subjects.length > 0) {
            setCurrentTab(prev => prev || subjects[0]);
          }
        } catch (err) {
          console.error('loadInitialData caught:', err);
          showToast('⚠️ 数据加载提示: ' + err.message);
          const fallbackMap = {
            BC: { zh: '华文', ms: 'Bahasa Cina', type: 'homework' },
            BI: { zh: '英文', ms: 'Bahasa Inggeris', type: 'homework' },
            SN: { zh: '科学', ms: 'Sains', type: 'homework' },
            Year1: { zh: '一年级事件记录', ms: 'Tahun 1', type: 'event' }
          };
          setSubjectMap(fallbackMap);
          setCurrentTab('BC');
        }
        setLoading(false);
      };

      // 实时订阅更新
      useEffect(() => {
        if (!isAuthenticated || !supabase) return;
        const channel = supabase
          .channel('schema_db_changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'homework_records' }, () => {
            loadInitialData();
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'students' }, () => {
            loadInitialData();
          })
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
        };
      }, [isAuthenticated]);

      // 日期计算工具
      const parseDate = (dateStr) => {
        if (!dateStr) return null;
        const s = String(dateStr);
        if (s.includes('-')) {
          const [y, m, d] = s.split('-').map(Number);
          return new Date(y, m - 1, d);
        }
        if (s.includes('/')) {
          const [d, m, y] = s.split('/').map(Number);
          return new Date(y, m - 1, d);
        }
        return new Date(s);
      };

      const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const todayStart = startOfDay(new Date());

      const getDayDiff = (dateStr) => {
        const d = parseDate(dateStr);
        if (!d || isNaN(d.getTime())) return null;
        return Math.floor((todayStart - startOfDay(d)) / 86400000);
      };

      const formatDateDisplay = (dateStr) => {
        const d = parseDate(dateStr);
        if (!d || isNaN(d.getTime())) return String(dateStr || '');
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
      };

      if (!isAuthenticated) {
        return (
          <div className="flex justify-center items-center h-screen px-4 bg-slate-100">
            {toast && <div className="fixed top-6 left-1/2 -translate-x-1/2 bg-red-600 text-white px-5 py-3 rounded-xl text-sm font-bold shadow-2xl z-[110] animate-bounce">{toast}</div>}
            <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm animate-fade-in text-center border border-slate-200">
              <div className="text-5xl mb-4">🔐</div>
              <h2 className="text-xl font-bold text-slate-800 mb-2">系统访问验证</h2>
              <p className="text-xs text-slate-500 mb-6">请输入管理员密码以进入管理系统</p>
              <form onSubmit={handleLogin} className="space-y-4">
                <input 
                  type="password" 
                  value={passwordInput} 
                  onChange={(e) => setPasswordInput(e.target.value)} 
                  className="w-full px-4 py-3 text-center tracking-widest text-lg border-2 border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none" 
                  placeholder="••••" 
                  autoFocus 
                />
                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors shadow-md">
                  进入系统
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (!subjectMap) {
        return (
          <div className="flex flex-col justify-center items-center h-screen space-y-3">
            <div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
            <p className="text-xs text-slate-400 font-medium">正在读取云端数据...</p>
          </div>
        );
      }

      const subjectList = Object.keys(subjectMap);
      const currentSubjectInfo = subjectMap[currentTab] || { zh: currentTab, ms: currentTab, type: 'homework' };
      const isEventSubject = currentSubjectInfo.type === 'event';

      const currentStudents = allStudents.filter(s => s.subject === currentTab);
      const currentPendingRecords = allRecords.filter(r => r.subject === currentTab && r.status === 'Pending');
      const currentEventRecords = allRecords.filter(r => r.subject === currentTab);

      // 每个学生的未完成作业数量映射
      const studentPendingCountMap = {};
      currentPendingRecords.forEach(r => {
        studentPendingCountMap[r.student_name] = (studentPendingCountMap[r.student_name] || 0) + 1;
      });

      // 标记单条已补交
      const handleResolveRecord = async (recordId) => {
        const { error } = await supabase.from('homework_records').update({ status: 'Resolved' }).eq('id', recordId);
        if (!error) {
          setAllRecords(prev => prev.map(r => r.id === recordId ? { ...r, status: 'Resolved' } : r));
          showToast('✅ 已成功标记补交！');
        } else {
          showToast('❌ 标记失败: ' + error.message);
        }
      };

      // 一键全部补交
      const handleResolveAllForStudent = async (studentName) => {
        const targetIds = currentPendingRecords.filter(r => r.student_name === studentName).map(r => r.id);
        if (targetIds.length === 0) return;

        const { error } = await supabase.from('homework_records').update({ status: 'Resolved' }).in('id', targetIds);
        if (!error) {
          setAllRecords(prev => prev.map(r => targetIds.includes(r.id) ? { ...r, status: 'Resolved' } : r));
          showToast(`🎉 已为 ${studentName} 一键结清所有作业！`);
          setStudentDetailModal(null);
        } else {
          showToast('❌ 批量处理失败: ' + error.message);
        }
      };

      // 删除单条记录
      const handleDeleteRecord = async (recordId) => {
        if (!window.confirm('确定要删除此条记录吗？此操作不可撤销。')) return;
        const { error } = await supabase.from('homework_records').delete().eq('id', recordId);
        if (!error) {
          setAllRecords(prev => prev.filter(r => r.id !== recordId));
          showToast('🗑️ 记录已删除');
        } else {
          showToast('❌ 删除失败: ' + error.message);
        }
      };

      // 提交新记录
      const handleSubmitNewRecord = async (e) => {
        e.preventDefault();
        if (!recordDate) return showToast('⚠️ 请选择日期！');
        if (!homeworkName.trim()) return showToast(isEventSubject ? '⚠️ 请输入事件名称/备忘事项！' : '⚠️ 请输入功课名称！');

        const studentKeys = Object.keys(selectedStudents);
        if (studentKeys.length === 0) {
          return showToast('⚠️ 请至少选择一位学生！');
        }

        setLoading(true);
        const recordsToInsert = studentKeys.map(name => ({
          id: `REC_${Date.now()}_${Math.floor(Math.random() * 10000)}`,
          record_date: recordDate,
          subject: currentTab,
          homework: homeworkName.trim(),
          student_name: name,
          reason: selectedStudents[name],
          status: isEventSubject ? 'Event' : 'Pending'
        }));

        const { data, error } = await supabase.from('homework_records').insert(recordsToInsert).select();
        if (!error) {
          setAllRecords(prev => [...(data || recordsToInsert), ...prev]);
          setHomeworkName('');
          setSelectedStudents({});
          setActiveStudentInput(null);
          showToast(isEventSubject ? '✅ 成功记入班级流水账！' : '✅ 成功录入未交作业！');
        } else {
          showToast('❌ 保存失败: ' + error.message);
        }
        setLoading(false);
      };

      const handleToggleStudent = (studentName) => {
        if (selectedStudents.hasOwnProperty(studentName)) {
          const updated = { ...selectedStudents };
          delete updated[studentName];
          setSelectedStudents(updated);
          if (activeStudentInput === studentName) setActiveStudentInput(null);
        } else {
          setSelectedStudents({ ...selectedStudents, [studentName]: isEventSubject ? '记录' : '没做' });
          setActiveStudentInput(studentName);
        }
      };

      // 添加单个学生
      const handleAddSingleStudent = async (e) => {
        e.preventDefault();
        if (!newStudentName.trim()) return showToast('⚠️ 请输入学生姓名');
        const exists = currentStudents.some(s => s.name.trim().toLowerCase() === newStudentName.trim().toLowerCase());
        if (exists) return showToast('⚠️ 该科目已有同名学生！');

        const { data, error } = await supabase.from('students').insert([{
          subject: currentTab,
          student_name: newStudentName.trim()
        }]).select();

        if (!error && data) {
          setAllStudents(prev => [...prev, { id: data[0].id, subject: currentTab, name: newStudentName.trim() }]);
          setNewStudentName('');
          showToast('✅ 学生添加成功');
        } else {
          showToast('❌ 添加失败: ' + error.message);
        }
      };

      // 批量导入学生
      const handleBatchImportStudents = async () => {
        if (!batchStudentInput.trim()) return showToast('⚠️ 请输入学生姓名列表');
        const names = batchStudentInput
          .split('\n')
          .map(n => n.trim())
          .filter(n => n.length > 0);

        if (names.length === 0) return showToast('⚠️ 未识别到有效学生姓名');

        const existingNames = new Set(currentStudents.map(s => s.name.trim()));
        const toAdd = Array.from(new Set(names))
          .filter(n => !existingNames.has(n))
          .map(n => ({ subject: currentTab, student_name: n }));

        if (toAdd.length === 0) return showToast('ℹ️ 所输入学生均已在名册中');

        setLoading(true);
        const { data, error } = await supabase.from('students').insert(toAdd).select();
        if (!error && data) {
          const addedFormatted = data.map(d => ({ id: d.id, subject: currentTab, name: d.student_name }));
          setAllStudents(prev => [...prev, ...addedFormatted]);
          setBatchStudentInput('');
          showToast(`✅ 成功批量导入 ${toAdd.length} 名学生！`);
        } else {
          showToast('❌ 批量导入失败: ' + error.message);
        }
        setLoading(false);
      };

      // 移除学生
      const handleDeleteStudent = async (studentId, studentName) => {
        if (!window.confirm(`确定要从【${currentTab}】名册中移除 ${studentName} 吗？`)) return;
        const { error } = await supabase.from('students').delete().eq('id', studentId);
        if (!error) {
          setAllStudents(prev => prev.filter(s => s.id !== studentId));
          showToast(`🗑️ 已移除学生 ${studentName}`);
        } else {
          showToast('❌ 移除失败: ' + error.message);
        }
      };

      // 科目配置管理
      const openSettings = () => {
        const currentArr = Object.keys(subjectMap).map(key => ({ 
          code: key, 
          zh: subjectMap[key].zh, 
          ms: subjectMap[key].ms,
          type: subjectMap[key].type || 'homework'
        }));
        setTempSubjects(currentArr);
        setIsSettingsOpen(true);
      };

      const handleSubjectRowChange = (index, field, value) => {
        const updated = [...tempSubjects];
        updated[index][field] = value;
        setTempSubjects(updated);
      };

      const handleDeleteSubjectRow = async (code, index) => {
        if (!window.confirm(`⚠️ 严重警告：确定要彻底删除科目【${code}】吗？\n该科目名下的所有学生以及关联的所有历史作业记录将会全部一并清理！`)) return;

        setLoading(true);
        await supabase.from('homework_records').delete().eq('subject', code);
        await supabase.from('students').delete().eq('subject', code);
        const { error } = await supabase.from('subjects').delete().eq('code', code);

        if (!error) {
          const updated = [...tempSubjects];
          updated.splice(index, 1);
          setTempSubjects(updated);
          await loadInitialData();
          showToast(`🗑️ 科目【${code}】及关联数据已全部清理！`);
        } else {
          showToast('❌ 删除科目失败: ' + error.message);
        }
        setLoading(false);
      };

      const saveSettings = async () => {
        const invalid = tempSubjects.some(s => !s.code.trim());
        if (invalid) return showToast('⚠️ 科目代号不能为空！');

        setLoading(true);
        const rows = tempSubjects.map((s, idx) => ({
          code: s.code.trim().toUpperCase(),
          name_zh: s.zh.trim(),
          name_ms: s.ms.trim(),
          type: s.type || 'homework',
          sort_order: idx + 1
        }));

        const { error } = await supabase.from('subjects').upsert(rows);
        if (!error) {
          await loadInitialData();
          setIsSettingsOpen(false);
          showToast('✅ 科目配置更新成功！');
        } else {
          showToast('❌ 保存失败: ' + error.message);
        }
        setLoading(false);
      };

      // 导出 CSV (安全转义，Excel 无乱码)
      const exportToCSV = (recordsToExport) => {
        if (recordsToExport.length === 0) return showToast('⚠️ 没有可导出的记录');
        const bom = '\uFEFF';
        const q = String.fromCharCode(34);
        const escapeCSV = (val) => {
          const s = (val === null || val === undefined) ? '' : String(val);
          return q + s.split(q).join(q + q) + q;
        };

        let csvContent = ['序号', '记录ID', '日期', '科目', '作业/事件名称', '学生姓名', '原因/备注', '状态'].map(escapeCSV).join(',') + '\n';
        recordsToExport.forEach((r, idx) => {
          const statusText = r.status === 'Resolved' ? '已补交' : r.status === 'Pending' ? '欠交中' : '事件备忘';
          const row = [idx + 1, r.id, formatDateDisplay(r.date || r.record_date), r.subject, r.homework, r.student_name, r.reason, statusText];
          csvContent += row.map(escapeCSV).join(',') + '\n';
        });

        const blob = new Blob([bom + csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `作业与事件记录_${new Date().toISOString().slice(0, 10)}.csv`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('📥 表格已成功导出为 CSV！');
      };

      // 历史记录多维筛选（纯原生 JS 运算，无任何 Hook 计数冲突）
      const filteredHistoryRecords = allRecords.filter(r => {
        if (histSubject !== 'all' && r.subject !== histSubject) return false;
        if (histStatus !== 'all' && r.status !== histStatus) return false;
        if (histKeyword.trim()) {
          const kw = histKeyword.trim().toLowerCase();
          const sName = (r.student_name || '').toLowerCase();
          const hw = (r.homework || '').toLowerCase();
          if (!sName.includes(kw) && !hw.includes(kw)) return false;
        }
        if (histStartDate) {
          const rDate = r.record_date || r.date;
          if (rDate < histStartDate) return false;
        }
        if (histEndDate) {
          const rDate = r.record_date || r.date;
          if (rDate > histEndDate) return false;
        }
        return true;
      });

      // 生成通知文案
      const handleGenerateMessage = () => {
        const todayStr = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '/');

        if (isEventSubject) {
          let msg = `📅 日期: ${todayStr}\n\n【${currentSubjectInfo.zh} ${currentTab}】今日班级事件与备忘流水记录如下：\n\n`;
          const todayEvents = currentEventRecords.filter(r => getDayDiff(r.record_date || r.date) === 0);
          if (todayEvents.length === 0) {
            msg += '今日无特殊突发或收费备忘事项，一切正常。✨';
          } else {
            todayEvents.forEach((r, idx) => {
              msg += `${idx + 1}. 【${r.homework}】 涉及学生: ${r.student_name} (详情: ${r.reason || '无'})\n`;
            });
          }
          navigator.clipboard.writeText(msg.trim()).then(() => showToast('📋 事件流水记录已复制！')).catch(() => showToast('❌ 复制失败'));
          return;
        }

        if (currentPendingRecords.length === 0) {
          const praiseMsg = `📅 日期 / Tarikh Semasa: ${todayStr}\n\n今日【${currentSubjectInfo.zh} ${currentTab}】功课全班皆已安全完成，感谢各位家长的悉心督促！\nSemua murid telah menyiapkan kerja sekolah bagi mata pelajaran 【${currentSubjectInfo.ms}】. Terima kasih atas kerjasama ibu bapa! ❤️`;
          navigator.clipboard.writeText(praiseMsg).then(() => showToast('📋 全班齐交！赞美信息已复制'));
          return;
        }

        const grouped = {};
        currentPendingRecords.forEach(r => {
          if (!grouped[r.student_name]) grouped[r.student_name] = [];
          grouped[r.student_name].push(r);
        });

                    <span className="text-xl">👤</span>
                    <div>
                      <h3 className="text-base font-bold text-slate-800">{studentDetailModal}</h3>
                      <p className="text-[11px] text-slate-500">【{currentTab}】当前欠交作业清单</p>
                    </div>
                  </div>
                  <button onClick={() => setStudentDetailModal(null)} className="text-slate-400 hover:text-red-500 text-xl font-bold px-2">&times;</button>
                </div>

                <div className="p-5 overflow-y-auto space-y-3 bg-slate-50/30 flex-1">
                  {currentPendingRecords.filter(r => r.student_name === studentDetailModal).length === 0 ? (
                    <div className="text-center py-8 text-slate-500 text-sm">🎉 该生目前没有任何欠交作业，表现优秀！</div>
                  ) : (
>                     <>
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-bold text-red-600 bg-red-50 border border-red-200 px-2.5 py-1 rounded-full">
                          共欠交 {currentPendingRecords.filter(r => r.student_name === studentDetailModal).length} 项
                        </span>
                        <button 
                          type="button" 
                          onClick={() => handleResolveAllForStudent(studentDetailModal)} 
                          className="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md transition-all active:scale-95"
                        >
                          🎉 全部标记已补交
                        </button>
                      </div>

                      {currentPendingRecords.filter(r => r.student_name === studentDetailModal).map(rec => (
                        <div key={rec.id} className="p-3 bg-white border border-slate-200 rounded-xl shadow-sm space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-indigo-950 text-xs">{rec.homework}</span>
                            <span className="text-[11px] text-slate-400">{formatDateDisplay(rec.record_date || rec.date)}</span>
                          </div>
                          <div className="text-xs text-slate-500 flex items-center justify-between">
                            <span>原因: <strong className="text-slate-700">{rec.reason || '没做'}</strong></span>
                            <div className="space-x-1.5">
                              <button type="button" onClick={() => handleDeleteRecord(rec.id)} className="text-[11px] text-red-500 hover:text-red-700 px-2 py-0.5 rounded border border-red-200">
                                🗑️
                              </button>
                              <button type="button" onClick={() => handleResolveRecord(rec.id)} className="text-xs font-bold bg-emerald-50 hover:bg-emerald-100 text-emerald-700 px-3 py-1 rounded-lg border border-emerald-300">
                                ✓ 标记补交
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </>
                  )}
                </div>

                <div className="px-5 py-3 bg-white border-t border-slate-100 flex justify-end">
                  <button type="button" onClick={() => setStudentDetailModal(null)} className="px-5 py-1.5 text-xs font-bold bg-slate-200 hover:bg-slate-300 text-slate-700 rounded-xl">关闭</button>
                </div>
              </div>
            </div>
          )}

          {/* 弹窗 B: 名单管理中心 */}
          {isStudentMgrOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 animate-fade-in">
              <div className="bg-white w-full max-w-xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-indigo-50/50">
                  <div className="flex items-center space-x-2">
                    <span className="text-xl">👥</span>
                    <div>
                      <h3 className="text-base font-bold text-slate-800">学生名册管理中心</h3>
                      <p className="text-[11px] text-slate-500">当前正在配置科目：<strong className="text-indigo-600">【{currentTab} ({currentSubjectInfo.zh})】</strong></p>
                    </div>
                  </div>
                  <button onClick={() => setIsStudentMgrOpen(false)} className="text-slate-400 hover:text-red-500 text-xl font-bold px-2">&times;</button>
                </div>

                <div className="p-6 overflow-y-auto space-y-6 flex-1 bg-slate-50/30">
                  <div className="bg-white p-4 rounded-xl border border-slate-200 space-y-2">
                    <label className="block text-xs font-bold text-slate-600">➕ 单个新增学生</label>
                    <form onSubmit={handleAddSingleStudent} className="flex gap-2">
                      <input 
                        type="text" 
                        placeholder="例如: 林明德 或 LIM MIN DE" 
                        value={newStudentName} 
                        onChange={(e) => setNewStudentName(e.target.value)} 
                        className="flex-1 px-3 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500" 
                      />
                      <button type="submit" className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs rounded-xl shadow-sm shrink-0">
                        添加
                      </button>
                    </form>
                  </div>

                  <div className="bg-white p-4 rounded-xl border border-slate-200 space-y-2">
                    <div className="flex items-center justify-between">
                      <label className="block text-xs font-bold text-slate-600">📋 批量快速导入（从名册直接复制粘贴）</label>
                      <span className="text-[10px] text-slate-400">一行一个学生姓名</span>
                    </div>
                    <textarea 
                      rows="4" 
                      placeholder={'请在此粘贴一整列学生名单，例如：\nCHAN SIN QI 郑惞嬨\nCHONG ZHI XUAN 张芷萱\nGAN WEI CHEN 颜维辰'} 
                      value={batchStudentInput} 
                      onChange={(e) => setBatchStudentInput(e.target.value)} 
                      className="w-full px-3 py-2 text-xs rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 leading-relaxed font-mono"
                    ></textarea>
                    <button type="button" onClick={handleBatchImportStudents} className="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-sm transition-all">
                      📥 一键批量导入至【{currentTab}】
                    </button>
                  </div>

                  <div className="bg-white p-4 rounded-xl border border-slate-200 space-y-3">
                    <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                      <h4 className="text-xs font-bold text-slate-700">当前科目学生名单 (共 {currentStudents.length} 人)</h4>
                    </div>
                    {currentStudents.length === 0 ? (
                      <p className="text-xs text-slate-400 py-3 text-center">暂无学生，可通过上方表单录入。</p>
                    ) : (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-56 overflow-y-auto pr-1">
                        {currentStudents.map(student => (
                          <div key={student.id} className="flex items-center justify-between p-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                            <span className="font-medium text-slate-700 truncate">{student.name}</span>
                            <button 
                              type="button" 
                              onClick={() => handleDeleteStudent(student.id, student.name)} 
                              className="text-red-400 hover:text-red-600 hover:bg-red-50 p-1 rounded transition-colors ml-2" 
                              title="移除此学生"
                            >
                              🗑️
                            </button>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                </div>

                <div className="px-6 py-3 bg-white border-t border-slate-100 flex justify-end">
                  <button type="button" onClick={() => setIsStudentMgrOpen(false)} className="px-6 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl">完成关闭</button>
                </div>
              </div>
            </div>
          )}

          {/* 弹窗 C: 历史总账查询与数据导出 */}
          {isHistoryOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-3 sm:p-5 animate-fade-in">
              <div className="bg-white w-full max-w-4xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh]">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-emerald-50/50">
                  <div className="flex items-center space-x-2">
                    <span className="text-xl">📜</span>
                    <div>
                      <h3 className="text-base font-bold text-slate-800">历史总账检索与数据导出</h3>
                      <p className="text-[11px] text-slate-500">支持全学期多条件筛选、实时检索与 Excel/CSV 表格导出</p>
                    </div>
                  </div>
                  <button onClick={() => setIsHistoryOpen(false)} className="text-slate-400 hover:text-red-500 text-xl font-bold px-2">&times;</button>
                </div>

                <div className="p-4 bg-slate-50 border-b border-slate-200 grid grid-cols-2 sm:grid-cols-5 gap-2.5 text-xs">
                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 mb-1">科目</label>
                    <select value={histSubject} onChange={(e) => setHistSubject(e.target.value)} className="w-full p-2 rounded-lg border border-slate-300 font-medium">
                      <option value="all">全部科目</option>
                      {subjectList.map(s => <option key={s} value={s}>{s} ({subjectMap[s].zh})</option>)}
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 mb-1">状态</label>
                    <select value={histStatus} onChange={(e) => setHistStatus(e.target.value)} className="w-full p-2 rounded-lg border border-slate-300 font-medium">
                      <option value="all">全部状态</option>
                      <option value="Pending">欠交中 (Pending)</option>
                      <option value="Resolved">已补交 (Resolved)</option>
                      <option value="Event">事件备忘 (Event)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 mb-1">关键词 (姓名/作业)</label>
                    <input type="text" placeholder="输入搜索..." value={histKeyword} onChange={(e) => setHistKeyword(e.target.value)} className="w-full p-2 rounded-lg border border-slate-300" />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 mb-1">开始日期</label>
                    <input type="date" value={histStartDate} onChange={(e) => setHistStartDate(e.target.value)} className="w-full p-2 rounded-lg border border-slate-300" />
                  </div>

                  <div>
                    <label className="block text-[11px] font-bold text-slate-500 mb-1">结束日期</label>
                    <input type="date" value={histEndDate} onChange={(e) => setHistEndDate(e.target.value)} className="w-full p-2 rounded-lg border border-slate-300" />
                  </div>
                </div>

                <div className="p-4 overflow-y-auto flex-1">
                  <div className="flex items-center justify-between mb-3">
                    <span className="text-xs font-bold text-slate-600">检索结果：共找到 {filteredHistoryRecords.length} 条记录</span>
                    <button type="button" onClick={() => exportToCSV(filteredHistoryRecords)} className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs rounded-xl shadow-md flex items-center gap-1 transition-all active:scale-95">
                      <span>📥 导出筛选结果为 CSV (Excel)</span>
                    </button>
                  </div>

                  {filteredHistoryRecords.length === 0 ? (
                    <div className="text-center py-16 text-slate-400 text-sm">没有匹配到符合条件的记录。</div>
                  ) : (
                    <div className="border border-slate-200 rounded-xl overflow-hidden shadow-sm">
                      <table className="w-full text-left text-xs text-slate-600 divide-y divide-slate-200">
                        <thead className="bg-slate-100 font-bold text-slate-700">
                          <tr>
                            <th className="p-2.5">日期</th>
                            <th className="p-2.5">科目</th>
                            <th className="p-2.5">学生姓名</th>
                            <th className="p-2.5">作业 / 事件名称</th>
                            <th className="p-2.5">原因 / 备注</th>
                            <th className="p-2.5">状态</th>
                            <th className="p-2.5 text-right">操作</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200/60 bg-white">
                          {filteredHistoryRecords.slice(0, 150).map(row => (
                            <tr key={row.id} className="hover:bg-slate-50">
                              <td className="p-2.5 whitespace-nowrap text-slate-500">{formatDateDisplay(row.record_date || row.date)}</td>
                              <td className="p-2.5 font-bold text-indigo-700">{row.subject}</td>
                              <td className="p-2.5 font-medium text-slate-800">{row.student_name}</td>
                              <td className="p-2.5 font-semibold text-slate-900">{row.homework}</td>
                              <td className="p-2.5 text-slate-500">{row.reason || '-'}</td>
                              <td className="p-2.5">
                                {row.status === 'Resolved' ? (
                                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-700 border border-emerald-200">✓ 已补交</span>
                                ) : row.status === 'Pending' ? (
                                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-100 text-red-700 border border-red-200">欠交中</span>
                                ) : (
                                  <span className="px-2 py-0.5 rounded-full text-[10px] font-bold bg-blue-100 text-blue-700 border border-blue-200">事件备忘</span>
                                )}
                              </td>
                              <td className="p-2.5 text-right">
                                <button type="button" onClick={() => handleDeleteRecord(row.id)} className="text-red-500 hover:text-red-700 p-1">🗑️</button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                      {filteredHistoryRecords.length > 150 && (
                        <div className="p-2.5 text-center text-[11px] text-slate-400 bg-slate-50">
                          仅预览前 150 条记录。如需完整全量数据，请点击上方“导出 CSV (Excel)”直接下载！
                        </div>
                      )}
                    </div>
                  )}
                </div>

                <div className="px-6 py-3 bg-white border-t border-slate-100 flex justify-end">
                  <button type="button" onClick={() => setIsHistoryOpen(false)} className="px-6 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl">关闭</button>
                </div>
              </div>
            </div>
          )}

          {/* 弹窗 D: 科目配置管理 */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4 animate-fade-in">
              <div className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <div>
                    <h3 className="text-base font-bold text-slate-800">⚙️ 管理科目配置</h3>
                    <p className="text-[11px] text-slate-500">可设定科目代号、名称，并自由切换为【作业追踪类】或【事件备忘类】</p>
                  </div>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-red-500 text-xl font-bold px-2">&times;</button>
                </div>

                <div className="p-6 overflow-y-auto bg-slate-50/50 flex-1 space-y-3">
                  {tempSubjects.map((sub, idx) => (
                    <div key={idx} className="grid grid-cols-1 sm:grid-cols-12 gap-2 bg-white p-3 border border-slate-200 rounded-xl shadow-sm items-center">
                      <div className="sm:col-span-2">
                        <label className="block sm:hidden text-[10px] text-slate-400 font-bold mb-1">代号</label>
                        <input type="text" placeholder="代号" value={sub.code} onChange={(e) => handleSubjectRowChange(idx, 'code', e.target.value.toUpperCase())} className="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded-lg uppercase font-bold" />
                      </div>
                      <div className="sm:col-span-3">
                        <label className="block sm:hidden text-[10px] text-slate-400 font-bold mb-1">中文名称</label>
                        <input type="text" placeholder="中文" value={sub.zh} onChange={(e) => handleSubjectRowChange(idx, 'zh', e.target.value)} className="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded-lg" />
                      </div>
                      <div className="sm:col-span-3">
                        <label className="block sm:hidden text-[10px] text-slate-400 font-bold mb-1">国文名称</label>
                        <input type="text" placeholder="国文" value={sub.ms} onChange={(e) => handleSubjectRowChange(idx, 'ms', e.target.value)} className="w-full px-2.5 py-1.5 text-xs border border-slate-200 rounded-lg" />
                      </div>
                      <div className="sm:col-span-3">
                        <label className="block sm:hidden text-[10px] text-slate-400 font-bold mb-1">科目属性</label>
                        <select value={-slate-400 font-bold mb-1">科目属性</label>
                        <select value={sub.type || 'homework'} onChange={(e) => handleSubjectRowChange(idx, 'type', e.target.value)} className="w-full px-2 py-1.5 text-xs border border-slate-200 rounded-lg font-bold">
                          <option value="homework">📚 作业追踪类</option>
                          <option value="event">📌 事件备忘类</option>
                        </select>
                      </div>
                      <div className="sm:col-span-1 flex justify-end">
                        <button type="button" onClick={() => handleDeleteSubjectRow(sub.code, idx)} className="w-8 h-8 flex items-center justify-center bg-red-50 text-red-500 hover:bg-red-500 hover:text-white rounded-lg transition-colors" title="彻底删除此科目">
                          🗑️
                        </button>
                      </div>
                    </div>
                  ))}

                  <button type="button" onClick={() => setTempSubjects([...tempSubjects, { code: '', zh: '', ms: '', type: 'homework' }])} className="mt-4 w-full py-3 border-2 border-dashed border-indigo-200 text-indigo-600 hover:bg-indigo-50 rounded-xl font-bold text-xs transition-colors">
                    ➕ 新增一行科目
                  </button>
                </div>

                <div className="px-6 py-4 bg-white border-t border-slate-100 flex justify-end space-x-3">
                  <button type="button" onClick={() => setIsSettingsOpen(false)} className="px-5 py-2 text-xs font-medium text-slate-600 hover:bg-slate-100 rounded-xl">取消</button>
                  <button type="button" onClick={saveSettings} className="px-6 py-2 text-xs font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md">💾 确认保存</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error("ErrorBoundary caught:", error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="max-w-md mx-auto my-12 p-6 bg-red-50 border border-red-200 rounded-2xl text-center shadow-lg">
              <div className="text-4xl mb-3">⚠️</div>
              <h2 className="text-lg font-bold text-red-800 mb-2">界面渲染发生异常</h2>
              <p className="text-xs text-red-600 mb-4 font-mono bg-white p-3 rounded-xl border border-red-100 text-left overflow-auto max-h-40">
                {String(this.state.error?.message || this.state.error)}
              </p>
              <button onClick={() => window.location.reload()} className="px-5 py-2 bg-red-600 hover:bg-red-700 text-white text-xs font-bold rounded-xl shadow transition-all">
                刷新页面重试
              </button>
            </div>
          );
        }
        return this.props.children;
      }
    }

    const rootElement = document.getElementById('root');
    const reactRoot = ReactDOM.createRoot(rootElement);
    reactRoot.render(
      <ErrorBoundary>
        <App />
      </ErrorBoundary>
    );
  </script>
</body>
</html>
