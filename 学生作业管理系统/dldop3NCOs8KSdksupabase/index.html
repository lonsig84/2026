<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>学生作业管理系统 (Supabase版)</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <!-- 引入 Supabase 官方 SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-in { animation: fadeIn 0.4s ease-out forwards; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // =========================================================================
    // ⚠️ 请填入你的 Supabase 项目参数
    // =========================================================================
    const SUPABASE_URL = "https://fmecxejzfagtdlxcxymk.supabase.co"; 
    const SUPABASE_KEY = "sb_publishable__WW7bNpZdQUOXDFDEBDBYQ_-6bhu76T"; 

    // 系统访问密码
    const SYSTEM_PASSWORD = "8888"; 

    // 初始化 Supabase 客户端
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function App() {
      const [isAuthenticated, setIsAuthenticated] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');

      const [subjectMap, setSubjectMap] = useState(null); 
      const [currentTab, setCurrentTab] = useState('');
      const [allStudents, setAllStudents] = useState([]);
      const [pendingRecords, setPendingRecords] = useState([]);
      
      const todayYYYYMMDD = new Date().toLocaleDateString('en-CA'); 
      const [recordDate, setRecordDate] = useState(todayYYYYMMDD);
      const [homeworkName, setHomeworkName] = useState('');
      const [selectedStudents, setSelectedStudents] = useState({});
      const [activeStudentInput, setActiveStudentInput] = useState(null);

      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);
      const [recentFilter, setRecentFilter] = useState('all');
      const [syncingIds, setSyncingIds] = useState(new Set());
      const resolveQueueRef = useRef(new Set());
      const resolveTimerRef = useRef(null);

      const [isSettingsOpen, setIsSettingsOpen] = useState(false);
      const [tempSubjects, setTempSubjects] = useState([]);

      const showToast = (msg) => {
        setToast(msg);
        setTimeout(() => setToast(null), 3000);
      };

      // 处理登录
      const handleLogin = (e) => {
        e.preventDefault();
        if (passwordInput === SYSTEM_PASSWORD) {
          setIsAuthenticated(true);
          loadInitialData();
        } else {
          showToast('❌ 密码错误，请重试');
          setPasswordInput('');
        }
      };

      // 从 Supabase 加载初始数据
      const loadInitialData = async () => {
        setLoading(true);
        try {
          const [subRes, stuRes, recRes] = await Promise.all([
            supabase.from('subjects').select('*').order('sort_order', { ascending: true }),
            supabase.from('students').select('*'),
            supabase.from('homework_records').select('*').eq('status', 'Pending').order('record_date', { ascending: false })
          ]);

          if (subRes.error || stuRes.error || recRes.error) {
            showToast('❌ 读取数据库失败: ' + (subRes.error?.message || stuRes.error?.message || recRes.error?.message));
            setLoading(false);
            return;
          }

          const map = {};
          (subRes.data || []).forEach(s => {
            map[s.code] = { zh: s.name_zh, ms: s.name_ms };
          });
          setSubjectMap(map);

          setAllStudents((stuRes.data || []).map(s => ({ subject: s.subject, name: s.student_name })));

          setPendingRecords((recRes.data || []).map(r => ({
            id: r.id,
            date: r.record_date, // YYYY-MM-DD
            subject: r.subject,
            homework: r.homework,
            student: r.student_name,
            reason: r.reason
          })));

          const subjects = Object.keys(map);
          if (subjects.length > 0 && !currentTab) setCurrentTab(subjects[0]);
        } catch (err) {
          console.error(err);
          showToast('❌ 网络错误，请重试');
        }
        setLoading(false);
      };

      // 实时订阅 Realtime（多设备即时同步：手机改了，电脑自动变）
      useEffect(() => {
        if (!isAuthenticated) return;
        const channel = supabase
          .channel('db_changes')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'homework_records' }, () => {
            loadInitialData();
          })
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
        };
      }, [isAuthenticated]);

      // 日期计算辅助函数 (支持 YYYY-MM-DD 与 DD/MM/YYYY)
      const parseDate = (dateStr) => {
        if (!dateStr) return null;
        if (dateStr.includes('-')) {
          const [y, m, d] = dateStr.split('-').map(Number);
          return new Date(y, m - 1, d);
        }
        if (dateStr.includes('/')) {
          const [d, m, y] = dateStr.split('/').map(Number);
          return new Date(y, m - 1, d);
        }
        return new Date(dateStr);
      };

      const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const todayStart = startOfDay(new Date());

      const getDayDiff = (dateStr) => {
        const d = parseDate(dateStr);
        if (!d) return null;
        return Math.floor((todayStart - startOfDay(d)) / 86400000);
      };

      const formatDateDisplay = (dateStr) => {
        const d = parseDate(dateStr);
        if (!d) return dateStr;
        const day = String(d.getDate()).padStart(2, '0');
        const month = String(d.getMonth() + 1).padStart(2, '0');
        const year = d.getFullYear();
        return `${day}/${month}/${year}`;
      };

      // 登录界面
      if (!isAuthenticated) {
        return (
          <div className="flex justify-center items-center h-screen px-4 bg-slate-100">
            {toast && <div className="fixed top-6 left-1/2 -translate-x-1/2 bg-red-600 text-white px-5 py-3 rounded-xl text-sm font-bold shadow-2xl z-[110] animate-bounce">{toast}</div>}
            <div className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-sm animate-fade-in text-center border border-slate-200">
              <div className="text-5xl mb-4">🔐</div>
              <h2 className="text-xl font-bold text-slate-800 mb-2">系统访问验证</h2>
              <p className="text-xs text-slate-500 mb-6">请输入管理员密码以进入作业管理系统</p>
              <form onSubmit={handleLogin} className="space-y-4">
                <input 
                  type="password" 
                  value={passwordInput} 
                  onChange={(e) => setPasswordInput(e.target.value)} 
                  className="w-full px-4 py-3 text-center tracking-widest text-lg border-2 border-slate-200 rounded-xl focus:border-indigo-500 focus:outline-none" 
                  placeholder="••••" 
                  autoFocus 
                />
                <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-colors shadow-md">
                  进入系统
                </button>
              </form>
            </div>
          </div>
        );
      }

      if (!subjectMap) {
        return <div className="flex justify-center items-center h-screen"><div className="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div></div>;
      }

      const subjectList = Object.keys(subjectMap);
      const currentStudents = allStudents.filter(s => s.subject === currentTab);
      const currentPending = pendingRecords.filter(r => r.subject === currentTab);

      const recentPending = currentPending.filter(r => {
        const diff = getDayDiff(r.date);
        return diff !== null && diff >= 0 && diff <= 4;
      });

      const filterOptions = [
        { key: 'all', label: '总览' },
        { key: '0', label: '今天' },
        { key: '1', label: '昨天' },
        { key: '2', label: '前天' },
        { key: '3', label: '3天前' },
        { key: '4', label: '4天前' }
      ];

      const filteredRecentPending = recentFilter === 'all'
        ? recentPending
        : recentPending.filter(r => String(getDayDiff(r.date)) === recentFilter);

      const filteredByStudent = currentStudents
        .map(student => ({
          student,
          records: filteredRecentPending.filter(r => r.student === student.name)
        }))
        .filter(group => group.records.length > 0);

      const getUniqueStudentCount = (records) => new Set(records.map(r => r.student)).size;
      const getFilterCount = (key) => {
        if (key === 'all') return getUniqueStudentCount(recentPending);
        return getUniqueStudentCount(recentPending.filter(r => String(getDayDiff(r.date)) === key));
      };

      const handleToggleStudent = (studentName) => {
        if (selectedStudents.hasOwnProperty(studentName)) {
          const updated = { ...selectedStudents };
          delete updated[studentName];
          setSelectedStudents(updated);
          if (activeStudentInput === studentName) setActiveStudentInput(null);
        } else {
          setSelectedStudents({ ...selectedStudents, [studentName]: '没做' });
          setActiveStudentInput(studentName);
        }
      };

      const handleReasonChange = (studentName, reason) => {
        setSelectedStudents({ ...selectedStudents, [studentName]: reason });
      };

      // 提交到 Supabase
      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!recordDate) return showToast('⚠️ 请选择日期！');
        if (!homeworkName.trim()) return showToast('⚠️ 请先输入功课名称！');
        const studentKeys = Object.keys(selectedStudents);
        if (studentKeys.length === 0) return showToast('⚠️ 请至少选择一位未交功课的学生！');

        setLoading(true);

        const recordsToInsert = studentKeys.map(name => ({
          id: `REC_${Date.now()}_${Math.floor(Math.random() * 1000)}`,
          record_date: recordDate,
          subject: currentTab,
          homework: homeworkName.trim(),
          student_name: name,
          reason: selectedStudents[name],
          status: 'Pending'
        }));

        const { data, error } = await supabase.from('homework_records').insert(recordsToInsert).select();

        if (!error) {
          const newEntries = (data || recordsToInsert).map(r => ({
            id: r.id,
            date: r.record_date,
            subject: r.subject,
            homework: r.homework,
            student: r.student_name,
            reason: r.reason
          }));
          setPendingRecords(prev => [...newEntries, ...prev]);
          setHomeworkName('');
          setSelectedStudents({});
          setActiveStudentInput(null);
          showToast('✅ 成功录入未交记录！');
        } else {
          showToast('❌ 录入失败: ' + error.message);
        }
        setLoading(false);
      };

      // 批量将记录标记为 Resolved (已补交)
      const flushResolveQueue = async () => {
        const ids = Array.from(resolveQueueRef.current);
        if (ids.length === 0) return;

        resolveQueueRef.current.clear();
        resolveTimerRef.current = null;

        const { error } = await supabase
          .from('homework_records')
          .update({ status: 'Resolved' })
          .in('id', ids);

        if (error) {
          showToast(`⚠️ 同步失败，请刷新检查: ${error.message}`);
        }

        setSyncingIds(prev => {
          const next = new Set(prev);
          ids.forEach(id => next.delete(id));
          return next;
        });
      };

      const handleResolve = (recordId) => {
        if (syncingIds.has(recordId) || resolveQueueRef.current.has(recordId)) return;

        setSyncingIds(prev => {
          const next = new Set(prev);
          next.add(recordId);
          return next;
        });

        // 界面秒删，流畅无卡顿
        setPendingRecords(prev => prev.filter(r => r.id !== recordId));
        resolveQueueRef.current.add(recordId);

        if (resolveTimerRef.current) clearTimeout(resolveTimerRef.current);
        resolveTimerRef.current = setTimeout(flushResolveQueue, 500);
      };

      // 生成催交/表扬信息 (支持双语)
      const handleGenerateMessage = () => {
        const todayStr = new Date().toLocaleDateString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit' }).replace(/\//g, '/');
        const subInfo = subjectMap[currentTab] || { zh: currentTab, ms: currentTab };

        if (currentPending.length === 0) {
          const praiseMsg = `📅 日期 / Tarikh Semasa: ${todayStr}\n\n今日【${subInfo.zh} ${currentTab}】功课全班皆已安全完成，感谢各位家长的悉心督促！\nSemua murid telah menyiapkan kerja sekolah bagi mata pelajaran 【${subInfo.ms}】. Terima kasih atas kerjasama ibu bapa! ❤️`;
          navigator.clipboard.writeText(praiseMsg).then(() => showToast('📋 全班齐交！赞美信息已复制'));
          return;
        }

        const grouped = {};
        currentPending.forEach(r => {
          if (!grouped[r.student]) grouped[r.student] = [];
          grouped[r.student].push(r);
        });

        let msg = `📅 日期 / Tarikh Semasa: ${todayStr}\n\n各位家长好，以下是【${subInfo.zh} ${currentTab}】尚未完成功课的学生名单，请家长多加关注及督促孩子的学习，谢谢配合。\nSalam sejahtera ibu bapa, berikut adalah senarai murid yang belum menyiapkan kerja sekolah bagi mata pelajaran 【${subInfo.ms}】. Mohon kerjasama ibu bapa untuk memantau pembelajaran anak anda. Terima kasih.\n\n`;

        Object.keys(grouped).forEach((student, index) => {
          msg += `👤 ${index + 1}. ${student}\n`;
          grouped[student].forEach(r => { msg += `   - ${r.homework} (欠交日期: ${formatDateDisplay(r.date)}, 原因: ${r.reason})\n`; });
          msg += `\n`;
        });

        navigator.clipboard.writeText(msg.trim()).then(() => showToast('📋 催交信息已复制，快去 WhatsApp 粘贴吧！')).catch(() => showToast('❌ 复制失败'));
      };

      // 科目设置
      const openSettings = () => {
        const currentArr = Object.keys(subjectMap).map(key => ({ code: key, zh: subjectMap[key].zh, ms: subjectMap[key].ms }));
        setTempSubjects(currentArr);
        setIsSettingsOpen(true);
      };

      const handleSubjectChange = (index, field, value) => {
        const newSubjects = [...tempSubjects];
        newSubjects[index][field] = value;
        setTempSubjects(newSubjects);
      };

      const saveSettings = async () => {
        const invalid = tempSubjects.some(s => !s.code.trim());
        if (invalid) return showToast('⚠️ 科目代号不能为空！');

        setLoading(true);
        const rows = tempSubjects.map((s, idx) => ({
          code: s.code.trim().toUpperCase(),
          name_zh: s.zh.trim(),
          name_ms: s.ms.trim(),
          sort_order: idx + 1
        }));

        const { error } = await supabase.from('subjects').upsert(rows);
        if (!error) {
          const map = {};
          rows.forEach(s => { map[s.code] = { zh: s.name_zh, ms: s.name_ms }; });
          setSubjectMap(map);
          setIsSettingsOpen(false);
          showToast('✅ 科目更新成功！');
        } else {
          showToast('❌ 保存失败: ' + error.message);
        }
        setLoading(false);
      };

      return (
        <div className="max-w-4xl mx-auto p-4 md:p-6 pb-24 relative animate-fade-in">
          <header className="mb-6 text-center">
            <h1 className="text-2xl md:text-3xl font-bold text-slate-800 tracking-wide">📝 学生作业跟踪管理系统</h1>
          </header>

          {loading && (
            <div className="fixed inset-0 bg-slate-900/30 backdrop-blur-sm flex items-center justify-center z-[100]">
              <div className="bg-white px-6 py-4 rounded-xl shadow-lg flex items-center space-x-3">
                <div className="w-5 h-5 border-2 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                <span className="text-slate-700 font-medium text-sm">正在同步云端数据...</span>
              </div>
            </div>
          )}

          {toast && (
            <div className="fixed top-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-xl text-sm font-bold shadow-2xl z-[110]">{toast}</div>
          )}

          <div className="flex items-center space-x-2 bg-slate-200 p-1.5 rounded-xl mb-6 shadow-sm overflow-x-auto">
            {subjectList.map(tab => (
              <button key={tab} type="button" onClick={() => { setCurrentTab(tab); setSelectedStudents({}); setActiveStudentInput(null); setRecentFilter('all'); }} className={`flex-1 min-w-[90px] py-3 px-2 text-center text-sm sm:text-base font-bold rounded-lg transition-all duration-200 ${currentTab === tab ? 'bg-white text-indigo-600 shadow-md scale-[1.02]' : 'text-slate-600 hover:bg-white/50'}`}>
                {tab} ({subjectMap[tab]?.zh})
              </button>
            ))}
            <button onClick={openSettings} className="min-w-[48px] h-[48px] flex items-center justify-center bg-slate-300 hover:bg-indigo-100 text-slate-600 hover:text-indigo-600 rounded-lg transition-colors ml-1" title="管理科目">⚙️</button>
          </div>

          <div className="grid grid-cols-1 gap-6">
            <section className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
              <h2 className="text-base font-bold text-slate-700 mb-4 flex items-center"><span className="w-2.5 h-2.5 bg-amber-500 rounded-full mr-2"></span>新增未交作业</h2>
              <form onSubmit={handleSubmit} className="space-y-4">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">1. 选择日期</label>
                    <input type="date" value={recordDate} onChange={(e) => setRecordDate(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 text-sm transition-all" />
                  </div>
                  <div>
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5">2. 输入功课名称</label>
                    <input type="text" placeholder="例如: 活动本下册 M/S 14" value={homeworkName} onChange={(e) => setHomeworkName(e.target.value)} className="w-full px-4 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:border-indigo-500 text-sm transition-all" />
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1.5 mt-2">3. 点击未完成的学生名字 ({currentStudents.length} 人)</label>
                  {currentStudents.length === 0 ? (
                    <p className="text-xs text-amber-600 bg-amber-50 p-3 rounded-xl border border-dashed border-amber-300">💡 该科目暂无学生名单，请在 Supabase 的 students 表中添加。</p>
                  ) : (
                    <div className="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-2">
                      {currentStudents.map(student => {
                        const isSelected = selectedStudents.hasOwnProperty(student.name);
                        return (
                          <button type="button" key={student.name} onClick={() => handleToggleStudent(student.name)} className={`py-2 px-3 text-xs font-medium rounded-xl border transition-all duration-150 ${isSelected ? 'bg-red-50 text-red-600 border-red-300 ring-2 ring-red-100 font-bold' : 'bg-white text-slate-600 border-slate-200 hover:border-slate-300 hover:bg-slate-50'}`}>
                            {student.name}
                          </button>
                        );
                      })}
                    </div>
                  )}
                </div>

                {Object.keys(selectedStudents).length > 0 && (
                  <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <label className="block text-xs font-bold text-slate-500 uppercase tracking-wider">4. 快速配置欠交原因</label>
                    <div className="flex flex-wrap gap-1.5 mb-2">
                      {Object.keys(selectedStudents).map(name => (
                        <button type="button" key={name} onClick={() => setActiveStudentInput(name)} className={`px-3 py-1.5 text-xs rounded-lg transition-all ${activeStudentInput === name ? 'bg-indigo-600 text-white font-bold shadow-sm' : 'bg-white text-slate-600 border border-slate-300 hover:bg-slate-100'}`}>
                          {name}: {selectedStudents[name]}
                        </button>
                      ))}
                    </div>
                    {activeStudentInput && selectedStudents.hasOwnProperty(activeStudentInput) && (
                      <div className="flex flex-col sm:flex-row items-start sm:items-center gap-2 bg-white p-3 rounded-lg border border-slate-300 shadow-sm">
                        <span className="text-xs font-bold text-slate-600 whitespace-nowrap">为 【{activeStudentInput}】 修改:</span>
                        <input type="text" value={selectedStudents[activeStudentInput]} onChange={(e) => handleReasonChange(activeStudentInput, e.target.value)} className="w-full sm:flex-1 px-3 py-1.5 rounded border border-slate-300 text-xs focus:outline-none focus:border-indigo-500" />
                        <div className="flex gap-1.5 flex-wrap">
                          {['没做', '没带', '不完整', '不认真重做'].map(text => (
                            <button type="button" key={text} onClick={() => handleReasonChange(activeStudentInput, text)} className="px-2.5 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-[11px] rounded font-medium border border-slate-200">{text}</button>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                )}
                <button type="submit" className="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-xl text-sm transition-all shadow-md active:scale-[0.99]">📥 提交到未交排行榜</button>
              </form>
            </section>

            <section className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
              <div className="border-b border-slate-100 pb-4 mb-4">
                <h2 className="text-base font-bold text-slate-700 flex items-center mb-3"><span className="w-2.5 h-2.5 bg-emerald-500 rounded-full mr-2"></span>📅【{currentTab}】近5天未完成</h2>
                <div className="flex flex-wrap gap-2">
                  {filterOptions.map(opt => (
                    <button key={opt.key} type="button" onClick={() => setRecentFilter(opt.key)} className={`px-3 py-2 rounded-xl text-xs font-bold border transition-all ${recentFilter === opt.key ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}>
                      {opt.label} {getFilterCount(opt.key)}人
                    </button>
                  ))}
                </div>
              </div>

              {filteredByStudent.length === 0 ? (
                <div className="text-center py-8"><span className="text-3xl inline-block mb-2">🎉</span><p className="text-sm text-slate-500 font-medium">这个范围内没有未完成作业。</p></div>
              ) : (
                <div className="space-y-4">
                  {filteredByStudent.map(({ student, records }) => (
                    <div key={student.name} className="bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm">
                      <div className="text-sm font-bold text-slate-800 mb-3 flex items-center justify-between gap-2">
                        <span><span className="mr-1.5">👤</span>{student.name}</span>
                        <span className="text-[10px] text-slate-500 bg-white border border-slate-200 px-2 py-0.5 rounded-full">共 {records.length} 项</span>
                      </div>
                      <div className="space-y-2">
                        {.map(diff => {
                          const dayRecords = records.filter(r => getDayDiff(r.date) === diff);
                          if (dayRecords.length === 0) return null;
                          return (
                            <div key={diff} className="border-t first:border-t-0 border-slate-200/70 pt-2 first:pt-0">
                              <div className="text-[11px] font-bold text-slate-500 mb-1.5">{diff === 0 ? '今天' : diff === 1 ? '昨天' : diff === 2 ? '前天' : diff === 3 ? '3天前' : '4天前'}</div>
                              <div className="space-y-2">
                                {dayRecords.map(record => (
                                  <div key={record.id} className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 bg-white border border-slate-200 rounded-lg p-2.5">
                                    <div className="flex-1 min-w-0">
                                      <div className="font-semibold text-indigo-900 text-xs">{record.homework}</div>
                                      <div className="text-[11px] text-slate-500 mt-1">{formatDateDisplay(record.date)}{record.reason ? ` · 原因: ${record.reason}` : ''}</div>
                                    </div>
                                    <button type="button" onClick={() => handleResolve(record.id)} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-4 py-2 rounded-lg border border-emerald-300 transition-colors shrink-0">✓ 已补交</button>
                                  </div>
                                ))}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>

            <section className="bg-white p-5 rounded-2xl shadow-sm border border-slate-200">
              <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between border-b border-slate-100 pb-4 mb-4 gap-3">
                <h2 className="text-base font-bold text-slate-700 flex items-center"><span className="w-2.5 h-2.5 bg-indigo-500 rounded-full mr-2"></span>【{currentTab}】未交作业追踪榜 ({currentPending.length} 项)</h2>
                <button type="button" onClick={handleGenerateMessage} className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition-all shadow-md active:scale-[0.98]">📋 复制本堂催交双语信息</button>
              </div>
              {currentPending.length === 0 ? (
                <div className="text-center py-10"><span className="text-4xl inline-block mb-3">🎉</span><p className="text-sm text-slate-500 font-medium">太棒了！当前没有任何未交作业旧账。</p></div>
              ) : (
                <div className="space-y-4">
                  {Object.entries(currentPending.reduce((acc, cur) => { if (!acc[cur.student]) acc[cur.student] = []; acc[cur.student].push(cur); return acc; }, {})).map(([studentName, records]) => (
                    <div key={studentName} className="bg-slate-50 p-4 rounded-xl border border-slate-200 shadow-sm">
                      <div className="text-sm font-bold text-slate-800 mb-3 flex items-center">
                        <span className="mr-1.5">👤</span> {studentName} <span className="ml-2 text-[10px] bg-red-100 text-red-700 px-2 py-0.5 rounded-full border border-red-200 font-bold">欠 {records.length} 项</span>
                      </div>
                      <div className="divide-y divide-slate-200/60">
                        {records.map(record => (
                          <div key={record.id} className="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-3 text-xs">
                            <div className="space-y-1.5 flex-1">
                              <span className="font-semibold text-indigo-900 bg-indigo-50 border border-indigo-100 px-2 py-1 rounded mr-2 text-[12px] inline-block">{record.homework}</span>
                              <span className="text-slate-500 font-medium">({formatDateDisplay(record.date)})</span>
                              {record.reason && <p className="text-slate-600 bg-white inline-block px-2 py-0.5 rounded border border-slate-100 ml-0 sm:ml-2 mt-1 sm:mt-0">原因: {record.reason}</p>}
                            </div>
                            <button type="button" onClick={() => handleResolve(record.id)} className="bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold px-4 py-2 rounded-lg border border-emerald-300 transition-colors shrink-0">✓ 已补交</button>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </div>

          {/* 科目配置弹窗 */}
          {isSettingsOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex justify-center items-center p-4">
              <div className="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
                <div className="px-6 py-4 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                  <h3 className="text-lg font-bold text-slate-800">⚙️ 管理科目配置</h3>
                  <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-red-500 text-xl font-bold px-2">&times;</button>
                </div>
                <div className="p-6 overflow-y-auto bg-slate-50/50">
                  <div className="space-y-3">
                    {tempSubjects.map((sub, idx) => (
                      <div key={idx} className="grid grid-cols-1 sm:grid-cols-12 gap-2 bg-white p-3 sm:p-1 border border-slate-200 sm:border-none rounded-xl sm:rounded-none relative">
                        <div className="sm:col-span-3"><input type="text" placeholder="代号" value={sub.code} onChange={(e) => handleSubjectChange(idx, 'code', e.target.value.toUpperCase())} className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg uppercase font-bold" /></div>
                        <div className="sm:col-span-4"><input type="text" placeholder="中文" value={sub.zh} onChange={(e) => handleSubjectChange(idx, 'zh', e.target.value)} className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg" /></div>
                        <div className="sm:col-span-4"><input type="text" placeholder="国文" value={sub.ms} onChange={(e) => handleSubjectChange(idx, 'ms', e.target.value)} className="w-full px-3 py-2 text-sm border border-slate-200 rounded-lg" /></div>
                        <div className="sm:col-span-1 flex justify-end items-center absolute top-2 right-2 sm:relative sm:top-0 sm:right-0">
                          <button type="button" onClick={() => { const ns = [...tempSubjects]; ns.splice(idx,1); setTempSubjects(ns); }} className="w-8 h-8 flex items-center justify-center bg-red-50 text-red-500 hover:bg-red-500 hover:text-white rounded-lg">🗑️</button>
                        </div>
                      </div>
                    ))}
                  </div>
                  <button type="button" onClick={() => setTempSubjects([...tempSubjects, {code:'', zh:'', ms:''}])} className="mt-4 w-full py-3 border-2 border-dashed border-indigo-200 text-indigo-600 hover:bg-indigo-50 rounded-xl font-bold text-sm">➕ 新增一行科目</button>
                </div>
                <div className="px-6 py-4 bg-white border-t border-slate-100 flex justify-end space-x-3">
                  <button type="button" onClick={() => setIsSettingsOpen(false)} className="px-5 py-2.5 text-sm font-medium text-slate-600 hover:bg-slate-100 rounded-xl">取消</button>
                  <button type="button" onClick={saveSettings} className="px-6 py-2.5 text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md">💾 确认保存</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const rootElement = document.getElementById('root');
    const reactRoot = ReactDOM.createRoot(rootElement);
    reactRoot.render(<App />);
  </script>
</body>
</html>
