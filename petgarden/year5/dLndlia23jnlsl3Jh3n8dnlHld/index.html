<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>错误提示</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
        }
        .error-message {
            color: #d32f2f; /* 红色字体，适合错误提示 */
            font-size: 24px;
            font-weight: bold;
            padding: 20px;
            border: 1px solid #ffcdd2;
            background-color: #ffebee;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="error-message">
        有问题，something gone wrong
    </div>

</body>
</html>
