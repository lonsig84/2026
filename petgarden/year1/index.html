<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { backgroundImage: { 'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))', } } }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <style>
    body { user-select: none; -webkit-user-select: none; margin: 0; overflow: hidden; background-color: #f8fafc; }

    /* 喂养：爱心喷发上浮 */
    @keyframes floatUpBurst {
      0% { transform: translateY(0) scale(0.5); opacity: 1; }
      100% { transform: translateY(-160px) scale(1.5); opacity: 0; }
    }
    /* 扣分：心碎掉落 */
    @keyframes dropDown {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(100px) scale(0.8); opacity: 0; }
    }
    /* 扣分：左右摇晃震动 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-3deg); }
      50% { transform: translateX(8px) rotate(3deg); }
      75% { transform: translateX(-8px) rotate(-3deg); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }
    @keyframes spinSlow { 100% { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spinSlow 6s linear infinite; }
    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .animate-bounce-in { animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ========================================================
    // 🚀 核心基建：全栈分离后的 API 通信引擎
    // ========================================================
    // ⚠️ 请在这里填入你部署后获取到的 Google Apps Script Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbw41cR5v5EoKkTXVpd_88oLb33gVNYEVV6xA1rMhstnZTBkqHDki0KBVcKQ5OKed6iZWQ/exec"; 

    // 统一的 fetchGAS 通信引擎，完美替代 google.script.run
    const fetchGAS = async (action, payload = {}) => {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          // ⚠️ 核心技巧：使用 text/plain 绕过复杂的 CORS 预检
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          // 将 action 注入数据包，对应后端的 switch(action)
          body: JSON.stringify({ action, ...payload }),
        });
        const result = await response.json();
        if (result.error) throw new Error(result.error);
        return result;
      } catch (error) {
        console.error(`API 请求失败 [${action}]:`, error);
        throw error;
      }
    };

    // ========================================================
    // 🎵 全局常量与音频资源
    // ========================================================
    const LEVEL_THRESHOLDS = [0, 0, 10, 30, 60, 100, 150, 210, 280];
    const soundCheers = new Audio('https://actions.google.com/sounds/v1/crowds/female_crowd_celebration.ogg');
    const soundFeed = new Audio('https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    const soundLevelUp = new Audio('https://actions.google.com/sounds/v1/cartoon/magic_chime.ogg');
    const soundClaim = new Audio('https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
    const soundSad = new Audio('https://actions.google.com/sounds/v1/cartoon/slide_whistle_down.ogg');
    const HEART_EMOJIS = [' ❤️ ', ' 💖 ', ' 💗 ', ' 💓 ', ' 💞 ', ' 💕 ', ' 💘 ', ' 💝 ', ' ✨ ', ' 🌟 '];

    // --- 下方紧接着的是你原本的“积木 1：悬浮式底部导航栏 (BottomNav)” ---

// 积木 1：悬浮式底部导航栏 (BottomNav)
    function BottomNav({ onOpenModal }) {
      return (
        <div className="absolute bottom-6 w-[90%] max-w-md bg-white/80 backdrop-blur-md border border-white shadow-xl rounded-3xl p-2 flex justify-around items-center z-40">
          <button onClick={() => onOpenModal(null)} className="flex flex-col items-center p-2 text-indigo-600 transition-all hover:scale-110 active:scale-95">
            <span className="text-2xl mb-1"> 🏠 </span>
            <span className="text-[10px] font-bold">宠物园</span>
          </button>
          <button onClick={() => onOpenModal('history')} className="flex flex-col items-center p-2 text-slate-400 hover:text-indigo-500 transition-all hover:scale-110 active:scale-95">
            <span className="text-2xl mb-1"> 📜 </span>
            <span className="text-[10px] font-bold">足迹</span>
          </button>
          <button onClick={() => onOpenModal('leaderboard')} className="flex flex-col items-center p-2 text-slate-400 hover:text-amber-500 transition-all hover:scale-110 active:scale-95">
            <span className="text-2xl mb-1"> 🏆 </span>
            <span className="text-[10px] font-bold">荣誉榜</span>
          </button>
          <button onClick={() => onOpenModal('shop')} className="flex flex-col items-center p-2 text-slate-400 hover:text-pink-500 transition-all hover:scale-110 active:scale-95">
            <span className="text-2xl mb-1"> 🛍️ </span>
            <span className="text-[10px] font-bold">兑换</span>
          </button>
          <button onClick={() => onOpenModal('memorial')} className="flex flex-col items-center p-2 text-slate-400 hover:text-amber-500 transition-all hover:scale-110 active:scale-95">
            <span className="text-2xl mb-1"> 🏅 </span>
            <span className="text-[10px] font-bold">纪念册</span>
          </button>
        </div>
      );
    }

    // 积木 2：精美的荣誉排行榜弹窗 (LeaderboardModal)
    function LeaderboardModal({ onClose, globalStudents, currentStudentName, levelThresholds, githubUser, githubRepo }) {
      const getCurrentLevel = (exp, petId) => {
        if (!petId) return 0;
        for (let i = levelThresholds.length - 1; i >= 1; i--) {
          if (exp >= levelThresholds[i]) return i;
        }
        return 1;
      };
      
      const sorted = [...globalStudents]
        .filter(s => s.petId)
        .sort((a, b) => {
          const aBadges = (a.petHistory || []).length;
          const bBadges = (b.petHistory || []).length;
          if (bBadges !== aBadges) return bBadges - aBadges;
          return b.totalExp - a.totalExp;
        });
        
      return (
        <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
          <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div className="p-4 bg-gradient-to-r from-amber-100 to-orange-100 flex justify-between items-center border-b border-amber-200">
              <h3 className="font-bold text-amber-900 text-lg"> 🏆 班级荣誉榜</h3>
              <button onClick={onClose} className="text-amber-700 hover:text-amber-900 text-2xl font-bold active:scale-90">&times;</button>
            </div>
            <div className="p-4 bg-slate-50 flex flex-col gap-3 max-h-96 overflow-y-auto">
              {sorted.length === 0 ? (
                <div className="text-center py-8 text-slate-400 font-medium">还没有同学领养宠物哦~</div>
              ) : (
                sorted.map((s, index) => {
                  const level = getCurrentLevel(s.totalExp, s.petId);
                  const petUrl = `https://cdn.jsdelivr.net/gh/${githubUser}/${githubRepo}/avatar/${s.petId}/${level}.webp`;
                  const isMe = s.name === currentStudentName;
                  const badgeCount = (s.petHistory || []).length;

                  return (
                    <div key={s.id} className={`flex items-center p-3 rounded-2xl border transition-all ${isMe ? 'bg-indigo-50 border-indigo-300 shadow-md' : index < 3 ? 'bg-gradient-to-r from-white to-amber-50 border-amber-300 shadow-md' : 'bg-white border-slate-200 shadow-sm'}`}>
                      <div className="w-8 font-black text-2xl text-center mr-2">
                        {index === 0 ? ' 🥇 ' : index === 1 ? ' 🥈 ' : index === 2 ? ' 🥉 ' : <span className="text-slate-400 text-lg">{index + 1}</span>}
                      </div>
                      <div className="w-10 h-10 rounded-xl bg-white border border-slate-100 flex items-center justify-center mr-2 shadow-sm overflow-hidden">
                        <img src={petUrl} className="w-8 h-8 object-contain" />
                      </div>
                      <div className="flex-1">
                        <div className="font-bold text-slate-700 text-sm flex items-center gap-1">
                          {s.name}
                          {isMe && <span className="text-[9px] bg-indigo-500 text-white px-1.5 py-0.5 rounded-full">我</span>}
                        </div>
                        <div className="text-xs text-indigo-500 font-bold"> 🎓 {badgeCount} · Lv.{level}</div>
                      </div>
                      <div className="font-black text-amber-500 text-sm">
                        {s.totalExp} <span className="text-[10px] font-normal text-slate-400">EXP</span>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </div>
      );
    }

    // 积木 3：成长足迹弹窗 (HistoryModal) - 🚀 核心改造：无缝接入 fetchGAS
    function HistoryModal({ onClose, studentName }) {
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);
      
      useEffect(() => {
        const loadHistory = async () => {
          try {
            const data = await fetchGAS('getStudentLogs', { studentName });
            setHistory(data);
          } catch (err) {
            console.error('读取足迹失败:', err);
          } finally {
            setLoading(false);
          }
        };
        loadHistory();
      }, [studentName]);

      return (
        <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
          <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div className="p-4 bg-gradient-to-r from-blue-100 to-indigo-100 flex justify-between items-center border-b border-blue-200">
              <h3 className="font-bold text-indigo-900 text-lg"> 📜 成长足迹</h3>
              <button onClick={onClose} className="text-indigo-700 hover:text-indigo-900 text-2xl font-bold active:scale-90">&times;</button>
            </div>
            <div className="p-4 bg-slate-50 flex flex-col gap-3 max-h-96 overflow-y-auto">
              {loading ? (
                <div className="text-center py-8 text-slate-400 font-medium">读取中...</div>
              ) : history.length === 0 ? (
                <div className="text-center py-8 text-slate-400 font-medium">还没有足迹哦~</div>
              ) : (
                history.map((record, index) => (
                  <div key={index} className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between transition-transform hover:scale-[1.02]">
                    <div className="flex-1">
                      <div className="font-bold text-slate-700">{record.reason}</div>
                      <div className="text-xs text-slate-500 mt-1">
                        {record.teacher} · {record.subject} · {record.date}
                      </div>
                    </div>
                    <div className={`font-black text-xl ${record.type === 'add' ? 'text-green-500' : 'text-red-500'}`}>
                      {record.type === 'add' ? '+' : ''}{record.points}
                    </div>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

    // 纪念册组件 (MemorialModal)
    function MemorialModal({ onClose, petHistory, githubUser, githubRepo }) {
      return (
        <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
          <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div className="p-4 bg-gradient-to-r from-amber-100 to-orange-100 flex justify-between items-center border-b border-amber-200">
              <h3 className="font-bold text-amber-900 text-lg"> 🏅 毕业纪念册</h3>
              <button onClick={onClose} className="text-amber-700 hover:text-amber-900 text-2xl font-bold active:scale-90">&times;</button>
            </div>
            <div className="p-4 bg-slate-50 max-h-96 overflow-y-auto">
              {petHistory.length === 0 ? (
                <div className="text-center py-8 text-slate-400 font-medium">还没有毕业的宠物哦~努力养成吧！</div>
              ) : (
                <div className="grid grid-cols-3 gap-3">
                  {petHistory.map((petId, index) => (
                    <div key={index} className="bg-white p-3 rounded-2xl border border-amber-200 shadow-sm flex flex-col items-center gap-2">
                      <div className="w-16 h-16 flex items-center justify-center bg-amber-50 rounded-xl border border-amber-100 p-1">
                        <img src={`https://cdn.jsdelivr.net/gh/${githubUser}/${githubRepo}/avatar/${petId}/8.webp`} alt={petId} className="max-w-full max-h-full object-contain" />
                      </div>
                      <span className="text-[10px] font-black text-amber-600"> 🎓 已毕业</span>
                    </div>
                  ))}
                </div>
              )}
            </div>
            <div className="p-3 bg-amber-50 text-center text-xs font-bold text-amber-700 border-t border-amber-100">
              已收集 {petHistory.length} 只毕业宠物 🏅
            </div>
          </div>
        </div>
      );
    }

    // 积木 4：兑换小屋弹窗 (ShopModal) - 🚀 核心改造：商品库存更新走 fetchGAS
    function ShopModal({ onClose, badges, onExchangeItem, globalProducts, setGlobalProducts }) {
      return (
        <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
          <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div className="p-4 bg-gradient-to-r from-pink-100 to-rose-100 flex justify-between items-center border-b border-pink-200">
              <h3 className="font-bold text-pink-900 text-lg"> 🛍️ 兑换小屋</h3>
              <button onClick={onClose} className="text-pink-700 hover:text-pink-900 text-2xl font-bold active:scale-90">&times;</button>
            </div>
            <div className="p-3 bg-pink-50 text-center text-sm font-bold text-pink-800 shadow-inner flex items-center justify-center gap-2">
              当前可用徽章: <span className="text-2xl text-amber-500">{badges}</span> 🏅
            </div>
            <div className="p-4 bg-slate-50 flex flex-col gap-3 max-h-80 overflow-y-auto">
              {globalProducts.length === 0 ? (
                <div className="text-center py-8 text-slate-400 font-medium">暂时没有商品哦~</div>
              ) : (
                globalProducts.map(item => (
                  <div key={item.id} className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between transition-transform hover:scale-[1.02]">
                    <div className="flex items-center gap-3">
                      <span className="text-3xl drop-shadow-sm">{item.icon}</span>
                      <div>
                        <span className="font-bold text-slate-700">{item.name}</span>
                        <p className="text-xs text-slate-400 mt-0.5">库存: {item.stock}</p>
                      </div>
                    </div>
                    <button
                      disabled={badges < item.cost || item.stock <= 0}
                      onClick={async () => {
                        const newStock = item.stock - 1;
                        // 先更新前端状态，保证体验流畅
                        setGlobalProducts(prev => prev.map(p => p.id === item.id ? { ...p, stock: newStock } : p));
                        
                        // 后台异步扣除库存
                        try {
                          await fetchGAS('updateProductStock', { id: item.id, newStock });
                        } catch(err) {
                          console.error('更新商品库存失败:', err);
                        }
                        onExchangeItem(item);
                      }}
                      className={`font-bold py-2 px-4 rounded-xl shadow-md transition-all active:scale-95 ${
                        badges >= item.cost && item.stock > 0
                          ? 'bg-pink-500 hover:bg-pink-600 text-white'
                          : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                      }`}
                    >
                      {item.stock <= 0 ? '已售完' : `${item.cost} 🏅 `}
                    </button>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

// 🧱 积木 5：终极科任老师面板 (动态增删小组 + 独立记账与双向充值完美融合版)
    function TeacherPanel({ onExit, subject, teacherName, rules, globalStudents }) {
      const [students, setStudents] = useState([]);

      useEffect(() => {
        setStudents(globalStudents.map(s => ({
          id: s.id,
          name: s.name,
          exp: s.totalExp || 0,
          totalScore: s.totalScore || 0,
          group: null 
        })));
      }, [globalStudents]);

      // ★ 核心改造：本科分数状态拉取
      const [subjectScores, setSubjectScores] = useState({});
      useEffect(() => {
        const loadSubjectScores = async () => {
          try {
            const scores = await fetchGAS('getStudentScoreByTeacher', { teacherName, subject });
            setSubjectScores(scores || {});
          } catch (err) {
            console.error('读取科目分失败:', err);
          }
        };
        loadSubjectScores();
      }, [teacherName, subject]);

      const [groupsList, setGroupsList] = useState([""]);
      const [newGroupName, setNewGroupName] = useState(""); 
      const [groupScores, setGroupScores] = useState("");
      const [groupIds, setGroupIds] = useState({});

      // ★ 核心改造：启动时读取该老师的分组
      useEffect(() => {
        const loadGroups = async () => {
          try {
            const data = await fetchGAS('getGroups', { teacherName });
            if (!data) return;
            const names = data.map(g => g.name);
            const scores = {};
            const ids = {};
            const memberMap = {};

            data.forEach(g => {
              scores[g.name] = g.score;
              ids[g.name] = g.id;
              memberMap[g.name] = g.members;
            });

            setGroupsList(names);
            setGroupScores(scores);
            setGroupIds(ids);

            setStudents(prev => prev.map(s => ({
              ...s,
              group: Object.keys(memberMap).find(gName => memberMap[gName].includes(s.name)) || null
            })));
          } catch (err) {
            console.error('读取分组失败:', err);
          }
        };
        loadGroups();
      }, [teacherName]);

      const RULES = rules || [];
      const [isEditMode, setIsEditMode] = useState(false); 
      const [selectedStudentIds, setSelectedStudentIds] = useState([]); 
      const [activeGroupForAssign, setActiveGroupForAssign] = useState("第一组"); 
      const [toastMsg, setToastMsg] = useState("");
      const [viewingStudent, setViewingStudent] = useState(null);   
      const [studentLogs, setStudentLogs] = useState([]);           
      const [logsLoading, setLogsLoading] = useState(false);        
      const [ruleFilter, setRuleFilter] = useState('all');  
      const [ruleSearch, setRuleSearch] = useState('');      

      const getGroupScore = (groupName) => {
        return groupScores[groupName] || 0;
      };

      const toggleSelectStudent = (id) => {
        if (isEditMode) return;
        if (selectedStudentIds.includes(id)) {
          setSelectedStudentIds(selectedStudentIds.filter(sId => sId !== id));
        } else {
          setSelectedStudentIds([...selectedStudentIds, id]);
        }
      };

      const toggleSelectGroupAll = (groupName) => {
        if (isEditMode) return;
        const groupStudentIds = students.filter(s => s.group === groupName).map(s => s.id);
        const allSelected = groupStudentIds.length > 0 && groupStudentIds.every(id => selectedStudentIds.includes(id));

        if (allSelected) {
          setSelectedStudentIds(selectedStudentIds.filter(id => !groupStudentIds.includes(id)));
        } else {
          const newSelected = [...selectedStudentIds, ...groupStudentIds.filter(id => !selectedStudentIds.includes(id))];
          setSelectedStudentIds(newSelected);
        }
      };

      // ★ 核心改造：升级打分函数 (异步更新云端)
      const handleScore = async (rule) => {
        if (selectedStudentIds.length === 0) return;
        new Audio('https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg').play();
        
        const affectedGroups = [...new Set(students.filter(s => selectedStudentIds.includes(s.id) && s.group).map(s => s.group))];

        // 实时更新分组分到前端与云端
        affectedGroups.forEach(gName => {
          const newScore = Math.max(0, (groupScores[gName] || 0) + rule.points);
          setGroupScores(prev => ({ ...prev, [gName]: newScore }));
          
          fetchGAS('updateGroup', {
            groupId: groupIds[gName],
            members: students.filter(s => s.group === gName).map(s => s.name),
            score: newScore
          }).catch(err => console.error('组分更新失败:', err));
        });

        // 实时更新学生前端分数
        setStudents(prev => prev.map(s => {
          if (selectedStudentIds.includes(s.id)) {
            return { ...s, exp: Math.max(0, s.exp + rule.points), totalScore: Math.max(0, (s.totalScore || 0) + rule.points) }; 
          }
          return s;
        }));

        setSubjectScores(prev => {
          const next = { ...prev };
          students.filter(s => selectedStudentIds.includes(s.id)).forEach(s => {
            next[s.name] = Math.max(0, (next[s.name] || 0) + rule.points);
          });
          return next;
        });

        // 记录 Logs 存入云端
        const selectedNames = students.filter(s => selectedStudentIds.includes(s.id)).map(s => s.name);
        try {
          await fetchGAS('addLogs', {
            teacher: teacherName,
            subject: subject,
            studentNames: selectedNames,
            points: rule.points,
            reason: rule.label
          });
        } catch (err) {
          console.error('Logs写入失败:', err);
        }

        const names = students.filter(s => selectedStudentIds.includes(s.id)).map(s => s.name).join(', ');
        setToastMsg(`已给【${names}】及所属小组同步下发：${rule.label} ${rule.points > 0 ? '+' : ''}${rule.points}分`);
        setTimeout(() => { setToastMsg(""); setSelectedStudentIds([]); }, 2000);
      };

      // 允许老师在管理模式下完全自主改写某组的总分
      const handleManualGroupScoreChange = (groupName, newScore) => {
        const parsedScore = Math.max(0, parseInt(newScore) || 0);
        setGroupScores(prev => ({ ...prev, [groupName]: parsedScore }));
        
        fetchGAS('updateGroup', {
          groupId: groupIds[groupName],
          members: students.filter(s => s.group === groupName).map(s => s.name),
          score: parsedScore
        }).catch(err => console.error('手动改分失败:', err));
      };

      // 将未分配的学生加入当前选中的小组
      const assignToGroup = (studentId) => {
        setStudents(prev => {
          const updated = prev.map(s => s.id === studentId ? { ...s, group: activeGroupForAssign } : s);
          const newMembers = updated.filter(s => s.group === activeGroupForAssign).map(s => s.name);
          
          fetchGAS('updateGroup', {
            groupId: groupIds[activeGroupForAssign],
            members: newMembers,
            score: groupScores[activeGroupForAssign] || 0
          }).catch(err => console.error('分配失败:', err));
          
          return updated;
        });
      };

      // 将学生踢出小组
      const removeFromGroup = (studentId) => {
        setStudents(prev => {
          const student = prev.find(s => s.id === studentId);
          const groupName = student?.group;
          const updated = prev.map(s => s.id === studentId ? { ...s, group: null } : s);
          
          if (groupName) {
            const newMembers = updated.filter(s => s.group === groupName).map(s => s.name);
            fetchGAS('updateGroup', {
              groupId: groupIds[groupName],
              members: newMembers,
              score: groupScores[groupName] || 0
            }).catch(err => console.error('踢出失败:', err));
          }
          return updated;
        });
        setSelectedStudentIds(selectedStudentIds.filter(id => id !== studentId));
      };

      // 添加新组
      const handleAddGroup = async () => {
        const trimmedName = newGroupName.trim();
        if (!trimmedName) return;
        if (groupsList.includes(trimmedName)) {
          alert("这个小组名字已经存在啦！");
          return;

        const newId = 'G_' + teacherName + '_' + Date.now();
        setGroupsList([...groupsList, trimmedName]);
        setGroupScores(prev => ({ ...prev, [trimmedName]: 0 }));
        setGroupIds(prev => ({ ...prev, [trimmedName]: newId }));
        setActiveGroupForAssign(trimmedName);
        setNewGroupName("");

        try {
          await fetchGAS('addGroup', { id: newId, name: trimmedName, teacherName });
        } catch (err) {
          console.error('建组写入云端失败:', err);
        }
      };

      // 删除组
      const handleDeleteGroup = async (groupName) => {
        if (!confirm(`确定要解散【${groupName}】吗？\n该组所有学生将自动退回到“未分配”状态。`)) return;

        setStudents(prev => prev.map(s => s.group === groupName ? { ...s, group: null } : s));
        const updatedList = groupsList.filter(g => g !== groupName);
        setGroupsList(updatedList);

        setGroupScores(prev => {
          const nextScores = { ...prev };
          delete nextScores[groupName];
          return nextScores;
        });
        
        if (activeGroupForAssign === groupName) {
          setActiveGroupForAssign(updatedList[0] || "");
        }

        try {
          await fetchGAS('deleteGroup', { groupId: groupIds[groupName] });
        } catch (err) {
          console.error('云端删组失败:', err);
        }
      };

      return (
        <div className="relative w-screen h-screen flex flex-col bg-slate-100 overflow-hidden">
          {/* 顶部状态栏 */}
          <div className="w-full bg-white shadow-sm p-4 flex justify-between items-center z-10">

              </button>
              <button onClick={onExit} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-bold active:scale-95">退出</button>
            </div>
          </div>
          
          {/* 核心内容区 */}
          <div className="flex-1 w-full max-w-5xl mx-auto p-4 flex flex-col gap-4 overflow-y-auto md:flex-row md:overflow-hidden">

            {/* 左侧/主体：小组大卡片展示区 */}
            <div className="flex-1 overflow-y-auto pr-1 space-y-4 min-h-[200px]">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {groupsList.map(groupName => {
                  const groupStudents = students.filter(s => s.group === groupName);
                  const isGroupAllSelected = groupStudents.length > 0 && groupStudents.every(s => selectedStudentIds.includes(s.id));

                  return (
                    <div key={groupName} className={`bg-white p-4 rounded-3xl border shadow-sm transition-all ${isGroupAllSelected ? 'border-indigo-400 bg-indigo-50/30' : 'border-slate-100'}`}>
                      {/* 小组头部 */}
                      <div className="flex justify-between items-center border-b border-slate-100 pb-2 mb-3">
                        <button
                          disabled={isEditMode || groupStudents.length === 0}
                          onClick={() => toggleSelectGroupAll(groupName)}
                          className={`font-black text-base flex items-center gap-1 ${isEditMode ? 'cursor-default text-slate-700' : 'text-indigo-900 hover:text-indigo-600'}`}
                        >
                          {!isEditMode && groupStudents.length > 0 && <span>{isGroupAllSelected ? " ☑️ " : " ⬜ "}</span>}
                          {groupName}
                        </button>

                        <div className="flex items-center gap-2">
                          {isEditMode ? (
                            <div className="flex items-center gap-1 bg-amber-50 border border-amber-200 rounded-xl px-2 py-1 animate-[fadeIn_0.15s_ease-out]">
                              <span className="text-[10px] font-black text-amber-800"> 🏆 独立分:</span>
                              <input
                                type="number"
                                value={getGroupScore(groupName)}
                                onChange={(e) => handleManualGroupScoreChange(groupName, e.target.value)}
                                className="w-14 text-center font-black text-xs bg-white border border-amber-300 rounded-md text-amber-900 focus:outline-none focus:border-amber-500 shadow-sm"
                              />

                          ) : (
                            <span className="bg-amber-100 text-amber-800 text-xs font-black px-2 py-1 rounded-full">
                              🏆 组总分: {getGroupScore(groupName)} 分
                            </span>
                          )}

                          {isEditMode && (
                            <button onClick={() => handleDeleteGroup(groupName)} className="text-rose-500 hover:text-rose-700 text-xs font-black bg-rose-50 px-2 py-1 rounded-md transition-all active:scale-90"> 🗑️ 删组</button>

                        </div>
                      </div>
                      
                      {/* 组内学生名单 */}
                      <div className="flex flex-wrap gap-2">
                        {groupStudents.length === 0 ? (

                            const isSelected = selectedStudentIds.includes(student.id);
                            return (
                              <div
                                key={student.id}
                                onClick={() => !isEditMode && toggleSelectStudent(student.id)}
                                className={`px-3 py-2 rounded-xl text-sm font-bold flex items-center gap-1 shadow-sm border transition-all ${
                                  isEditMode
                                    ? 'bg-slate-50 border-slate-200 text-slate-700'
                                    : isSelected
                                      ? 'bg-indigo-500 text-white border-indigo-600 scale-95'
                                      : 'bg-white hover:border-indigo-300 text-slate-600 cursor-pointer active:scale-95'
                                }`}
                              >
                                <span> 👤 {student.name}</span>
                                <span className={`text-[10px] px-1 rounded ${isSelected ? 'bg-indigo-600' : 'bg-slate-100 text-slate-400'}`}>{subjectScores[student.name] || 0}分</span>
                                
                                {/* ★ 核心改造：独立读取学生的足迹历史走 fetchGAS */}
                                <button
                                  onClick={async (e) => {
                                    e.stopPropagation();
                                    setViewingStudent(student.name);
                                    setLogsLoading(true);
                                    try {
                                      const data = await fetchGAS('getStudentLogsBySubject', { studentName: student.name, teacherName, subject });
                                      setStudentLogs(data || []);
                                    } catch (err) {
                                      console.error('读取记录失败:', err);
                                    } finally {
                                      setLogsLoading(false);
                                    }
                                  }}
                                  className="text-[10px] px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-500 hover:bg-indigo-100 font-bold"
                                >
                                  📋
                                </button>

                                {isEditMode && (
                                  <button onClick={(e) => { e.stopPropagation(); removeFromGroup(student.id); }} className="text-red-500 hover:text-red-700 font-black ml-1 text-xs">&times;</button>
                                )}
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            
            {/* 右侧：操作面板 */}
            <div className={`w-full md:w-80 bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex flex-col overflow-hidden md:max-h-none ${isEditMode ? '' : 'max-h-64'}`}>

              {/* 模式 A：日常打分控制台 */}
              {!isEditMode && (
                <div className="flex flex-col h-full relative">
                  {selectedStudentIds.length === 0 && (
                    <div className="absolute inset-0 bg-white/70 backdrop-blur-[1px] z-10 flex items-center justify-center text-center p-4">
                      <p className="bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-full shadow-lg animate-pulse"> 👈 请先在左边点击勾选学生或小组</p>
                    </div>
                  )}
                  <div className="flex gap-1 mb-3">
                    <button onClick={() => setRuleFilter('all')} className={`flex-1 py-1.5 rounded-xl text-xs font-bold transition-all ${ruleFilter === 'all' ? 'bg-slate-700 text-white' : 'bg-slate-100 text-slate-500'}`}>全部</button>
                    <button onClick={() => setRuleFilter('add')} className={`flex-1 py-1.5 rounded-xl text-xs font-bold transition-all ${ruleFilter === 'add' ? 'bg-emerald-500 text-white' : 'bg-emerald-50 text-emerald-600'}`}> 🟢 加分</button>
                    <button onClick={() => setRuleFilter('sub')} className={`flex-1 py-1.5 rounded-xl text-xs font-bold transition-all ${ruleFilter === 'sub' ? 'bg-rose-500 text-white' : 'bg-rose-50 text-rose-600'}`}> 🔴 扣分</button>
                  </div>
                  <input
                    type="text"
                    value={ruleSearch}
                    onChange={e => setRuleSearch(e.target.value)}
                    placeholder="搜索规则..."
                    className="w-full px-3 py-1.5 mb-2 border border-slate-200 rounded-xl text-xs font-bold focus:outline-none focus:border-indigo-500 bg-slate-50 shadow-inner"
                  />
                  <div className="grid grid-cols-1 gap-2 flex-1 overflow-y-auto">
                    {RULES.filter(rule => (ruleFilter === 'all' || rule.type === ruleFilter) && (ruleSearch === '' || rule.label.includes(ruleSearch))).map(rule => (
                      <button
                        key={rule.id} onClick={() => handleScore(rule)}
                        className={`flex items-center justify-between p-3 rounded-2xl border-2 transition-all active:scale-95 ${rule.type === 'add' ? 'bg-emerald-50/50 border-emerald-100 text-emerald-800 hover:bg-emerald-100' : 'bg-rose-50/50 border-rose-100 text-rose-800 hover:bg-rose-100'}`}
                      >
                        <div className="flex items-center gap-2">
                          <span className="text-2xl">{rule.icon}</span>
                          <span className="font-bold text-sm">{rule.label}</span>
                        </div>
                        <span className="font-black text-sm">{rule.points > 0 ? '+' : ''}{rule.points} 🍎 </span>
                      </button>
                    ))}
                  </div>
                </div>
              )}
              
              {/* 模式 B：管理分组控制台 */}
              {isEditMode && (
                <div className="flex flex-col h-full gap-4 overflow-hidden">
                  {/* 新建小组的输入区 */}
                  <div className="bg-slate-50 p-3 rounded-2xl border border-slate-200">
                    <h3 className="font-bold text-slate-700 mb-2 text-xs"> ✨ 自由编写并新建小组：</h3>
                    <div className="flex gap-2">
                      <input
                        type="text"
                        value={newGroupName}
                        onChange={(e) => setNewGroupName(e.target.value)}
                        placeholder="输入自定义组名..."
                        className="flex-1 px-3 py-1.5 text-xs rounded-xl border border-slate-200 font-bold focus:outline-none focus:border-indigo-500 shadow-inner"
                      />
                      <button
                        onClick={handleAddGroup}
                        className="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-1.5 rounded-xl transition-all active:scale-95 shadow-md flex-shrink-0"
                      >
                        ➕ 建组
                      </button>
                    </div>
                  </div>
                  {/* 选择目标组 */}
                  <div>
                    <h3 className="font-bold text-slate-700 mb-2 text-xs">1. 选择目标小组：</h3>
                    <select
                      value={activeGroupForAssign}
                      onChange={(e) => setActiveGroupForAssign(e.target.value)}
                      className="w-full p-2 border border-slate-200 rounded-xl font-bold text-sm text-slate-700 bg-slate-50 focus:outline-none focus:border-indigo-500"
                    >
                      {groupsList.map(g => <option key={g} value={g}>{g}</option>)}
                    </select>
                  </div>

                  {/* 待分配的学生池 */}
                  <div className="flex-1 flex flex-col overflow-hidden">
                    <h3 className="font-bold text-slate-700 mb-2 text-xs">2. 点击学生塞进【{activeGroupForAssign}】：</h3>
                    <div className="flex-1 border-2 border-dashed border-slate-200 rounded-2xl p-2 overflow-y-auto bg-slate-50 flex flex-col gap-1.5">
                      {students.filter(s => s.group === null).length === 0 ? (
                        <p className="text-xs text-slate-400 text-center py-8 font-medium">所有学生都已分配完毕 🎉 </p>
                      ) : (
                        students.filter(s => s.group === null).map(student => (
                          <button
                            key={student.id} onClick={() => assignToGroup(student.id)}
                            className="w-full p-2 bg-white hover:bg-indigo-50 hover:border-indigo-300 border border-slate-200 rounded-xl font-bold text-xs text-slate-600 text-left flex justify-between items-center transition-all active:scale-98"
                          >
                            <span> 👤 {student.name}</span>
                            <span className="text-indigo-500 font-black">+ 塞入</span>
                          </button>
                        ))
                      )}
                    </div>
                  </div>
                </div>
              )}
            </div>
          </div>
          
          {/* 学生足迹查阅弹窗 */}
          {viewingStudent && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden">
                <div className="p-4 bg-gradient-to-r from-indigo-100 to-blue-100 flex justify-between items-center border-b border-indigo-200">
                  <h3 className="font-bold text-indigo-900 text-base"> 📋 {viewingStudent} · {subject}</h3>
                  <button onClick={() => { setViewingStudent(null); setStudentLogs([]); }} className="text-indigo-700 text-2xl font-bold">&times;</button>
                </div>
                <div className="p-4 bg-slate-50 flex flex-col gap-2 max-h-96 overflow-y-auto">
                  {logsLoading ? (
                    <div className="text-center py-8 text-slate-400">读取中...</div>
                  ) : studentLogs.length === 0 ? (
                    <div className="text-center py-8 text-slate-400">还没有记录哦～</div>
                  ) : (
                    studentLogs.map((log, i) => (
                      <div key={i} className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                        <div>
                          <p className="font-bold text-slate-700 text-sm">{log.reason}</p>
                          <p className="text-xs text-slate-400 mt-0.5">{log.date}</p>
                        </div>
                        <span className={`font-black text-base ${log.points > 0 ? 'text-green-500' : 'text-red-500'}`}>
                          {log.points > 0 ? '+' : ''}{log.points}
                        </span>
                      </div>
                    ))
                  )}
                </div>
                <div className="p-3 bg-indigo-50 text-center text-xs font-bold text-indigo-700 border-t border-indigo-100">
                  共 {studentLogs.length} 条记录 · 本科累计 {subjectScores[viewingStudent] || 0} 分
                </div>
              </div>
            </div>
          )}
          
          {/* 发分成功提示 */}
          {toastMsg && (
            <div className="absolute top-16 left-1/2 transform -translate-x-1/2 z-50 animate-[fadeIn_0.3s_ease-out]">
              <div className="bg-slate-800 text-white text-xs px-5 py-2.5 rounded-full font-bold shadow-2xl flex items-center gap-2">
                <span className="text-green-400 text-base"> ✓ </span> {toastMsg}
              </div>
            </div>
          )}
        </div>
      );
    }

// ========================================================
    //  👑  终极完全体：班主任独立超级大后台 (AdminPanel - 五板斧大满贯版)
    // ========================================================
    function AdminPanel({
      onExit, teachersList, setTeachersList, globalStudents, setGlobalStudents,
      levelThresholds, setLevelThresholds, levelTitles, setLevelTitles,
      globalRules, setGlobalRules, globalProducts, setGlobalProducts, setAdminPassword
    }) {

      const [activeTab, setActiveTab] = useState("students");
      
      // 1. 学生大总管状态
      const [singleName, setSingleName] = useState("");
      const [bulkInput, setBulkInput] = useState("");
      const [toastMsg, setToastMsg] = useState("");
      
      // 2. 商店进货商状态
      const [newItemName, setNewItemName] = useState("");
      const [newItemCost, setNewItemCost] = useState(1);
      const [newItemIcon, setNewItemIcon] = useState(" 🎫 ");
      const [newItemStock, setNewItemStock] = useState(10);
      
      // 3. 班级金科玉律状态
      const [newRuleLabel, setNewRuleLabel] = useState("");
      const [newRulePoints, setNewRulePoints] = useState(2);
      const [newRuleType, setNewRuleType] = useState("add");
      const [newRuleIcon, setNewRuleIcon] = useState(" 📝 ");
      const [editingRule, setEditingRule] = useState(null); 
      
      // 4. 科任教师授权状态
      const [newTeacherName, setNewTeacherName] = useState("");
      const [newTeacherSubject, setNewTeacherSubject] = useState("");
      const [newTeacherPin, setNewTeacherPin] = useState("");
      const [newAdminPin, setNewAdminPin] = useState(""); 

      // ========================================================
      //  🛠️  核心业务逻辑处理函数 (全面升级为 async/await fetchGAS)
      // ========================================================

      const handleAddSingle = async () => {
        const name = singleName.trim();
        if (!name) return;
        if (globalStudents.some(s => s.name === name)) {
          alert(`班级里已经有【${name}】啦！`); return;
        }

        const tempId = 's_' + Date.now(); 
        const newKid = {
          id: tempId, name, pin: "123456", totalExp: 0, unfedFood: 0, badges: 0,
          group: null, mythUnlocked: false, petId: null,
          pendingRedemptions: [], redeemedItems: [], hasOrder: false
        };

        setGlobalStudents(prev => [...prev, newKid]);
        setSingleName('');
        showToast(`成功添加学生：${name}`);

        try {
          const realId = await fetchGAS('addStudent', { name, pin: "123456" });
          setGlobalStudents(prev => prev.map(s => s.id === tempId ? { ...s, id: realId } : s));
        } catch (err) {
          console.error('学生写入失败:', err);
        }
      };

      const handleAddBulk = async () => {
        if (!bulkInput.trim()) return;
        const names = bulkInput.split(/[\n,，]/).map(n => n.trim()).filter(n => n.length > 0);
        if (names.length === 0) return;
        
        const newStudents = [];
        names.forEach((name, index) => {
          if (!globalStudents.some(s => s.name === name) && !newStudents.some(s => s.name === name)) {
            newStudents.push({ id: `s_b_${Date.now()}_${index}`, name, pin: "123456", totalExp: 0, badges: 0, group: null, mythUnlocked: false, petId: null });
          }
        });
        
        setGlobalStudents([...globalStudents, ...newStudents]);
        setBulkInput("");
        showToast(` 🚀  成功批量导入 ${newStudents.length} 位同学！`);
        
        const tempIds = newStudents.map(k => k.id);
        try {
          const realIds = await fetchGAS('addStudentsBulk', { names: newStudents.map(k => k.name), pin: "123456" });
          setGlobalStudents(prev => prev.map(s => {
            const index = tempIds.indexOf(s.id);
            if (index !== -1) return { ...s, id: realIds[index] };
            return s;
          }));
        } catch (err) {
          console.error('批量写入失败:', err);
        }
      };

      const handleDeleteStudent = async (student) => {
        if (!confirm(` ⚠️  确定要删除【${student.name}】吗？`)) return;
        setGlobalStudents(globalStudents.filter(s => s.id !== student.id)); 
        showToast(`已删除学生：${student.name}`);
        
        try {
          await fetchGAS('deleteStudent', { username: student.id });
        } catch (err) {
          console.error('删除学生失败:', err);
        }
      };

      const handleToggleMyth = async (id) => {
        const newValue = !globalStudents.find(s => s.id === id)?.mythUnlocked;
        setGlobalStudents(prev => prev.map(s => s.id === id ? { ...s, mythUnlocked: !s.mythUnlocked } : s));
        showToast(" 🌟  成功更新该同学的山海神兽领养特权！");
        
        try {
          await fetchGAS('updateMythUnlocked', { username: id, value: newValue });
        } catch (err) {
          console.error('神兽特权更新失败:', err);
        }
      };

      const handleAddItem = async () => {
        if (!newItemName.trim()) return;
        const newItem = {
          id: 'P_' + Date.now(),
          name: newItemName.trim(),
          cost: Number(newItemCost),
          icon: newItemIcon,
          stock: Number(newItemStock)
        };
        
        setGlobalProducts(prev => [...prev, newItem]);
        setNewItemName("");
        setNewItemStock(10);
        showToast(` 🛍️  成功上架奖品：${newItemName}`);

        try {
          await fetchGAS('addProduct', { id: newItem.id, name: newItem.name, cost: newItem.cost, icon: newItem.icon, stock: newItem.stock });
        } catch (err) {
          console.error('商品写入失败:', err);
        }
      };

      const handleAddRule = async () => {
        if (!newRuleLabel.trim()) return;
        const pts = Number(newRulePoints);
        const newRule = {
          id: 'r_' + Date.now(),
          label: newRuleLabel.trim(),
          points: newRuleType === 'add' ? Math.abs(pts) : -Math.abs(pts),
          type: newRuleType,
          icon: newRuleIcon
        };

        setGlobalRules([...globalRules, newRule]);
        setNewRuleLabel('');
        setNewRuleType('add');    
        setNewRulePoints(2);      
        setNewRuleIcon(' 📝 ');     
        showToast(` 📜  成功颁布全班新规：${newRuleLabel}`);

        try {

    // ========================================================
    // 🌟 全球主脑核心组件 (App) - fetchGAS 驱动版
    // ========================================================
    function App() {
      // --- 全局数据池 ---
      const [dataLoaded, setDataLoaded] = useState(false);
      const [globalStudents, setGlobalStudents] = useState([]);
      const [teachersList, setTeachersList] = useState([]);
      const [globalRules, setGlobalRules] = useState([]);
      const [globalProducts, setGlobalProducts] = useState([]);
      const [adminPassword, setAdminPassword] = useState("");
      
      const [levelThresholds, setLevelThresholds] = useState(LEVEL_THRESHOLDS);
      const [levelTitles, setLevelTitles] = useState(["新蛋期", "幼体期", "成长期", "进化期", "成熟期", "完全体", "究极体", "神圣体", "传说级"]);
      
      const githubUser = "lonsig84";
      const githubRepo = "pet-assets";

      // --- 核心加载引擎 ---
      useEffect(() => {
        const loadAllData = async () => {
          try {
            console.log("🚀 开始通过 API_URL 拉取云端数据...");
            const [students, teachers, rules, products, levelConf, adminPwd] = await Promise.all([
              fetchGAS('getStudents'),
              fetchGAS('getTeachers'),
              fetchGAS('getRules'),
              fetchGAS('getProducts'),
              fetchGAS('getLevelConfig'),
              fetchGAS('getAdminPassword')
            ]);
            
            setGlobalStudents(students || []);
            setTeachersList(teachers || []);
            setGlobalRules(rules || []);
            setGlobalProducts(products || []);
            if (levelConf && levelConf.thresholds) {
              setLevelThresholds(levelConf.thresholds);
              setLevelTitles(levelConf.titles);
            }
            setAdminPassword(adminPwd || "888888");
            setDataLoaded(true);
            console.log("✅ 全局数据加载完毕！");
          } catch (err) {
            console.error("❌ 数据加载彻底失败，请检查 API_URL 是否正确部署：", err);
            alert("无法连接到数据库，请刷新页面或联系 Wong 老师检查 GAS Web App URL。");
          }
        };
        loadAllData();
      }, []);

      // --- 视图与互动状态 ---
      const [currentView, setCurrentView] = useState("home"); // home | teacher | admin
      const [currentTeacher, setCurrentTeacher] = useState(null);
      const [activeModal, setActiveModal] = useState(null);
      
      const [selectedStudentForLogin, setSelectedStudentForLogin] = useState(null);
      const [currentStudentForPet, setCurrentStudentForPet] = useState(null);
      const [showTeacherAuth, setShowTeacherAuth] = useState(false);
      const [showAdminAuth, setShowAdminAuth] = useState(false);

      const [hearts, setHearts] = useState([]);
      const [badMarks, setBadMarks] = useState([]);
      const [isShaking, setIsShaking] = useState(false);
      const [isLevelingUp, setIsLevelingUp] = useState(false);
      const [feedPoints, setFeedPoints] = useState(0); 

      // --- 核心计算函数 ---
      const getCurrentLevel = (exp, petId) => {
        if (!petId) return 0;
        for (let i = levelThresholds.length - 1; i >= 1; i--) {
          if (exp >= levelThresholds[i]) return i;
        }
        return 1;
      };

      // --- 宠物互动核心逻辑 ---
      const handleFeed = async () => {
        if (!currentStudentForPet) return;
        const currentDB = globalStudents.find(s => s.name === currentStudentForPet.name);
        if (!currentDB || currentDB.unfedFood <= 0) return;

        soundFeed.currentTime = 0; soundFeed.play();
        const currentLevel = getCurrentLevel(currentDB.totalExp, currentDB.petId);
        
        // 前端即时更新动画与数值
        const newHearts = Array.from({ length: currentDB.unfedFood }).map((_, i) => ({
          id: Date.now() + i,
          emoji: HEART_EMOJIS[Math.floor(Math.random() * HEART_EMOJIS.length)],
          left: 30 + Math.random() * 40 + '%',
          animationDuration: 0.8 + Math.random() * 0.5 + 's'
        }));
        setHearts(prev => [...prev, ...newHearts]);
        setFeedPoints(currentDB.unfedFood);
        
        setTimeout(() => {
          setHearts([]);
          setFeedPoints(0);
        }, 1500);

        const newExp = currentDB.totalExp + currentDB.unfedFood;
        const newLevel = getCurrentLevel(newExp, currentDB.petId);

        // 云端异步同步数据
        try {
          await fetchGAS('updateStudentStats', { 
            username: currentDB.id, 
            exp: newExp, 
            unfedFood: 0 
          });
          
          setGlobalStudents(prevList => prevList.map(s => 
            s.id === currentDB.id ? { ...s, totalExp: newExp, unfedFood: 0 } : s
          ));

          // 触发升级
          if (newLevel > currentLevel) {
            setTimeout(() => {
              soundLevelUp.currentTime = 0; soundLevelUp.play();
              setIsLevelingUp(true);
              setTimeout(() => setIsLevelingUp(false), 2000);
            }, 800);
          }

          // 触发毕业
          if (newLevel >= 8) {
            setTimeout(async () => {
              soundCheers.currentTime = 0; soundCheers.play();
              alert(`🎉 太棒啦！【${currentDB.name}】的宠物终于长成完全体，顺利毕业啦！你获得了一枚毕业徽章 🏅 ！`);
              
              setGlobalStudents(gList => gList.map(s => {
                if (s.id === currentDB.id) {
                  return { ...s, petId: null, totalExp: 0, petHistory: [...(s.petHistory || []), currentDB.petId] };
                }
                return s;
              }));
              setCurrentStudentForPet(null);
              
              // 同步毕业状态到云端
              await fetchGAS('graduatePet', { username: currentDB.id, petId: currentDB.petId });
            }, 2000);
          }
        } catch (err) {
          console.error("喂食同步失败:", err);
        }
      };

      // 扣除历史欠分
      const handleSettleDeductions = async () => {
        if (!currentStudentForPet) return;
        const currentDB = globalStudents.find(s => s.name === currentStudentForPet.name);
        
        try {
          const pendingDeductions = await fetchGAS('getStudentPendingDeductions', { studentName: currentDB.name });
          if (!pendingDeductions || pendingDeductions.length === 0) return;
          
          const totalDeduct = pendingDeductions.reduce((sum, item) => sum + Math.abs(item.points), 0);
          const newExp = Math.max(0, currentDB.totalExp - totalDeduct);
          
          // 更新前端与云端
          setGlobalStudents(prevList => prevList.map(s => s.id === currentDB.id ? { ...s, totalExp: newExp } : s));
          await fetchGAS('updateStudentStats', { username: currentDB.id, exp: newExp, unfedFood: currentDB.unfedFood });
          await fetchGAS('claimAllDeductions', { studentName: currentDB.name });

          // 扣分动画
          soundSad.currentTime = 0; soundSad.play();
          setIsShaking(true);
          setTimeout(() => setIsShaking(false), 400);
          
          const newBadMark = { id: Date.now(), points: totalDeduct };
          setBadMarks(prev => [...prev, newBadMark]);

          console.error('结账扣分失败:', err);

      }

      const expProgress = petLevel < 8 && petLevel > 0 
        ? ((activeStudentObj.totalExp - levelThresholds[petLevel]) / (levelThresholds[petLevel + 1] - levelThresholds[petLevel])) * 100 
        : 100;

          <div className="absolute bottom-[-10%] right-[-10%] w-[40%] h-[40%] bg-pink-200 rounded-full blur-[100px] opacity-60"></div>

            <button onClick={() => setShowTeacherAuth(true)} className="bg-white/80 backdrop-blur border border-white text-indigo-700 font-bold px-3 py-1.5 rounded-full text-xs shadow-sm active:scale-95">👩‍🏫 科任登入</button>

            <div className="w-full max-w-4xl p-6 h-[85vh] flex flex-col z-10 animate-[fadeIn_0.3s_ease-out]">
              <div className="text-center mb-6">
                <h1 className="text-3xl font-black text-indigo-950 drop-shadow-sm mb-2">🐾 班级宠物园</h1>
                <p className="text-sm text-indigo-600/80 font-bold">请点击你的名字，召唤你的专属神兽</p>
              </div>
              <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3 overflow-y-auto pr-2 pb-20">
                {globalStudents.map(student => (
                  <button
                    key={student.id} onClick={() => setSelectedStudentForLogin(student.name)}
                    className="relative bg-white/90 backdrop-blur-md p-4 rounded-3xl border border-white shadow-sm hover:shadow-xl hover:-translate-y-1 transition-all group flex flex-col items-center gap-2 active:scale-95"
                  >
                    <div className="w-14 h-14 rounded-full bg-slate-50 border-2 border-indigo-50 shadow-inner flex items-center justify-center overflow-hidden">
                      {student.petId 
                        ? <img src={`https://cdn.jsdelivr.net/gh/${githubUser}/${githubRepo}/avatar/${student.petId}/${getCurrentLevel(student.totalExp, student.petId)}.webp`} className="w-10 h-10 object-contain group-hover:scale-110 transition-transform" />
                        : <span className="text-2xl text-slate-300">🥚</span>
                      }
                    </div>
                    <span className="font-black text-slate-700 text-sm">{student.name}</span>
                    {student.unfedFood > 0 && (
                      <span className="absolute -top-2 -right-2 bg-rose-500 text-white text-[10px] font-black px-2 py-1 rounded-full shadow-md animate-bounce">
                        +{student.unfedFood} 🍎
                      </span>
                    )}
                  </button>
                ))}
              </div>
            </div>
          ) : (
            // B. 选定学生后的宠物互动主界面
            <div className="w-full max-w-md h-full flex flex-col relative z-10 animate-[fadeIn_0.3s_ease-out]">
              {/* 顶部状态栏 */}
              <div className="flex justify-between items-center p-5 pt-8">
                <button onClick={() => setCurrentStudentForPet(null)} className="w-10 h-10 bg-white/80 backdrop-blur rounded-full shadow-sm flex items-center justify-center text-slate-600 font-bold active:scale-90 transition-all border border-white">
                  ←
                </button>
                <div className="bg-white/80 backdrop-blur px-5 py-2 rounded-full shadow-sm border border-white flex items-center gap-2">
                  <span className="font-black text-slate-800">{activeStudentObj.name}</span>
                  <span className="text-xs bg-amber-100 text-amber-700 font-black px-2 py-0.5 rounded-full">
                    {activeStudentObj.petHistory?.length || 0} 🏅
                  </span>
                </div>
                <div className="w-10 h-10" />
              </div>

              {/* 宠物中心展示区 */}
              <div className="flex-1 flex flex-col items-center justify-center mt-[-10vh] relative">
                
                {/* 动画层 */}
                {hearts.map(heart => (
                  <div key={heart.id} className="absolute text-3xl z-40 pointer-events-none drop-shadow-md" style={{ left: heart.left, bottom: '40%', animation: `floatUpBurst ${heart.animationDuration} ease-out forwards` }}>{heart.emoji}</div>
                ))}
                {badMarks.map(bad => (
                  <div key={bad.id} className="absolute text-5xl z-40 pointer-events-none text-red-500 font-black drop-shadow-xl" style={{ left: '45%', top: '30%', animation: 'dropDown 1s ease-in forwards' }}>-{bad.points}</div>
                ))}

                {activeStudentObj.petId ? (
                  <>
                    <div className="text-center mb-6 z-20">
                      <div className="inline-block bg-indigo-600 text-white text-xs font-black px-4 py-1.5 rounded-full shadow-md mb-2 tracking-widest uppercase">
                        Lv.{petLevel} · {currentTitle}
                      </div>
                    </div>

                    <div className={`relative w-64 h-64 flex items-center justify-center z-10 ${isShaking ? 'animate-shake' : ''}`}>
                      <div className="absolute inset-0 bg-indigo-500/10 rounded-full blur-3xl animate-pulse"></div>
                      {isLevelingUp && <div className="absolute inset-[-20%] bg-[url('https://www.transparenttextures.com/patterns/stardust.png')] animate-spin-slow opacity-50 mix-blend-overlay"></div>}
                      
                      <img src={petImageUrl} className={`max-w-[85%] max-h-[85%] object-contain drop-shadow-2xl transition-all duration-500 ${isLevelingUp ? 'scale-125 brightness-110 drop-shadow-[0_0_30px_rgba(79,70,229,0.8)]' : 'hover:scale-105'} ${isShaking ? 'filter grayscale brightness-75' : ''}`} alt="pet" />
                    </div>

                    {/* 经验值进度条 */}
                    <div className="w-64 mt-8 bg-white/50 backdrop-blur p-1.5 rounded-full shadow-inner border border-white/60">
                      <div className="h-3 bg-gradient-to-r from-indigo-400 to-purple-500 rounded-full transition-all duration-1000 ease-out relative overflow-hidden" style={{ width: `${expProgress}%` }}>
                        <div className="absolute inset-0 bg-white/20 w-full h-full" style={{ animation: 'shimmer 2s infinite' }}></div>
                      </div>
                    </div>
                    <div className="text-[10px] font-black text-slate-400 mt-2 uppercase tracking-wider">
                      {activeStudentObj.totalExp} / {levelThresholds[petLevel + 1]} EXP
                    </div>
                    
                    {/* 喂食大按钮 */}
                    {activeStudentObj.unfedFood > 0 ? (
                      <button onClick={handleFeed} className="mt-8 relative group active:scale-95 transition-all">
                        <div className="absolute -inset-1 bg-gradient-to-r from-rose-400 to-pink-500 rounded-full blur opacity-70 group-hover:opacity-100 transition duration-200 animate-pulse"></div>
                        <div className="relative bg-white px-8 py-3 rounded-full flex items-center gap-2 border border-rose-100 shadow-xl">
                          <span className="text-xl">🍎</span>
                          <span className="font-black text-rose-600">喂食 (+{activeStudentObj.unfedFood})</span>
                        </div>
                      </button>
                    ) : (
                      <div className="mt-8 px-8 py-3 rounded-full bg-slate-200/50 backdrop-blur border border-slate-300 text-slate-400 font-bold text-sm flex items-center gap-2 shadow-inner">
                        <span>😴</span> 宠物现在很饱，上课多发言赚口粮吧~
                      </div>
                    )}
                  </>
                ) : (
                  // C. 未领养宠物的选蛋界面
                  <div className="text-center w-full px-6 flex flex-col items-center">
                    <div className="w-32 h-32 bg-white rounded-full shadow-xl border-4 border-indigo-50 flex items-center justify-center mb-6 animate-bounce">
                      <span className="text-6xl">🥚</span>
                    </div>
                    <h2 className="text-2xl font-black text-slate-800 mb-2">领养你的宠物蛋</h2>
                    <p className="text-xs font-bold text-slate-500 mb-8 max-w-[200px] leading-relaxed">
                      不同的宠物蛋会孵化出完全不同的神兽哦，凭借直觉选择一个吧！
                    </p>
                    <div className="grid grid-cols-2 gap-4 w-full">
                      {[1, 2, 3, 4].map(id => (
                        <button
                          key={id}
                          onClick={async () => {
                            if (!confirm("选定宠物后，毕业前不能更改哦！确定领养这颗蛋吗？")) return;
                            setGlobalStudents(gList => gList.map(s => s.id === activeStudentObj.id ? { ...s, petId: id, totalExp: 0, unfedFood: 0 } : s));
                            try {
                              await fetchGAS('adoptPet', { username: activeStudentObj.id, petId: id });
                            } catch (err) {
                              console.error('领养写入失败:', err);
                            }
                          }}
                          className="bg-white p-4 rounded-3xl shadow-sm border border-slate-100 hover:border-indigo-400 hover:shadow-md transition-all active:scale-95 flex flex-col items-center"
                        >
                          <img src={`https://cdn.jsdelivr.net/gh/${githubUser}/${githubRepo}/avatar/${id}/0.webp`} className="w-12 h-12 object-contain opacity-80" />
                          <span className="text-[10px] font-black text-slate-400 mt-2">点击领养</span>
                        </button>
                      ))}
                    </div>
                    {activeStudentObj.mythUnlocked && (
                      <button
                        onClick={async () => {
                          if (!confirm("隐藏的传说神兽！确定领养吗？")) return;
                          setGlobalStudents(gList => gList.map(s => s.id === activeStudentObj.id ? { ...s, petId: 5, totalExp: 0, unfedFood: 0, mythUnlocked: false } : s));
                          try {
                            await fetchGAS('adoptPet', { username: activeStudentObj.id, petId: 5 });
                            await fetchGAS('updateMythUnlocked', { username: activeStudentObj.id, value: false });
                          } catch (err) { console.error('神兽领养失败:', err); }
                        }}
                        className="mt-6 w-full bg-gradient-to-r from-purple-600 to-indigo-600 p-4 rounded-3xl shadow-lg border border-purple-400 hover:shadow-xl transition-all active:scale-95 flex items-center justify-center gap-3 group"
                      >
                        <img src={`https://cdn.jsdelivr.net/gh/${githubUser}/${githubRepo}/avatar/5/0.webp`} className="w-10 h-10 object-contain drop-shadow-md group-hover:rotate-12 transition-transform" />
                        <span className="font-black text-white text-sm tracking-widest drop-shadow-sm">✨ 领养隐藏山海神兽 ✨</span>
                      </button>
                    )}
                  </div>
                )}
              </div>
            </div>
          )}

          {/* 渲染各种弹窗 */}
          {currentStudentForPet && <BottomNav onOpenModal={setActiveModal} />}

          {activeModal === 'leaderboard' && <LeaderboardModal onClose={() => setActiveModal(null)} globalStudents={globalStudents} currentStudentName={currentStudentForPet?.name} levelThresholds={levelThresholds} githubUser={githubUser} githubRepo={githubRepo} />}
          {activeModal === 'history' && <HistoryModal onClose={() => setActiveModal(null)} studentName={currentStudentForPet?.name} />}
          {activeModal === 'memorial' && <MemorialModal onClose={() => setActiveModal(null)} petHistory={activeStudentObj?.petHistory || []} githubUser={githubUser} githubRepo={githubRepo} />}
          {activeModal === 'shop' && (
            <ShopModal 
              onClose={() => setActiveModal(null)} 
              badges={activeStudentObj?.petHistory?.length || 0} 
              globalProducts={globalProducts} setGlobalProducts={setGlobalProducts}
              onExchangeItem={async (item) => {
                const currentBadges = activeStudentObj?.petHistory?.length || 0;
                if (currentBadges < item.cost) { alert("徽章不足哦！"); return; }
                const newBadges = currentBadges - item.cost;
                const newHistory = activeStudentObj.petHistory.slice(0, newBadges);
                const updatedRedeemed = [...(activeStudentObj.redeemedItems || []), item];
                
                setGlobalStudents(prevList => prevList.map(s => 
                  s.id === activeStudentObj.id ? { ...s, petHistory: newHistory, redeemedItems: updatedRedeemed, hasOrder: true } : s
                ));
                alert(`🎉 兑换成功！你获得了 ${item.name}！老师会在后台看到你的订单，准备发货啦！`);
                
                try {
                  await fetchGAS('exchangeItem', { username: activeStudentObj.id, cost: item.cost, redeemedItems: updatedRedeemed });
                } catch (err) { console.error('兑换云端同步失败:', err); }
              }} 
            />
          )}

          {/* 密码验证与后台入口 */}
          {selectedStudentForLogin && (
            <PinPadModal
              studentName={selectedStudentForLogin}
              globalStudents={globalStudents}
              onClose={() => setSelectedStudentForLogin(null)}
              onSuccess={async (studentDB) => {
                setCurrentStudentForPet(studentDB);
                setSelectedStudentForLogin(null);
                
                // 登录成功后，静默拉取未领取的加分与扣分
                try {
                  // 拉取加分（转换为食物）
                  const additions = await fetchGAS('getStudentPendingAdditions', { studentName: studentDB.name });
                  if (additions && additions.length > 0) {
                    const totalAdd = additions.reduce((sum, item) => sum + item.points, 0);
                    const newFood = studentDB.unfedFood + totalAdd;
                    setGlobalStudents(prevList => prevList.map(s => s.id === studentDB.id ? { ...s, unfedFood: newFood } : s));
                    
                    soundClaim.currentTime = 0; soundClaim.play();
                    await fetchGAS('claimAllAdditions', { studentName: studentDB.name });
                  }
                  
                  // 处理扣分（直接在组件内调用已写好的函数）
                  handleSettleDeductions();
                } catch (err) {
                  console.error('拉取待处理分数失败:', err);
                }
              }}
            />
          )}

          {showTeacherAuth && (
            <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
              <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl overflow-hidden flex flex-col">
                <div className="p-4 bg-indigo-50 border-b border-indigo-100 flex justify-between items-center">
                  <h3 className="font-black text-indigo-900">👩‍🏫 科任登录</h3>
                  <button onClick={() => setShowTeacherAuth(false)} className="text-indigo-400 hover:text-indigo-700 font-bold active:scale-90">&times;</button>
                </div>
                <div className="p-4 flex flex-col gap-2 max-h-80 overflow-y-auto">
                  {teachersList.length === 0 ? (
                    <p className="text-center text-sm text-slate-400 py-6">班主任还未添加任何科任老师哦！</p>
                  ) : (
                    teachersList.map(teacher => (
                      <button key={teacher.id} onClick={() => setCurrentTeacher(teacher)} className={`p-3 rounded-2xl border text-left flex items-center justify-between transition-all ${currentTeacher?.id === teacher.id ? 'bg-indigo-500 text-white border-indigo-600 shadow-md' : 'bg-slate-50 border-slate-200 text-slate-700 hover:border-indigo-300'}`}>
                        <span className="font-bold">{teacher.name}</span>
                        <span className={`text-xs font-black px-2 py-1 rounded-full ${currentTeacher?.id === teacher.id ? 'bg-indigo-400 text-white' : 'bg-indigo-100 text-indigo-600'}`}>{teacher.subject}</span>
                      </button>
                    ))
                  )}
                </div>
                {currentTeacher && (
                  <div className="p-4 bg-slate-50 border-t border-slate-100">
                    <TeacherLoginModal title={`欢迎, ${currentTeacher.name}`} correctPassword={currentTeacher.pin} onClose={() => { setCurrentTeacher(null); setShowTeacherAuth(false); }} onSuccess={() => { setCurrentView("teacher"); setShowTeacherAuth(false); }} />
                  </div>
                )}
              </div>
            </div>
          )}

          {showAdminAuth && <TeacherLoginModal title="班主任超级后台" correctPassword={adminPassword} onClose={() => setShowAdminAuth(false)} onSuccess={() => { setCurrentView("admin"); setShowAdminAuth(false); }} />}
        </div>
      );
    }

    // 🚀 最终渲染挂载点
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
