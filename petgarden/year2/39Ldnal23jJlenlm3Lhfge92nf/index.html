<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { backgroundImage: { 'gradient-radial': 'radial-gradient(var(--tw-gradient-stops))', } } }
    }
  </script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <style>
    body { user-select: none; -webkit-user-select: none; margin: 0; overflow: hidden; background-color: #f8fafc; }

    /* 喂养：爱心喷发上浮 */
    @keyframes floatUpBurst {
      0% { transform: translateY(0) scale(0.5); opacity: 1; }
      100% { transform: translateY(-160px) scale(1.5); opacity: 0; }
    }
    /* 扣分：心碎掉落 */
    @keyframes dropDown {
      0% { transform: translateY(0) scale(1); opacity: 1; }
      100% { transform: translateY(100px) scale(0.8); opacity: 0; }
    }
    /* 扣分：左右摇晃震动 */
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px) rotate(-3deg); }
      50% { transform: translateX(8px) rotate(3deg); }
      75% { transform: translateX(-8px) rotate(-3deg); }
    }
    .animate-shake { animation: shake 0.4s ease-in-out; }
    @keyframes spinSlow { 100% { transform: rotate(360deg); } }
    .animate-spin-slow { animation: spinSlow 6s linear infinite; }
    @keyframes bounceIn {
      0% { transform: scale(0.3); opacity: 0; }
      50% { transform: scale(1.1); opacity: 1; }
      70% { transform: scale(0.9); }
      100% { transform: scale(1); }
    }
    .animate-bounce-in { animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // ========================================================
    // 🚀 核心基建：全栈分离后的 API 通信引擎
    // ========================================================
    // ⚠️ 请在这里填入你部署后获取到的 Google Apps Script Web App URL
    const API_URL = "https://script.google.com/macros/s/AKfycbxQjdgaFCPWxyMgie3kAk_xodVx3AkzdGtMqLXUfob-gS8P_M50kW0s848SY2xRzlsYXQ/exec"; 

    // 统一的 fetchGAS 通信引擎，完美替代 google.script.run
    const fetchGAS = async (action, payload = {}) => {
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          // ⚠️ 核心技巧：使用 text/plain 绕过复杂的 CORS 预检
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          // 将 action 注入数据包，对应后端的 switch(action)
          body: JSON.stringify({ action, ...payload }),
        });
        const result = await response.json();
        if (result.error) throw new Error(result.error);
        return result;
      } catch (error) {
        console.error(`API 请求失败 [${action}]:`, error);
        throw error;
      }
    };

    // ========================================================
    // 🎵 全局常量与音频资源
    // ========================================================
    const LEVEL_THRESHOLDS = [0, 0, 10, 30, 60, 100, 150, 210, 280];
    const soundCheers = new Audio('https://actions.google.com/sounds/v1/crowds/female_crowd_celebration.ogg');
    const soundFeed = new Audio('https://actions.google.com/sounds/v1/cartoon/pop.ogg');
    const soundLevelUp = new Audio('https://actions.google.com/sounds/v1/cartoon/magic_chime.ogg');
    const soundClaim = new Audio('https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg');
    const soundSad = new Audio('https://actions.google.com/sounds/v1/cartoon/slide_whistle_down.ogg');
    const HEART_EMOJIS = [' ❤️ ', ' 💖 ', ' 💗 ', ' 💓 ', ' 💞 ', ' 💕 ', ' 💘 ', ' 💝 ', ' ✨ ', ' 🌟 '];

    // --- 下方紧接着的是你原本的“积木 1：悬浮式底部导航栏 (BottomNav)” ---

// 积木 1：悬浮式底部导航栏 (BottomNav)
    function BottomNav({ onOpenModal }) {
      return (
        <div className="fixed bottom-3 left-1/2 -translate-x-1/2 w-[94%] max-w-md bg-white/95 backdrop-blur-md border border-white shadow-2xl rounded-3xl p-1.5 sm:p-2 flex justify-around items-center z-[140]">
          <button onClick={() => onOpenModal(null)} className="flex flex-col items-center p-1.5 sm:p-2 text-indigo-600 transition-all hover:scale-110 active:scale-95">
            <span className="text-2xl mb-1"> 🏠 </span>
            <span className="text-[10px] font-bold">宠物园</span>
          </button>
          <button onClick={() => onOpenModal('history')} className="flex flex-col items-center p-1.5 sm:p-2 text-slate-400 hover:text-indigo-500 transition-all hover:scale-110 active:scale-95">
            <span className="text-2xl mb-1"> 📜 </span>
            <span className="text-[10px] font-bold">足迹</span>
          </button>
          <button onClick={() => onOpenModal('leaderboard')} className="flex flex-col items-center p-1.5 sm:p-2 text-slate-400 hover:text-amber-500 transition-all hover:scale-110 active:scale-95">
            <span className="text-2xl mb-1"> 🏆 </span>
            <span className="text-[10px] font-bold">荣誉榜</span>
          </button>
          <button onClick={() => onOpenModal('shop')} className="flex flex-col items-center p-1.5 sm:p-2 text-slate-400 hover:text-pink-500 transition-all hover:scale-110 active:scale-95">
            <span className="text-2xl mb-1"> 🛍️ </span>
            <span className="text-[10px] font-bold">兑换</span>
          </button>
          <button onClick={() => onOpenModal('memorial')} className="flex flex-col items-center p-1.5 sm:p-2 text-slate-400 hover:text-amber-500 transition-all hover:scale-110 active:scale-95">
            <span className="text-2xl mb-1"> 🏅 </span>
            <span className="text-[10px] font-bold">纪念册</span>
          </button>
        </div>
      );
    }

    // 积木 2：精美的荣誉排行榜弹窗 (LeaderboardModal)
    function LeaderboardModal({ onClose, globalStudents, currentStudentName, levelThresholds, githubUser, githubRepo }) {
      const getCurrentLevel = (exp, petId) => {
        if (!petId) return 0;
        for (let i = levelThresholds.length - 1; i >= 1; i--) {
          if (exp >= levelThresholds[i]) return i;
        }
        return 1;
      };
      
      const sorted = [...globalStudents]
        .filter(s => s.petId)
        .sort((a, b) => {
          const aBadges = (a.petHistory || []).length;
          const bBadges = (b.petHistory || []).length;
          if (bBadges !== aBadges) return bBadges - aBadges;
          return b.totalExp - a.totalExp;
        });
        
      return (
        <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
          <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div className="p-4 bg-gradient-to-r from-amber-100 to-orange-100 flex justify-between items-center border-b border-amber-200">
              <h3 className="font-bold text-amber-900 text-lg"> 🏆 班级荣誉榜</h3>
              <button onClick={onClose} className="text-amber-700 hover:text-amber-900 text-2xl font-bold active:scale-90">&times;</button>
            </div>
            <div className="p-4 bg-slate-50 flex flex-col gap-3 max-h-96 overflow-y-auto">
              {sorted.length === 0 ? (
                <div className="text-center py-8 text-slate-400 font-medium">还没有同学领养宠物哦~</div>
              ) : (
                sorted.map((s, index) => {
                  const level = getCurrentLevel(s.totalExp, s.petId);
                  const petUrl = `https://cdn.jsdelivr.net/gh/${githubUser}/${githubRepo}/avatar/${s.petId}/${level}.webp`;
                  const isMe = s.name === currentStudentName;
                  const badgeCount = (s.petHistory || []).length;

                  return (
                    <div key={s.id} className={`flex items-center p-3 rounded-2xl border transition-all ${isMe ? 'bg-indigo-50 border-indigo-300 shadow-md' : index < 3 ? 'bg-gradient-to-r from-white to-amber-50 border-amber-300 shadow-md' : 'bg-white border-slate-200 shadow-sm'}`}>
                      <div className="w-8 font-black text-2xl text-center mr-2">
                        {index === 0 ? ' 🥇 ' : index === 1 ? ' 🥈 ' : index === 2 ? ' 🥉 ' : <span className="text-slate-400 text-lg">{index + 1}</span>}
                      </div>
                      <div className="w-10 h-10 rounded-xl bg-white border border-slate-100 flex items-center justify-center mr-2 shadow-sm overflow-hidden">
                        <img src={petUrl} className="w-8 h-8 object-contain" />
                      </div>
                      <div className="flex-1">
                        <div className="font-bold text-slate-700 text-sm flex items-center gap-1">
                          {s.name}
                          {isMe && <span className="text-[9px] bg-indigo-500 text-white px-1.5 py-0.5 rounded-full">我</span>}
                        </div>
                        <div className="text-xs text-indigo-500 font-bold"> 🎓 {badgeCount} · Lv.{level}</div>
                      </div>
                      <div className="font-black text-amber-500 text-sm">
                        {s.totalExp} <span className="text-[10px] font-normal text-slate-400">EXP</span>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </div>
      );
    }

    // 🌿 Ikon Lestari Mingguan：每周课堂积分排行榜弹窗
    function IkonLestariModal({ onClose, ikonData, currentWeek, currentStudentName }) {
      const [selectedMonth, setSelectedMonth] = useState(
        currentWeek?.month?.name || 'July'
      );
      const [selectedWeekStart, setSelectedWeekStart] = useState(
        currentWeek?.startDate || ''
      );

      const months = ['July', 'August', 'September', 'October', 'November'];
      const weeks = Array.isArray(ikonData?.weeks) ? ikonData.weeks : [];
      const monthWeeks = weeks.filter(week => week.month?.name === selectedMonth);
      const selectedWeek = weeks.find(week => week.startDate === selectedWeekStart)
        || monthWeeks[0]
        || currentWeek
        || null;

      useEffect(() => {
        if (!monthWeeks.some(week => week.startDate === selectedWeekStart)) {
          setSelectedWeekStart(monthWeeks[0]?.startDate || '');
        }
      }, [selectedMonth]);

      const ranking = selectedWeek?.ranking || [];

      return (
        <div className="absolute inset-0 z-[160] flex items-center justify-center bg-slate-900/55 backdrop-blur-sm p-4">
          <div className="w-full max-w-md bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden max-h-[88vh]">
            <div className="p-4 bg-gradient-to-r from-emerald-100 to-lime-100 flex justify-between items-center border-b border-emerald-200">
              <div>
                <h3 className="font-black text-emerald-900 text-lg">🌿 Ikon Lestari Mingguan</h3>
                <p className="text-[10px] font-bold text-emerald-700 mt-0.5">根据每周课堂净积分排名</p>
              </div>
              <button onClick={onClose} className="text-emerald-700 hover:text-emerald-900 text-2xl font-bold active:scale-90">&times;</button>
            </div>

            <div className="p-3 bg-white border-b border-slate-100">
              <div className="flex gap-1 overflow-x-auto pb-1">
                {months.map(month => (
                  <button
                    key={month}
                    onClick={() => setSelectedMonth(month)}
                    className={`px-3 py-1.5 rounded-xl text-[10px] font-black flex-shrink-0 transition-all ${selectedMonth === month ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-500'}`}
                  >
                    {month}
                  </button>
                ))}
              </div>

              <select
                value={selectedWeek?.startDate || ''}
                onChange={e => setSelectedWeekStart(e.target.value)}
                className="w-full mt-2 p-2.5 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-900 text-xs font-black focus:outline-none"
              >
                {monthWeeks.map(week => (
                  <option key={week.startDate} value={week.startDate}>{week.dateRange}</option>
                ))}
              </select>
            </div>

            <div className="px-4 pt-3">
              <div className="rounded-2xl bg-emerald-50 border border-emerald-100 p-3 text-center">
                <p className="text-xs font-black text-emerald-800">{selectedWeek?.dateRange || '暂无星期资料'}</p>
                <p className="text-[10px] text-slate-500 font-bold mt-1 leading-relaxed">
                  净积分最高者胜出；净积分相同，则正面加分记录次数较多者胜出。
                </p>
              </div>
            </div>

            <div className="p-4 bg-slate-50 flex flex-col gap-2 overflow-y-auto">
              {ranking.length === 0 ? (
                <div className="text-center py-10 text-slate-400 font-bold text-sm">🌱 这个星期还没有课堂记录。</div>
              ) : (
                ranking.map((item, index) => {
                  const isMe = item.name === currentStudentName;
                  return (
                    <div key={`${item.name}-${index}`} className={`flex items-center gap-3 p-3 rounded-2xl border shadow-sm ${isMe ? 'bg-indigo-50 border-indigo-300' : index === 0 ? 'bg-gradient-to-r from-amber-50 to-yellow-50 border-amber-300' : 'bg-white border-slate-200'}`}>
                      <div className="w-9 text-center font-black text-xl">
                        {item.rank === 1 ? '🥇' : item.rank === 2 ? '🥈' : item.rank === 3 ? '🥉' : <span className="text-slate-400 text-sm">{item.rank}</span>}
                      </div>
                      <div className="flex-1 min-w-0">
                        <div className="font-black text-slate-800 text-sm truncate">
                          {item.name}
                          {isMe && <span className="ml-1 text-[9px] bg-indigo-500 text-white px-1.5 py-0.5 rounded-full">我</span>}
                        </div>
                        <div className="text-[10px] font-bold text-slate-400 mt-0.5">
                          正面记录 {item.positiveCount || 0} 次 · 扣分记录 {item.negativeCount || 0} 次
                        </div>
                      </div>
                      <div className="text-right flex-shrink-0">
                        <div className={`text-lg font-black ${item.netScore >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {item.netScore > 0 ? '+' : ''}{item.netScore}
                        </div>
                        <div className="text-[9px] font-bold text-slate-400">净积分</div>
                      </div>
                    </div>
                  );
                })
              )}
            </div>
          </div>
        </div>
      );
    }


    // 🌿 班主任后台：7月至11月每周 Ikon Lestari 查询面板
    function AdminIkonPanel({ ikonData, currentWeek }) {
      const months = ['July', 'August', 'September', 'October', 'November'];
      const weeks = Array.isArray(ikonData?.weeks) ? ikonData.weeks : [];

      const initialMonth = currentWeek?.month?.name || months.find(month =>
        weeks.some(week => week.month?.name === month)
      ) || 'July';

      const [selectedMonth, setSelectedMonth] = useState(initialMonth);
      const [selectedWeekStart, setSelectedWeekStart] = useState(
        currentWeek?.startDate || ''
      );

      const monthWeeks = weeks.filter(week => week.month?.name === selectedMonth);
      const selectedWeek = weeks.find(week => week.startDate === selectedWeekStart)
        || monthWeeks[0]
        || currentWeek
        || null;

      useEffect(() => {
        if (!monthWeeks.some(week => week.startDate === selectedWeekStart)) {
          setSelectedWeekStart(monthWeeks[0]?.startDate || '');
        }
      }, [selectedMonth, weeks.length]);

      const ranking = selectedWeek?.ranking || [];
      const winners = selectedWeek?.winners || [];

      return (
        <div className="flex-1 max-w-6xl w-full mx-auto p-4 flex flex-col gap-4 overflow-y-auto animate-[fadeIn_0.15s_ease-out]">
          <div className="bg-gradient-to-r from-emerald-700 to-lime-600 text-white rounded-3xl p-5 shadow-md">
            <div className="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
              <div>
                <h3 className="text-xl font-black">🌿 Ikon Lestari Mingguan</h3>
                <p className="text-xs font-bold text-emerald-100 mt-1">
                  查看2026年7月至11月每个星期的课堂积分排名
                </p>
              </div>
              <div className="bg-white/15 border border-white/20 rounded-2xl px-4 py-2 text-xs font-black">
                共 {weeks.length} 个星期
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-5">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label className="block text-[11px] font-black text-slate-400 mb-2">1. 选择月份</label>
                <div className="flex gap-2 overflow-x-auto pb-1">
                  {months.map(month => (
                    <button
                      key={month}
                      onClick={() => setSelectedMonth(month)}
                      className={`px-4 py-2 rounded-xl text-xs font-black flex-shrink-0 transition-all ${selectedMonth === month ? 'bg-emerald-600 text-white shadow-md' : 'bg-slate-100 text-slate-500 hover:bg-emerald-50 hover:text-emerald-700'}`}
                    >
                      {month}
                    </button>
                  ))}
                </div>
              </div>

              <div>
                <label className="block text-[11px] font-black text-slate-400 mb-2">2. 选择星期</label>
                <select
                  value={selectedWeek?.startDate || ''}
                  onChange={e => setSelectedWeekStart(e.target.value)}
                  className="w-full p-3 rounded-xl border border-emerald-200 bg-emerald-50 text-emerald-900 text-xs font-black focus:outline-none focus:border-emerald-500"
                >
                  {monthWeeks.map(week => (
                    <option key={week.startDate} value={week.startDate}>
                      {week.dateRange}
                    </option>
                  ))}
                </select>
              </div>
            </div>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-[320px_1fr] gap-4 min-h-0">
            <div className="bg-white rounded-3xl border border-slate-100 shadow-sm p-5 h-fit">
              <p className="text-[11px] font-black text-slate-400">所选星期</p>
              <h4 className="font-black text-slate-800 mt-1 leading-snug">
                {selectedWeek?.dateRange || '没有星期资料'}
              </h4>

              {winners.length > 0 ? (
                <div className="mt-4 space-y-2">
                  <p className="text-[11px] font-black text-emerald-700">🏆 本周最高</p>
                  {winners.map((winner, index) => (
                    <div key={`${winner.name}-${index}`} className="rounded-2xl border border-amber-200 bg-gradient-to-r from-amber-50 to-yellow-50 p-4">
                      <p className="font-black text-slate-800">{winner.name}</p>
                      <div className="flex justify-between items-end mt-2">
                        <div className="text-[10px] font-bold text-slate-500">
                          正面记录 {winner.positiveCount || 0} 次
                        </div>
                        <div className="text-2xl font-black text-emerald-600">
                          {winner.netScore > 0 ? '+' : ''}{winner.netScore}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              ) : (
                <div className="mt-4 rounded-2xl bg-slate-50 border border-slate-200 p-5 text-center text-xs font-bold text-slate-400">
                  🌱 本星期还没有课堂记录
                </div>
              )}

              <div className="mt-4 rounded-2xl bg-emerald-50 border border-emerald-100 p-3 text-[10px] font-bold text-slate-600 leading-relaxed">
                规则：先比较课堂净积分；净积分相同，再比较正面加分记录次数；两项都相同则共同获奖。
              </div>
            </div>

            <div className="bg-white rounded-3xl border border-slate-100 shadow-sm flex flex-col min-h-[420px] overflow-hidden">
              <div className="p-4 border-b border-slate-100 flex justify-between items-center">
                <div>
                  <h4 className="font-black text-slate-800">📊 全班星期排名</h4>
                  <p className="text-[10px] font-bold text-slate-400 mt-0.5">
                    共 {ranking.length} 位学生有课堂记录
                  </p>
                </div>
                <span className="text-[10px] font-black text-emerald-700 bg-emerald-50 border border-emerald-100 px-3 py-1 rounded-full">
                  净积分 ↓
                </span>
              </div>

              <div className="p-4 bg-slate-50 flex-1 overflow-y-auto space-y-2">
                {ranking.length === 0 ? (
                  <div className="h-full min-h-[280px] flex items-center justify-center text-slate-400 font-bold text-sm">
                    暂无排名资料
                  </div>
                ) : (
                  ranking.map((item, index) => (
                    <div key={`${item.name}-${index}`} className={`grid grid-cols-[44px_1fr_auto] items-center gap-3 p-3 rounded-2xl border shadow-sm ${item.rank === 1 ? 'bg-gradient-to-r from-amber-50 to-yellow-50 border-amber-300' : 'bg-white border-slate-200'}`}>
                      <div className="text-center font-black text-xl">
                        {item.rank === 1 ? '🥇' : item.rank === 2 ? '🥈' : item.rank === 3 ? '🥉' : <span className="text-slate-400 text-sm">{item.rank}</span>}
                      </div>
                      <div className="min-w-0">
                        <p className="font-black text-slate-800 text-sm truncate">{item.name}</p>
                        <p className="text-[10px] font-bold text-slate-400 mt-0.5">
                          正面 {item.positiveCount || 0} 次 · 扣分 {item.negativeCount || 0} 次 · 共 {item.totalRecords || 0} 条记录
                        </p>
                      </div>
                      <div className="text-right">
                        <p className={`text-lg font-black ${item.netScore >= 0 ? 'text-emerald-600' : 'text-rose-600'}`}>
                          {item.netScore > 0 ? '+' : ''}{item.netScore}
                        </p>
                        <p className="text-[9px] font-bold text-slate-400">净积分</p>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 积木 3：成长足迹弹窗 (HistoryModal) - 🚀 核心改造：无缝接入 fetchGAS
    function HistoryModal({ onClose, studentName }) {
      const [history, setHistory] = useState([]);
      const [loading, setLoading] = useState(true);
      
      useEffect(() => {
        const loadHistory = async () => {
          try {
            const data = await fetchGAS('getStudentLogs', { studentName });
            setHistory(data);
          } catch (err) {
            console.error('读取足迹失败:', err);
          } finally {
            setLoading(false);
          }
        };
        loadHistory();
      }, [studentName]);

      return (
        <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
          <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">

// 积木 4：兑换小屋弹窗 (ShopModal) - 🚀 增加防连点保护锁
    function ShopModal({ onClose, badges, onExchangeItem, globalProducts, setGlobalProducts }) {
      const [processingId, setProcessingId] = useState(null); // ★ 新加：记录正在处理的商品ID，作为智能锁

      return (
        <div className="absolute inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4">
          <div className="w-full max-w-sm bg-white rounded-3xl shadow-2xl flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
            <div className="p-4 bg-gradient-to-r from-pink-100 to-rose-100 flex justify-between items-center border-b border-pink-200">
              <h3 className="font-bold text-pink-900 text-lg"> 🛍️ 兑换小屋</h3>
              <button onClick={onClose} className="text-pink-700 hover:text-pink-900 text-2xl font-bold active:scale-90">&times;</button>
            </div>
            <div className="p-3 bg-pink-50 text-center text-sm font-bold text-pink-800 shadow-inner flex items-center justify-center gap-2">
              当前可用徽章: <span className="text-2xl text-amber-500">{badges}</span> 🏅
            </div>
            <div className="p-4 bg-slate-50 flex flex-col gap-3 max-h-80 overflow-y-auto">
              {globalProducts.length === 0 ? (
                <div className="text-center py-8 text-slate-400 font-medium">暂时没有商品哦~</div>
              ) : (
                globalProducts.map(item => (
                  <div key={item.id} className="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between transition-transform hover:scale-[1.02]">
                    <div className="flex items-center gap-3">
                      <span className="text-3xl drop-shadow-sm">{item.icon}</span>
                      <div>
                        <span className="font-bold text-slate-700">{item.name}</span>
                        <p className="text-xs text-slate-400 mt-0.5">库存: {item.stock}</p>
                      </div>
                    </div>
                    <button
                      // 🌟 核心拦截 1：如果有正在处理的订单 (processingId 不为空)，直接让所有按钮变成灰色不可按
                      disabled={badges < item.cost || item.stock <= 0 || processingId !== null}
                      onClick={async () => {
                        if (processingId !== null) return; // 🌟 核心拦截 2：双重保险，拒绝多余点击
                        setProcessingId(item.id); // 🌟 立刻上锁：告诉系统正在处理这个商品

                        const newStock = item.stock - 1;
                        // 先更新前端视觉库存
                        setGlobalProducts(prev => prev.map(p => p.id === item.id ? { ...p, stock: newStock } : p));
                        
                        try {
                          // 后台异步扣除库存
                          await fetchGAS('updateProductStock', { id: item.id, newStock });
                          // 触发大厅的扣款和发货逻辑
                          await onExchangeItem(item); 
                        } catch(err) {
                          console.error('商品兑换同步出错:', err);
                        } finally {
                          // 🌟 解锁：如果大厅没关掉这个弹窗（比如出错了），就把锁解开
                          setProcessingId(null); 
                        }
                      }}
                      className={`font-bold py-2 px-4 rounded-xl shadow-md transition-all active:scale-95 ${
                        badges >= item.cost && item.stock > 0 && processingId === null
                          ? 'bg-pink-500 hover:bg-pink-600 text-white'
                          : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                      }`}
                    >
                      {/* 🌟 核心拦截 3：智能提示按钮状态 */}
                      {processingId === item.id 
                        ? '打包中...' 
                        : item.stock <= 0 
                          ? '已售完' 
                          : `${item.cost} 🏅 `}
                    </button>
                  </div>
                ))
              )}
            </div>
          </div>
        </div>
      );
    }

// 🧱 积木 5：终极科任老师面板 (动态增删小组 + 独立记账与双向充值完美融合版)
    function TeacherPanel({ onExit, subject, teacherName, rules, globalStudents }) {
      const [students, setStudents] = useState([]);

      useEffect(() => {
        setStudents(globalStudents.map(s => ({
          id: s.id,
          name: s.name,
          exp: s.totalExp || 0,
          totalScore: s.totalScore || 0,
          group: null 
        })));
      }, [globalStudents]);

      // ★ 核心改造：本科分数状态拉取
      const [subjectScores, setSubjectScores] = useState({});
      useEffect(() => {
        const loadSubjectScores = async () => {
          try {
            const scores = await fetchGAS('getStudentScoreByTeacher', { teacherName, subject });
            setSubjectScores(scores || {});
          } catch (err) {
            console.error('读取科目分失败:', err);
          }
        };
        loadSubjectScores();
      }, [teacherName, subject]);

      const [groupsList, setGroupsList] = useState([""]);
      const [newGroupName, setNewGroupName] = useState(""); 
      const [groupScores, setGroupScores] = useState("");
      const [groupIds, setGroupIds] = useState({});

      // ★ 核心改造：启动时读取该老师的分组
      useEffect(() => {
        const loadGroups = async () => {
          try {
            const data = await fetchGAS('getGroups', { teacherName });
            if (!data) return;
            const names = data.map(g => g.name);
            const scores = {};
            const ids = {};
            const memberMap = {};

            data.forEach(g => {
              scores[g.name] = g.score;
              ids[g.name] = g.id;
              memberMap[g.name] = g.members;
            });

            setGroupsList(names);
            setGroupScores(scores);
            setGroupIds(ids);

            setStudents(prev => prev.map(s => ({
              ...s,
              group: Object.keys(memberMap).find(gName => memberMap[gName].includes(s.name)) || null
            })));
          } catch (err) {
            console.error('读取分组失败:', err);
          }
        };
        loadGroups();
      }, [teacherName]);

      const RULES = rules || [];
      const [isEditMode, setIsEditMode] = useState(false); 
      const [selectedStudentIds, setSelectedStudentIds] = useState([]); 
      const [activeGroupForAssign, setActiveGroupForAssign] = useState("第一组"); 
      const [toastMsg, setToastMsg] = useState("");
      const [viewingStudent, setViewingStudent] = useState(null);   
      const [studentLogs, setStudentLogs] = useState([]);           
      const [logsLoading, setLogsLoading] = useState(false);        
      const [ruleFilter, setRuleFilter] = useState('all');  
      const [ruleSearch, setRuleSearch] = useState('');      

      const getGroupScore = (groupName) => {
        return groupScores[groupName] || 0;
      };

      const toggleSelectStudent = (id) => {
        if (isEditMode) return;
        if (selectedStudentIds.includes(id)) {
          setSelectedStudentIds(selectedStudentIds.filter(sId => sId !== id));
        } else {
          setSelectedStudentIds([...selectedStudentIds, id]);
        }
      };

      const toggleSelectGroupAll = (groupName) => {
        if (isEditMode) return;
        const groupStudentIds = students.filter(s => s.group === groupName).map(s => s.id);
        const allSelected = groupStudentIds.length > 0 && groupStudentIds.every(id => selectedStudentIds.includes(id));

        if (allSelected) {
          setSelectedStudentIds(selectedStudentIds.filter(id => !groupStudentIds.includes(id)));
        } else {
          const newSelected = [...selectedStudentIds, ...groupStudentIds.filter(id => !selectedStudentIds.includes(id))];
          setSelectedStudentIds(newSelected);
        }
      };

      // ★ 核心改造：升级打分函数 (异步更新云端)
      const handleScore = async (rule) => {
        if (selectedStudentIds.length === 0) return;
        new Audio('https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg').play();
        
        const affectedGroups = [...new Set(students.filter(s => selectedStudentIds.includes(s.id) && s.group).map(s => s.group))];

        // 实时更新分组分到前端与云端
        affectedGroups.forEach(gName => {
          const newScore = Math.max(0, (groupScores[gName] || 0) + rule.points);
          setGroupScores(prev => ({ ...prev, [gName]: newScore }));
          
          fetchGAS('updateGroup', {
            groupId: groupIds[gName],
            members: students.filter(s => s.group === gName).map(s => s.name),
            score: newScore
          }).catch(err => console.error('组分更新失败:', err));
        });

        // 实时更新学生前端分数
        setStudents(prev => prev.map(s => {
          if (selectedStudentIds.includes(s.id)) {
            return { ...s, exp: Math.max(0, s.exp + rule.points), totalScore: Math.max(0, (s.totalScore || 0) + rule.points) }; 
          }
          return s;
        }));

        setSubjectScores(prev => {
          const next = { ...prev };
          students.filter(s => selectedStudentIds.includes(s.id)).forEach(s => {
            next[s.name] = Math.max(0, (next[s.name] || 0) + rule.points);
          });
          return next;
        });

        // 记录 Logs 存入云端
        const selectedNames = students.filter(s => selectedStudentIds.includes(s.id)).map(s => s.name);
        try {
          await fetchGAS('addLogs', {
            teacher: teacherName,
            subject: subject,
            studentNames: selectedNames,
            points: rule.points,
            reason: rule.label
          });
        } catch (err) {
          console.error('Logs写入失败:', err);
        }

        const names = students.filter(s => selectedStudentIds.includes(s.id)).map(s => s.name).join(', ');
        setToastMsg(`已给【${names}】及所属小组同步下发：${rule.label} ${rule.points > 0 ? '+' : ''}${rule.points}分`);
        setTimeout(() => { setToastMsg(""); setSelectedStudentIds([]); }, 2000);
      };

      // 允许老师在管理模式下完全自主改写某组的总分
      const handleManualGroupScoreChange = (groupName, newScore) => {
        const parsedScore = Math.max(0, parseInt(newScore) || 0);
        setGroupScores(prev => ({ ...prev, [groupName]: parsedScore }));
        
        fetchGAS('updateGroup', {
          groupId: groupIds[groupName],
          members: students.filter(s => s.group === groupName).map(s => s.name),
          score: parsedScore
        }).catch(err => console.error('手动改分失败:', err));
      };

      // 将未分配的学生加入当前选中的小组
      const assignToGroup = (studentId) => {
        setStudents(prev => {
          const updated = prev.map(s => s.id === studentId ? { ...s, group: activeGroupForAssign } : s);
          const newMembers = updated.filter(s => s.group === activeGroupForAssign).map(s => s.name);
          
          fetchGAS('updateGroup', {
            groupId: groupIds[activeGroupForAssign],
            members: newMembers,
            score: groupScores[activeGroupForAssign] || 0
          }).catch(err => console.error('分配失败:', err));
          
          return updated;
        });
      };

      // 将学生踢出小组
      const removeFromGroup = (studentId) => {
        setStudents(prev => {
          const student = prev.find(s => s.id === studentId);
          const groupName = student?.group;
          const updated = prev.map(s => s.id === studentId ? { ...s, group: null } : s);
          
          if (groupName) {
            const newMembers = updated.filter(s => s.group === groupName).map(s => s.name);
            fetchGAS('updateGroup', {
              groupId: groupIds[groupName],
              members: newMembers,
              score: groupScores[groupName] || 0
            }).catch(err => console.error('踢出失败:', err));
          }
          return updated;
        });
        setSelectedStudentIds(selectedStudentIds.filter(id => id !== studentId));
      };

      // 添加新组
      const handleAddGroup = async () => {
        const trimmedName = newGroupName.trim();
        if (!trimmedName) return;
        if (groupsList.includes(trimmedName)) {
          alert("这个小组名字已经存在啦！");
          return;
        }

        const newId = 'G_' + teacherName + '_' + Date.now();
        setGroupsList([...groupsList, trimmedName]);
        setGroupScores(prev => ({ ...prev, [trimmedName]: 0 }));
        setGroupIds(prev => ({ ...prev, [trimmedName]: newId }));
        setActiveGroupForAssign(trimmedName);
        setNewGroupName("");

        try {
          await fetchGAS('addGroup', { id: newId, name: trimmedName, teacherName });
        } catch (err) {
          console.error('建组写入云端失败:', err);
        }
      };

      // 删除组
      const handleDeleteGroup = async (groupName) => {
        if (!confirm(`确定要解散【${groupName}】吗？\n该组所有学生将自动退回到“未分配”状态。`)) return;

        setStudents(prev => prev.map(s => s.group === groupName ? { ...s, group: null } : s));
        const updatedList = groupsList.filter(g => g !== groupName);
        setGroupsList(updatedList);

        setGroupScores(prev => {
          const nextScores = { ...prev };
          delete nextScores[groupName];
          return nextScores;
        });
        
        if (activeGroupForAssign === groupName) {
          setActiveGroupForAssign(updatedList[0] || "");
        }

        try {
          await fetchGAS('deleteGroup', { groupId: groupIds[groupName] });
        } catch (err) {
          console.error('云端删组失败:', err);
        }
      };

      return (
        <div className="relative w-screen h-screen flex flex-col bg-slate-100 overflow-hidden">
          {/* 顶部状态栏 */}
          <div className="w-full bg-white shadow-sm p-4 flex justify-between items-center z-10">
            <div>
              <h2 className="text-xl font-black text-indigo-900"> 👩‍🏫 {subject || "科任"}课堂打分台 <span className="text-xs font-normal text-slate-400">({teacherName || "独立记账版"})</span></h2>
              <p className="text-xs text-slate-500 font-bold">
                模式：{isEditMode ? " ⚙️ 组员调配与自主建组" : " ⚡ 团队独立积分与分粮控制台"}
              </p>
            </div>
            <div className="flex gap-2">
              <button
                onClick={() => { setIsEditMode(!isEditMode); setSelectedStudentIds([]); }}
                className={`px-4 py-2 rounded-xl font-bold transition-all active:scale-95 text-sm ${isEditMode ? 'bg-emerald-500 text-white shadow-md' : 'bg-indigo-100 text-indigo-600 hover:bg-indigo-100'}`}
              >
                {isEditMode ? " ✅ 完成管理" : " ⚙️ 管理分组"}
              </button>
              <button onClick={onExit} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-xl text-sm font-bold active:scale-95">退出</button>
            </div>
          </div>
          
          {/* 核心内容区 */}
          <div className="flex-1 w-full max-w-5xl mx-auto p-4 flex flex-col gap-4 overflow-y-auto md:flex-row md:overflow-hidden">

            {/* 左侧/主体：小组大卡片展示区 */}
            <div className="flex-1 overflow-y-auto pr-1 space-y-4 min-h-[200px]">
              <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                {groupsList.map(groupName => {
                  const groupStudents = students.filter(s => s.group === groupName);
                  const isGroupAllSelected = groupStudents.length > 0 && groupStudents.every(s => selectedStudentIds.includes(s.id));

                  return (
                    <div key={groupName} className={`bg-white p-4 rounded-3xl border shadow-sm transition-all ${isGroupAllSelected ? 'border-indigo-400 bg-indigo-50/30' : 'border-slate-100'}`}>
                      {/* 小组头部 */}
                      <div className="flex justify-between items-center border-b border-slate-100 pb-2 mb-3">
                        <button
                          disabled={isEditMode || groupStudents.length === 0}
                          onClick={() => toggleSelectGroupAll(groupName)}
                          className={`font-black text-base flex items-center gap-1 ${isEditMode ? 'cursor-default text-slate-700' : 'text-indigo-900 hover:text-indigo-600'}`}
                        >
                          {!isEditMode && groupStudents.length > 0 && <span>{isGroupAllSelected ? " ☑️ " : " ⬜ "}</span>}
                          {groupName}
                        </button>

                        <div className="flex items-center gap-2">
                          {isEditMode ? (
                            <div className="flex items-center gap-1 bg-amber-50 border border-amber-200 rounded-xl px-2 py-1 animate-[fadeIn_0.15s_ease-out]">
                              <span className="text-[10px] font-black text-amber-800"> 🏆 独立分:</span>
                              <input
                                type="number"
                                value={getGroupScore(groupName)}
                                onChange={(e) => handleManualGroupScoreChange(groupName, e.target.value)}
                                className="w-14 text-center font-black text-xs bg-white border border-amber-300 rounded-md text-amber-900 focus:outline-none focus:border-amber-500 shadow-sm"
                              />
                            </div>
                          ) : (
                            <span className="bg-amber-100 text-amber-800 text-xs font-black px-2 py-1 rounded-full">
                              🏆 组总分: {getGroupScore(groupName)} 分
                            </span>
                          )}

                          {isEditMode && (
                            <button onClick={() => handleDeleteGroup(groupName)} className="text-rose-500 hover:text-rose-700 text-xs font-black bg-rose-50 px-2 py-1 rounded-md transition-all active:scale-90"> 🗑️ 删组</button>
                          )}
                        </div>
                      </div>
                      
                      {/* 组内学生名单 */}
                      <div className="flex flex-wrap gap-2">
                        {groupStudents.length === 0 ? (
                          <p className="text-xs text-slate-400 py-2 font-medium">暂无组员，请在管理模式添加</p>
                        ) : (
                          groupStudents.map(student => {
                            const isSelected = selectedStudentIds.includes(student.id);
                            return (
                              <div
                                key={student.id}
                                onClick={() => !isEditMode && toggleSelectStudent(student.id)}
                                className={`px-3 py-2 rounded-xl text-sm font-bold flex items-center gap-1 shadow-sm border transition-all ${
                                  isEditMode
                                    ? 'bg-slate-50 border-slate-200 text-slate-700'
                                    : isSelected
                                      ? 'bg-indigo-500 text-white border-indigo-600 scale-95'
                                      : 'bg-white hover:border-indigo-300 text-slate-600 cursor-pointer active:scale-95'
                                }`}
                              >
                                <span> 👤 {student.name}</span>
                                <span className={`text-[10px] px-1 rounded ${isSelected ? 'bg-indigo-600' : 'bg-slate-100 text-slate-400'}`}>{subjectScores[student.name] || 0}分</span>
                                
                                {/* ★ 核心改造：独立读取学生的足迹历史走 fetchGAS */}
                                <button
                                  onClick={async (e) => {
                                    e.stopPropagation();
                                    setViewingStudent(student.name);
                                    setLogsLoading(true);
                                    try {
                                      const data = await fetchGAS('getStudentLogsBySubject', { studentName: student.name, teacherName, subject });
                                      setStudentLogs(data || []);
                                    } catch (err) {
                                      console.error('读取记录失败:', err);
                                    } finally {
                                      setLogsLoading(false);
                                    }
                                  }}
                                  className="text-[10px] px-1.5 py-0.5 rounded bg-indigo-50 text-indigo-500 hover:bg-indigo-100 font-bold"
                                >
                                  📋
                                </button>

                                {isEditMode && (
                                  <button onClick={(e) => { e.stopPropagation(); removeFromGroup(student.id); }} className="text-red-500 hover:text-red-700 font-black ml-1 text-xs">&times;</button>
                                )}
                              </div>
                            );
                          })
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            
            {/* 右侧：操作面板 */}
            <div className={`w-full md:w-80 bg-white p-4 rounded-3xl border border-slate-100 shadow-sm flex flex-col overflow-hidden md:max-h-none ${isEditMode ? '' : 'max-h-64'}`}>

              {/* 模式 A：日常打分控制台 */}
              {!isEditMode && (
                <div className="flex flex-col h-full relative">
                  {selectedStudentIds.length === 0 && (
                    <div className="absolute inset-0 bg-white/70 backdrop-blur-[1px] z-10 flex items-center justify-center text-center p-4">

                <div className="p-3 bg-indigo-50 text-center text-xs font-bold text-indigo-700 border-t border-indigo-100">

          {/* 发分成功提示 */}

              </div>
            </div>

        </div>
      );
    }

// ========================================================
    //  👑  终极完全体：班主任独立超级大后台 (AdminPanel - 五板斧大满贯版)

      const [newTeacherPin, setNewTeacherPin] = useState("");
      const [newAdminPin, setNewAdminPin] = useState(""); 

      // ========================================================
      //  🛠️  核心业务逻辑处理函数 (全面升级为 async/await fetchGAS)
      // ========================================================

      const handleAddSingle = async () => {
        const name = singleName.trim();
        if (!name) return;
        if (globalStudents.some(s => s.name === name)) {
          alert(`班级里已经有【${name}】啦！`); return;
        }

        const tempId = 's_' + Date.now(); 
        const newKid = {
          id: tempId, name, pin: "123456", totalExp: 0, unfedFood: 0, badges: 0,
          group: null, mythUnlocked: false, petId: null,
          pendingRedemptions: [], redeemedItems: [], hasOrder: false
        };

        setGlobalStudents(prev => [...prev, newKid]);
        setSingleName('');
        showToast(`成功添加学生：${name}`);

        try {
          const realId = await fetchGAS('addStudent', { name, pin: "123456" });
          setGlobalStudents(prev => prev.map(s => s.id === tempId ? { ...s, id: realId } : s));
        } catch (err) {
          console.error('学生写入失败:', err);
        }
      };

      const handleAddBulk = async () => {
        if (!bulkInput.trim()) return;
        const names = bulkInput.split(/[\n,，]/).map(n => n.trim()).filter(n => n.length > 0);
        if (names.length === 0) return;
        
        const newStudents = [];
        names.forEach((name, index) => {
          if (!globalStudents.some(s => s.name === name) && !newStudents.some(s => s.name === name)) {
            newStudents.push({ id: `s_b_${Date.now()}_${index}`, name, pin: "123456", totalExp: 0, badges: 0, group: null, mythUnlocked: false, petId: null });
          }
        });
        
        setGlobalStudents([...globalStudents, ...newStudents]);
        setBulkInput("");
        showToast(` 🚀  成功批量导入 ${newStudents.length} 位同学！`);
        
        const tempIds = newStudents.map(k => k.id);
        try {
          const realIds = await fetchGAS('addStudentsBulk', { names: newStudents.map(k => k.name), pin: "123456" });
          setGlobalStudents(prev => prev.map(s => {
            const index = tempIds.indexOf(s.id);
            if (index !== -1) return { ...s, id: realIds[index] };
            return s;
          }));
        } catch (err) {
          console.error('批量写入失败:', err);
        }
      };

      const handleDeleteStudent = async (student) => {
        if (!confirm(` ⚠️  确定要删除【${student.name}】吗？`)) return;
        setGlobalStudents(globalStudents.filter(s => s.id !== student.id)); 
        showToast(`已删除学生：${student.name}`);
        
        try {
          await fetchGAS('deleteStudent', { username: student.id });
        } catch (err) {
          console.error('删除学生失败:', err);
        }
      };

      const handleToggleMyth = async (id) => {
        const newValue = !globalStudents.find(s => s.id === id)?.mythUnlocked;
        setGlobalStudents(prev => prev.map(s => s.id === id ? { ...s, mythUnlocked: !s.mythUnlocked } : s));
        showToast(" 🌟  成功更新该同学的山海神兽领养特权！");
        
        try {
          await fetchGAS('updateMythUnlocked', { username: id, value: newValue });
        } catch (err) {
          console.error('神兽特权更新失败:', err);
        }
      };

      const handleAddItem = async () => {
        if (!newItemName.trim()) return;
        const newItem = {
          id: 'P_' + Date.now(),
          name: newItemName.trim(),
          cost: Number(newItemCost),
          icon: newItemIcon,
          stock: Number(newItemStock)
        };
        
        setGlobalProducts(prev => [...prev, newItem]);
        setNewItemName("");
        setNewItemStock(10);
        showToast(` 🛍️  成功上架奖品：${newItemName}`);

        try {
          await fetchGAS('addProduct', { id: newItem.id, name: newItem.name, cost: newItem.cost, icon: newItem.icon, stock: newItem.stock });
        } catch (err) {
          console.error('商品写入失败:', err);
        }
      };

      const handleAddRule = async () => {
        if (!newRuleLabel.trim()) return;
        const pts = Number(newRulePoints);
        const newRule = {
          id: 'r_' + Date.now(),
          label: newRuleLabel.trim(),
          points: newRuleType === 'add' ? Math.abs(pts) : -Math.abs(pts),
          type: newRuleType,
          icon: newRuleIcon
        };

        setGlobalRules([...globalRules, newRule]);
        setNewRuleLabel('');
        setNewRuleType('add');    
        setNewRulePoints(2);      
        setNewRuleIcon(' 📝 ');     
        showToast(` 📜  成功颁布全班新规：${newRuleLabel}`);

        try {
          await fetchGAS('addRule', { id: newRule.id, type: newRule.type, label: newRule.label, points: newRule.points, icon: newRule.icon });
        } catch (err) {
          console.error('规则写入失败:', err);
        }
      };

      const handleAddTeacher = async () => {
        const name = newTeacherName.trim();
        const pin = newTeacherPin.trim();
        if (!name || !pin) { alert("老师姓名和密码都必须填写哦！"); return; }
        if (!/^[A-Za-z0-9]{4,12}$/.test(pin)) { alert("密码必须是4至12位英文字母或数字！"); return; }
        if (teachersList.some(t => t.name === name && t.subject === newTeacherSubject)) {
          alert(`【${newTeacherSubject}】已经授权过【${name}】了！`); return;
        }

        const newTeacher = { id: 't_' + Date.now(), name, subject: newTeacherSubject, pin };
        setTeachersList([...teachersList, newTeacher]);
        setNewTeacherName(""); setNewTeacherPin("");
        showToast(` 👩‍🏫  成功授权：${newTeacherSubject} · ${name}`);
        
        try {
          await fetchGAS('addTeacher', { id: newTeacher.id, name, subject: newTeacherSubject, pin });
        } catch (err) {
          console.error('教师写入失败:', err);
        }
      };

      const handleThresholdChange = (index, val) => {
        const num = parseInt(val) || 0;
        setLevelThresholds(prev => {
          const next = [...prev];
          next[index] = num;
          return next;
        });
      };

      const handleTitleChange = (index, text) => {
        setLevelTitles(prev => {
          const next = [...prev];
          next[index] = text;
          return next;
        });
      };

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(""), 2500); };

      return (
        <div className="w-screen h-screen bg-slate-50 flex flex-col overflow-hidden animate-[fadeIn_0.2s_ease-out]">
          {/* 👑  顶部超级控制顶栏 */}
          <div className="bg-gradient-to-r from-indigo-900 to-slate-950 p-4 shadow-md flex flex-col sm:flex-row justify-between items-center text-white gap-4 z-10">
            <div>
              <h2 className="text-xl font-black tracking-wide flex items-center gap-2"> 👑  班主任超级后台</h2>
              <p className="text-xs text-indigo-300 font-bold">
                当前板块：{activeTab === 'students' ? "花名册与神兽权限" : activeTab === 'grow_config' ? "宠物成长数值局" : activeTab === 'shop' ? "兑换商店进货商" : activeTab === 'rules' ? "全班金科玉律" : activeTab === 'ikon' ? "Ikon Lestari 每周排名" : "系统设置"}
              </p>
            </div>
            {/* 🛠️  顶部分流导航 */}
            <div className="bg-white/10 p-1 rounded-2xl flex gap-1 border border-white/10 overflow-x-auto max-w-full">

              <button onClick={() => setActiveTab("grow_config")} className={`px-3 py-1.5 rounded-xl font-black text-xs transition-all flex-shrink-0 ${activeTab === 'grow_config' ? 'bg-amber-500 text-white shadow-md scale-105' : 'text-slate-300 hover:text-white'}`}> 📈  宠物成长局</button>
              <button onClick={() => setActiveTab("shop")} className={`px-3 py-1.5 rounded-xl font-black text-xs transition-all flex-shrink-0 ${activeTab === 'shop' ? 'bg-white text-indigo-950 shadow-md scale-105' : 'text-slate-300 hover:text-white'}`}> 🛍️  商店进货商</button>
              <button onClick={() => setActiveTab("rules")} className={`px-3 py-1.5 rounded-xl font-black text-xs transition-all flex-shrink-0 ${activeTab === 'rules' ? 'bg-white text-indigo-950 shadow-md scale-105' : 'text-slate-300 hover:text-white'}`}> 📜  班级金科玉律</button>
              <button onClick={() => setActiveTab("ikon")} className={`px-3 py-1.5 rounded-xl font-black text-xs transition-all flex-shrink-0 ${activeTab === 'ikon' ? 'bg-emerald-500 text-white shadow-md scale-105' : 'text-slate-300 hover:text-white'}`}> 🌿 Ikon Lestari</button>
              <button onClick={() => setActiveTab("teachers")} className={`px-3 py-1.5 rounded-xl font-black text-xs transition-all flex-shrink-0 ${activeTab === 'teachers' ? 'bg-white text-indigo-950 shadow-md scale-105' : 'text-slate-300 hover:text-white'}`}> ⚙️  系统设置</button>
            </div>

          {/* 📢  第一板斧：学生大总管 */}
          {activeTab === 'students' && (

              <div className="w-full md:w-[400px] flex flex-col gap-4 pr-1">

                    <input type="text" value={singleName} onChange={(e) => setSingleName(e.target.value)} placeholder="输入学生姓名..." className="flex-1 px-4 py-2 rounded-xl border border-slate-200 font-bold text-sm focus:outline-none focus:border-indigo-500 shadow-inner" />

                          <p className="text-[11px] font-black text-amber-600 mb-1.5 flex items-center gap-1">
                            🎁  收到 {student.redeemedItems.length} 项待发奖品：
                          </p>
                          <div className="flex flex-col gap-1.5">
                            {student.redeemedItems.map(gift => (
                              <div key={gift.id} className="flex justify-between items-center bg-white p-1.5 rounded-lg border border-amber-100 shadow-sm">
                                <span className="text-xs font-bold text-slate-600 break-words flex-1 mr-2 text-left">
                                  {gift.icon} {gift.name}
                                </span>

          </div>
          <div className="flex-1 w-full max-w-5xl mx-auto overflow-y-auto z-10 pr-1 pb-10">
            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
              {globalStudents.map(s => (
                <button key={s.id} onClick={() => { setIsTeacherLoginProcess(false); setSelectedStudentForLogin(s); }} className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-col items-center justify-center text-center transition-all hover:border-indigo-400 active:scale-95 group min-h-[100px]">
                  <span className="text-xl mb-1 group-hover:scale-110 transition-transform">👤</span>
                  <span className="font-black text-slate-700 text-sm group-hover:text-indigo-600 truncate w-full">{s.name}</span>
                  <div className="flex gap-1 items-center mt-1">
                    {s.mythUnlocked && <span className="text-[8px] bg-indigo-100 text-indigo-700 px-1.5 py-0.5 rounded-md font-bold">🐲神兽解封</span>}
                    {s.group && <span className="text-[9px] bg-slate-100 text-slate-400 font-bold px-2 py-0.5 rounded-full">{s.group}</span>}
                  </div>
                </button>
              ))}
            </div>
          </div>
          {selectedStudentForLogin && !isTeacherLoginProcess && (
            <TeacherLoginModal title={`${selectedStudentForLogin.name} 的宠物园`} correctPassword={selectedStudentForLogin.pin} onClose={() => { setSelectedStudentForLogin(null); }} onSuccess={async () => {
              const currentDB = globalStudents.find(gs => gs.id === selectedStudentForLogin.id) || selectedStudentForLogin;
              // 🎒 切换学生时先清空上一位学生的道具状态，避免短暂显示别人的装备
              setInventoryLoading(true);
              setStudentInventory([]);
              setEquippedItems({ background: null, ground: null, foreground: null, frame: null, sceneObject: null });
              setShowBackpack(false);
              setShowCheckin(false);
              setDrawResult(null);
              setCheckinData({ lastCheckinDate: '', progress: 0, totalCheckins: 0, drawTickets: 0 });
              setShowUpdates(false);
              setLatestUpdate(null);
              setUpdateHistory([]);
              setLastSeenUpdate('');

              setStudent(prev => ({ ...prev, id: currentDB.id, name: currentDB.name, totalExp: currentDB.totalExp, unfedFood: currentDB.unfedFood || 0, badges: currentDB.badges || 0, mythUnlocked: currentDB.mythUnlocked || false, petId: currentDB.petId || null, petHistory: currentDB.petHistory || [], pin: currentDB.pin || '123456', pendingRewards: [] }));
              setSelectedStudentForLogin(null);
              
              try {
                const bagData = await fetchGAS('getStudentInventory', { username: currentDB.id });
                setStudentInventory(Array.isArray(bagData?.inventory) ? bagData.inventory : []);
                setEquippedItems({
                  background: null,
                  ground: null,
                  foreground: null,
                  frame: null,
                  sceneObject: null,
                  ...(bagData?.equippedItems || {})
                });
                setCheckinData({
                  lastCheckinDate: '',
                  progress: 0,
                  totalCheckins: 0,
                  drawTickets: 0,
                  ...(bagData?.checkinData || {})
                });

                // 🔔 V5：登录时检查最新公告。新版本只自动弹一次。
                const seenUpdateId = String(bagData?.lastSeenUpdate || '');
                setLastSeenUpdate(seenUpdateId);
                try {
                  const newest = await fetchGAS('getLatestUpdate', {});
                  setLatestUpdate(newest || null);
                  if (newest?.updateId && String(newest.updateId) !== seenUpdateId) {
                    setShowUpdates(true);
                    // 自动弹出时先准备完整历史，方便学生往下看旧版本
                    fetchGAS('getUpdateHistory', {})
                      .then(history => setUpdateHistory(Array.isArray(history) ? history : []))
                      .catch(err => console.error('读取更新历史失败:', err));
                  }
                } catch (updateErr) {
                  console.error('检查系统更新失败:', updateErr);
                }

                setInventoryLoading(false);
                // 新学生装备资料到齐后才进入宠物页面
                setCurrentView("student");

                const rewards = await fetchGAS('getStudentPendingRewards', { studentName: currentDB.name });
                if (rewards) setStudent(prev => ({ ...prev, pendingRewards: rewards }));

                const deductions = await fetchGAS('getStudentPendingDeductions', { studentName: currentDB.name });
                if (deductions && deductions.length > 0) {
                  const totalDeduct = deductions.reduce((sum, d) => sum + Math.abs(d.points), 0);
                  setStudent(prev => {
                    // 🌟 核心修改：移除了最低等级保护，直接用现有经验减去扣除的经验，并限制最低为 0
                    const newExp = Math.max(0, prev.totalExp - totalDeduct);
                    
                    fetchGAS('updateStudentStats', { username: currentDB.id, totalExp: newExp, unfedFood: prev.unfedFood });
                    setGlobalStudents(gList => gList.map(s => s.name === prev.name ? { ...s, totalExp: newExp } : s));
                    return { ...prev, totalExp: newExp };
                  });
                  soundSad.currentTime = 0; soundSad.play(); setIsShaking(true); setTimeout(() => setIsShaking(false), 400);
                  const newBadMark = { id: Date.now(), points: totalDeduct }; setBadMarks(prev => [...prev, newBadMark]);
                  setTimeout(() => { setBadMarks(prev => prev.filter(b => b.id !== newBadMark.id)); }, 1200);
                  await fetchGAS('claimAllDeductions', { studentName: currentDB.name });
                }
              } catch (err) {
                setInventoryLoading(false);
                console.error('拉取新数据失败:', err);
                // 读取失败时也只用空装备进入，绝不沿用上一位学生的装备
                setStudentInventory([]);
                setEquippedItems({ background: null, ground: null, foreground: null, frame: null, sceneObject: null });
                setCheckinData({ lastCheckinDate: '', progress: 0, totalCheckins: 0, drawTickets: 0 });
                setLastSeenUpdate('');
                setLatestUpdate(null);
                setUpdateHistory([]);
                setShowUpdates(false);
                setCurrentView("student");
              }
            }} />
          )}
          {showAdminAuth && adminPasswordLoaded && <TeacherLoginModal title="班主任超级后台" correctPassword={adminPassword} onClose={() => setShowAdminAuth(false)} onSuccess={() => { setCurrentView("admin"); setShowAdminAuth(false); }} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
